# Equipments
 KOR_light_tank_equipment_1: "K290"
 KOR_light_tank_equipment_1_short: "K290"
 KOR_light_tank_equipment_1_desc: "Based on the K200 armored vehicle's chassis, this is a proposed design for a firepower support vehicle and light tank equipped with 90 mm low-pressure guns to enhance firepower. It was mainly developed with the export market in mind, but it was never adopted as standard equipment by the South Korean military. It aimed to balance excellent mobility with firepower and was designed to be suitable for rapid deployment in conflict zones and for infantry firepower support."
 KOR_light_tank_equipment_2: "K-21 XC8(105)"
 KOR_light_tank_equipment_2_short: "K-21 XC8(105)"
 KOR_light_tank_equipment_2_desc: "This firepower-enhanced model combines the chassis of the K21 infantry fighting vehicle with a 105 mm turret from Belgium's John Cockerill. It retains the mobility of a light tank while offering excellent anti-tank firepower comparable to that of an older main battle tank. Its integral amphibious capability allows it to cross rivers and provide rapid fire support alongside mechanized infantry in a wide range of battlefield environments."
 KOR_light_tank_equipment_3: "K-21 XC8(120)"
 KOR_light_tank_equipment_3_short: "K-21 XC8(120)"
 KOR_light_tank_equipment_3_desc: "It is a modernized light tank that maximizes offensive power by mounting a 120 mm high-pressure low-thrust cannon on the K-21 armored vehicle body. Combined with the latest fire-control systems, it can operate powerful wing-stabilized, disengaged armor-piercing rounds, and can effectively destroy the sides of third-generation tanks or older tanks. Thanks to its lightweight chassis, it demonstrates excellent mobility even in mountainous terrain or rough terrain where heavy tanks would struggle to enter."
 KOR_light_tank_equipment_4: "AS-21 PIP"
 KOR_light_tank_equipment_4_short: "AS-21 PIP"
 KOR_light_tank_equipment_4_desc: "It is a light tank variant that further improves the Redback (AS-21), the next-generation infantry fighting vehicle, in terms of armor and firepower, based on its chassis. It maximizes battlefield survivability by adding an Active Protection System (APS) and composite armor materials. Equipped with a large-caliber gun system, it was designed to overwhelm enemy armored forces at the forefront of mechanized infantry units and create rapid breakthroughs."
 KOR_modern_tank_equipment_1: "K1A1"
 KOR_modern_tank_equipment_1_short: "K1A1"
 KOR_modern_tank_equipment_1_desc: "It is the Republic of Korea Army's third-generation main battle tank, which significantly increased firepower by replacing the K1 tank's 105mm rifled gun with a 120mm 44-caliber smoothbore gun. By upgrading the special armor and equipping it with a Korean-style fire control system (KGPS), its night combat capability and firing accuracy during movement have been greatly improved. It is a solid battlefield shield developed in the early 21st century to reliably suppress enemy armored forces on the rugged and complex terrain of the Korean Peninsula."
 KOR_modern_tank_equipment_2: "K2 Black Panther"
 KOR_modern_tank_equipment_2_short: "K2 Black Panther"
 KOR_modern_tank_equipment_2_desc: "It is the Republic of Korea's latest 3.5-generation main battle tank, boasting world-class performance. Equipped with a 120 mm 55-caliber long-range gun and an automatic loading system, it delivers powerful firepower and high firing rate while reducing the crew size. Its semi-active suspension unit (ISU) enables body posture control, making it advantageous in mountainous terrain, while advanced vetronics and composite armor provide near-perfect balance both on the offensive and defensive sides."
 KOR_modern_tank_equipment_3: "K-3"
 KOR_modern_tank_equipment_3_short: "K-3"
 KOR_modern_tank_equipment_3_desc: "It is the Republic of Korea Armed Forces' next-generation (4th generation) main battle tank, featuring a stealth design and an unmanned turret. Designed to protect the crew, it was built with a capsule-type battles compartment inside the hull and aimed to carry a large-caliber main gun of at least 130 mm. It was designed as a core mobility force to dominate future battlefields by integrating AI-based autonomous driving, hydrogen fuel cells, and multi-purpose drone capabilities."
 KOR_modern_tank_equipment_4: "K-4"
 KOR_modern_tank_equipment_4_short: "K-4"
 KOR_modern_tank_equipment_4_desc: "An ultramodern mobile strike system that abandons the traditional concept of the tank, this vehicle operates through a fully unmanned, AI-controlled network. New ultralight armor materials and an omnidirectional active protection system provide exceptional battlefield survivability. Hypervelocity kinetic-energy penetrators or an electrothermal-chemical gun can defeat even the heaviest enemy armor."
 KOR_modern_tank_equipment_5: "K-5"
 KOR_modern_tank_equipment_5_short: "K-5"
 KOR_modern_tank_equipment_5_desc: "The ultimate weapon of future ground warfare, this platform combines hypersonic strike capabilities with electromagnetic-field defenses and can operate in the harshest battlefield environments. Quantum computers analyze the battlefield in real time, predict enemy movements, and direct strikes from beyond the horizon. Limited use of gravity-control and repulsive-force technologies rewrites the very concept of cross-country mobility for tracked vehicles."
 KOR_modern_tank_equipment_6: "K-6"
 KOR_modern_tank_equipment_6_short: "K-6"
 KOR_modern_tank_equipment_6_desc: "It is the final evolution of a futuristic tank envisioned as a multipurpose, multi-functional maneuvering platform that transcends the limitations of traditional ground vehicles. Depending on the battlefield conditions, it can change its form or break through the front lines by gliding rapidly over the ground surface. With built-in orbital strike guidance and the deterrent capability of a small tactical nuclear warhead, it is regarded as a strategic asset capable of changing the course of the entire theater with just a single weapon."
 KOR_mechanized_equipment_1: "KAFV"
 KOR_mechanized_equipment_1_short: "KAFV"
 KOR_mechanized_equipment_1_desc: "Based on the K200 armored personnel carrier, this is an export-model infantry fighting vehicle that has been equipped with a 25 mm or 30 mm cannon turret to enhance firepower. It complemented the limited firepower of existing armored personnel carriers (APCs) and dramatically enhanced infantry fire support capabilities. It was developed based on excellent reliability and cost-effectiveness, but it gave way to another vehicle for the position of the main IFV of the armed forces."
 KOR_mechanized_equipment_2: "K-21"
 KOR_mechanized_equipment_2_short: "K-21"
 KOR_mechanized_equipment_2_desc: "The Republic of Korea Army's principal infantry fighting vehicle, the K21 carries a 40 mm autocannon and Hyeongung anti-tank missiles, allowing it to engage both enemy armor and low-flying helicopters. Despite its considerable 25-ton weight, composite armor and a deployable flotation system give it integral amphibious capability. Its formidable firepower and mobility make it the core infantry element of mechanized formations."
 KOR_mechanized_equipment_3: "K-21 PIP"
 KOR_mechanized_equipment_3_short: "K-21 PIP"
 KOR_mechanized_equipment_3_desc: "This upgrade was developed to further improve the protection and survivability of the K21 infantry fighting vehicle. Non-explosive reactive armor and an active protection system (APS) dramatically increase its defenses against anti-tank rockets and missiles. The engine and suspension have been improved to accommodate the extra weight, while its battlefield-awareness networking has been greatly expanded."
 KOR_mechanized_equipment_4: "AS-21 Redback"
 KOR_mechanized_equipment_4_short: "AS-21 Redback"
 KOR_mechanized_equipment_4_desc: "Based on K-21's proprietary technological capabilities, this is a state-of-the-art heavily armored infantry fighting vehicle precisely developed for demanding overseas markets such as the Australian Army. With a hefty weight of 42 tons, it delivers top-tier defensive capabilities, while the composite rubber track softly improves ride comfort and maneuverability. It incorporates the latest technologies, including a 30mm autocannons, an iron-pist active protection system, and 360-degree situational awareness cameras."
 KOR_mechanized_equipment_5: "AS-21 PIP Redback"
 KOR_mechanized_equipment_5_short: "AS-21 PIP Redback"
 KOR_mechanized_equipment_5_desc: "Based on the AS-21 Redback's design, this is a next-generation upgrade integrating an unmanned turret and a directed laser weapon system. To fully respond to the upcoming network-centric war, command and control capabilities have been maximized, and reconnaissance and remote suicide attacks via UAVs have become possible. It is a key tactical transport vehicle of the future ground forces, which has ultimately elevated the survivability of onboard personnel."
 KOR_motorized_equipment_1: "K-711"
 KOR_motorized_equipment_1_short: "K-711"
 KOR_motorized_equipment_1_desc: "As a 5-ton, 6x6 tactical truck of the Republic of Korea Armed Forces, it quietly carries out a variety of missions in the field, including transporting large numbers of troops and supplies and towing artillery. Developed based on the American M809 series and tailored to Korea's rugged mountainous terrain, it boasts exceptional durability and the ability to break through rough terrain. It is a highly reliable vehicle that plays a central role in supply and logistics support."
 KOR_motorized_equipment_2: "K-511"
 KOR_motorized_equipment_2_short: "K-511"
 KOR_motorized_equipment_2_desc: "Widely known as the \"deuce-and-a-half,\" this 2.5-ton multipurpose tactical truck is one of the most common military vehicles in the Republic of Korea Armed Forces. Developed domestically from the M35 truck, it has countless variants for troop transport, communications, maintenance, ambulance duties, and more. Its simple, rugged mechanical design is easy to maintain in the field, making it a workhorse that has served on the front line for decades."
 KOR_motorized_equipment_3: "K-551"
 KOR_motorized_equipment_3_short: "K-551"
 KOR_motorized_equipment_3_desc: "This new tactical transport vehicle was developed to replace the military's aging truck fleet and improve operational efficiency. An armored cab and run-flat tires protect the crew from small-arms fire and fragments, while an automatic transmission and high-output engine greatly improve mobility. It is a modern logistics platform built for all-weather field resupply and rapid troop deployment."
 KOR_light_mechanized_equipment_1: "K200"
 KOR_light_mechanized_equipment_1_short: "K200"
 KOR_light_mechanized_equipment_1_desc: "It is the Republic of Korea's first independently developed tracked infantry carrier vehicle (APC), a historic model that formed the backbone of the mechanized infantry of the armed forces. By using aircraft-grade aluminum alloy armor, it achieves a light weight and excellent water crossing capability. Based on the lessons of the Vietnam War, it was widely mass-produced with a focus on the rapid deployment of infantry and the defense of light weapons."
 KOR_light_mechanized_equipment_2: "K200A1"
 KOR_light_mechanized_equipment_2_short: "K200A1"
 KOR_light_mechanized_equipment_2_desc: "It is an upgraded version that increased the K200 armored vehicle's engine output to 350 horsepower and introduced a fully automatic transmission to greatly improve maneuverability. The all-around defense capabilities were slightly improved, and a smoke grenade launcher was added to enhance battlefield survivability. Its performance has been optimized so that it can maneuver smoothly in the rugged mountainous terrain of the Korean Peninsula, in sync with the K1 tank."
 KOR_light_mechanized_equipment_3: "K806/808"
 KOR_light_mechanized_equipment_3_short: "K806/808"
 KOR_light_mechanized_equipment_3_desc: "The 'Baekho' is a wheeled armored vehicle developed for the Army's rapid-response and rear-area defense missions. It comes in two variants: the 6x6 K806 for rear-area operations and the 8x8 K808 for frontline combat. Both feature independent suspension and tactical tires. Excellent road performance gives them a wide operating radius and allows a rapid response to urban combat and asymmetric threats."
 KOR_light_mechanized_equipment_4: "K806/808A1"
 KOR_light_mechanized_equipment_4_short: "K806/808A1"
 KOR_light_mechanized_equipment_4_desc: "It is an upgraded version of the K808 wheeled armored vehicle, with its armor and weapons operation capabilities upgraded to meet modern warfare. Equipped with a Remote Controlled Weapon System (RCWS) as standard, crew members can safely and precisely fire from inside the vehicle. It is a multipurpose combat vehicle with increased slat armor and additional armor, significantly enhancing protection against anti-tank rockets (RPG) and landmine explosions."
 KOR_light_mechanized_equipment_5: "Next-generation Wheeled Armored Vehicle"
 KOR_light_mechanized_equipment_5_short: "Next-generation wheeled armored vehicle"
 KOR_light_mechanized_equipment_5_desc: "It is a next-generation multipurpose wheeled platform equipped with a hybrid electric drivetrain and AI autonomous driving technology. Its stealth-like appearance drastically reduces infrared and radar detection rates, and its modular design allows weapons and armor to be freely swapped on the battlefield to suit the mission. Optimized for reconnaissance of complex urban areas and rapid troop deployment."
 KOR_modern_tank_artillery_equipment_1: "K9 Self-propelled Howitzer"
 KOR_modern_tank_artillery_equipment_1_short: "K9 self-propelled howitzer"
 KOR_modern_tank_artillery_equipment_1_desc: "This is the Republic of Korea's premium 155mm 52-caliber self-propelled howitzer, the \"Thunder,\" which has dominated the global self-propelled artillery market. It boasts a long range of up to 40 km, excellent mobility through rough terrain, and the capability for TOT (simultaneous firing) through a precise firing control system. Secure survivability with thick armor, pour down rain of devastating firepower on enemy lines, and quickly break through the position."
 KOR_modern_tank_artillery_equipment_2: "K9A2"
 KOR_modern_tank_artillery_equipment_2_short: "K9A2"
 KOR_modern_tank_artillery_equipment_2_desc: "It is the latest upgraded version of the K9 self-propelled howitzer, featuring a fully automated unmanned turret and high-strength, highly insensitive armor to maximize firepower, rate, and survivability. Despite a significant reduction in crew, it became capable of sustained firing at up to 9 rounds per minute, and by adopting composite rubber tracks, ride comfort and ease of maintenance were greatly improved. An overwhelming firepower system that will change the paradigm of artillery firepower doctrine."
 KOR_modern_tank_artillery_equipment_3: "K9A3"
 KOR_modern_tank_artillery_equipment_3_short: "K9A3"
 KOR_modern_tank_artillery_equipment_3_desc: "As the final evolution of the K9 self-propelled howitzer system, it can conduct ultra-long-range strikes of 70 to over 100 km by operating a new smoothbore gun and extended-range rounds. Integrated with remote unmanned piloting technology, it operates as a manned-unmanned combined system (MUM-T), with artificial intelligence analyzing the target and independently calculating the optimal firing parameters. It functions as a strategic strike asset equivalent to a short-range tactical ballistic missile."
 KOR_rocket_artillery: "K136 Guryong"
 KOR_rocket_artillery_short: "K136 Guryong"
 KOR_rocket_artillery_desc: "The K136 Guryong is a domestically developed 130 mm, 36-tube multiple rocket launcher designed to counter North Korea's large rocket-artillery force. Mounted on a five-ton truck chassis, it is highly mobile and can blanket an area several football fields wide with rockets in a matter of moments. Its powerful area-suppression capability can destroy massed infantry and fortified positions."
 KOR_rocket_artillery_equipment_1: "M270 MLRS"
 KOR_rocket_artillery_equipment_1_short: "M270 MLRS"
 KOR_rocket_artillery_equipment_1_desc: "It is a 227mm tracked multiple launch rocket launch system developed by the U.S. military and adopted by the Republic of Korea Armed Forces. Using the chassis of the Bradley armored vehicle, it has excellent off-road capability and can fire the M26 self-propelled rockets, known as the \"Steel Rain,\" as well as ATACMS tactical ballistic missiles. It is a corps-level firepower asset capable of striking all at once an artillery force or a key command post located deep in enemy territory."
 KOR_motorized_rocket_equipment_2: "K239 Chunmoo"
 KOR_motorized_rocket_equipment_2_short: "K239 Chunmoo"
 KOR_motorized_rocket_equipment_2_desc: "This is the next-generation multiple-launch rocket system developed with domestic technology to replace the older multiple-launch system. It offers excellent operational flexibility by being able to operate a wide variety of warhead types in modular form, from 130 mm and 227 mm unguided rockets to 239 mm guided rockets. Mounted on an 8x8 high-mobility tactical truck, it precisely strikes targets 80 km away like a pinpoint hit, guided by GPS."
 KOR_spaa_equipment_1: "K30 Biho"
 KOR_spaa_equipment_1_short: "K30 Biho"
 KOR_spaa_equipment_1_desc: "A tracked self-propelled anti-aircraft gun of the Republic of Korea Army, equipped with a 30mm twin-barrel autocannon, designed to intercept enemy aircraft and helicopters penetrating at low altitude. Equipped with independent detection radar and an electro-optical tracker, it enables all-weather, day-and-night operations. Recently, it has evolved into the \"Biho Complex,\" which combines the Shingung surface-to-air missile, dramatically increasing its enemy interception range and engagement capability."
 KOR_spaa_equipment_2: "K30W Cheonho 30 mm Wheeled SPAAG"
 KOR_spaa_equipment_2_short: "K-30W Cheonho"
 KOR_spaa_equipment_2_desc: "It is a new air defense weapon system equipped by upgrading the Biho's 30 mm anti-aircraft gun turret onto the body of the K808 wheeled armored vehicle. By boldly omitting its own detection radar and integrating local air defense radar with data links, it can conduct precise stealth firing using the latest electro-optical tracking system (EOTS). It provides mobile units with a reliable air defense network and is excellent at countering threats from enemy small unmanned aerial vehicles (UAVs)."
 KOR_artillery_equipment_1: "KH179 155Mm Towed Howitzer"
 KOR_artillery_equipment_1_short: "KH179"
 KOR_artillery_equipment_1_desc: "The Republic of Korea independently designed and mass-produced the 155mm towed artillery, created to address the range deficiency of the conventional American M114. Equipped with a .39 caliber long-barreled barrel, it can strike targets up to 30 km away when using extended-range rounds. Though its heavy weight means serious transformations take time, its low acquisition cost and heavy single-hit firepower have made it a backbone for artillery for a long time."
 KOR_artillery_equipment_2: "K105A1 Pungik"
 KOR_artillery_equipment_2_short: "K105A1 Pungik"
 KOR_artillery_equipment_2_desc: "It is a wheeled self-propelled gun that was self-propelled by mounting the old 105 mm towed gun, which had been stored in bulk as a decoration material, onto the body of a 5-ton truck. By applying the K9 self-propelled howitzer's precise firing control system technology, automatic heat dissipation and firing specification calculation are possible with the push of a button. It is a modern weapons system responsible for rapid and precise firepower support at the infantry regiment level, achieving ultimate cost-effectiveness and efficiency."
 KOR_artillery_equipment_3: "KSM-120 Bigeok"
 KOR_artillery_equipment_3_short: "KSM-120 Bigeok"
 KOR_artillery_equipment_3_desc: "It is a fully automated self-propelled mortar system with a 120 mm mortar mounted on a K200A1 armored vehicle. Compared to the existing 4.2-inch mortar, its range and destructive power have improved by more than twice, and it is equipped with 360-degree rotational firing and rapid automatic heat dissipation. In the mountainous terrain-heavy environment of the Korean Peninsula, it provides mechanized infantry battalions with immediate and lethal artillery fire."
 KOR_artillery_equipment_4: "K9 Wheeled Type"
 KOR_artillery_equipment_4_short: "K9 wheeled type"
 KOR_artillery_equipment_4_desc: "An export and next-generation howitzer model that adapts the proven turret and armament system of the K9 self-propelled howitzer to a high-mobility 8x8 wheeled platform. Compared to tracked vehicles, it has lower operational maintenance costs and allows for rapid strategic redeployment on well-paved roads. Specializing in the Shoot and Scoot tactic, it excels at evading antiartillery fire."
 KOR_infantry_equipment_0_short: "M16A1"
 KOR_infantry_equipment_0_desc: "It is a 5.56mm assault rifle developed by the American Colt and produced under license and officially operated by the Republic of Korea at the Armaments Depot. With its light weight and direct-drive gas operation, it demonstrated excellent firing accuracy and made a significant contribution to the modernization of the South Korean military's firepower and to deployment to the Vietnam War. Although it has now been withdrawn from frontline units, it is still being used as a reliable weapon in rear or reserve forces."
 KOR_infantry_equipment_1: "K1 Submachine Gun"
 KOR_infantry_equipment_1_short: "K1 submachine gun"
 KOR_infantry_equipment_1_desc: "This compact 5.56 mm submachine gun was developed domestically to meet the Republic of Korea special forces' demand for greater firepower. Its highly compact telescoping stock provides excellent handling inside vehicles, in urban terrain, and during special operations. It delivers rifle-caliber firepower in a submachine-gun-sized package and was therefore widely issued to commanders, tank crews, and other personnel."
 KOR_infantry_equipment_2: "K2 Assault Rifle"
 KOR_infantry_equipment_2_short: "K2 assault rifle"
 KOR_infantry_equipment_2_desc: "The standard 5.56 mm assault rifle forming the backbone of the Republic of Korea Armed Forces, the K2 combines the ergonomic sight line of the M16 with the reliability of the AK-47's long-stroke gas-piston system. It continues to function in rugged mountains and clouds of dust. A right-folding stock makes it easy to carry on the march or during airborne operations, and it has long served as the dependable core of the infantry's firepower."
 KOR_infantry_equipment_3: "K2C1"
 KOR_infantry_equipment_3_short: "K2C1"
 KOR_infantry_equipment_3_desc: "It is an upgraded rifle that adds versatility by applying an aluminum Picatinny rail system and a new adjustable stock to the existing K2 rifle. With the ability to easily attach various auxiliary equipment such as optical scopes, tactical flashes, and laser target indicators, soldiers' close-combat effectiveness has been maximized. Successfully reflecting the requirements of 21st-century infantry systems, it is being supplied starting with frontline units."
 KOR_infantry_equipment_4: "K7 Silenced Submachine Gun"
 KOR_infantry_equipment_4_short: "K7 Silenced Submachine Gun"
 KOR_infantry_equipment_4_desc: "Developed from the K1 submachine gun, this 9 mm special-operations weapon features an integral suppressor. With 9 mm subsonic ammunition, its report is extremely quiet, making it ideal for night infiltration, counterterrorism, sentry elimination, and covert strikes. By replacing imported silenced firearms with a domestic design, it became a trusted silent weapon of the Republic of Korea's special forces."
 KOR_infantry_equipment_5: "DSAR-15PC"
 KOR_infantry_equipment_5_short: "DSAR-15PC"
 KOR_infantry_equipment_5_desc: "It is a modern short-stroke gas piston-operated special warfare rifle developed by a domestic firearms company based on the AR-15 structure. Its modular design allows rapid replacement of gun barrels to suit operational environments, and it is ergonomically designed for two-handed operation. It is a precise and highly durable weapon that forms the basis for the special operations submachine gun project intended to replace the existing K1A."
 KOR_infantry_equipment_6: "K11 Composite Rifle"
 KOR_infantry_equipment_6_short: "K11 Composite Rifle"
 KOR_infantry_equipment_6_desc: "An advanced composite weapon combining a 5.56 mm assault rifle and a 20 mm airburst grenade launcher into a single gun. It was designed with a built-in laser rangefinder and ballistic computer so that shells could be detonated from above the enemy hiding in a trench or behind cover to strike. The original K11 rifle was discontinued in production due to technical limitations and weight issues, but it was remanufactured with the ambitious firepower concept of future infantry weapons intact."
 KOR_attack_helicopter_equipment_1: "AH-1S"
 KOR_attack_helicopter_equipment_1_short: "AH-1S"
 KOR_attack_helicopter_equipment_1_desc: "This is the Cobra attack helicopter, boasting a sleek fuselage and the capability to carry powerful armaments. Equipped with TOW anti-tank missiles and a 20mm triple-barrel autocannon, it excellently performs the role of a \"tank hunter,\" intercepting enemy armored units from a long range. Although it had aged somewhat, it had long served as the mainstay of the Republic of Korea Army Aviation Unit, suppressing large-scale armored threats."
 KOR_attack_helicopter_equipment_2: "AH-64D"
 KOR_attack_helicopter_equipment_2_short: "AH-64D"
 KOR_attack_helicopter_equipment_2_desc: "The Apache Longbow, considered one of the world's most powerful attack helicopters, can simultaneously detect and track hundreds of targets using its longbow radar mounted on the rotor. With Hellfire missiles, it can annihilate enemy armored forces in an instant, and its advanced network data link system allows real-time sharing of battlefield conditions with friendly forces. With overwhelming survivability and firepower, it dominates the dynamics of three-dimensional maneuver operations."
 KOR_utility_helicopter_equipment_1: "UH-60M Black Hawk"
 KOR_utility_helicopter_equipment_1_short: "UH-60M"
 KOR_utility_helicopter_equipment_1_desc: "A world-class multi-purpose tactical maneuver helicopter with outstanding all-weather operational capabilities. With the latest digital cockpit, an enhanced engine, and upgraded rotor blades, payload capacity and high-altitude flight performance have been greatly improved. It quietly performs in many areas, including transporting troops, evacuating the wounded, and airlifting critical supplies, becoming the reliable and swift wing of the airborne assault units."
 KOR_utility_helicopter_equipment_2: "V22 Osprey"
 KOR_utility_helicopter_equipment_2_short: "V22 Osprey"
 KOR_utility_helicopter_equipment_2_desc: "This tiltrotor aircraft combines the vertical takeoff and landing of a helicopter with the speed and range of a fixed-wing aircraft. Able to fly more than twice as fast and far as a conventional utility helicopter, it is indispensable for the rapid deployment of special forces and over-the-horizon amphibious operations. It enables wide-ranging, three-dimensional maneuver across broad seas and island regions."
 KOR_amphibious_mechanized_equipment_1: "KAAVP-7A1"
 KOR_amphibious_mechanized_equipment_1_short: "KAAVP-7A1"
 KOR_amphibious_mechanized_equipment_1_desc: "The principal amphibious armored vehicle of the Republic of Korea Marine Corps, this vehicle launches from an amphibious assault ship and carries landing forces to hostile shores, making it central to over-the-horizon amphibious operations. Armed with a 12.7 mm K6 heavy machine gun and a 40 mm K4 automatic grenade launcher, it suppresses enemy positions along the beach and possesses excellent water mobility. It embodies the Marines' courageous spirit of 'assault.'"
 KOR_amphibious_mechanized_equipment_2: "KAAV-II"
 KOR_amphibious_mechanized_equipment_2_short: "KAAV-II"
 KOR_amphibious_mechanized_equipment_2_desc: "This is a next-generation amphibious assault armored vehicle being independently developed to overcome the slow sea speed and defensive limitations of existing amphibious assault armored vehicles. Equipped with a powerful waterjet thruster and a variable hull structure, it can maneuver at ultra-high speeds on water, and it was armed with an unmanned turret over 40 mm in diameter to boost firepower. It has been designed to significantly boost survivability and attack power, allowing you to tear through the enemy's coastal defenses in an instant."
 KOR_anti_air_equipment_1: "Mistral"
 KOR_anti_air_equipment_1_short: "Mistral"
 KOR_anti_air_equipment_1_desc: "This is the MANPADS, a portable surface-to-air missile using infrared guidance, introduced and operated in France. Although its standalone portability is limited because it is mounted on a dedicated tripod before firing, it uses a large 90mm warhead, giving it strong destructive power and excellent accuracy. It made a major contribution to the early establishment of the Republic of Korea's air defense network by effectively intercepting enemy attacks such as surprise infiltrations by low altitude, as well as helicopters and fighter jets."
 KOR_anti_air_equipment_2: "KP-SAM Shingung"
 KOR_anti_air_equipment_2_short: "KP-SAM Shingung"
 KOR_anti_air_equipment_2_desc: "Drawing on the strengths of foreign missiles, the KP-SAM Shingung is a domestically developed man-portable surface-to-air missile with a dual-color seeker. It offers excellent anti-jamming performance against countermeasures such as flares and uses a proximity fuze that detonates just before impact, shredding the target with fragments. Its high accuracy and reduced weight make it a dependable shield for frontline air-defense units."
 KOR_anti_air_equipment_3: "KM-SAM Cheongung"
 KOR_anti_air_equipment_3_short: "KM-SAM Cheongung"
 KOR_anti_tank_equipment_1: "9K115-2 Metis-M"
 KOR_anti_tank_equipment_1_short: "9K115-2 Metis-M"
 KOR_anti_tank_equipment_1_desc: "Acquired from Russia through the Brown Bear Project, this wire-guided anti-tank missile uses semi-automatic command to line of sight (SACLOS) guidance. It can be carried by infantry or mounted on a light tactical vehicle, and its tandem warhead can defeat tanks protected by explosive reactive armor (ERA). Easy to operate and highly reliable in harsh conditions, it served with distinction as the infantry battalion's principal anti-tank weapon."
 KOR_anti_tank_equipment_2: "AT-1K Hyeongung"
 KOR_anti_tank_equipment_2_short: "AT-1K Hyeongung"
 KOR_anti_tank_equipment_2_desc: "Developed with domestic technology to replace aging anti-tank weapons, this is a third-generation infantry anti-tank guided missile. Its fire-and-forget guidance eliminates the need for the operator to remain exposed while guiding the missile, while a top-attack mode dives onto the most vulnerable part of an enemy tank: the turret roof. Capable of penetrating most modern armor, it is the battlefield's 'grim reaper of tanks.'"
 KOR_train_equipment_1: "Electric Locomotive in the 8000 Series"
 KOR_train_equipment_1_desc: "It is the Republic of Korea's first full-scale freight AC electric locomotive, introduced in 1972. With its outstanding traction, it was responsible for transporting coal and cement freight on mountainous lines such as the Taebaek Line and the Jungang Line, and for decades it played a central role in freight transportation on the Republic of Korea's railways."
 KOR_train_equipment_2: "Electric Locomotive in the 8500 Series"
 KOR_train_equipment_2_desc: "This is a next-generation freight electric locomotive introduced in 2012. With its high output of 6,600 kW and improved traction performance, it replaced the aging 8,000 series locomotives and is now operating as the main locomotive for freight transport on the Republic of Korea railway."
 strat_bomber_equipment_0: "Early-model strategic bomber"
