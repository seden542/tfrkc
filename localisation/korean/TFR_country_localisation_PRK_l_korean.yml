 PRK_chinese_peoples_volunteer_army_idea: "중국인민지원군"
 PRK_chinese_peoples_volunteer_army_idea_desc: "중국의 군사고문단과 지원 병력은 조선인민군의 작전 능력을 끌어올리고 있지만, 그 존재 자체가 평양의 정치적 자율성이 얼마나 좁아졌는지를 보여주고 있습니다."
 PRK_Total_Control_idea: "완전한 지역 통제"
 PRK_Total_Control_idea_desc: "\n\n\n\n£GFX_PKR_Total_Control\n\n\n\n\n\n북한과 김씨 왕조는 오랜 세월 동안 완벽한 감시 사회를 구축해 왔습니다. 반체제 인사는 찾아보기 어려우며, 그들 대부분은 북한 내부에서 저항하기보다 탈북을 선택했습니다.\n\n'선군' 정책 덕분에 방대한 군 병력을 확보할 수 있었고, 그 대가로 빈틈없는 감시망을 유지할 수 있었습니다. 군인이든 장교든, 노동자든 청소부든, 당 관료든 그 누구든, 당과 경애하는 수령님과 군대에 대한 애국심을 끝없이 외치고 미국과 제국주의 괴뢰들로부터 보호받는 사회주의 낙원에 산다는 것이 얼마나 큰 행운인지를 쉼 없이 선전하도록 만들어 놓았습니다.\n\n김정은에 대한 개인숭배는 사상 최대 규모에 이르렀습니다. 압도적인 수의 주민이 의심 없이 충성을 다하고 있으며, 경애하는 지도자 동지를 위해 일하고 싸우고 죽을 준비가 되어 있습니다. 허나 그들은 지나치게 충성스럽습니다. §R김 위원장이 갑자기 사망하면 국가의 운명이 어떻게 될지는 아무도 모르지만요...§!"
