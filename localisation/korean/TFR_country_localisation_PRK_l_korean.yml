 PRK_politburo_of_wpk_desc: "조선로동당은 김일성 동지와 김정일 동지를 영원한 수령으로 모시고 경애하는 김정은 동지를 중심으로 조직적, 사상적으로 굳게 결속된 노동계급과 근로인민대중의 핵심적이며 선봉적인 부대입니다.\n조선로동당은 국가와 인민의 이익을 대변합니다. 정치, 경제, 군사, 문화 및 기타 모든 분야를 통일적으로 지도하는 정치 지도 조직이자 혁명의 총참모부입니다.\n\n우리의 §Y경제적 자립§!: [?PRK_economic_sovereignty_level_var|1%].\n\n현재 §t중국의 영향력§!: [?Chinese_Influence|-1%]\n\n우리의 §G군사적 준비태세§!: [?PRK_military_preparedness_level_var|1%]\n\n"
