 news.340.t: "Second Korean War"
 news.340.d: "Breaking news has arrived from the Korean Peninsula. North Korea's Korean People's Army has crossed the Military Demarcation Line into South Korean territory without even declaring war, launching an open, full-scale invasion of the Republic of Korea.\n\nWithin roughly thirty minutes of the outbreak of war, the Republic of Korea declared emergency martial law and ordered wartime mobilization. The member states of EADI and PDTO, long at odds over a range of international issues, activated their pre-established mobilization plans.\n\nThe Republic of Korea Armed Forces possess overwhelming firepower and military strength compared with the North Korean Korean People's Army, and are therefore expected to enjoy a decisive advantage in the short term. If China intervenes, however, the war could become a prolonged conflict inflicting enormous costs on both sides.\n\nFor PDTO, EADI, and the rest of the world, this war on the Korean Peninsula shows that escalating tensions between the two blocs have already reached their breaking point. Both sides appear ready to exploit the situation in support of their respective causes, and the possibility of war spreading across all of Asia can no longer be ruled out."
 news.340.a: "It's a war of our time."
 news.356.t: "China's Reoccupation of Taiwan"
 news.356.d: "This war, the largest armed conflict in East Asia since the Vietnam War, ended as one of the most densely populated and prosperous regions in the world engulfed in ruins and flames, involving the Chinese People's Liberation Army, the Republic of China Air Force, Japan's Self-Defense Forces, and the world's most elite militaries. Under the watchful eyes of countless eyes around the world, the outcome of the war was revealed. With the People's Liberation Army having achieved a complete victory at the PDTO, the Republic of China having fully surrendered, and all allied forces having completely withdrawn, only a small number of remnants remaining on the battlefield in the mountainous region, resisting.\n\nBecause of its enormous advantage in both economic and battlefield terms, most observers and national leaders had expected a Chinese victory, so this was not surprising to anyone. For the first time since 1895, as China returned to a fully sovereign state, victory celebrations began across the country, and President Xi Jinping delivered a historic speech to the crowd in the capital. Countries around the world sent congratulatory messages to China, and Russia, in particular, reaffirmed its commitment to a \"multipolar world\" in addition to the congratulations. As anxiety rises across East Asia, the PDTO sinks into a quagmire of defeat, and China plans its next move, Asia is moving toward a future ruled by hammers and sickles backed by the yuan."
 news.356.a: "The paper tiger lets out its final roar."
 news.356.b: "It's a victory!"
 news.356.c: "We were defeated..."
 news.357.t: "Maintain Taiwan's Independence"
 news.357.d: "The largest armed conflict in East Asia since the Vietnam War has finally come to an end. This war, in which the world's most advanced militaries—including China's People's Liberation Army, the Republic of China Air Force, and Japan's Self-Defense Forces—confronted each other, reduced the world's most densely populated and wealthiest regions to ruins. As the whole world watched, the outcome of the war was revealed. With the support of the PDTO, Taiwan resisted the seemingly overwhelming People's Liberation Army, and ultimately the Chinese forces were forced to withdraw from Taiwan's territory, including the island of Kinmen.\n\nThis news shocked the entire world. Because China held an absolute advantage in military and economic power. But the surprise soon turned into joy, and from Tokyo to Canberra, spontaneous marches followed in many cities celebrating the defeat of the dictatorship and the victory of the Liberal Democratic Union. In contrast, Beijing fell into a heavy silence, and the Chinese Communist Party and Xi Jinping found themselves in crisis, facing the shock of defeat and the greater problems yet to come."
 news.357.a: "China may not be that powerful."
 news.357.b: "We were defeated..."
 news.357.c: "The dragon has been pushed into the cave!"
 news.413.t: "EADI's Great Asian War Victory"
 news.413.d: "There are very few places on Earth, such as the Asia-Pacific region, that remain continuously at risk of conflict. Since the end of World War II, this region has experienced prolonged border clashes in South Asia, intermittent guerrilla warfare in Indochina, and tense military confrontations across the Military Demarcation Line and the Taiwan Strait. Each confrontation seemed nothing more than a spark before it escalated into an all-out war. However, the Great Asian War, which has dragged on for so long, is finally showing signs of coming to an end.\n\nThe East Asian Defense Initiative, composed of countries such as China, North Korea, and Pakistan, emerged as the ultimate victor in this long war. This alliance, by resisting imperialist hegemony and paying tremendous sacrifices, has established itself as a just force for half of the peoples of the world. The so-called PDTOs, the defeated, were left completely torn apart even by the veneer of \"democracy\" and faced the people's retaliation."
 news.413.a: "Peace is valuable in itself."
 news.414.t: "PDTO's Victory in the Great Asian War"
 news.414.d: "There are very few places on Earth, such as the Asia-Pacific region, that remain continuously at risk of conflict. Since the end of World War II, this region has experienced prolonged border clashes in South Asia, intermittent guerrilla warfare in Indochina, and tense military confrontations across the Military Demarcation Line and the Taiwan Strait. Each confrontation seemed nothing more than a spark before it escalated into an all-out war. However, the Great Asian War, which has dragged on for so long, is finally showing signs of coming to an end.\n\nThe Pacific Defense Treaty Organization, composed of countries such as Japan, Australia, India, and South Korea, emerged as the ultimate victor in this long-standing conflict. This alliance of democracies has proven itself to be a struggle for freedom for half the world's population, at a considerable cost. The defeated nation, that is, the China-led EADI, faced inevitable atonement while completely losing the ability to start another war."
 news.414.a: "Peace is valuable in itself."
 news.415.t: "The Great Asian War!"
 news.415.d: "Since the Taiwan War ended, everyone has been counting down the days to this moment. War has now been formally declared between the East Asian Defense Initiative (EADI) and the Pacific Defense Treaty Organization (PDTO), the two defining military alliances of the post-Cold War era. People immediately began calling this new conflict the \"Great Asian War.\"\n\nThe name evokes both the Pacific War of World War II and Imperial Japan's so-called \"Greater East Asia War,\" but this war is on a scale far beyond any previous conflict in the Asia-Pacific. Some believe that China—with its enormous population, formidable industrial capacity, and the world's largest military—holds an overwhelming advantage over its enemies alongside its EADI allies. EADI members can also exploit their interior lines and use Chinese territory as a secure rear base. Others argue that the Japan- and Korea-led PDTO geographically surrounds and contains China, and that its command of vast seas will secure maritime supremacy and stable trade routes. Predominantly composed of \"democracies,\" the PDTO also claims an inherent ideological advantage over the \"authoritarian\" states of the EADI.\n\nFrom the moment it begins, war advances by the logic of force alone. From land to sea, from sky to space, and now into cyberspace, the god of war has begun a bloody game that will shape humanity's political landscape for the next half-century."
 news.415.a: "The flames that will consume the Asia-Pacific are rising."
 news.416.t: "The Second Battle of Seoul"
 news.416.d: "Recently, PDTO planned a nationwide operation to recapture Seoul. After fierce fighting, the PDTO succeeded in retaking control of the area.\n\nHaving recaptured Seoul, PDTO can now use this modern city as a natural barrier in the struggle surrounding Korea. However, the situation is still bleak. Although it achieved a temporary victory, the PDTO is still facing the threat of a relatively intact EADI force. In addition, the issue of the large number of refugees that emerged in Seoul after two battles is testing PDTO's ability to govern. \n\nOn the other hand, EADI must face Seoul's loss and recovery head-on. It still proves that the PDTO possesses considerable combat capability. EADI will have to solve this problem soon."
 news.416.a: "PDTO is back."
 news.527.t: "The Republic of Korea Armed Forces' Entry into Manchuria"
 news.527.d: "News has arrived from Asia: PDTO coalition forces spearheaded by the Republic of Korea Armed Forces have advanced through the Korean Peninsula, crossed the Yalu and Tumen Rivers, and entered Northeast China. The operation marks a humiliating defeat for China and the EADI forces—and gives the PDTO cause to celebrate.\n\nFor the Republic of Korea and its allies, the news signals a major victory in the \"Great Asian War.\" As Chinese forces are steadily pushed back within their own borders, many military analysts now judge that the tide has turned in favor of the Pacific Defense Treaty Organization.\n\nChina and the EADI, meanwhile, insist that the setback is merely a brief defeat caused by unfavorable terrain and boast that they will soon drive the PDTO out of Manchuria. At least, that is what Chinese citizens appear to believe."
 news.527.a: "The war is intensifying..."