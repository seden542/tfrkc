 LOADING_TIP_210: "단순히 베토벤의 교향곡을 연주하라는 지시만으로는 그것을 잘 연주하게 할 수 없는 경우가 있다.\n- 알렉산드르 콜차크"
 LOADING_TIP_211: "힘 있는 사람은 힘으로, 지식 있는 사람은 지식으로, 돈 있는 사람은 돈으로.\n- 김일성"
 LOADING_TIP_212: "작고 납작한 벽돌, 직사각형의 팬케이크 같은 책은 인류가 발명한 가장 기발한 창조물이다. 얼마나 많은 이들이 책에 의해 길을 잃었는가! 성경과 복음서는 여러 전쟁의 원인이 되었고, 마르크스의 책들 또한 그렇다! 그리고 나의 투쟁! 마리겔라의 도시 게릴라 교본까지!\n- 예두아르트 리모노프"
 LOADING_TIP_213: "좌파도 우파도 없다. 오직 체제와 체제의 적들만이 존재할 뿐이다.\n- 예두아르트 리모노프"
 LOADING_TIP_214: "사람을 무는 개가 물에 빠졌을 때, 그 개를 구해줘서는 안 된다.\n- 조국"
 LOADING_TIP_215: "미국한테 매달려 가지고 바짓가랭이 매달려 가지고 미국 응딩이 뒤에서 숨어 가지고 \"형님, 형님, 형님 빽만 믿겠다.\", 이게 자주 국가의 국민들의 안보의식일 수가 있겠습니까?\n- 노무현"
 LOADING_TIP_216: " 미국이 주도하는 질서, 그것을 거역할 순 없어. 그러나 최소한 자주 국가, 독립 국가로서의 체면은 유지해야 될 거 아니겠습니까? 때때로 한 번씩 배짱이라도 내보일 수 있어야 될 거 아닙니까?\n- 노무현"
 LOADING_TIP_217: "표현의 자유는 분명 존재한다, 하지만 표현 이후의 자유는 보장할 수 없다.\n- 이디 아민"
 LOADING_TIP_218: "현대인의 삶은 너무나도 얇고, 피상적이며, 가짜 같다. 나는 개발자들이 파산하고, 일본이 더 가난해지며, 들풀이 모든 것을 뒤덮는 날이 오기를 고대한다.\n- 미야자키 하야오"
 LOADING_TIP_219: "과거가 불우했다고 지금 그 과거를 원망한다면 불우했던 과거는 영원히 너의 영역의 사생아가 되는 것이 아니냐?\n- 전태일"
 LOADING_TIP_220: "그가 천 개의 도시에서 울부짖는 소리가 들리지 않는가? 전투가 우리를 둘러싸던 그 날들처럼, 그의 천둥소리가 우리 주위에서 울리는 것이 들리지 않는가? 우리 모두의 눈 속에서 그의 불꽃이 빛나는 것이 보이지 않는가?\n- 에른스트 윙어"
 LOADING_TIP_221: "어떤 사람은 통치하고 어떤 사람은 다스려야 한다는 것은 필요하고도 편리한 일이며, 태어날 때부터 어떤 사람은 복종하도록, 어떤 사람은 다스리도록 정해져 있다. \n- 아리스토텔레스, 정치학"
 LOADING_TIP_222: "구세계가 죽어가는 한편 신세계는 태어나기 위해 안간힘을 쓰고 있다. 지금이야말로 괴물들의 시대일지라.\n- 안토니오 그람시"
 LOADING_TIP_223: "인생은 생각할수록 아름답고 역사는 앞으로 발전한다.\n- 김대중"
 LOADING_TIP_224: "우리는 소유한 것으로 풍요로워지는 것이 아니라, 없어도 될 것으로 풍요로워진다.\n- 이마누엘 칸트"
 LOADING_TIP_225: "자유가 아니면 죽음을 달라!\n- 패트릭 헨리"
 LOADING_TIP_226: "이상을 가진 이들은 의사를 찾아가야 한다.\n- 헬무트 슈미트"
 LOADING_TIP_227: "한 바퀴를 돌고 다시 한 바퀴를 돌자. 그러면 우리는 오늘보다도 더 의식적으로 인생의 고난을 맛볼 수 있으리라.\n- 아쿠타가와 류노스케"
 LOADING_TIP_228: "그는 극좌의 왼쪽에 있었다. 그러므로 극좌를 경멸했다.\n- 아쿠타가와 류노스케"
 LOADING_TIP_229: "나는 확실히 실패했다. 그러나 나를 창조한 것은 반드시 다른 누군가를 창조할 것이다. 한 그루 나무의 죽음은 대수롭지 않다. 수많은 씨앗을 품은 광활한 대지가 있는 한.\n- 아쿠타가와 류노스케"
 LOADING_TIP_230: "시대의 조류는 조만간 인간 세계의 여러 모순을 그대로 두지 않을 것이다. 서둘러 이 과거의 껍데기를 벗지 못하면 국가도 개인도 이내 망하고 말 것이다.\n- 여운형"
 LOADING_TIP_231: "인민의 행복이 당과 정부가 베푸는 시혜라는 잘못된 인식을 끝장내야 한다.\n- 왕양"
 LOADING_TIP_232: "공정이란 출발선에서의 평등이지, 결승선에서의 평등이 아니다.\n- 후춘화"
 LOADING_TIP_233: "그토록 오랫동안 빙빙 돌고 돌아, 마침내 겨울에도 잎을 지키는 나무들이 있는 곳에 당도했구나.\n- 후춘화"
 LOADING_TIP_234: "우리 공산주의자들에게도 신앙이 있습니다. 우리의 신앙은 마르크스-레닌주의에 있습니다. 공산주의 운동을 위해 평생을 싸우기 위해 당과 국가에 목숨을 바쳐야 한다는 신앙이 있습니다.\n- 천취안궈"
 LOADING_TIP_235: "나는 미국에 갈 생각도 전혀 없고, 미국에 단 한 푼, 한 뼘의 자산도 가지고 있지 않다. 그들이 이른바 \"제재\"라고 부르는 것은 추악한 익살극이자 스스로를 모욕하는 미국의 정치인들의 역겨운 술수에 불과하며, 누구도 두려워하지 않을 것이다.\n- 천취안궈"
 LOADING_TIP_236: "권력의 사용은 중국 정치의 핵심이며, 권력을 효과적으로 사용하지 않고는 안정적이고 통일된 국가를 가질 수 없다.\n- 왕후닝"
 LOADING_TIP_237: "강철 같은 믿음, 강철 같은 신념, 강철 같은 규율, 강철 같은 책임.\n- 리쭤청"
 LOADING_TIP_238: "중국 인민은 어떤 외세도 중국을 괴롭히거나, 억압하거나, 노예로 삼는 것을 결코 용납하지 않을 것이며, 그렇게 하려는 자는 누구든 14억 중국 인민이 피와 살로 쌓아 올린 강철의 만리장성에 머리가 깨져 피흘리게 할 것입니다!\n- 시진핑"
 LOADING_TIP_239: "요즘 사람들은 선대들이 무능했고 중국을 엉망으로 만들었다고들 합니다. 제 가장 큰 소원은 미래 세대의 중국인들이 우리에 대해 똑같은 말을, 즉 우리가 무능했고 중국을 엉망으로 만들었다는 말을 하지 않는 것입니다.\n- 왕후닝"
 LOADING_TIP_240: "\"칼자루\"는 반드시 당과 인민의 손에 단단히 쥐어져야 한다.\n- 천원칭"
 LOADING_TIP_241: "참으로 인간 가운데 영웅으로 살고 신령 가운데 영웅으로 죽으려면, 큰 꿈을 위해 기꺼이 희생하고, 감히 해와 달을 새로운 하늘로 바꾸려는 숭고한 이상을 지녀야 한다.\n- 천취안궈"
 LOADING_TIP_242: "문명국가를 다스리려면 강력한 군대가 있어야 한다.\n- 리쭤청"
 LOADING_TIP_243: "희망찬 국가는 영웅 없이는 설 수 없으며, 유망한 국가는 개척자 없이는 나아갈 수 없습니다.\n- 시진핑"
 LOADING_TIP_244: "그들과 다르게 하는 것이 옳은 길이라는 것을 보여주는 게 가장 최선의 복수다.\n- 문재인"