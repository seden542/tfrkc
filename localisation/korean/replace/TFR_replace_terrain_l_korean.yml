 naples: "나폴리"
 naples_desc: "----\n§9나폴리는 바다 곁에 앉아 있네, 푸른 아치의 쐐기돌이여,\n모든 나라가 인정한 비할 데 없는 환희의 여왕이라네\n그녀는 대양의 진노를 비웃고, 베수비오의 격노를 조롱하며\n햇살 가득한 거리를 메우는 질병과 비참함, 기근을 일축하네.§!"
