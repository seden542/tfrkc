 # ===== Category =====
 KOR_defense_reform_category: "Defense Reform"
 KOR_defense_reform_category_desc: "§A Devotion to the country §! §P The duty of a soldier §!, dedicating oneself to the country is the fundamental duty of a soldier."

 # ===== GUI =====
 TFRKP_defreform_open_tooltip: "§GDefense Reform§!\nOpen the defense reform status board."
 TFRKP_defreform_hanzi_tooltip: "§YDevotion to the Nation Is a Soldier's Duty§!\n- Ahn Jung-geun\n--------------\n§LThis famous phrase was left by Ahn Jung-geun to Chiba Toshichi, a Japanese prison guard who was deeply moved after meeting Ahn in prison and became troubled by his own duty.\n\nFrom the unforgettable humiliation of June 25, when artillery fire sounded across the border at dawn and Seoul fell in only three days, through the retreat to the Nakdong River in Yeongnam and the eventual recapture of the capital, every achievement was made possible because soldiers fulfilled their duty to devote themselves to Korea.\n\nAcross successive governments, the fruits of rapid growth were continuously invested in the armed forces, eventually earning Korea the glorious title of one of the world's seven greatest military powers. Yet the Republic of Korea Armed Forces, having accepted devotion to the nation as a soldier's duty like an inflexible dogma, are burdened by long-standing procurement corruption, abuses in the barracks, inequality in military service, and above all the departure of junior officers—more problems than can be counted on ten fingers. Both troop morale and public trust are now falling together.\n\nWe may have several choices left, but there is only one road we must take.\n\nWe must thoroughly reform every affliction, so that by the time our children enlist, injustice will be gone and these abuses will be remembered only as fragments of the past. There is no other way.§!"
 TFRKP_defreform_token_label_text: "Defense Reform Token"
 TFRKP_defreform_token_count_text: "§Y[?KOR_defreform_token_var|0]§! / 5"
 TFRKP_defreform_token_tooltip: "§YDefense Reform Tokens§!\nAdopting a defense reform agenda consumes §Y1 token§!.\nThey can be earned through focuses and events."
 TFRKP_defreform_progress_label_text: "Progress on Defense Reform"
 TFRKP_defreform_progress_value_text: "§G[?KOR_defreform_progress_var|0]%§!"
 TFRKP_defreform_trust_label_text: "Trust in the Republic of Korea Armed Forces"
 TFRKP_defreform_trust_value_text: "§C[?KOR_defreform_trust_var|0]%§!"
 TFRKP_defreform_rank_label_text: "World army rankings"
 TFRKP_defreform_rank_value_text: "Rank §Y[?KOR_defreform_rank_var|0]§!"

