 KOR_supreme_council_prosperity_loyalty_campaign: "조국미래화 충정 결의"
 KOR_supreme_council_prosperity_loyalty_campaign_desc: "산업 현장과 경제 관료들을 모아 국가재건의 성과를 선전하고 최고회의에 대한 충정을 다짐하게 합니다. 사업이 끝나면 §Y충정 5§!를 획득합니다."
 KOR_supreme_council_stability_loyalty_campaign: "국가안정 충정 결의"
 KOR_supreme_council_stability_loyalty_campaign_desc: "관변단체와 행정조직을 동원해 질서와 안정을 최고회의의 공으로 돌리는 결의대회를 엽니다. 사업이 끝나면 §Y충정 5§!를 획득합니다."
 KOR_supreme_council_freedom_loyalty_campaign: "자유수호 충정 결의"
 KOR_supreme_council_freedom_loyalty_campaign_desc: "자유대한의 수호와 최고회의에 대한 충정을 하나의 구호로 묶어 전국적인 결의운동을 전개합니다. 사업이 끝나면 §Y충정 5§!를 획득합니다."

