# Equipments
 KOR_light_tank_equipment_1: "K290"
 KOR_light_tank_equipment_1_short: "K290"
 KOR_light_tank_equipment_1_desc: "K200 장갑차의 차체를 기반으로 90mm 저압포를 탑재하여 화력을 강화한 화력지원차량 및 경전차 제안형입니다. 주로 수출 시장을 겨냥하여 개발되었으나 국군에 제식 채용되지는 못했습니다. 우수한 기동성과 화력의 균형을 맞추고자 했으며, 분쟁 지역에서의 신속한 전개와 보병 화력 지원에 적합하도록 설계되었습니다."
 KOR_light_tank_equipment_2: "K-21 XC8(105)"
 KOR_light_tank_equipment_2_short: "K-21 XC8(105)"
 KOR_light_tank_equipment_2_desc: "K-21 보병전투차의 차체에 벨기에 존 코커릴 사의 105mm 포탑을 결합한 화력 강화형 모델입니다. 경전차 체급의 기동력을 유지하면서도 구형 주력 전차에 준하는 훌륭한 대전차 화력을 제공합니다. 자체 부항 능력을 통한 도하가 가능하여, 다양한 전장 환경에서 기계화 보병과 함께 신속한 화력 지원을 수행할 수 있습니다."
 KOR_light_tank_equipment_3: "K-21 XC8(120)"
 KOR_light_tank_equipment_3_short: "K-21 XC8(120)"
 KOR_light_tank_equipment_3_desc: "K-21 장갑차 차체에 120mm 고압 저반동포를 탑재하여 공격력을 극대화한 현대화된 경전차입니다. 최신 사격통제장치와 결합되어 강력한 날개안정분리철갑탄 운용이 가능하며, 3세대 전차의 측면이나 구형 전차를 효과적으로 격파할 수 있습니다. 가벼운 차체 덕분에 중전차가 진입하기 힘든 산악 지형이나 험지에서도 뛰어난 기동성을 발휘합니다."
 KOR_light_tank_equipment_4: "AS-21 PIP"
 KOR_light_tank_equipment_4_short: "AS-21 PIP"
 KOR_light_tank_equipment_4_desc: "차세대 보병전투차량인 레드백(AS-21)의 차체를 기반으로 방어력과 화력을 한층 개량한 파생형 경전차 모델입니다. 능동방호체계(APS)와 복합 장갑재를 덧대어 전장 생존성을 극대화했습니다. 대구경 주포 시스템을 탑재하여 기계화 보병 부대의 선봉에서 적의 기갑 전력을 압도하고 신속한 돌파구를 마련하도록 설계되었습니다."
 KOR_modern_tank_equipment_1: "K1A1"
 KOR_modern_tank_equipment_1_short: "K1A1"
 KOR_modern_tank_equipment_1_desc: "기존 K1 전차의 105mm 강선포를 120mm 44구경장 활강포로 교체하여 화력을 대폭 끌어올린 대한민국 육군의 3세대 주력 전차입니다. 특수장갑을 개량하고 한국형 사격통제장치(KGPS)를 탑재하여 야간 전투 능력과 이동 간 사격 명중률이 크게 향상되었습니다. 21세기 초반 한반도의 험준하고 복잡한 지형에서 적 기갑전력을 확실하게 제압하기 위해 개발된 전장의 든든한 방패입니다."
 KOR_modern_tank_equipment_2: "K-2 흑표"
 KOR_modern_tank_equipment_2_short: "K-2 흑표"
 KOR_modern_tank_equipment_2_desc: "세계 최고 수준의 성능을 자랑하는 대한민국의 3.5세대 최신예 주력 전차입니다. 120mm 55구경장 활강포와 자동장전장치를 채용하여 승무원 수를 줄이면서도 강력한 화력과 높은 발사 속도를 지니고 있습니다. 반능동 현수장치(ISU)를 통해 차체 자세 제어가 가능해 산악 지형에서 유리하며, 진보된 베트로닉스와 복합장갑으로 공수 양면에서 완벽에 가까운 밸런스를 갖췄습니다."
 KOR_modern_tank_equipment_3: "K-3"
 KOR_modern_tank_equipment_3_short: "K-3"
 KOR_modern_tank_equipment_3_desc: "스텔스 설계 및 무인화 포탑이 적용된 대한민국 국군의 차세대(4세대) 주력 전차입니다. 승무원 보호를 위해 차체 내부에 캡슐형 전투실을 마련하고 130mm 이상의 대구경 주포 탑재를 목표로 설계되었습니다. 인공지능 기반의 자율 주행, 수소 연료 전지, 다목적 드론 운용 능력을 통합하여 미래 전장을 지배할 핵심 기동 전력으로 기획되었습니다."
 KOR_modern_tank_equipment_4: "K-4"
 KOR_modern_tank_equipment_4_short: "K-4"
 KOR_modern_tank_equipment_4_desc: "기존 전차의 개념을 완전히 탈피한 초현대식 기동 타격 체계로, 완전 무인화 및 AI 통제 네트워크를 기반으로 작동합니다. 신소재 초경량 장갑과 전방위 지향성 능동방호체계를 융합하여 전장에서 절대적인 생존성을 확보했습니다. 초고속 운동에너지탄 또는 전열화학포를 사용하여 적의 어떠한 중장갑 방어 체계도 무력화할 수 있습니다."
 KOR_modern_tank_equipment_5: "K-5"
 KOR_modern_tank_equipment_5_short: "K-5"
 KOR_modern_tank_equipment_5_desc: "어떠한 극한의 전장 환경에서도 작전이 가능한 극초음속 타격 및 전자기장 방어 능력을 품은 미래 지상전의 궁극적 병기입니다. 양자 컴퓨터를 활용한 실시간 전장 전술 분석으로 적의 움직임을 예측하고 초수평선 밖에서 타격합니다. 중력 제어 및 반발력 기술이 일부 도입되어 기존 궤도 차량의 험지 돌파력 개념을 새로 쓴 혁신적인 플랫폼입니다."
 KOR_modern_tank_equipment_6: "K-6"
 KOR_modern_tank_equipment_6_short: "K-6"
 KOR_modern_tank_equipment_6_desc: "전통적인 지상 차량의 한계를 초월한 다목적 복합 기동 플랫폼으로 구상된 미래형 전차의 최종 진화형입니다. 전황에 따라 형태를 변형하거나 지상 표면 위를 고속으로 활공하며 전선을 돌파할 수 있습니다. 궤도 폭격 유도 기능과 소형 전술 핵 억지력을 자체 내장하여, 단일 병기만으로도 전역의 판도를 바꿀 수 있는 전략 자산으로 평가받습니다."
 KOR_mechanized_equipment_1: "KAFV"
 KOR_mechanized_equipment_1_short: "KAFV"
 KOR_mechanized_equipment_1_desc: "K200 장갑차를 기반으로 25mm 또는 30mm 기관포탑을 탑재하여 화력을 증강시킨 보병전투차량 수출형 모델입니다. 기존 병력수송장갑차(APC)의 빈약한 화력을 보완하여 보병 화력 지원 능력을 획기적으로 강화했습니다. 우수한 신뢰성과 가성비를 바탕으로 개발되었으나, 국군 주력 IFV의 자리는 다른 차량에게 내어주었습니다."
 KOR_mechanized_equipment_2: "K-21"
 KOR_mechanized_equipment_2_short: "K-21"
 KOR_mechanized_equipment_2_desc: "대한민국 육군의 주력 보병전투차량(IFV)으로, 40mm 기관포와 현궁 대전차 미사일을 탑재하여 적 장갑차는 물론 저고도 헬기까지 요격할 수 있습니다. 25톤급의 만만치 않은 중량에도 불구하고 복합장갑과 전개식 수상 부양 장치를 갖추어 자체 도하가 가능합니다. 강력한 화력과 기동성을 통해 기계화 부대의 핵심적인 보병 전력으로 활약합니다."
 KOR_mechanized_equipment_3: "K-21 PIP"
 KOR_mechanized_equipment_3_short: "K-21 PIP"
 KOR_mechanized_equipment_3_desc: "K-21 보병전투차량의 방어력과 생존성을 한층 강화하기 위해 추진된 성능 개량형입니다. 비활성 반응장갑과 능동방호체계(APS)를 장착하여 대전차 로켓 및 미사일 위협에 대한 방호력을 획기적으로 높였습니다. 늘어난 중량에 맞춰 엔진 출력 및 현가장치가 개량되었으며, 전장 인식 네트워크 능력이 크게 향상되었습니다."
 KOR_mechanized_equipment_4: "AS-21 레드백"
 KOR_mechanized_equipment_4_short: "AS-21 레드백"
 KOR_mechanized_equipment_4_desc: "K-21의 독자적인 기술력을 바탕으로 호주 육군 등 까다로운 해외 시장을 겨냥해 정밀하게 개발된 최첨단 중장갑 보병전투차량입니다. 42톤에 달하는 묵직한 중량으로 최고 수준의 방어력을 제공하며, 복합소재 고무궤도를 적용해 승차감과 기동성을 부드럽게 개선했습니다. 30mm 기관포와 아이언 피스트 능동방호체계, 360도 상황인식 카메라 등 최신 기술이 집약되어 있습니다."
 KOR_mechanized_equipment_5: "AS-21 PIP 레드백"
 KOR_mechanized_equipment_5_short: "AS-21 PIP 레드백"
 KOR_mechanized_equipment_5_desc: "AS-21 레드백의 설계를 바탕으로 무인 포탑 및 지향성 레이저 무기 체계를 통합한 차세대 개량형입니다. 다가올 네트워크 중심전에 완벽히 대응하기 위해 지휘통제 능력이 극대화되었으며, 차재 드론을 통한 정찰 및 원격 자폭 공격이 가능해졌습니다. 탑승 병력의 생존성을 궁극으로 끌어올린 미래 지상군의 핵심 전술 이송 수단입니다."
 KOR_motorized_equipment_1: "K-711"
 KOR_motorized_equipment_1_short: "K-711"
 KOR_motorized_equipment_1_desc: "대한민국 국군의 5톤급 6x6 전술 트럭으로, 야전에서 대규모 병력 및 물자 수송, 야포 견인 등 다양한 임무를 묵묵히 수행합니다. 미국의 M809 시리즈를 기반으로 한국의 험한 산악 지형에 맞게 개발되었으며, 뛰어난 내구성과 험지 돌파 능력을 자랑합니다. 보급 및 군수 지원의 중추적인 역할을 담당하는 신뢰성 높은 차량입니다."
 KOR_motorized_equipment_2: "K-511"
 KOR_motorized_equipment_2_short: "K-511"
 KOR_motorized_equipment_2_desc: "일명 '두돈반'으로 널리 불리는 2.5톤급 다목적 전술 트럭으로, 국군에서 가장 흔하게 찾아볼 수 있는 군용 차량입니다. M35 트럭을 바탕으로 자체 개발되었으며, 병력 수송부터 통신, 정비, 구급 등 무수히 많은 파생형을 가지고 있습니다. 단순하고 튼튼한 기계식 구조로 야전 유지보수가 용이하여 오랫동안 전선을 지켜온 일꾼입니다."
 KOR_motorized_equipment_3: "K-551"
 KOR_motorized_equipment_3_short: "K-551"
 KOR_motorized_equipment_3_desc: "기존의 노후화된 구형 트럭 체계를 대체하고 작전 효율을 높이기 위해 개발된 신형 전술 수송 차량입니다. 방탄 캡과 런플랫 타이어를 적용하여 소형 화기와 파편으로부터 승무원의 생존성을 높이고, 자동변속기와 고출력 엔진으로 기동성을 대폭 개선했습니다. 전천후 야전 보급과 신속한 병력 투입을 보장하는 현대적인 물류 플랫폼입니다."
 KOR_light_mechanized_equipment_1: "K200"
 KOR_light_mechanized_equipment_1_short: "K200"
 KOR_light_mechanized_equipment_1_desc: "대한민국이 최초로 독자 개발한 궤도형 보병수송장갑차(APC)로, 국군 기계화 보병의 뼈대를 이룬 역사적인 모델입니다. 항공기용 알루미늄 합금 장갑을 사용하여 가벼운 중량과 우수한 수상 도하 능력을 확보했습니다. 베트남전의 교훈을 바탕으로 보병의 신속한 전개와 소형 화기 방어에 초점을 맞추어 널리 양산되었습니다."
 KOR_light_mechanized_equipment_2: "K200A1"
 KOR_light_mechanized_equipment_2_short: "K200A1"
 KOR_light_mechanized_equipment_2_desc: "K200 장갑차의 엔진 출력을 350마력으로 높이고 완전 자동 변속기를 도입하여 기동력을 크게 향상시킨 개량형입니다. 전방위 방어력을 소폭 개선하고 연막탄 발사기를 추가하여 전장 생존성을 높였습니다. 험준한 한반도의 산악 지형에서도 K1 전차와 발을 맞추어 원활하게 기동할 수 있도록 성능이 최적화되었습니다."
 KOR_light_mechanized_equipment_3: "K806/808"
 KOR_light_mechanized_equipment_3_short: "K806/808"
 KOR_light_mechanized_equipment_3_desc: "육군의 신속대응 및 후방 지역 방어를 위해 개발된 차륜형 장갑차 '백호'입니다. 후방 작전용 6x6 형태의 K806과 전방 전투용 8x8 형태의 K808로 나뉘며, 독립 현가장치와 전술 타이어를 장착했습니다. 우수한 도로 주행 성능을 바탕으로 넒은 작전 반경을 가지며 시가지 전투와 비대칭 위협에 신속하게 대응할 수 있습니다."
 KOR_light_mechanized_equipment_4: "K806/808A1"
 KOR_light_mechanized_equipment_4_short: "K806/808A1"
 KOR_light_mechanized_equipment_4_desc: "K808 차륜형 장갑차의 방어력과 무장 운용 능력을 현대전에 맞게 업그레이드한 개량형입니다. 무인원격사격통제체계(RCWS)를 기본 장착하여 승무원이 차내에서 안전하고 정밀하게 사격할 수 있습니다. 슬랫아머와 부가 장갑을 증설하여 대전차 로켓(RPG) 및 지뢰 폭발에 대한 방호력을 크게 높인 다목적 전투 차량입니다."
 KOR_light_mechanized_equipment_5: "차세대 차륜형장갑차"
 KOR_light_mechanized_equipment_5_short: "차세대 차륜형장갑차"
 KOR_light_mechanized_equipment_5_desc: "하이브리드 전기 구동계와 인공지능 자율주행 기술이 적용된 차세대 다목적 차륜형 플랫폼입니다. 스텔스 형상의 외관으로 적외선 및 레이다 탐지율을 극단적으로 낮추었고, 모듈화 설계를 통해 임무에 맞춰 무장과 장갑을 야전에서 자유롭게 교체할 수 있습니다. 복잡한 도심 지역 정찰 및 초고속 병력 전개에 최적화되어 있습니다."
 KOR_modern_tank_artillery_equipment_1: "K9 자주곡사포"
 KOR_modern_tank_artillery_equipment_1_short: "K9 자주곡사포"
 KOR_modern_tank_artillery_equipment_1_desc: "전 세계 자주포 시장을 석권한 대한민국의 155mm 52구경장 명품 자주곡사포 '썬더(Thunder)'입니다. 최대 40km에 달하는 긴 사거리와 우수한 험지 기동력, 정밀한 사격통제장치를 통한 TOT(동시탄착) 사격 능력을 자랑합니다. 두터운 장갑으로 생존성을 확보했으며, 적진에 치명적인 화력의 비를 쏟아붓고 신속하게 진지를 이탈할 수 있습니다."
 KOR_modern_tank_artillery_equipment_2: "K9A2"
 KOR_modern_tank_artillery_equipment_2_short: "K9A2"
 KOR_modern_tank_artillery_equipment_2_desc: "K9 자주곡사포에 완전 자동화된 무인 포탑과 고강도 둔감장약을 적용하여 화력 투사 속도와 생존성을 극대화한 최신 개량형입니다. 승무원 수가 크게 줄었음에도 분당 최대 9발의 지속 사격이 가능해졌으며, 복합소재 고무 궤도를 채택해 승차감과 정비성을 대폭 향상시켰습니다. 포병 화력 교리의 패러다임을 바꿀 압도적인 화력 체계입니다."
 KOR_modern_tank_artillery_equipment_3: "K9A3"
 KOR_modern_tank_artillery_equipment_3_short: "K9A3"
 KOR_modern_tank_artillery_equipment_3_desc: "K9 자주포 체계의 최종 진화형으로, 신형 활강포신과 사거리 연장탄을 운용하여 70~100km 이상의 초장거리 타격이 가능합니다. 원격 무인 조종 기술이 통합되어 유무인 복합 체계(MUM-T)로 운용되며, 인공지능이 목표물을 분석하여 최적의 사격 제원을 스스로 산출합니다. 사실상 단거리 전술 탄도 미사일 급의 전략적 타격 자산으로 기능합니다."
 KOR_rocket_artillery: "K136 구룡"
 KOR_rocket_artillery_short: "K136 구룡"
 KOR_rocket_artillery_desc: "대한민국이 북한의 대규모 방사포 위협에 대응하기 위해 독자 개발한 130mm 36연장 다연장 로켓포입니다. 5톤 트럭 차체에 탑재되어 기동성이 뛰어나며, 짧은 시간 내에 대량의 로켓을 일제히 쏟아부어 축구장 몇 개 넓이의 면적을 초토화할 수 있습니다. 적의 보병 밀집 부대나 진지를 파괴하는 강력한 지역 제압 능력을 갖추고 있습니다."
 KOR_rocket_artillery_equipment_1: "M270 MLRS"
 KOR_rocket_artillery_equipment_1_short: "M270 MLRS"
 KOR_rocket_artillery_equipment_1_desc: "미군이 개발하고 대한민국 국군이 도입한 227mm 궤도형 다연장 로켓 발사 시스템입니다. 브래들리 장갑차의 차체를 사용하여 험지 주행 능력이 뛰어나며, '강철 비'라 불리는 M26 자탄 로켓이나 에이태킴스(ATACMS) 전술 탄도 미사일을 발사할 수 있습니다. 적 종심에 위치한 포병 전력이나 핵심 지휘소를 일거에 타격하는 군단급 화력 자산입니다."
 KOR_motorized_rocket_equipment_2: "K-239 천무"
 KOR_motorized_rocket_equipment_2_short: "K-239 천무"
 KOR_motorized_rocket_equipment_2_desc: "구형 다연장 시스템을 대체하기 위해 국내 기술로 개발된 차기 다연장 로켓 시스템입니다. 130mm, 227mm 무유도 로켓부터 239mm 유도 로켓까지 다양한 구경의 탄종을 모듈화하여 운용할 수 있어 작전 유연성이 뛰어납니다. 8x8 고기동 전술 트럭에 탑재되었으며, GPS 유도를 통해 80km 밖의 표적을 족집게처럼 정밀 타격합니다."
 KOR_spaa_equipment_1: "K-30 비호"
 KOR_spaa_equipment_1_short: "K-30 비호"
 KOR_spaa_equipment_1_desc: "대한민국 육군의 궤도형 자주대공포로, 30mm 쌍열 기관포를 탑재하여 저고도로 침투하는 적의 항공기와 헬기를 요격합니다. 독자적인 탐지 레이다와 전자광학 추적기를 갖추어 주야간 전천후 작전이 가능합니다. 최근에는 신궁 지대공 미사일을 결합한 '비호복합'으로 진화하여 적기 요격 범위와 교전 능력이 비약적으로 상승했습니다."
 KOR_spaa_equipment_2: "K-30W 천호 30mm 차륜형 대공포"
 KOR_spaa_equipment_2_short: "K-30W 천호"
 KOR_spaa_equipment_2_desc: "K808 차륜형 장갑차 차체에 비호의 30mm 대공포탑을 개량하여 탑재한 신형 방공 무기체계입니다. 자체 탐지 레이다를 과감히 생략하고 국지방공 레이다와 데이터링크를 연동하며, 최신 전자광학 추적 장치(EOTS)를 사용하여 정밀한 은밀 사격이 가능합니다. 기동 부대에 든든한 방공망을 제공하며 적의 소형 무인기(UAV) 위협에 대응하는 데 탁월합니다."
 KOR_artillery_equipment_1: "KH179 155mm 견인곡사포"
 KOR_artillery_equipment_1_short: "KH179"
 KOR_artillery_equipment_1_desc: "대한민국이 독자적으로 설계 및 대량 양산한 155mm 견인포로, 기존 미국제 M114의 사거리 부족 문제를 해결하기 위해 탄생했습니다. 39구경장 포신을 적용해 사거리 연장탄 사용 시 최대 30km 밖의 표적을 타격할 수 있습니다. 무게가 무거워 진지 변환에 시간이 걸리지만, 저렴한 획득 비용과 묵직한 한 방 화력으로 오랫동안 포병대의 뼈대 역할을 해왔습니다."
 KOR_artillery_equipment_2: "K105A1 풍익"
 KOR_artillery_equipment_2_short: "K105A1 풍익"
 KOR_artillery_equipment_2_desc: "치장 물자로 대량 보관되던 구형 105mm 견인포를 5톤 트럭 차체에 결합하여 자주화한 차륜형 자주포입니다. K9 자주포의 정밀한 사격통제장치 기술을 적용해 버튼 하나로 자동 방열 및 사격 제원 산출이 가능합니다. 보병 연대급의 신속하고 정밀한 화력 지원을 담당하며, 극강의 '가성비'와 효율성을 달성한 현대식 무기체계입니다."
 KOR_artillery_equipment_3: "KSM-120 비격"
 KOR_artillery_equipment_3_short: "KSM-120 비격"
 KOR_artillery_equipment_3_desc: "120mm 박격포를 K200A1 장갑차에 탑재하여 완전히 자동화한 자주박격포 시스템입니다. 기존 4.2인치 박격포 대비 사거리와 파괴력이 2배 이상 향상되었으며, 360도 회전 사격과 신속한 자동 방열 기능을 갖추고 있습니다. 산악 지형이 많은 한반도 환경에서 기계화 보병대대에게 즉각적이고 치명적인 곡사 화력을 제공합니다."
 KOR_artillery_equipment_4: "K9 차륜형"
 KOR_artillery_equipment_4_short: "K9 차륜형"
 KOR_artillery_equipment_4_desc: "K9 자주곡사포의 검증된 포탑과 무장 시스템을 고기동 8x8 차륜형 플랫폼에 이식한 수출 및 차세대 곡사포 모델입니다. 궤도형에 비해 작전 유지 보수 비용이 저렴하고, 잘 포장된 도로 위에서 신속한 전략적 재배치가 가능합니다. 슛 앤 스쿠트(Shoot and Scoot) 전술에 특화되어 대포병 사격을 회피하는 능력이 탁월합니다."
 KOR_infantry_equipment_0_short: "M16A1"
 KOR_infantry_equipment_0_desc: "미국 콜트사가 개발하고 대한민국이 조병창에서 라이선스 생산하여 제식으로 운용한 5.56mm 돌격소총입니다. 가벼운 무게와 직동식 가스 작동 방식으로 훌륭한 사격 명중률을 보여주며, 국군의 화력 현대화 및 베트남전 파병에 큰 기여를 했습니다. 현재는 1선 부대에서 물러났으나 여전히 후방이나 예비군 부대에서 신뢰할 수 있는 무기로 사용되고 있습니다."
 KOR_infantry_equipment_1: "K1 기관단총"
 KOR_infantry_equipment_1_short: "K1 기관단총"
 KOR_infantry_equipment_1_desc: "대한민국 특수부대의 화력 강화 요구로 독자 개발된 5.56mm 구경의 단축형 기관단총입니다. 휴대성이 매우 뛰어난 슬라이드식 인입 개머리판을 채택하여 좁은 차량 내부나 시가지, 특수 작전 환경에서 우수한 기동성을 발휘합니다. 기관단총급의 작은 크기에 소총탄의 화력을 뿜어내어 지휘관 및 전차병 등에게도 널리 지급되었습니다."
 KOR_infantry_equipment_2: "K2 돌격소총"
 KOR_infantry_equipment_2_short: "K2 돌격소총"
 KOR_infantry_equipment_2_desc: "대한민국 국군의 뼈대를 이루는 제식 5.56mm 돌격소총입니다. M16의 인체공학적 조준 방식과 AK-47의 롱스트로크 가스 피스톤 방식의 신뢰성을 절묘하게 결합하여 험준한 산악과 흙먼지 속에서도 고장 없이 작동합니다. 우측으로 접히는 개머리판을 적용해 행군 및 강하 시 휴대성이 좋으며, 보병 전력의 든든한 핵심으로 활약해왔습니다."
 KOR_infantry_equipment_3: "K2C1"
 KOR_infantry_equipment_3_short: "K2C1"
 KOR_infantry_equipment_3_desc: "기존 K2 소총에 알루미늄 피카티니 레일 시스템과 신형 조절식 개머리판을 적용하여 확장성을 부여한 개량형 소총입니다. 다양한 광학 조준경, 전술 플래시, 레이저 표적 지시기 등 부가 장비를 쉽게 장착할 수 있어 병사들의 근접 전투 효율이 극대화되었습니다. 21세기 보병 체계의 요구사항을 성공적으로 반영하여 전방 부대부터 보급되고 있습니다."
 KOR_infantry_equipment_4: "K7 소음기관단총"
 KOR_infantry_equipment_4_short: "K7 소음기관단총"
 KOR_infantry_equipment_4_desc: "K1 기관단총을 기반으로 총열 일체형 소음기를 장착하여 개발된 특수전용 9mm 기관단총입니다. 9mm 아음속탄을 사용할 경우 총성이 극히 작아 야간 침투나 대테러 작전, 보초병 암살 및 은밀한 타격 임무에 매우 적합합니다. 수입산 소음 총기들을 국산화하며 한국군 특수부대의 신뢰받는 무성 무기로 자리 잡았습니다."
 KOR_infantry_equipment_5: "DSAR-15PC"
 KOR_infantry_equipment_5_short: "DSAR-15PC"
 KOR_infantry_equipment_5_desc: "국내 총기 업체에서 AR-15 구조를 기반으로 개발한 현대식 쇼트 스트로크 가스 피스톤 작동식 특수전 소총입니다. 모듈화 설계를 통해 작전 환경에 맞춰 총열을 신속하게 교체할 수 있으며, 양손 조작이 가능하도록 인체공학적으로 설계되었습니다. 기존 K1A를 대체하기 위한 특수작전용 기관단총 사업의 기반이 된 정밀하고 내구성 높은 화기입니다."
 KOR_infantry_equipment_6: "K11 복합소총"
 KOR_infantry_equipment_6_short: "K11 복합소총"
 KOR_infantry_equipment_6_desc: "5.56mm 돌격소총과 20mm 공중폭발탄 발사기를 하나의 총기에 결합한 첨단 복합 화기입니다. 레이저 거리 측정기와 탄도 계산 컴퓨터를 내장하여 참호나 엄폐물 뒤에 숨은 적의 머리 위에서 포탄을 폭발시켜 타격할 수 있도록 설계되었습니다. 원본이 되는 K11 소총은 기술적 한계와 중량 문제로 양산이 중단되었으나, 미래 보병 화기의 야심 찬 화력 개념은 그대로 적용되어 다시 제작되었습니다."
 KOR_attack_helicopter_equipment_1: "AH-1S"
 KOR_attack_helicopter_equipment_1_short: "AH-1S"
 KOR_attack_helicopter_equipment_1_desc: "슬림한 동체와 강력한 무장 탑재 능력을 자랑하는 공격 헬리콥터 코브라입니다. TOW 대전차 미사일과 20mm 3총열 기관포를 장착하여 적의 기갑 부대를 원거리에서 요격하는 '전차 사냥꾼' 역할을 훌륭히 수행합니다. 비록 노후화가 다소 진행되었으나, 오랫동안 대한민국 육군 항공대의 주력으로 대규모 기갑 위협을 억제해왔습니다."
 KOR_attack_helicopter_equipment_2: "AH-64D"
 KOR_attack_helicopter_equipment_2_short: "AH-64D"
 KOR_attack_helicopter_equipment_2_desc: "세계 최강의 공격 헬기로 꼽히는 아파치 롱보우 기종으로, 로터 위의 롱보우 레이더를 통해 수백 개의 표적을 동시에 탐지하고 추적할 수 있습니다. 헬파이어 미사일로 적 기갑 전력을 일거에 궤멸시킬 수 있으며, 진보된 네트워크 데이터링크 체계로 전장 상황을 아군과 실시간 공유합니다. 압도적인 생존성과 화력으로 입체 기동 작전의 판도를 지배합니다."
 KOR_utility_helicopter_equipment_1: "UH-60M 블랙호크"
 KOR_utility_helicopter_equipment_1_short: "UH-60M"
 KOR_utility_helicopter_equipment_1_desc: "뛰어난 전천후 작전 능력을 갖춘 세계적인 다목적 전술 기동 헬리콥터입니다. 최신 디지털 조종석과 강화된 엔진, 개량된 로터 블레이드를 적용하여 탑재량과 고공 비행 성능이 크게 향상되었습니다. 무장 병력 수송, 의무 후송, 중요 물자 공수 등 다방면에서 묵묵히 활약하며 공중강습 부대의 든든하고 발 빠른 날개가 되어줍니다."
 KOR_utility_helicopter_equipment_2: "V22 오스프리"
 KOR_utility_helicopter_equipment_2_short: "V22 오스프리"
 KOR_utility_helicopter_equipment_2_desc: "헬리콥터의 수직 이착륙 능력과 고정익 항공기의 고속 비행 및 장거리 항속 능력을 절묘하게 결합한 틸트로터 항공기입니다. 일반 기동 헬기보다 두 배 이상 빠르고 멀리 비행할 수 있어 신속한 특수부대 투입이나 초수평선 상륙 작전에 필수적입니다. 넓은 해역과 도서 지역을 포괄하는 광역 입체 기동 작전을 가능하게 합니다."
 KOR_amphibious_mechanized_equipment_1: "KAAVP-7A1"
 KOR_amphibious_mechanized_equipment_1_short: "KAAVP-7A1"
 KOR_amphibious_mechanized_equipment_1_desc: "대한민국 해병대가 주력으로 운용하는 수륙양용 장갑차로, 해상 상륙함에서 발진하여 적 해안에 상륙군을 투입하는 초수평선 상륙작전의 핵심 장비입니다. 12.7mm K6 중기관총과 40mm K4 고속유탄기관총으로 무장하여 상륙 해안의 적 진지를 제압하며, 뛰어난 수상 주행 능력을 갖추고 있습니다. 해병대의 용맹한 '돌격' 정신을 상징합니다."
 KOR_amphibious_mechanized_equipment_2: "KAAV-II"
 KOR_amphibious_mechanized_equipment_2_short: "KAAV-II"
 KOR_amphibious_mechanized_equipment_2_desc: "기존 상륙돌격장갑차의 느린 해상 속도와 방어력 한계를 극복하기 위해 독자 개발 중인 차세대 상륙돌격장갑차입니다. 강력한 워터제트 추진기와 가변형 차체 구조를 채택해 수상에서 초고속 기동이 가능하며, 40mm 이상의 무인 포탑을 탑재하여 화력을 강화했습니다. 생존성과 공격력을 대폭 끌어올려 적의 해안 방어선을 단숨에 찢어발길 수 있도록 설계되었습니다."
 KOR_anti_air_equipment_1: "미스트랄"
 KOR_anti_air_equipment_1_short: "미스트랄"
 KOR_anti_air_equipment_1_desc: "프랑스에서 도입하여 운용 중인 적외선 유도 방식의 휴대용 지대공 미사일(MANPADS)입니다. 전용 삼각대에 거치하여 사격하는 방식으로 인해 단독 휴대성은 떨어지지만, 90mm 대형 탄두를 사용하여 파괴력이 강하고 명중률이 매우 뛰어납니다. 저고도로 기습 침투하는 적의 공격 헬기나 전투기를 효과적으로 요격하며 국군의 초기 방공망 구축에 크게 기여했습니다."
 KOR_anti_air_equipment_2: "KP-SAM 신궁"
 KOR_anti_air_equipment_2_short: "KP-SAM 신궁"
 KOR_anti_air_equipment_2_desc: "해외 미사일들의 장점을 흡수하여 대한민국이 독자 개발한 2연장 컬러 탐색기 기반의 국산 휴대용 지대공 미사일입니다. 기만 체계(플레어)에 대한 우수한 항재밍 능력을 갖추고 있으며, 명중 직전 폭발하여 수많은 파편으로 적기를 찢어버리는 근접신관을 채택했습니다. 높은 명중률과 가벼워진 무게로 일선 방공 부대의 든든한 대공 방패 역할을 합니다."
 KOR_anti_air_equipment_3: "KM-SAM 천궁"
 KOR_anti_air_equipment_3_short: "KM-SAM 천궁"
 KOR_anti_tank_equipment_1: "9K115-2 메티스-M"
 KOR_anti_tank_equipment_1_short: "9K115-2 메티스-M"
 KOR_anti_tank_equipment_1_desc: "불곰사업을 통해 러시아에서 도입된 유선 반자동 시선유도(SACLOS) 방식의 대전차 미사일입니다. 보병이 휴대하거나 소형 전술 차량에 탑재하여 운용할 수 있으며, 텐덤 탄두를 적용해 폭발반응장갑(ERA)을 두른 적 전차도 파괴할 수 있습니다. 조작이 간편하고 열악한 환경에서의 신뢰성이 높아 보병대대의 핵심 대전차 화력으로 맹활약했습니다."
 KOR_anti_tank_equipment_2: "AT-1K 현궁"
 KOR_anti_tank_equipment_2_short: "AT-1K 현궁"
 KOR_anti_tank_equipment_2_desc: "노후화된 구형 대전차 무기들을 대체하기 위해 국내 기술로 개발된 3세대 보병용 대전차 유도무기입니다. 발사 후 망각(Fire & Forget) 방식을 채택하여 미사일 유도 중 사수가 노출되는 위험을 없앴으며, 적 전차의 가장 취약한 포탑 상부를 수직으로 내리꽂아 타격하는 탑어택 능력을 보유하고 있습니다. 현존하는 대부분의 장갑을 관통할 수 있는 전장의 '전차 저승사자'입니다."
 KOR_train_equipment_1: "8000호대 전기기관차"
 KOR_train_equipment_1_desc: "1972년부터 도입된 대한민국 최초의 본격 화물용 교류 전기기관차입니다. 뛰어난 견인력으로 태백선과 중앙선 등 산악 노선의 석탄, 시멘트 화물 수송을 담당했으며, 수십 년간 대한민국 철도 화물 운송의 중추 역할을 수행하였습니다."
 KOR_train_equipment_2: "8500호대 전기기관차"
 KOR_train_equipment_2_desc: "2012년부터 도입된 차세대 화물용 전기기관차입니다. 6,600kW의 높은 출력과 향상된 견인 성능을 바탕으로 노후화된 8000호대를 대체하였으며, 현재 대한민국 철도 화물 운송의 주력 기관차로 운용되고 있습니다."
 strat_bomber_equipment_0: "초기형 전략폭격기"
