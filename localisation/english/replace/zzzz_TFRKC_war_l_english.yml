l_english:
 TFRKC_constitutional_front: "헌정수호 공동전선"
 TFRKC_workers_front: "노동자 공동전선"
 tfrkc_war.2.t: "일본의 한국 지원"
 tfrkc_war.2.d: "일본은 대한민국 정부를 인정하며 헌정수호연합과의 별도 군사협력을 검토한다. 지원은 군수품 이전으로 제한된다."
 tfrkc_war.3.t: "한국 정부의 지원 요청"
 tfrkc_war.3.d: "독일 정부는 한국 정부의 법적 연속성을 존중하며 제한된 구호와 군수 지원을 검토한다. 아시아 전쟁에 대한 동맹 전체의 참전 결정은 포함되지 않는다."
 tfrkc_war.a: "제한적 지원을 승인한다."
 tfrkc_war.no: "지금은 지원할 수 없다."
 tfrkc_war.11.t: "헌정수호연합의 마지막 결정"
 tfrkc_war.11.d: "공동의 적은 사라졌다. 연합은 독립 지휘권을 정부에 이양할지, 독자 정부를 세우기 위해 최종전을 치를지 결정해야 한다."
 tfrkc_war.11.a: "정부에 통합한다."
 tfrkc_war.11.b: "독자 정부를 위해 싸운다."
