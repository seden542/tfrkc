l_korean:
 # ===== 카테고리 =====
 KOR_defense_reform_category: "국방개혁"
 KOR_defense_reform_category_desc: "§A위국헌신§! §P군인본분§!, 나라를 위해 몸을 바침은 군인의 본분이다."

 # ===== GUI =====
 TFRKP_defreform_open_tooltip: "§G국방개혁§!\n국방개혁 현황판을 엽니다."
 TFRKP_defreform_hanzi_tooltip: "§Y위국헌신 군인본분§!\n- 안중근\n--------------\n§L안중근 의사를 옥중에서 만나 감화된 일본인 간수인 치바 도시치가 자신의 임무에 괴로워 하자, 그가 치바 도시치에게 남긴 유명한 글귀입니다.\n\n6월 25일, 새벽에 울린 국경 너머의 포성으로 3일만에 수도 서울을 함락당하는 잊지 못할 치욕과 함께, 영남의 낙동강까지 전선이 밀린 뒤 다시금 수도를 수복하기까지, 이 모든 공로는 조국 대한을 위해 헌신한 군인의 본분이 존재하기 때문이었습니다. \n\n여러 정권을 거치고 고도성장의 과실을 국군에 지속적으로 투자하여 결국 세계 7대 군사강국이라는 영광스러운 칭호를 얻었지만 나라를 위해 헌신하는 것이 군인의 본분이라는 기치를 교조적으로 받아들인 대한민국 국군은 수없이 오래된 군납비리와 병영 내 부조리, 병역의 형평성. 무엇보다 초급 장교들의 이탈 등등 손가락 열개로는 감히 세어볼 엄두조차 나지 않는 우리 군대는 병사들의 사기와 국민들의 신뢰 모두가 함께 낮아지고 있는 상황입니다.\n\n우리에게 남은 선지는 굳이 헤아려보자면 여러가지가 있겠으나, 가야할 길은 단 하나입니다.\n\n모든 병폐를 철저히 개혁하여 우리 미래의 아이들이 입대할 때 쯤, 부조리 하나 없이 악행을 과거의 편린으로 여기게 되는 것. 오직 그 하나 뿐입니다.§!"
 TFRKP_defreform_token_label_text: "국방개혁 토큰"
 TFRKP_defreform_token_count_text: "§Y[?KOR_defreform_token_var|0]§! / 5"
 TFRKP_defreform_token_tooltip: "§Y국방개혁 토큰§!\n국방개혁 의제를 채택할 때 §Y1개§!가 소모됩니다.\n중점과 이벤트를 통해 획득할 수 있습니다."
 TFRKP_defreform_progress_label_text: "국방개혁 진척도"
 TFRKP_defreform_progress_value_text: "§G[?KOR_defreform_progress_var|0]%§!"
 TFRKP_defreform_trust_label_text: "국군 신뢰도"
 TFRKP_defreform_trust_value_text: "§C[?KOR_defreform_trust_var|0]%§!"
 TFRKP_defreform_rank_label_text: "세계 육군 순위"
 TFRKP_defreform_rank_value_text: "제 §Y[?KOR_defreform_rank_var|0]§!위"

 # ===== 포스터 =====
 TFRKP_defreform_poster_welfare_tooltip: "§G복무환경 개선§!\n장병들의 복무 여건을 혁신합니다.\n클릭하면 관련 의제가 방위/전쟁 탭에 공개됩니다."
 TFRKP_defreform_poster_equip_tooltip: "§G장비 연구§!\n무기체계 연구개발에 집중합니다.\n클릭하면 관련 의제가 방위/전쟁 탭에 공개됩니다."
 TFRKP_defreform_poster_training_tooltip: "§G훈련 개선§!\n실전적 훈련 체계를 구축합니다.\n클릭하면 관련 의제가 방위/전쟁 탭에 공개됩니다."

