l_korean:
 # Working draft based on installed TFRKP tone. Final story files are untouched.
 TFRKC_TMP_ack:0 "상황을 확인했다."
 TFRKC_TMP_1_t: "패전 1주년, 전주"
 TFRKC_TMP_1_d: "대만이 함락되고 한국이 양안전쟁에서 패한 지 1년이 되었습니다. 전주의 거리에 윤석열 탄핵을 요구하는 사람들이 모였습니다. 귀환장병의 치료와 일자리, 유가족에게 미뤄진 답변, 난민의 거처와 끊긴 거래는 서로 다른 사정이었지만, 더는 기다릴 수 없다는 말은 같았습니다.\n\n시위가 이어지는 가운데 거리 일부에서 폭동이 발생했습니다. 현장의 경위에 관한 보고는 엇갈리고 있습니다. 탄핵을 요구하며 모인 사람들 전체를 하나의 폭력집단으로 묶을 수는 없지만, 정부의 보고서는 벌써 여러 얼굴을 하나의 항목 아래 정리하기 시작했습니다.\n\n이 패전 이후 혼란기의 첫 대규모 폭동입니다. 문을 닫은 가게 앞에는 미처 걷지 못한 가격표가 남았습니다. 작년보다 오른 숫자 아래로 사람들이 지나갑니다."
 TFRKC_TMP_1_a: "전주의 상황을 확인한다."
 TFRKC_TMP_2_t: "열세 명"
 TFRKC_TMP_2_d: "전주 사건의 사망자는 총 13명으로 집계되었습니다. 누가 어떤 경위로 목숨을 잃었는지, 누구에게 책임이 있는지에 대한 답은 아직 정리되지 않았습니다. 그러나 집계가 끝났다는 사실은 사태가 정리되었다는 발표의 근거로 먼저 쓰였습니다.\n\n정부는 사건 가담자 전원을 검거하고 사형 선고를 추진하겠다는 방침을 내놓았습니다. 발표문은 이를 국가의 생존과 질서 회복을 위한 조치라고 설명했습니다. 정부가 내세운 문구는 짧았습니다. ‘§R예외를 남기지 않겠습니다.§!’ 이어 사건 가담자로 분류된 이들에게 사형이 선고되었습니다. 서로 다른 행위와 책임을 가려야 할 자리에, 먼저 예외를 없애겠다는 말이 놓였습니다.\n\n집계표에는 합계가 적혔습니다. 돌아오지 않는 사람을 기다리는 집에서는 평소와 같은 수의 수저를 꺼냈다가 하나를 다시 넣었습니다."
 TFRKC_TMP_2_a: "발표문 밖의 질문은 남았다."
 TFRKC_TMP_3_t: "선처라는 이름"
 TFRKC_TMP_3_d: "전주 사건 가담자로 분류된 이들에게 내려진 사형 선고가 무기징역으로 감형되었습니다. 정부는 엄정한 처벌과 인도적 고려를 함께 지켰다고 발표했습니다. 감형 발표에는 정부가 처음부터 사형을 추진한 이유를 다시 묻는 문장은 없었습니다.\n\n반발은 전국으로 번지고 있습니다. 거리에서는 윤석열 탄핵 요구와 함께 일괄적인 극형 추진을 비판하는 목소리가 커졌습니다. 무엇을 했는지 따져야 할 책임을 어디에 있었는지로 대신할 수 없다는 주장입니다. 사망자 13명에 대한 규명 요구도 가라앉지 않았습니다.\n\n정부는 선처했다고 말합니다. 가족들은 면회가 가능한 요일을 적습니다. 서로 같은 결정을 두고 말하고 있지만, 쓰는 달력은 다릅니다."
 TFRKC_TMP_3_a: "감형으로 끝날 일이 아니었다."
 TFRKC_TMP_4_t: "불이 꺼지지 않는 집무실"
 TFRKC_TMP_4_d: "전국에서 올라온 보고가 대통령의 책상에 쌓였습니다. 집회 규모와 경찰의 대응 여력은 숫자로 정리되었지만, 다음 보고에서 상황이 나아질 것이라는 근거는 찾기 어려웠습니다. 누군가는 대화를, 누군가는 더 강한 조치를 요구했습니다.\n\n책상 한쪽에는 비상조치에 관한 문건이 놓였습니다. 아직 서명된 명령은 없습니다. 회의가 끝난 뒤에도 그 문건만은 치워지지 않았습니다."
 TFRKC_TMP_4_a: "다음 보고를 접수한다."
 TFRKC_TMP_5_t: "대통령의 직무정지"
 TFRKC_TMP_5_d: "계엄은 실패했고 국회는 윤석열에 대한 탄핵소추를 가결했습니다. 대통령의 직무는 정지되었지만, 이 결정만으로 파면이나 복직이 확정된 것은 아닙니다. 국정의 결재선은 한덕수 권한대행에게 넘어갔습니다.\n\n정부는 국가의 업무가 계속된다고 밝혔습니다. 그러나 직함을 고쳐 적은 공문이 내려가는 동안, 현장에서는 어느 지시를 따라야 하는지 되묻는 연락이 이어졌습니다."
 TFRKC_TMP_5_a: "직무는 정지되었으나 국가는 계속된다."
 TFRKC_TMP_6_t: "다시 바뀐 결재선"
 TFRKC_TMP_6_d: "한덕수 권한대행 체제가 끝나고 최상목이 업무를 넘겨받았습니다. 새 결재선이 각 부처에 전달되는 동안에도 해결되지 않은 보고서는 같은 책상 위에 남았습니다.\n\n관료들은 문서의 수신인을 고쳐 적었습니다. 구호품을 기다리는 사람들에게는 누가 서명하는지보다 언제 도착하는지가 먼저였습니다. 바뀐 이름 아래에서 다시 정상화가 약속되었습니다."
 TFRKC_TMP_6_a: "업무 인계 보고를 확인한다."
 TFRKC_TMP_7_t: "이주호 권한대행의 책상"
 TFRKC_TMP_7_d: "이주호 권한대행의 이름으로 각 기관에 업무 계속 지시가 발송되었습니다. 정부는 대통령의 직무정지가 국가의 직무정지를 뜻하지 않는다고 밝혔습니다. 급여와 구호, 병원과 발전소의 운영을 유지하는 것이 국가 생존의 첫 조건이라는 설명입니다.\n\n그러나 지방에서 올라오는 보고에는 정부가 집행할 수 없는 요구가 더 많습니다. 호송할 병력이 없는 구호품, 지급할 재원이 막힌 수당, 중앙의 승인을 기다리다 멈춘 행정이 책상 위에 놓였습니다. 법적 권한을 가진 정부가 그것을 행사할 수단부터 요청하고 있습니다.\n\n서류의 결재란은 비어 있지 않습니다. 결재 다음에 무엇이 이루어질지가 비어 있습니다."
 TFRKC_TMP_7_a: "정부의 업무는 계속되어야 한다."
 TFRKC_TMP_8_t: "배포하지 않는 명단"
 TFRKC_TMP_8_d: "계엄 이후, 남영신을 중심으로 모인 군 인사들이 국가재건최고회의를 비밀리에 결성했습니다. 이들은 윤석열의 실패뿐 아니라 기존 정치권 전체가 국가를 이끌 능력을 잃었다고 판단했습니다. 회의의 목적은 윤석열과 정치권을 함께 끌어내리고 군의 질서로 국가를 재건하는 것입니다.\n\n첫 회의에서는 명령 계통과 연락 방법이 논의되었습니다. 누가 누구의 지시를 받을지는 분명하게 적혔습니다. 군이 국가를 대신하기 시작한 뒤 누가 군에 책임을 물을지는 다음 논의로 남았습니다.\n\n명단은 공식 배포하지 않기로 했습니다. 나라를 구하겠다는 사람들의 첫 서류에는, 그 나라의 다른 기관들이 보아서는 안 된다는 표시가 붙었습니다."
 TFRKC_TMP_8_a: "연락망을 확인한다."
 TFRKC_TMP_9_t: "작전명: 귀환"
 TFRKC_TMP_9_d: "윤어게인이 ‘귀환’ 작전으로 윤석열을 구출했다고 발표했습니다. 모습을 드러낸 윤석열은 자신을 따르는 조직과 부대에 직접 명령을 내리기 시작했습니다. 지지자들이 돌려 보낸 영상에는 짧은 환호와 길게 반복되는 복권 구호가 담겼습니다.\n\n서울의 정부는 구출이 대통령의 법적 지위를 바꾸지 않는다고 밝혔습니다. 탄핵소추에 따른 직무정지는 계속되며, 윤석열의 지시는 정부의 적법한 지휘로 인정되지 않습니다. 그러나 윤어게인은 이미 그의 명령을 조직의 지휘 계통으로 삼고 있습니다.\n\n그를 되찾은 사람들의 목적까지 하나가 된 것은 아닙니다. 어떤 이들은 복권을, 어떤 이들은 정적에 대한 보복을, 또 다른 이들은 전쟁 뒤 자신의 자리를 생각합니다. 지금은 모두 같은 사람의 다음 명령을 기다립니다."
 TFRKC_TMP_9_a: "새 지휘 계통을 확인한다."
 TFRKC_TMP_10_t: "대전과 부산의 선언"
 TFRKC_TMP_10_d: "청소년해방군이 대전 교육청을 점령했습니다. 청사를 확보한 전투부대는 성인 대학생·청년노동자·귀환장병·예비역 등으로 구성되어 있습니다. 청소년 당사자 대표들은 학생자치와 권리 보장을 요구하며 회의에 참여했습니다.\n\n‘우리가 겪었던 억압을 다음 세대에게 넘기지 않겠다.’ 성명서를 읽은 뒤에도 급식 물자와 학교 운영, 학생 대표의 결정권을 둘러싼 논의는 끝나지 않았습니다. 성인 지휘부가 안전을 이유로 결정을 미루자, 대표들은 자신들의 권리를 미루던 말도 늘 안전을 앞세웠다고 지적했습니다.\n\n부산에서는 윤어게인이 윤석열의 직접 명령에 따르는 비상통치를 선언했습니다. 정부는 그 선언에 법적 효력이 없고 대통령의 직무정지도 계속된다고 밝혔습니다. 그러나 현장에서는 이미 서로 다른 지시가 내려오고 있습니다. 대전과 부산의 움직임은 하나의 국가 위기로 보고되었습니다."
 TFRKC_TMP_10_a: "점령 다음에는 통치가 남는다."
 TFRKC_TMP_11_t: "무장해제 및 지휘 복귀 요구"
 TFRKC_TMP_11_d: "이주호 권한대행 정부는 국가의 적법한 지휘를 이탈한 부대와 무장조직에 무장해제 및 지휘 복귀를 요구했습니다. 정부는 국가기관의 업무 계속과 국민 보호를 위해 독자적인 군사 지휘를 인정할 수 없다고 밝혔습니다.\n\n요구는 거부되었습니다. 각 조직은 정부가 자신들을 보호하거나 대표할 수 없다며 자체 지휘를 유지했습니다. 기관 내부에서도 어느 지시를 따라야 하는지 의견이 갈렸고, 중앙의 공문을 접수한 창구와 실제 무기를 관리하는 지휘소가 서로 다른 답을 보내기 시작했습니다.\n\n정부 발표에는 모든 기관이 정상적으로 기능하고 있다고 적혔습니다. 그 발표를 전달할 통신망 일부는 이미 다른 지휘의 허가를 받아야 했습니다."
 TFRKC_TMP_11_a: "국가의 지휘권을 재확인한다."
 TFRKC_TMP_12_t: "봉투 안의 명령"
 TFRKC_TMP_12_d: "비상계엄 선포 이후 봉인된 명령이 각 지휘부에 전달되었습니다. 접수했다는 보고는 차례로 올라왔지만, 접수가 곧 집행을 뜻하지는 않았습니다. 어떤 지휘관은 후속 지시를 기다렸고, 어떤 지휘관은 명령의 적법성과 책임의 소재를 되물었습니다.\n\n상황판에는 확인 표시가 늘어났습니다. 명령을 내린 사람에게는 같은 표시였지만, 그 명령을 감당할 사람들의 판단까지 같은 것은 아니었습니다."
 TFRKC_TMP_12_a: "접수와 복종 사이에 침묵이 남았다."
 TFRKC_timeline_status:0 "계엄 이후의 정국"
 TFRKC_timeline_status_desc:0 "계엄 선포일: [?TFRKC_proclamation_date.GetDateStringNoHourLong]\n달력 기준 한 달 뒤 내전 진입 조건을 판정합니다."
