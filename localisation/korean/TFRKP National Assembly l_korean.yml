 #군바리 국회의원
 KOR_national_assembly_new_category: "[GetKORNationalAssemblyCategoryTitle]"
 KOR_national_assembly_new_category_desc: "\n\n\n\n\n£GFX_KOR_national_assembly_new_category_decision\n\n\n\n\n\n\n\n§Y대한민국 국회§!는 대한민국의 최고 입법 기관이자 유일한 입법 기관입니다. 단원제로 운영되며, 법률 제정 및 개정, 국가 예산 심의, 조약 비준, 정부에 대한 감시와 견제를 담당합니다.\n\n국회는 국가 권력 구조의 핵심 축으로서, 질의, 청문, 탄핵 등의 권한을 통해 행정부와 사법부를 견제합니다. 그 결정은 국가 정책, 국방 안보, 국민의 삶에 직접적인 영향을 미칩니다.\n\n우리는 핵심 법안을 통과시켜 '포스트 아메리카 시대'의 기반을 다지고, 불안정한 국제 질서 속에서도 국가의 안정과 독립, 지속 가능한 발전을 보장해야 합니다.\n\n---- §Y원내 정당 목록§! ---- \n[GetNamePPPLoc]\n[GetNameDPLoc]\n[GetNamePPLoc]"
