 vatican_city_desc: "----\n§9콘클라베 레퍼런스!!"
 brasilia: "브라질리아"
 brasilia_desc: "----\n§9브라질의 수도인 브라질리아는 주셀리누 쿠비체크 대통령의 '5년의 계획을 50년의 효과로'라는 정책의 일환으로 1960년에 브라질 내륙 지역의 발전을 위해 건설되었습니다. 이 도시는 도시 계획가인 루시우 코스타와 건축가 오스카르 니에메르가 설계한 '플라누 필로투'에 따라 독특한 비행기 모양의 도시 구조를 갖추고 있습니다.\n\n도시의 중심은 '기념비적 축'으로, 이 축에는 플라나우투궁, 국회의사당, 연방대법원 등 주요 정부 청사들이 '트레스 포데리스 광장'을 중심으로 배치되어 있습니다. 브라질리아 대성당과 아우보라다궁 같은 상징적인 건축물들은 1987년 유네스코 세계문화유산으로 지정되는 데 기여했습니다. 혁신적인 건축물로 가득한 브라질리아는 계획된 도시 구조와 무분별하게 확장되는 도시화로 인해 여러 어려움을 겪고 있지만, 여전히 브라질 모더니즘과 정치 권력의 상징으로 남아 있습니다.§!"
 fuzhou: "푸저우"
 fuzhou_desc: "----\n§9당나라와 송나라 시대부터 푸저우는 해상 실크로드의 핵심 거점 역할을 해왔으며, 지역 군벌들의 분열된 통치와 송, 원, 명, 청 왕조의 연이은 교체, 그리고 청말의 양무운동을 겪어왔습니다. 19세기 후반에는 이곳에 복건선정학당이 설립되어 중국의 근대 해군 및 조선의 발전을 이끌었지만, 갑신년의 정변으로 인해 잠시 중단되기도 했습니다. 20세기에는 민강을 통해 해외 이주자들이 보내온 자본이 독특한 \"고향\" 문화를 조성하고 상업적 성장을 촉진하기도 했습니다. 21세기에 접어들면서 푸저우의 디지털화된 항만 기반시설은 24시간 내내 빛나고 있습니다. \"디지털 경제 시범구\"로서의 지위를 활용하여 푸저우는 국경 간 전자상거래 및 현대적 물류 체계를 확장하고, 스마트 항만 및 신구 집속 산업망을 구축하며, 중요한 지역 중심지로서의 기능을 계속 수행하고 있습니다.§!"
 xiamen: "샤먼"
 xiamen_desc: "----\n§9명나라 시절 건설된 샤먼은 초기에는 해상 무역항이자 청나라에 대항하는 방어 거점 역할을 했습니다. 이 도시는 잇따른 시대의 최전선에서 푸저우-샤먼 회랑의 교두보이자 해외 화교 문명의 축소판으로 기능해왔습니다. 샤먼은 청말 개항의 어려움과 이후 경제특구로서의 급속한 발전을 모두 경험했습니다. 1980년부터 샤먼은 상당한 외국인 투자를 유치하여 항만 시설과 첨단 산업의 급속한 성장을 이끌었습니다. 최근 몇 년 동안 지메이신청과 토치 고기술산업개발구라는 쌍발엔진은 신에너지, 해양 기술, 문화 콘텐츠 산업의 발전을 견인하고 있습니다. 역외 금융 및 양안 통합 실험 구역의 시범 사업은 지역 통합을 더욱 발전시켰습니다.§!"
 gaoxiong: "가오슝"
 gaoxiong_desc: "----\n§9가오슝 항구는 가오핑강과 얼런강 사이에 자랑스럽게 자리 잡고 있습니다. 오랫동안 대만 석유화학 및 중공업의 중심지로 인정받아 온 가오슝에는 국내 소비와 해외 수출 수요를 충족하는 여러 대규모 산업 단지가 있습니다. 대만 초기 산업화의 기관차 역할을 했던 가오슝은 그 자체로 독특한 역사와 문화를 가지고 있습니다. 청나라 시대의 성벽이 오늘날까지 남아 있으며, 일본 식민 정부의 도시 계획은 이후 도시 발전에 지속적인 영향을 미쳤습니다. 그러나 많은 이들에게 공공 참여의 영감을 준 가오슝 사건 이후 가오슝의 가장 잘 알려진 별명은 \"대만 민주주의의 발상지\"가 되었을 것입니다.\n\n수많은 관광객이 매일 이 도시를 찾고 있으며, 일부는 건축 명소를 보기 위해, 더 많은 이들은 대만의 수백 년에 걸친 발전 역사를 엿보기 위해 방문합니다.§!"
 tainan: "타이난"
 tainan_desc: "----\n§9흔히 대만의 '첫 번째 도시'로 불리는 타이난은 400년 이상의 역사를 지니고 있으며, 일본 식민 통치 이전에 대만의 행정 수도였습니다. 시간이 흐르며 정치적, 경제적 중요성은 줄었지만 문화적 중심지로서의 위상은 변치 않았습니다. 국립청궁대학과 국립중앙도서관, 중앙연구원 등의 남부 분원 및 수많은 명성 있는 기관들이 자리하고 있어, 타이난 공자묘가 세워진 지 수백 년이 지난 지금도 남부 대만의 학술 수도라는 명성에 걸맞은 역할을 하고 있습니다. 학술 기관 외에도 타이난에는 과거의 이야기를 들려주는 수많은 역사적 건축물들이 여전히 남아 있습니다. 여기에는 네덜란드 동인도회사와 남명 정권의 행정 중심지였던 제라니모 요새, 역사적인 네덜란드 요새였던 프로빈티아 요새, 그리고 이전에 영국 상인들이 머물렀던 타이안양행 등이 포함됩니다. 오늘날 타이난은 과거와 미래가 공존하는 도시입니다. 식민지 시대의 요새부터 남부 과학단지, 민속 행사부터 서양식 건축물로 지어진 박물관까지, 타이난은 고유한 정체성을 보존하면서 현대화를 위해 노력하고 있습니다.§!"
 zhengzhou: "정저우"
 zhengzhou_desc: "----\n§9허난성 신정 남쪽에 위치한 \"정한고성\"의 다져 만든 흙벽 유적과 상나라 시대 성벽은 과거의 이야기를 들려줍니다. 청나라 말기와 공화국 초기에 룽하이선과 징한선 철도가 완공되면서 정저우는 이 노선들의 교차점에 자리 잡게 되었고, 이는 현대 정저우의 탄생을 알렸습니다. 마차와 연단은 농업 무역에서 산업 무역으로의 전환을 목격했습니다. 중화인민공화국 건국 후 기계, 섬유, 곡물 가공과 같은 산업이 이 도시에 확고한 기반을 구축했습니다. 20세기 후반 이래로 정저우는 단순한 지도상의 지점 이상으로 발전해 왔습니다. 정둥 신구가 번성했고 항공 항만 실험구가 형성되었으며, 국경 간 전자상거래 종합 시범구와 자유무역 시범구가 등장했습니다. 지능형 제조, 장비, 식품, 생명 공학 분야의 산업 또한 빠르게 발전해 왔습니다.§!"
 luoyang: "뤄양"
 luoyang_desc: "----\n§9낙수와 황하가 합류하는 지점에 위치한 뤄양은 주나라부터 조위, 서진 왕조에 이르기까지 13개 왕조의 수도로서 중국 역사에서 중요한 위치를 차지해 왔습니다. 수와 당의 시대에는 뤄양이 비단길과 대운하가 교차하는 핵심 거점이 되었습니다. 백마사의 종소리와 모란꽃의 만개는 이 도시의 상징이 되었습니다.\n\n20세기 중반 제1차 5개년 계획 기간 동안 중공업, 석유화학, 베어링 생산과 같은 주요 정책들이 들어서면서 \"공화국의 맏아들\"로 불리는 기업군이 탄생했습니다.\n\n21세기에 들어서면서 뤄양은 주요 산업 도시이자 관광지로 발전했으며, 첨단 제조, 신소재, 항공우주 분야에서 중추적인 역할을 하고 있습니다.§!"
 nanchang: "난창"
 nanchang_desc: "----\n§9난창은 감강에 자리 잡고 있으며, 포양호로 열려 있습니다. 그 이름은 \"남쪽 변경을 번성케 한다\"는 염원을 담고 있습니다. 이 도시는 강바람과 석양이 처음으로 시로 읊어진 등왕각과 그 유명한 서문의 여운을 간직하고 있습니다. 난창을 현대 중국사에 진정으로 새긴 사건은 1927년 8월 1일에 일어났습니다. 바로 난창 봉기가 시작된 날입니다. 저우언라이, 허룽, 예팅, 주더, 류보청 등이 결집하여 무장 저항의 첫 포성을 울렸습니다. 그 순간부터 \"8월 1일\"은 건군절이 되어 지속되고 있으며 \"영웅의 도시\"라는 칭호가 자리 잡았습니다. 그 이후로 팔일광장, 기념관, 봉기 현장 등의 상징물이 군사적 역사 교육, 국방의 서사, 도시의 모습을 구현해 왔습니다. 오늘날 난창의 기술 주도형 산업 부문은 서로 맞물리며 성장하고 있습니다. 지리적 위치, 창베이 국제공항, 고속철도망을 활용하여 장시성을 장강 삼각주와 긴밀하게 연결하고 있습니다. 21세기에 난창은 고전 서문의 화려한 표현 그 이상입니다. 이곳은 혁명적인 장소이자 현대화되는 대도시로서, \"영웅의 도시\"라는 이름에 걸맞은 이야기를 계속해서 써나가고 있습니다.§!"
 dandong: "단둥"
 dandong_desc: "----\n§9단둥, 예전에는 안둥으로 불렸던 이 도시는 랴오둥 반도에 위치하며, 압록강 물줄기에 안겨 강 건너편으로 한반도를 마주하고 있습니다. 당나라 때 안동도호부가 설치된 이래로 이 도시는 동북에서 중원 왕조의 핵심 요충지 역할을 해왔습니다.\n\n청나라 말기부터 단둥은 청일 전쟁과 러일 전쟁을 겪으며 반복적인 파괴를 경험했습니다. 그러나 1950년대의 전쟁이야말로 단둥을 중화인민공화국의 연보에 진정으로 확고히 새긴 사건이었습니다. 전쟁의 불길이 압록강에 이르자 이 도시는 중국 인민지원군이 한반도로 건너가는 출격 지점이 되었고 전선을 지원하는 필수적인 후방 기지 역할을 수행했습니다.\n\n21세기에 들어서 단둥은 중국의 최대 육로 통상구이자 북한과의 핵심 무역망으로 성장하여 양국 간 육로 상업과 물류의 대부분을 처리하고 있습니다. 그 독특한 지리적 위치 덕분에 단둥은 국가 안정을 위한 전략적 중심축이자 동북아시아에서 중국의 입지를 위한 거점이 되었습니다.§!"
 hohhot: "후허하오터"
 hohhot_desc: "----\n§9\"녹색 도시\"를 의미하는 후허하오터는 투모촨 평원의 인산 남쪽에 위치하고 있습니다. 고대부터 이곳은 유목 문명과 농경 문명이 교차하는 변경 지역이었습니다. 명나라 때, 튀메드 부족의 알탄 칸이 이곳에 도시를 세웠고, 그 주위에 다자오사가 건설되면서 남몽골의 종교적, 정치적 중심지가 되었습니다. 청나라가 이 지역을 통일한 후, 구이화와 쑤이위안이라는 쌍둥이 도시가 건설되었으며 이들은 북몽골을 연결하는 핵심망이자 몽골-한족 무역을 위한 주요 거점 역할을 했고 차, 모피, 비단이 도시를 통해 풍부하게 흘러 다녔습니다.\n\n현대사에서 후허하오터는 내몽골 혁명 운동의 발상지가 되었습니다. 덕왕의 실패한 자치 계획부터 우란후의 해방 투쟁에 이르기까지 이 도시는 초원 민족의 선택과 재탄생을 목격했습니다.§!"
 jinan: "지난"
 jinan_desc: "----\n§9남쪽의 태산과 북쪽의 황하 사이에 자리 잡은 지난은 산과 샘이 어우러지는 도시입니다. 바오투샘은 세 줄기의 힘찬 물줄기를 뿜어내고, 흑호샘은 밤낮으로 으르렁거리며, 이 물들은 다밍호로 흘러들어 그림 같은 풍경을 만들어냅니다. 산둥의 문화적 중심지로서, 지난은 룽산 문화의 발상지 중 하나이며, 천년에 걸친 문학적 유산을 지니고 있습니다. 이청조의 섬세한 사색과 신기질의 영웅적 열정이 살아남아 우아함과 강인함이 조화롭게 어우러진 도시의 정신을 함께 구현합니다.\n\n오늘날 산둥성의 성도인 지난은 정치적, 경제적 영향력을 계속 확대하고 있습니다. 이곳은 보하이 경제권의 핵심 도시이자 황하 유역의 중심 허브입니다. 옛 도시를 둘러싼 고대 해자에는 여전히 수많은 샘물에서 흘러나온 물이 흐르고 있어, 전통과 현대가 공존하는 지난을 풍요롭게 합니다.§!"
 kunming: "쿤밍"
 kunming_desc: "----\n§9윈구이고원에 자리한 쿤밍은 뎬츠호수를 곁에 두고 삼면이 산으로 둘러싸여 있습니다. 온화한 기후와 사계절 내내 이어지는 봄 날씨 덕분에 \"영원한 봄의 도시\"라는 별명을 얻었습니다. 고대부터 쿤밍은 윈난 중부의 심장부였습니다. 전국시대에는 고대 왕국 전나라의 수도였고, 당송시대에는 남조와 대리국 아래 척동의 거점이 되어 지역 중심지로서의 입지를 다졌습니다. 원나라와 명청시대에는 윈난성의 성도였으며, 제국들이 서남부를 통치하는 정치적, 군사적 요새이자 상인과 여행자들이 모여드는 고대 차마고도의 중요한 기착지 역할을 했습니다.\n\n오늘날 쿤밍은 윈난성의 정치, 경제, 문화 중심지이자 중국의 동남아시아 및 남아시아로의 관문입니다. 일대일로 전략의 핵심 거점으로서 이 도시는 외딴 변경에서 권역의 국제운송 허브로 변모했습니다.§!"
 zhangye: "장예"
 zhangye_desc: "----\n§9역사적으로 간저우로 알려졌던 장예는 \"국가의 팔을 서역까지 뻗친다\"는 구절에서 그 이름이 유래했습니다. 한 무제가 이곳에 군을 설치한 이래 장예는 비단길의 생명선인 하서 회랑의 중심부에 위치해 왔습니다. 동쪽으로는 황토 고원과 연결되고, 서쪽으로는 둔황에 닿으며, 남쪽으로는 치롄산맥의 눈 덮인 봉우리, 북쪽으로는 광활한 사막과 경계를 이룹니다. 수천 년 동안 대상들의 종소리가 그 길목을 울려 퍼지는 가운데 사원, 요새, 역참, 사당들이 나란히 서 있으며, 이는 한족과 북방 문화의 교차로였습니다.\n\n오늘날 단샤 절벽 위로 바람이 불고 구름이 평원을 떠다니는 가운데, 황금빛 장예는 시간의 강 속에서 굳건하고 변함없이, 끊어지지 않는 비단길의 정신과 함께 살아 숨 쉬고 있습니다.§!"
 xi_an: "시안"
 xi_an_desc: "----\n§9역사적으로 장안, 호경, 서경으로 알려진 시안은 중국 8대 고도 중에서 단연 으뜸가는 도시입니다. 주나라, 진나라, 한나라, 수나라, 당나라 등 강력한 왕조의 수도였던 시안은 수천 년 간의 왕조의 교체를 목격했습니다. 이 도시에서 진시황은 불멸을 추구했고, 한무제는 하늘을 숙고했습니다. 시안의 관문을 통해 사신이자 탐험가인 장건은 초기 실크로드의 길을 열었고, 고승 현장은 인도로 떠나는 대장정을 시작했습니다. 요컨대, 시안은 중화문명의 살아있는 연대기이며, 청동기 시대 이래로 중국이라는 국가가 걸어온 여정의 기록 그 자체입니다.\n\n그러나 그 여정은 단지 과거에서 끝나지 않습니다. 오늘날에도 시안은 여전히 중국의 핵심 중심지입니다. 이곳에는 중국항공공업집단 산하의 핵심 군용 항공기 설계 및 제조사인 시안비기공업집단이 위치합니다. 청두비기공업 및 선양비기공업과 함께, 이들은 \"세 비행사\"로 불리며 중국 공군력의 강철의 날개로 자리 잡았습니다.\n\n고대의 실크로드의 출발점으로서, 시안은 또한 현대의 세계적 교류에서 그만의 몫을 담당하고 있습니다. 시안은 일대일로의 중요한 중심지이며, 동양과 더 넓은 세계 사이의 연결고리를 다시금 잇고 있습니다. 시안은 그 높은 역사의 높이에서 다시금 미래를 응시하며, 방대한 유산을 새로운 책임의 시대로 변화시키고 있습니다.§!"
 xiong_an: "슝안"
 xiong_an_desc: "----\n§97천여 년 전, 슝안 지역은 중국 문명의 가장 초기 토대 중 일부를 육성했습니다. 이 땅은 수많은 고대의 흔적을 간직하고 있으며 연나라의 남양 유적지는 그 오랜 역사를 증명합니다. 역사적으로 \"슝안\"은 독자적인 행정 구역이 아니었고 작은 현들로 나뉘거나 더 넓은 부에 편입되었습니다. 그 전신 중 하나인 슝현은 전략적 요충지에 위치하여 시대를 막론하고 통치자들과 경쟁자들의 탐을 받았으며, 경쟁과 갈등의 무대가 되었습니다.\n\n2017년, 시진핑을 핵심으로 하는 중국공산당 중앙위원회는 허베이성에 슝안 신구를 설립하기로 전략적 결정을 내렸습니다. 2019년 토지 수용 및 이주 정착이 공식적으로 시작되었으며, 연말에는 선전 경제특구와 상하이 푸둥 신구가 개척한 사명을 계승하는 경제특구인 허베이 자유무역 시범구의 일부가 신구 내에 설치되었습니다. 무거운 과거와 깊은 문명적 뿌리 위에 자신감 있게 건설되고 있는 슝안은 중국 국가 전략의 새로운 장을 열었습니다.§!"
 qingdao: "칭다오"
 qingdao_desc: "----\n§9칭다오 부지에 정착이 시작된 것은 신석기 시대로 거슬러 올라갑니다. 이 지역은 다양한 정권과 왕조 아래에서 반복적인 변화를 겪었지만 현대 시대에 이르러서야 독특한 전략적 및 무역적 위치로 두각을 나타내기 시작했습니다. 1891년 청나라 정부는 자오아오에 요새를 구축했습니다. 1897년 거야 사건 이후 독일 제국은 칭타우를 중심으로 자오저우만 조차지를 설정하고 \"모범 식민지\" 건설을 목표로 삼았습니다. 동아시아에 전략적 거점을 구축하려는 이러한 추진력은 현대적인 항구와 칭다오-지난 철도 건설로 이어졌으며, 이는 초기 도시의 토대를 마련했습니다.\n\n20세기의 격변을 거친 후 칭다오는 역사적 특성과 현대적 역동성이 조화된 현대적인 해안 대도시로 발전했습니다. 오늘날 칭다오는 유명한 관광지이자 중국에서 가장 중요한 상업 중심망 중 하나입니다.§!"
 kiamusze: "자무쓰"
 kiamusze_desc: "----\n§9세 강이 합류하는 지점에 자리 잡은 자무쓰는 다양한 야생 동물과 풍부한 산림 자원을 자랑하는 독특한 자연 환경을 갖추고 있습니다. 그러나 청나라 광서제 이전에는 이 지역이 황량하고 혹독하게 추운 황무지였습니다. 아이훈 조약과 베이징 조약을 통해 외만주의 광대한 영토가 러시아 제국에 할양된 후 자무쓰는 국경 지역이 되었습니다. 이때 청 정부는 비로소 이곳의 전략적 가치를 완전히 인식했습니다. 그 결과, 자무쓰는 러시아와의 무역을 위한 필수적인 상업 항구로 부상했으며, 오늘날까지 그 역할을 유지하고 있습니다.\n\n중소 우호 시대는 자무쓰에 상당한 발전 기회를 가져다주었습니다. 이 도시는 대량의 목재, 야생 동식물을 소련의 기계화 장비와 교환했고 이는 고립된 이 북부 도시를 철도와 고속도로에 연결하는 데 도움이 되었습니다. 시간이 흐르면서 자무쓰의 발전 속도는 둔화되었고 이로 인해 산업 전환과 개선은 더욱 절실해졌습니다. 오늘날 자무쓰는 생태 산업을 활발하게 발전시키고 있습니다. 싼장 평원의 거대한 기계 장비들은 이제 남부 도시들을 위한 고품질의 친환경 농산물을 생산하고 있으며, 웅장한 숲과 설경은 관광 산업을 위한 강력한 기반을 제공합니다. 한편 헤이샤쯔섬과 우수리강을 따라 있는 수많은 항구들은 자무쓰를 중국과 러시아 간 경제 및 무역 교류의 중요한 중심으로 확립하며 양국 간의 필수적인 연결 고리 역할을 하고 있습니다.§!"
 harbin: "하얼빈"
 harbin_desc: "----\n§9얼음 도시로도 알려진 하얼빈은 성 소피아 정교회 성당, 소련 붉은 군대 해방 기념비, 유대인 역사 문화 박물관, 안중근 의사 기념관, 731부대 유적지 등 고통스러운 과거를 상징하는 기념 건축물들의 본고장입니다. 러시아 제국의 식민 통치와 관리 하에 하얼빈은 춥고 황량했던 현에서 국제적인 대도시로 변모했습니다. 러시아 제국이 붕괴된 후에는 군벌, 백계 러시아인 난민, 일본 관동군이 차례로 이 도시에 자주 주둔했습니다.\n\n소련 붉은 군대의 전차가 일본 제국의 통치라는 낙원적 꿈을 분쇄한 후, 이 도시는 새로운 중국 정부에 정식으로 위임되어 관리되었습니다. 사회주의 건설 초기 신중국의 필수적인 산업 기지였던 하얼빈은 광범위한 소련 지원 정책과 자원의 수혜를 받았으며, 알루미늄 합금 제조 및 석유 가공과 같은 산업을 발전시켰습니다. 오늘날 과거의 고통스러운 상처는 점차 치유되었습니다. 현대의 하얼빈은 철도와 지리적 이점을 계속 활용하여 투자를 유치하고 동북아시아 국가들을 위한 물류망 역할을 하고 있습니다. 한편 하얼빈 항공 산업 그룹과 하얼빈 공과 대학은 인민해방군에 지속적으로 최고 수준의 국방 자원을 제공하고 있습니다. 제약 및 석유화학 산업의 부활은 하얼빈의 지위를 중국 북방 변경에서 가장 밝은 붉은 별로 더욱 확고히 하고 있습니다.§!"
 lanzhou: "란저우"
 lanzhou_desc: "----\n§9역사적으로 금성, 황금의 도시로 알려졌던 란저우는 끓는 해자로 둘러싸인 요새에 비유될 정도로 한때 강력했던 방어 시설에서 그 이름이 유래했습니다. 진나라가 룽유 지역을 개척하고 한나라가 서역으로 가는 길을 닦은 이래 란저우는 실크로드의 전략적 요충지로서 중원과 극서 지역이 만나는 지점에 서 있었습니다. 이곳에서는 황하가 서쪽에서 급히 달려와 동쪽으로 굽이치며 도시 북쪽 가장자리를 휘감아 흐르는데, 이는 중국 서북부의 척박한 고원 지대에 샘물을 형성합니다. 수천 년 동안 대상들은 이곳에서 멈춰 섰고, 낙타들은 울고 종을 울렸으며, 시인들은 언덕에 올라 황하 위로 지는 해와 란산에 남아 있는 눈을 바라보았습니다. 오늘날 란저우는 서부 중국의 핵심 교통망으로 남아 관중, 닝샤, 신장을 연결하며 서부 대개발 전략의 웅대한 꿈을 계승하고 있습니다. 비록 바람과 모래가 아직 가라앉지 않았고 땅은 여전히 척박하지만 도시는 싸우고 희망하기를 멈추지 않았습니다.§!"
 lhasa: "라싸"
 lhasa_desc: "----\n§9티베트어로 \"신들의 땅\"을 의미하는 라싸는 설산 고원의 수많은 사람들의 심장에 자리 잡고 있는 신성한 도시입니다. 7세기에 송첸 감포 왕이 이곳에 궁전과 사원을 지었고, 당나라의 문성공주와 네팔의 브리쿠티 공주를 맞이했습니다. 그들과 함께 불교가 동쪽으로 전파되면서 라싸는 부족 전초 기지에서 티베트 제국의 심장으로 변모했고, 곧 \"설국의 불교 수도\"로 숭배받게 되었습니다. 사캬 라마들의 통치 하에서든, 혹은 황모파의 부상 시기에서든 라싸는 항상 종교적 권력과 세속적 권력이 얽히는 초점이었습니다.\n\n중화인민공화국 건국 후 중국 깃발이 포탈라궁 앞에 휘날렸고, 라싸는 신앙의 중심지일 뿐만 아니라 고원 현대화의 새로운 출발점이 되었습니다. 이후 고속도로, 철도, 전력망이 끝없는 산맥을 가로질러 티베트를 본토와 연결했습니다. 모든 역경 속에서도 라싸는 새 시대로 용감하게 발을 내디뎠습니다.§!"
 hangzhou: "항저우"
 hangzhou_desc: "----\n§9진나라 때 현으로 설립되고 당나라 때 주로 승격된 항저우는 남송 왕조의 수도가 되었으며, 천하 제일의 장난의 보석으로 군림했습니다. 오월의 전류왕이 통치하던 시절 도시를 홍수로부터 보호하기 위한 제방이 건설되어 번영의 토대를 마련했습니다. 송나라 조정이 남쪽으로 퇴각한 후, 당시 린안이라 불렸던 이곳은 밤에는 등불로 빛나고 낮에는 북적이는 시장으로 활기가 넘쳤습니다. 학자와 상인들이 뒤섞이고, 강당에서는 강의가 울려 퍼졌으며, 찻집은 이야기꾼들의 목소리로 떠들썩했습니다.\n\n오늘날 샤오산과 위항이 편입되면서 항저우는 서호 시대를 넘어 첸탕강 시대로 발전했습니다. 동쪽에는 도시 항공 물류 경제의 중추인 샤오산이, 서쪽에는 옛 량주 문명에서 디지털 미래로 나아가는 위항이 있습니다. 만약 서호가 항저우의 영혼이라면 알리바바는 이 시대의 깃발입니다. 서호 옆에서 탄생한 이 회사는 도시의 산업 지형을 재편하고 중국 인터넷 시대의 상상력에 불을 붙였습니다. 알리바바가 주도하는 전자 상거래, 클라우드 컴퓨팅, 인공지능 등의 혁신은 항저우를 변화시켰을 뿐만 아니라 중국 전역의 상업 논리를 재정의했습니다. 오늘날 첸탕강을 따라 크레인이 늘어서 있고, 거리는 차량으로 넘쳐나며, 강은 여전히 흐르지만 도시 자체는 완전히 새로운 모습을 갖추었습니다.§!"
 haikou: "하이커우"
 haikou_desc: "----\n§9고대에 충산으로 알려졌던 하이커우는 한나라 때 현으로 건립된 이래로 중국 역사에서 중요한 부분을 차지해 왔습니다. 조수의 밀물과 썰물에 따라 당나라와 송나라 때 두각을 나타내며, 남중국해 해상 항로 필수망으로 부상했습니다. 문자 그대로 \"바다의 입구\"를 의미하는 그 이름은 이곳의 역할을 완벽하게 설명합니다. 명나라와 청나라 시대에 해안 방어 태세가 남쪽으로 이동하면서 하이커우는 구 충저우 시를 대신하여 하이난섬의 확실한 관문으로 떠올랐습니다. 이곳은 전 세계에서 온 선박들이 상인들과 여행자들을 데려와 중원 문화와 난양 문화가 활기차게 혼합되는 진정한 교차로였습니다. 보다 최근에는 외세의 침략을 견뎌내고, 중국 혁명 역사에 강력한 장을 새긴 저항군인 충야 종대의 격렬하고 피 흘리는 전투를 목격하며 그 회복력을 입증했습니다. 오늘날 하이커우는 현대적인 해안 대도시이며 하이난 자유무역항의 중심 역할을 자랑스럽게 수행하고 있습니다.§!"
 guiyang: "구이양"
 guiyang_desc: "----\n§9무성한 산맥에 둘러싸여 우강이 흐르는 구이양은 한때 \"주\"라 불렸으며, 오랫동안 중국 서남부의 전략적 교차로였습니다. 도로가 처음 개척된 진나라와 한나라부터 군사 주둔지가 설치된 당나라와 송나라에 이르기까지, 이곳은 항상 중원과 운남 및 구이저우 지역을 잇는 필수적인 통로 역할을 했습니다. 명나라 때는 군사 정착지를 통해 유목 문화와 농경 문화가 융합되었고, 청나라의 묘족 영토 통치는 풍부한 다민족 문화 교류를 가능하게 했습니다. 수 세기 동안 짙은 안개가 이 땅을 뒤덮었지만 끊임없는 인적, 물적 흐름을 가릴 수는 없었습니다. 옛 도로는 소금, 차, 약재를 운반했으며, 그와 함께 흥망성쇠를 거듭한 왕조들의 메아리를 실어 날랐습니다.\n\n현대에 들어 구이양은 한때 외딴 전초 기지였으나 항일 전쟁 중에 국가의 생명선을 내륙에서 지켜내는 책임을 맡으며 결정적인 전환점이 되었습니다. 오늘날 구이양은 더 이상 산에 안긴 겸손한 역참이 아닙니다. 이곳은 서남부의 고동치는 심장이자 서부 대개발의 전략적 교두보입니다. 한때 고립되었던 구이저우 땅은 이제 전력망으로 구동되며 빅데이터 산업의 떠오르는 별이 되었습니다. 산과 안개는 여전히 남아 있지만 도시는 조용하고도 단호히 변혁을 완수했습니다.§!"
 urumqi: "우루무치"
 urumqi_desc: "----\n§9\"아름다운 목장\"이라는 뜻을 지닌 우루무치는 항상 톈산 산맥을 가로지르는 필수적인 통로였습니다. 한나라 때 사절단이 서쪽으로 파견되어 비단길을 개척했을 때부터 당나라 때 안서와 북정의 군대가 초원을 거점으로 삼았을 때까지 비단길의 낙타 종소리와 천둥 같은 말발굽 소리가 이 땅에 울려 퍼졌습니다. 이곳은 위구르족이 대대로 번성해 온 곳이며, 그들의 민요와 춤은 초원의 기억을 보존하고 있고, 바자회는 무역의 활기로 가득합니다.\n\n최근 역사에서 우루무치는 신장의 심장부이자 중심지가 되었습니다. 이 도시는 다양한 민족의 투쟁과 융합을 견뎌냈고, 수십 년간의 격동의 시기를 인내했습니다. 청나라의 개간 유산, 소련의 잔존하는 영향력, 혁명 후 국가 건설의 강력한 요구가 모두 이 땅에 흔적을 남겼습니다. 오늘날 마천루들은 북적이는 바자회와 나란히 서 있으며, 석유 산업은 옛 비단길과도 같이 번성하고 있습니다. 우루무치는 고비 사막과 눈 덮인 봉우리 사이에 있는 도시의 샘물이자 동양과 서양이 만나고 문화가 아름답게 융합하는 축소판입니다. 톈산 북쪽에는 미루나무들이 높고 굳건하게 서 있으며, 홍산 아래에서는 도시가 활력과 에너지로 고동칩니다. 우루무치는 마치 길고 아름다운 민요와 같아 변화의 바람을 통해 옛적과 새로운 시작의 이야기를 노래하고 있습니다.§!"
 yinchuan: "인촨"
 yinchuan_desc: "----\n§9한때 싱칭으로 알려졌던 인촨은 헬란산 기슭, 황하 물가에 자리 잡고 있습니다. 서하 왕조가 이곳을 수도로 정한 이래로, 인촨은 서북 지역의 빛나는 진주였습니다. 광활한 사막과 지는 해는 한때 탕구트 철기병의 흥망성쇠를 목격했으며, 비록 옛 수도의 궁궐은 이제 모래 속에 묻혔지만, 짧지만 빛나는 유산을 남겼습니다. 원나라와 명나라 이래로 황하가 닝샤 평원을 관개하여 인촨을 \"만리장성 밖의 강남\"으로 변모시켰습니다. 이곳의 밭은 바둑판처럼 펼쳐져 있으며 수많은 운하망이 가로지르고 있습니다. 전략적인 군사 전초 기지이자 북부 비단길의 중요한 기착지였던 이 도시의 독특한 문화는 한족과 유목 민족의 혼합으로 짜였습니다.\n\n현대에 들어 인촨은 비록 동남부의 번잡함과는 거리가 멀지만 국경 안정 유지에 핵심적인 역할을 해왔습니다. 중화인민공화국 건국 후 이곳은 적어도 그들의 주장으론 소수 민족과 한족이 함께 미래를 건설해 나가는 공동의 여정을 보여주는 증거로서 닝샤 후이족 자치구의 수도가 되었습니다. 오늘날에는 현대적인 마천루와 고대의 황하 나룻배가 공존하며 전통과 현대가 아름답게 얽혀 있습니다. 헬란산에 남아 있는 눈과 황하의 급류는 이 도시의 회복력과 심오한 정신에 대한 이야기를 조용히 계속해서 들려주고 있습니다.§!"
 changsha: "창사"
 changsha_desc: "----\n§9세 강이 합류하는 지점에서 탄생한 창사는 한때 탄저우로 불렸으며, 그 수로를 따라 번성해 왔습니다. 진나라 때 군으로 설립된 이래로, 이곳은 형초와 강남 지역을 잇는 핵심 전략 도시였습니다. 초나라 사람들의 정신은 흐르는 상강 속에 스며들어 굴원과 가의 같은 시인들의 심오한 사상을 되울립니다. 한나라 때부터 강남 문화의 요람이었고, 당나라와 송나라에 이르러서는 학문이 번성했습니다. 악록산 기슭에서 탄생한 \"호남학파\"는 국운을 형성한 강력한 지식인 세력으로 성장했습니다. 창사는 또한 변화의 도가니였습니다. 청나라 말기에 갈등으로 거의 파괴되었으나 폐허 속에서 혁명의 불꽃이 타올랐습니다. 이곳 상강에서 한 세대의 애국자들이 이상에 불을 붙였고, 항일 전쟁 중에 세 차례나 초토화되었지만 매번 다시 일어서 굳건하고 굴하지 않는 모습을 보였습니다. 이는 시민들이 남아있는 한 도시 또한 남을 것임을 증명했습니다.\n\n오늘날 창사는 더 이상 과거의 전쟁으로 황폐해진 도시가 아닙니다. 이곳은 중국 중남부의 주요망이자 문화 및 산업의 자랑입니다. 상강이 끊임없이 동쪽으로 흐르듯 창사는 격동과 평온의 강력한 조화를 구현하며 도시가 어떻게 잿더미 속에서 진정으로 재탄생할 수 있는지를 증명하고 있습니다.§!"
 vancouver: "밴쿠버"
 vancouver_desc: "----\n§9밴쿠버는 브리티시컬럼비아주에서 가장 큰 도시이자 캐나다에서 세 번째로 큰 대도시권으로 로어 메인랜드 전역에 걸쳐 250만 명이 훨씬 넘는 주민이 거주하고 있습니다. 북쪽으로는 해안 산맥에, 서쪽으로는 조지아 해협에 가로막혀 있는 이 도시는 조밀하고 수직적인 항구 대도시이자 전국에서 가장 분주한 항구이기에 이곳에서 벌어지는 모든 전투는 지루하고 고된 소모전이 될 수밖에 없습니다.§!"
 victoria: "빅토리아"
 victoria_desc: "----\n§9빅토리아는 브리티시컬럼비아주의 주도로 밴쿠버섬의 남쪽 끝에 자리 잡고 있으며 조지아 해협을 사이에 두고 본토와 떨어져 있습니다. 밴쿠버에 비하면 규모는 다소 작지만, 주 의회와 에스콰이몰트의 주요 군항 기지가 위치해 있습니다. 또한 섬이라는 지리적 특성상 이곳을 노리는 모든 공격자는 먼저 주변 해역부터 장악해야만 합니다.§!"
 abbotsford: "애버츠퍼드"
 abbotsford_desc: "----\n§9밴쿠버 동쪽 프레이저밸리의 중심축을 이루는 애버츠포드는 프레이저강과 미국 국경 사이 위치하여 농경지, 산업 시설, 교외 지역이 넓게 펼쳐진 곳입니다. 내륙으로 향하는 모든 도로와 철도가 반드시 거쳐야 하는 길목이기에 이곳을 장악한다는 것은 곧 로어 메인랜드로 향하는 뒷문을 장악하는 것을 의미합니다.§!"
 kamloops: "캠루프스"
 kamloops_desc: "----\n§9캠푸르스는 브리티시컬럼비아 내륙 건조한 고원 속 톰슨강 북부와 남부가 만나는 합류점에 자리 잡고 있습니다. 무엇보다도 이곳은 주요 고속도로와 양대 대륙 횡단 철도가 교차하는 교통의 요충지이며 이곳을 장악하는 자가 곧 해안, 오카나간, 북부 지역을 잇는 모든 이동을 통제하게 됩니다.§!"
 kelowna: "켈로나"
 kelowna_desc: "----\n§9켈로나는 과수원과 포도밭 사이로 오카나간호의 동쪽 연안을 따라 길게 자리 잡은 오카나간 지역 최대의 도시입니다. 이 호수가 계곡의 대부분을 길게 가로질러 양분하고 있어 모든 진격로는 이 도시와 그 주변의 몇 안 되는 도하 지점으로 집중될 수밖에 없습니다.§!"