l_korean:
 tfrkc_super.1.t: "대한민국 내전"
 tfrkc_super.1.d: "대한민국에서 내전이 발발했다는 충격적인 소식이 전해졌습니다. 양안전쟁의 패전과 전주 사건, 계엄과 탄핵소추로 이어진 정치적 위기는 끝내 무력 충돌로 번졌습니다. 이주호 권한대행이 이끄는 정부는 무장 세력에 대한 해산과 무장해제를 요구했으나, 이를 거부한 세력들이 각지에서 병력과 거점을 확보하면서 중앙의 명령은 더 이상 전국에 닿지 않고 있습니다. 한때 같은 지휘체계 아래 있던 부대들마저 서로 다른 명령에 따라 움직이고 있다는 보고가 잇따르고 있습니다.\n\n서울의 발표가 끝나기도 전에 지방에서는 새로운 성명이 방송되고 있습니다. 정부와 헌정수호연합은 협력에 나섰지만 별도의 지휘권을 유지하고 있으며, 국가재건최고회의와 윤석열이 직접 지휘하는 윤어게인 계열 무장 세력 역시 저마다 국가를 구하겠다고 선언하고 있습니다. 작업장과 학교, 도시의 골목에서 조직된 세력들까지 혼란 속에서 움직이기 시작했습니다. 모두가 대한민국의 이름을 입에 올리고 있으나, 그들이 말하는 대한민국이 같은 나라인지는 이제 누구도 확신하지 못하고 있습니다.\n\n교전 지역에서는 도로가 봉쇄되고 검문소가 설치되면서 주민들의 이동과 물자 운송에 차질이 빚어지고 있습니다. 시민들은 어느 방송이 정확한지 확인할 겨를도 없이 가족의 행방과 안전한 대피로를 찾고 있습니다. 피난을 준비하는 사람들의 가방에는 신분증과 약, 충전기와 갈아입을 옷이 먼저 들어갔습니다. 어제까지 출근 시간을 알리던 휴대전화에는 이제 돌아올 수 있느냐는 메시지가 쌓이고 있습니다. 정확한 피해 규모와 전선의 범위는 아직 확인되지 않았습니다.\n\n세계 각국은 한반도 정세를 긴급히 점검하고 자국민 보호 대책을 검토하고 있습니다. 외교가에서는 교전 중단과 대화를 촉구하는 목소리가 이어지고 있으나, 분열된 지휘체계와 상호 불신 속에서 협상이 성사될 수 있을지는 불투명합니다. 분단의 상처를 안고 살아온 한반도가 다시 동족 간의 전쟁에 휘말렸다는 사실에 국제사회도 충격을 감추지 못하고 있습니다. 나라를 지키겠다는 선언들이 총성으로 바뀐 오늘, 거리의 사람들에게 남은 질문은 하나입니다. 이 모든 것이 끝났을 때, 우리는 누구와 함께 어느 나라로 돌아갈 수 있을까요."
 tfrkc_super.1.a: "한반도의 비극을 지켜보다."
