 moscow: "모스크바"
 moscow_desc: "----\n§9러시아의 수도인 모스크바는 러시아의 풍부한 역사와 문화적 중요성을 구현하며 뻗어나간 대도시군입니다. 흔히 \"제3의 로마\"라고 불리는 모스크바는 러시아 정치, 경제, 문화 생활의 핵심입니다. 광대한 면적을 자랑하는 모스크바는 2,500제곱킬로미터가 넘는 면적을 차지하며 세계에서 가장 큰 도시 중 하나입니다.\n\n모스크바에서는 역사적인 건축물과 현대적인 기반시설이 조화를 이루고 있습니다. 크렘린, 붉은 광장, 성 바실리 대성당과 같은 기념비적인 상징들이 현대적인 고층 빌딩과 함께 서 있으며, 이는 시대에 따른 모스크바의 진화를 보여줍니다. 모스크바 대도시군은 활기찬 분위기를 조성하는 다양한 인구와 함께 번화한 활동의 중심지입니다.§!\n\n§p모스크바...이 소리가 러시아인의 마음에 얼마나 많이 녹아들었는가! 얼마나 많이 울려 퍼졌는가!§!"
 petersburg: "상트페테르부르크"
 petersburg_desc: "----\n§9러시아의 \"문화수도\"라고도 불리는 상트페테르부르크는 역사와 예술의 유산이 깊이 스며들어 있는 도시입니다. 1703년 표트르 대제가 건설한 이 도시는 서구로 향하는 관문 역할을 할 현대적인 유럽 도시에 대한 그의 이상을 담고 있습니다. \"표트르 대제의 도시\" 상트페테르부르크는 웅장한 궁전, 복잡한 운하, 그리고 건설자의 야망을 반영하는 듯한 놀라운 건축물을 자랑합니다.\n\n이 도시는 에르미타주 박물관, 마린스키 극장, 그리고 수많은 갤러리와 극장과 같은 세계적 수준의 시설들이 있는 풍부한 문화적 산실로 유명합니다. 유네스코 세계 문화유산으로 지정된 유서 깊은 중심지에는 피 흘리신 구세주 교회와 겨울 궁전 같은 숨 막히는 유적들이 우뚝 서있습니다.§!\n\n§p오, 오래된 돌길들! 그들은 모든 것을 기억하고, 살아 있으며 여전히 꿈을 꾼다네.§!"
