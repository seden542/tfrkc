 news.340.t: "제2차 한국전쟁"
 news.340.d: "한반도에서 속보가 들어왔습니다. 북한 조선인민군이 선전포고조차 없이 군사분계선을 넘어 남한 영내로 진격하면서 대한민국에 대한 노골적이고 전면적인 침공을 개시했습니다.\n\n대한민국은 개전 30분여 만에 비상계엄 및 전시동원령을 선포하였으며, 다양한 국제 문제를 두고 오랫동안 갈등해온 EADI와 PDTO 구성국들은 사전에 수립된 계획에 따라 동원령을 선포했습니다.\n\n대한민국 국군은 북한 조선인민군에 대비하여 압도적인 화력과 군사전력을 보유하고 있기에 단기적으로는 대한민국 국군이 압도적인 우위를 점할 수 있을 것이라 추측되지만, 중국군이 개입한다면 전쟁은 양측에 엄청난 소모를 불러올 장기전으로 이어질 수 있습니다.\n\nPDTO와 EADI를 비롯한 전 세계에 있어서 한반도에서의 이번 전쟁은 양측 진영 간의 고조되는 갈등이 이미 한계점에 도달했음을 보여줍니다. 양측 모두가 이 상황을 각자의 명분을 위한 지렛대로 삼을 것이라는 징후는 보이며, 이 전쟁이 전 아시아로 확전될 가능성조차 배제할 수 없는 상황입니다."
 news.340.a: "우리 시대의 전쟁이군."
 news.356.t: "중국의 대만 재점령"
 news.356.d: "베트남 전쟁 이후 동아시아에서 가장 큰 무력충돌이었던 이 전쟁은 중국 인민해방군, 중화민국 공군, 일본 자위대 및 세계 최정예 군대가 참여한 전쟁으로, 세계에서 가장 인구 밀도가 높고 풍요로운 지역 중 하나를 폐허와 불길에 휩싸인 모습으로 남기며 끝을 맞았습니다. 전 세계의 수많은 눈들이 지켜보는 가운데 전쟁의 결과가 드러났습니다. 인민해방군이 PDTO에 완승을 거두면서 중화민국이 완전히 항복하고 모든 조약군이 완전히 철수한 가운데, 이제 전장에는 산악지대에서 저항하는 소수의 잔병만이 남아있습니다.\n\n경제와 전장 측면에서의 막대한 우위를 이유로 대부분의 관측자들과 국가 지도자들이 중국의 승리를 예상한 가운데 이는 누구에게도 놀라운 일이 아니었습니다. 1895년 이후 처음으로 중국이 다시 온전한 국가로 돌아가면서 중국 전역에서 승전 행사가 시작되었고, 시진핑 주석은 수도에서 군중을 대상으로 역사적인 연설을 남겼습니다. 전 세계 각국이 중국에 축하의 메시지를 보냈으며, 특히 러시아는 축하와 더불어 '다극세계'에 대한 의지를 다시 확인했습니다. 동아시아 전역에서 불안이 고조되고, PDTO가 패배의 늪에 빠지고, 중국이 다음 행보를 계획하는 가운데 아시아는 위안화를 등에 업은 망치와 낫이 지배하는 미래로 다가서고 있습니다."
 news.356.a: "종이 호랑이가 마지막 포효를 하는군."
 news.356.b: "승리다!"
 news.356.c: "우리는 패배했다..."
 news.357.t: "대만의 독립 유지"
 news.357.d: "베트남 전쟁 이후 동아시아에서 가장 큰 무력 충돌이 마침내 끝났습니다. 중국 인민해방군, 중화민국 공군, 일본 자위대를 포함한 세계 최첨단 군대들이 맞붙은 이 전쟁은 세계에서 가장 인구 밀도가 높고 부유한 지역을 폐허로 만들었습니다. 전 세계가 주목한 가운데 전쟁의 결과가 드러났습니다. 대만은 PDTO의 지원을 받아 막강해 보였던 인민해방군에게 저항해냈고, 결국 중국군은 진먼섬을 포함한 대만 영토에서 철수할 수밖에 없었습니다.\n\n이 소식은 전 세계에 충격을 안겼습니다. 군사력과 경제력 면에서 중국이 절대적인 우위를 점하고 있었기 때문입니다. 하지만 놀라움은 곧 기쁨으로 바뀌었고, 도쿄에서 캔버라에 이르기까지 여러 도시에서는 독재 정권의 패배와 자유 민주 연합의 승리를 축하하는 자발적인 행진이 이어졌습니다. 반면, 베이징은 무거운 침묵 속에 빠졌고, 중국공산당과 시진핑은 패배의 충격과 함께 앞으로 맞이할 더 큰 문제들에 직면하게 될 위기에 놓였습니다."
 news.357.a: "중국은 그렇게 강력하지 않을 수도 있다."
 news.357.b: "우리는 패배했다..."
 news.357.c: "용이 동굴 안으로 밀려났군!"
 news.413.t: "EADI의 대아대전 승리"
 news.413.d: "아시아 태평양 지역처럼 지속적으로 분쟁의 위기에 처한 지역은 지구상에서 거의 없습니다. 제2차 세계대전이 끝난 이후 이 지역은 남아시아에서 장기간의 국경 충돌, 인도차이나에서 간헐적인 게릴라전, 군사분계선과 대만 해협을 가로지르는 팽팽한 군사 대치를 겪어왔습니다. 각각의 대결은 전면전으로 비화하기 전의 불꽃에 불과해 보였습니다. 그러나 오랫동안 지속되어 온 대아대전이 마침내 끝이 날 조짐을 보이고 있습니다.\n\n중국, 북한, 파키스탄 등의 국가로 구성된 동아시아 방위 구상이 이 기나긴 전쟁에서 최종적인 승리자로 떠올랐습니다. 이 동맹은 제국주의 패권에 저항하며 엄청난 희생을 치른 덕분에 전 세계 인민의 절반을 위한 정의의 투사로 자리매김했습니다. 이른바 PDTO로 일컬어지는 패배자들은 '민주주의'라는 겉치레조차 완전히 잡아뜯긴 채 인민의 보복에 직면하게 되었습니다."
 news.413.a: "평화는 그 자체로 가치있다."
 news.414.t: "PDTO의 대아대전 승리"
 news.414.d: "아시아 태평양 지역처럼 지속적으로 분쟁의 위기에 처한 지역은 지구상에서 거의 없습니다. 제2차 세계대전이 끝난 이후 이 지역은 남아시아에서 장기간의 국경 충돌, 인도차이나에서 간헐적인 게릴라전, 군사분계선과 대만 해협을 가로지르는 팽팽한 군사 대치를 겪어왔습니다. 각각의 대결은 전면전으로 비화하기 전의 불꽃에 불과해 보였습니다. 그러나 오랫동안 지속되어 온 대아대전이 마침내 끝이 날 조짐을 보이고 있습니다.\n\n일본, 호주, 인도, 한국 등의 국가로 구성된 태평양방위조약기구는 이 기나긴 분쟁에서 최종적인 승리자로 부상했습니다. 이 민주주의 국가들의 동맹은 상당한 희생을 치르며 전 세계 인구의 절반을 위한 자유의 투사임을 증명했습니다. 패전국, 즉 중국이 주도하는 EADI는 필연적인 속죄에 직면하는 동시에 다시 전쟁을 일으킬 역량을 완전히 상실하였습니다."
 news.414.a: "평화는 그 자체로 가치있다."
 news.415.t: "아시아의 대전쟁!"
 news.415.d: "대만 전쟁이 끝난 이후 모두가 이 순간까지 며칠 남지 않은 나날을 세어 왔습니다. 탈냉전 시대의 가장 대표적인 군사동맹인 동아시아 방위 구상(EADI)과 태평양 방위 조약기구(PDTO) 간의 전쟁이 공식적으로 선포되었습니다. 사람들은 이 새로운 전쟁을 즉시 \"대아대전\"이라고 부르기 시작했습니다.\n\n이 이름은 제2차 세계대전의 태평양 전쟁과 일본 제국의 이른바 \"대동아전쟁\"을 떠올리게 하지만, 이 전쟁의 규모는 아시아 태평양 지역에서 발생한 이전의 어떤 분쟁보다 훨씬 더 거대합니다. 일부에서는 방대한 인구와 강력한 산업 역량, 세계 최대 규모의 군대를 가진 중국이 EADI의 동맹국들과 함께 적들에게 압도적인 우위를 점하고 있다고 믿고 있습니다. 또한 EADI 회원국들은 내부 작전선의 이점을 활용하여 중국의 국토를 안정적인 후방 기지로 활용할 수 있습니다. 반대로 일본과 한국이 주도하는 PDTO가 지리적으로 중국을 둘러싸고 차단하고 있으며, 광활한 해역을 지배하는 PDTO가 해양 지배권과 안정적인 무역로를 확보할 것이라는 주장도 제기되고 있습니다. 또한 PDTO는 주로 '민주주의' 국가들로 구성되어 본질적으로 '권위주의' 국가들의 EADI에 비해 이념적인 우위를 점하고 있습니다.\n\n전쟁은 시작된 순간부터 오로지 힘의 논리로만 추진됩니다. 육지에서 바다로, 하늘에서 우주로, 이제는 사이버 공간까지, 전쟁의 신이 향후 반세기 동안 인류의 정치 지형을 형성할 피비린내 나는 게임을 시작했습니다."
 news.415.a: "아시아 태평양을 불태울 불길이 타오른다."
 news.416.t: "제2차 서울 전투"
 news.416.d: "최근 PDTO는 서울 탈환을 위한 전역을 계획했습니다. 치열한 전투 끝에 PDTO는 이 지역을 다시 장악하는 데 성공했습니다.\n\n서울을 탈환한 PDTO는 이제 이 현대적인 도시를 한국을 둘러싼 투쟁을 위한 자연적 장벽으로 활용할 수 있게 되었습니다. 하지만 상황은 여전히 암울합니다. 비록 일시적인 승리를 거두기는 했지만, 여전히 PDTO는 상대적으로 온전한 EADI군의 위협에 직면해 있습니다. 또한 두 차례의 전투 이후 서울에서 발생한 수많은 난민들을 둔 문제는 PDTO의 통치 능력을 시험하고 있습니다. \n\n반면, EADI는 서울의 상실과 회복을 직시해야 합니다. 여전히 PDTO는 상당한 전투력을 보유하고 있음을 증명하고 있습니다. EADI는 머지않아 이 문제를 해결해야 할 것입니다."
 news.416.a: "PDTO가 다시 돌아왔다."
 news.527.t: "대한민국 국군의 만주 진입"
 news.527.d: "최근 아시아에서 뉴스가 전해졌습니다. 대한민국 국군을 주력으로 한 PDTO 연합군이 한반도를 통해 압록강과 두만강을 넘어 중국 동북 지방으로 진격한 것입니다. 이는 중국과 EADI군의 치욕적인 패배로 기록되었으며, PDTO군에게 승리의 축배를 안겨주었습니다.\n\n이 소식은 대한민국과 그 동맹국들에게 \"대아대전\"에서의 중요한 승리를 알리는 신호입니다. 중국군이 점차 자국 경계 안으로 밀려나면서, 많은 전쟁 전문가들은 전세가 태평양 방위조약기구 쪽으로 유리하게 기울고 있다고 분석했습니다. \n\n반면, 중국과 EADI는 이 패배가 단순히 지형적 불리함으로 인한 매우 단기적인 패배에 지나지 않으며 곧 만주에서 PDTO를 밀어낼 것이라 호언장담하고 있으며 적어도 중국 시민들은 그렇게 믿고 있는 것 같습니다."
 news.527.a: "전쟁이 격화되고 있다..."