 tfrkc.100.t: "다음 세대에게 넘기지 않을 것"
 tfrkc.100.d: "전주 사건 이후 학생자치와 청소년의 권리를 요구하는 목소리가 커지고 있습니다. 이를 지지하는 성인 대학생·청년노동자·귀환장병·예비역들이 청소년해방군의 전투조직을 이루고 있습니다. 청소년 당사자들은 학생자치와 권리 요구의 주체로 참여합니다.\n\n‘우리가 겪었던 억압을 다음 세대에게 넘기지 않겠다.’ 같은 문장을 들고 모였지만, 무장한 성인 조직이 학생 대표들의 말을 어디까지 따를 것인지는 아직 정해지지 않았습니다. 이들과 함께할지 입장을 정해야 합니다."
 tfrkc.100.yes: "청소년해방군과 함께한다."
 tfrkc.100.no: "다른 세력의 입장을 살핀다."
 tfrkc.101.t: "헌정을 지킨다는 것"
 tfrkc.101.d: "강원의 지휘관들이 헌정복원을 내걸었습니다. 헌정수호연합은 이주호 권한대행 정부의 법적 연속성을 인정하면서도, 협력을 위해서는 비상권력의 종료와 헌정복원이라는 조건이 지켜져야 한다고 주장합니다.\n\n그들에게 충성의 대상은 특정한 대통령이나 권한대행 개인이 아닙니다. 그러나 원칙을 지킬 병력을 갖게 된 순간, 그 병력을 언제 내려놓을지 스스로 답해야 합니다. 이 연합과 함께할지 결정해야 합니다."
 tfrkc.101.yes: "헌정수호연합과 함께한다."
 tfrkc.101.no: "다른 세력의 입장을 살핀다."
 tfrkc.102.t: "복권을 기다리는 사람들"
 tfrkc.102.d: "윤어게인은 직무가 정지된 윤석열의 복권을 요구하며 결집하고 있습니다. 이들은 정부의 법적 지휘보다 그를 향한 충성을 앞세웁니다.\n\n복권 뒤 무엇을 할 것인지에 대해서는 서로 다른 말을 합니다. 지지 운동의 회복을 원하는 사람과 새로운 비상권력을 원하는 사람이 같은 구호를 외칩니다. 지금 묻는 것은 그 모든 차이를 뒤로하고 이들과 함께할 것인지입니다."
 tfrkc.102.yes: "윤어게인과 함께한다."
 tfrkc.102.no: "다른 세력의 입장을 살핀다."
 tfrkc.103.t: "명령을 다시 세운다는 사람들"
 tfrkc.103.d: "정치권이 아니라 군의 질서로 국가를 재건해야 한다는 구상이 군 내부의 연락망을 따라 전달되고 있습니다. 남영신을 중심으로 질서를 회복하자는 이들은 기존 정치권의 무능을 비판합니다.\n\n군이 나라를 맡아야 한다는 주장에 동의할지 묻는 연락이 왔습니다. 아직 어느 지휘부가 실제로 움직일지 확정되지 않았습니다. 이 구상을 지지한다면 이후 국가재건최고회의 측에서 행동하게 됩니다."
 tfrkc.103.yes: "군의 국가 재건 구상을 지지한다."
 tfrkc.103.no: "다른 세력의 입장을 살핀다."
 tfrkc.104.t: "작업장에서 온 성명"
 tfrkc.104.d: "경기 남서부의 노동자 대표들이 생산시설과 생활 기반을 지키기 위한 평의회를 구성했습니다. 밀린 임금과 끊긴 원료, 작업장 곁의 배급 줄이 그들의 정치가 시작된 자리입니다.\n\n평의회는 일하는 사람들이 생산과 통치를 함께 결정해야 한다고 주장합니다. 그러나 공장을 지키는 일과 전선을 유지하는 일에 필요한 자원을 놓고도 견해가 갈립니다. 이들과 함께할지 결정해야 합니다."
 tfrkc.104.yes: "노동자평의회와 함께한다."
 tfrkc.104.no: "다른 세력의 입장을 살핀다."
 tfrkc.105.t: "배타적인 구호"
 tfrkc.105.d: "민족정화전선의 선전문은 패전과 빈곤의 원인을 내부의 적에게 돌립니다. 오늘의 명단에는 어제까지만 해도 이웃이라 부르던 사람들이 올라 있습니다.\n\n‘§R저들은 더 이상 우리의 국민이 아니다.§!’ 전선의 선전문은 그렇게 단언합니다. 누구를 배제하면 배급이 늘어날 것이라는 약속은, 다음번 배제할 이름을 찾는 이유가 됩니다. 이 조직에 가담할 것인지, 대한민국 정부에 남을 것인지 결정해야 합니다."
 tfrkc.105.yes: "민족정화전선에 가담한다."
 tfrkc.105.no: "이주호 권한대행 정부에 남는다."
