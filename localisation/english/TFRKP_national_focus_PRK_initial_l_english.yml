 PRK_epidemic_supply_requisition_disruption: "Disruption from Emergency Requisitions"
 PRK_epidemic_supply_requisition_disruption_desc: "Redirecting factory and military stockpiles to the epidemic front has disrupted normal production schedules."
 PRK_military_medical_units_deployment_strain: "Strain from Diverting Military Medical Units"
 PRK_military_medical_units_deployment_strain_desc: "Concentrating military doctors and field hospitals on epidemic control is delaying casualty evacuation and the recovery of frontline units."
 PRK_koryo_medicine_production_disruption: "Disruption from Koryo Medicine Expansion"
 PRK_koryo_medicine_production_disruption_desc: "Redirecting factory equipment and workers to Koryo medicine production has disrupted normal production schedules."
