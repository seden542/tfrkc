 PRK_eighth_congress_workers_party_desc: ""
 PRK_national_economic_development_plan_category: "National Economic Development Plan"
 PRK_national_economic_development_plan_category_desc: "Implement the National Economic Development Plan adopted by the Eighth Congress of the Workers' Party through sector-specific projects. Completing the relevant focuses will unlock new economic projects."
 PRK_expand_civilian_industry: "Expand the People's Economy Production Base"
 PRK_expand_civilian_industry_desc: "Prepare idle regional land and construct new production facilities for the people's economy."
 PRK_expand_defense_industry: "Expand the Defense Industrial Base"
 PRK_expand_defense_industry_desc: "Establish new military production facilities to expand the capacity of the defense industry."
 PRK_modernize_rural_infrastructure: "Modernize Rural Infrastructure"
 PRK_modernize_rural_infrastructure_desc: "Improve rural roads and infrastructure to raise agricultural output and transport efficiency."
 PRK_expand_agricultural_support_network: "Expand Agricultural Machinery and Fertilizer Supply Networks"
 PRK_expand_agricultural_support_network_desc: "Establish a reliable system for supplying machinery and fertilizer to rural areas."
 PRK_modernize_industrial_equipment: "Modernize Industrial Equipment"
 PRK_modernize_industrial_equipment_desc: "Replace obsolete equipment and modernize production processes to improve factory productivity."
 PRK_modernize_industrial_equipment_effect_tt: "Industrial Reconstruction modifier: Production Efficiency Cap: §G+1.0%§!"
 PRK_expand_power_transport_network: "Expand Power and Transport Networks"
 PRK_expand_power_transport_network_desc: "Expand the power and transport networks connecting industrial districts to support construction projects."
 PRK_expand_power_transport_network_effect_tt: "Industrial Reconstruction modifier: Construction Speed: §G+1.0%§!"
 PRK_coordinate_rural_industrial_development: "Balance Agricultural and Industrial Development"
 PRK_coordinate_rural_industrial_development_desc: "Coordinate agricultural and industrial planning so that each sector supports the growth of the other."
 PRK_complete_regional_development_projects: "Review Regional Economic Development Projects"
 PRK_complete_regional_development_projects_desc: "Review regional economic development projects and expand their achievements nationwide."
 PRK_five_year_national_economic_development_plan: "Five-Year National Economic Development Plan"
 PRK_five_year_national_economic_development_plan_desc: ""
 PRK_national_economic_reconstruction_dynamic: "Industrial Reconstruction"
 PRK_national_economic_reconstruction_dynamic_desc: "Under the Party's leadership, the production base is being restored and industry is gradually returning to normal. Its effects will improve as the national economic development plan advances."
 PRK_national_economic_reconstruction_dynamic_dummy_idea: "Industrial Reconstruction"
 PRK_national_economic_reconstruction_dynamic_dummy_idea_desc: ""
 PRK_economy_broken_beyond_recognition: "An Economy Broken Beyond Recognition"
 PRK_economy_broken_beyond_recognition_desc: "This is... a Strong and Prosperous Nation...?"
 PRK_guideline_crush_ideological_cultural_infiltration: "Guidelines for Crushing Ideological and Cultural Infiltration Schemes"
 PRK_guideline_crush_ideological_cultural_infiltration_desc: ""
 PRK_great_innovation_in_rural_areas: "A Great Innovation in the Countryside"
 PRK_great_innovation_in_rural_areas_desc: ""
 PRK_great_innovation_in_industrial_sector: "A Great Innovation in the Industrial Sector"
 PRK_great_innovation_in_industrial_sector_desc: ""
 PRK_enact_reactionary_thought_culture_rejection_act: "Enact the Reactionary Thought and Culture Rejection Act"
 PRK_enact_reactionary_thought_culture_rejection_act_desc: ""
 PRK_strengthen_anti_imperialist_class_education: "Strengthen Anti-Imperialist Class Education"
 PRK_strengthen_anti_imperialist_class_education_desc: ""
 PRK_strengthened_anti_imperialist_class_education_idea: "Strengthened Anti-Imperialist Class Education"
 PRK_strengthened_anti_imperialist_class_education_idea_desc: "By instilling an understanding of imperialism and firm class principles among the people, the banner of anti-imperialist independence will be defended more resolutely."
 PRK_review_line_for_rural_revitalization: "Review the Line for Rural Revitalization"
 PRK_review_line_for_rural_revitalization_desc: ""
 PRK_kim_jong_un_original_ideological_theory: "Comrade Kim Jong Un's 'Original Ideological Theory'"
 PRK_kim_jong_un_original_ideological_theory_desc: ""
 PRK_original_ideological_theory_idea: "'Original Ideological Theory'"
 PRK_original_ideological_theory_idea_desc: "The ideological theory originally developed by the Respected Comrade Kim Jong Un will serve as a programmatic guide that unites the Party, the state, and the people under a single will!"
 PRK_regional_development_20x10_policy: "Regional Development 20x10 Policy"
 PRK_regional_development_20x10_policy_desc: ""
 PRK_20x10_songchon_regional_industry: "Complete the Songchon Regional-Industry Factories"
 PRK_20x10_songchon_regional_industry_desc: "Complete food, garment, and daily-goods production facilities in Songchon County, the first groundbreaking site of the Regional Development 20x10 Policy. Normalize production of local specialties including sweet jelly and jam made from Songchon chestnuts."
 PRK_20x10_jaeryong_foodstuffs: "Normalize Food and Daily-Goods Production in Jaeryong County"
 PRK_20x10_jaeryong_foodstuffs_desc: "Use produce from the Jaeryong Namuri Plain to make bar rice cake and black glutinous-rice pepper paste while expanding the supply of soap and daily necessities."
 PRK_20x10_sukchon_west_sea_foodstuffs: "Build the Sukchon Seafood Processing Base"
 PRK_20x10_sukchon_west_sea_foodstuffs_desc: "Exploit Sukchon County's access to the West Sea of Korea to establish a regional industrial base producing pickled seafood and other foodstuffs."
 PRK_20x10_unpha_integrated_production: "Open the Sterile Unpha Foodstuff Factory"
 PRK_20x10_unpha_integrated_production_desc: "Introduce germ-free and dust-free production lines and an integrated production system at the Unpha County Foodstuff Factory to improve quality and productivity."
 PRK_20x10_kyongsong_specialty_foods: "Develop Kyongsong's Goji Berry Specialties"
 PRK_20x10_kyongsong_specialty_foods_desc: "Produce syrup, sweet jelly, and chili paste from Kyongsong County's goji berries and develop them into signature regional specialties."
 PRK_20x10_sinpho_offshore_farm: "Expand the Sinpho City Offshore Farm"
 PRK_20x10_sinpho_offshore_farm_desc: "Use the favorable conditions off Sinpho to expand the cultivation and processing of kelp, shellfish and other marine products."
 PRK_wave_of_malignant_virus: "Wave of the Malignant Virus"
 PRK_wave_of_malignant_virus_desc: "The fever that began beyond our borders is already watching for an opportunity to cross the Yalu and Tumen Rivers. Amid scarce testing equipment, decrepit hospitals, and a broken pharmaceutical supply chain, we must fight an invisible enemy."
 PRK_fight_malignant_virus_category: "Fight Against the Malignant Virus"
 PRK_fight_malignant_virus_category_desc: "§RBetween a feeble medical system and a collapsing epidemic-prevention front, resources must be allocated at every moment.§!\n£GFX_PRK_epidemic_supplies_texticon §YEpidemic Supplies Held§!: §G[?PRK_epidemic_supplies_var|0]§! / §Y100§!\n\n§YPyongan§! : Current Infection [GetPRKPyonganInfectionStage] (§Y[?PRK_pyongan_infection_var|%0]§!)\n§YHwanghae§! : Current Infection [GetPRKHwanghaeInfectionStage] (§Y[?PRK_hwanghae_infection_var|%0]§!)\n§YKangwon§! : Current Infection [GetPRKKangwonInfectionStage] (§Y[?PRK_kangwon_infection_var|%0]§!)\n§YHamgyong§! : Current Infection [GetPRKHamgyongInfectionStage] (§Y[?PRK_hamgyong_infection_var|%0]§!)\n§YRyanggang§! : Current Infection [GetPRKRyanggangInfectionStage] (§Y[?PRK_ryanggang_infection_var|%0]§!)\n§YChagang§! : Current Infection [GetPRKChagangInfectionStage] (§Y[?PRK_chagang_infection_var|%0]§!)\n\n§YNationwide Infection§! : Current Infection [GetPRKNationalInfectionStage] (§Y[?PRK_national_infection_var|%0]§!)\n£GFX_PRK_epidemic_containment_texticon §YContainment Capacity§!: §G[?PRK_epidemic_containment_var|%1]§!  |  £GFX_PRK_epidemic_infection_texticon §YExpected Concentrated Spread§!: §R[?PRK_epidemic_current_spread_var|%1]§!\n\n§YInfection Stages§!\n§G0-20%§!: No Abnormalities\n§Y21-40%§!: Infections Detected\n§O41-60%§!: Infections Surging\n§R61-80%§!: Quarantine Network Near Collapse\n§R81-100%§!: Epidemic Control Impossible"
 PRK_infection_stage_clear: "§GNo abnormalities§!"
 PRK_infection_stage_detected: "§YInfections detected§!"
 PRK_infection_stage_amplified: "§OInfections surging§!"
 PRK_infection_stage_collapse_imminent: "§RQuarantine network near collapse§!"
 PRK_infection_stage_uncontrollable: "§REpidemic control impossible§!"
 PRK_activate_maximum_emergency_epidemic_prevention_system: "Activate the Maximum Emergency Anti-Epidemic System"
 PRK_activate_maximum_emergency_epidemic_prevention_system_desc: "Bring every institution, enterprise, and neighborhood unit into the emergency epidemic-prevention system and immediately implement regional lockdowns and medical inspections. We can now respond directly to regions where infections occur."
 PRK_close_borders: "Border Closure"
 PRK_close_borders_desc: "Closing the railways, roads, ports, and airfields also means cutting off incoming food and medicine. But if we do not close the border now, we will be closing hospital doors instead."
 PRK_role_of_party: "The Party's Role"
 PRK_role_of_party_desc: "Mobilize Party organizations at every level and neighborhood units to identify patients and contacts and monitor the movement of those subject to quarantine. The Party's organizational network is the only nationwide organization capable of compensating for the shortage of medical personnel."
 PRK_organize_state_emergency_epidemic_prevention_command: "Organize the State Emergency Anti-Epidemic Command"
 PRK_organize_state_emergency_epidemic_prevention_command_desc: "Integrate the scattered reporting systems of the Ministry of Public Health, the Cabinet, the military, and local organs under a single command."
 PRK_impose_lockdowns_across_provinces: "Implement Lockdowns"
 PRK_impose_lockdowns_across_provinces_desc: "Control movement between cities and provinces and lock down infected areas by local living zone. It is a hard-line measure that sacrifices livelihoods and production, but it can break the pace of transmission."
 PRK_role_of_cabinet: "The Role of the Cabinet"
 PRK_role_of_cabinet_desc: "The Cabinet must allocate the remaining vehicles, fuel, food, and hospital beds to the epidemic-prevention front. We need supplies that actually arrive, not plans that exist only on paper."
 PRK_ensure_medical_supplies: "Secure Medical Supplies"
 PRK_ensure_medical_supplies_desc: "Gather masks, antipyretics, oxygen, and protective clothing from military warehouses, factories, and overseas procurement networks. Without supplies, orders to quarantine and treat the sick will remain only orders."
 PRK_investigate_infection_route: "Trace the Route of Infection"
 PRK_investigate_infection_route_desc: "Trace patients' movement records, border crossings, and market trading networks. We must know the routes of infection to deploy our limited personnel where they are needed."
 PRK_role_of_judiciary_and_prosecution: "The Role of Judicial and Prosecutorial Organs"
 PRK_role_of_judiciary_and_prosecution_desc: "Severely punish quarantine violations, concealment of infection, and diversion of epidemic-prevention supplies. Fear can compel cooperation, but excessive coercion will erode the stability of the system itself."
 PRK_emergency_vaccine_imports: "Emergency Vaccine Imports"
 PRK_emergency_vaccine_imports_desc: "Even if it exhausts our foreign currency and requires political concessions, urgently import proven vaccines. This offers rapid results, but supply will depend on decisions made abroad."
 PRK_our_own_vaccine: "A Vaccine of Our Own"
 PRK_our_own_vaccine_desc: "Mobilize domestic research institutes and production facilities to develop a vaccine suited to Joseon's conditions. Completion will be slow, but success would allow us to control the supply ourselves."
 PRK_kumgang_county_ipo_ri: "Ipo-ri, Kumgang County"
 PRK_kumgang_county_ipo_ri_desc: "Trace contacts along the travel route discovered in Ipo-ri, Kumgang County, Kangwon Province. A single small passage through the mountains has endangered the entire region."
 PRK_hyesan_kanggu_dong: "Ganggu-dong, Hyesan City"
 PRK_hyesan_kanggu_dong_desc: "Investigate the informal trading networks and border traffic in Ganggu-dong, Hyesan. Breaking Ryanggang's chain of transmission will determine the fate of the northern epidemic-prevention line."
 PRK_role_of_peoples_army: "The Role of the People's Army"
 PRK_role_of_peoples_army_desc: "Use personnel and vehicles from the People's Army to reinforce checkpoints and quarantine cordons. Its coercive power is reliable, but combat readiness and military morale will suffer accordingly."
 PRK_research_koryo_medicine: "Research Koryo Medicine"
 PRK_research_koryo_medicine_desc: "With modern medicines in short supply, use Koryo medicine prescriptions and domestic medicinal herbs as supplementary treatment. It is not a complete answer, but it is better than doing nothing."
 PRK_boiled_cows_head: "Boiled Cow's Head"
 PRK_boiled_cows_head_desc: "You fucking idiot!"
 PRK_national_emergency_epidemic_prevention_review_conference: "National Emergency Anti-Epidemic Review Conference"
 PRK_national_emergency_epidemic_prevention_review_conference_desc: "After reducing nationwide infection to a controllable level, review the emergency epidemic-prevention campaign and transition to a routine prevention system. The conference cannot be convened while the embers still burn."
 PRK_malignant_virus_must_be_fully_resolved_tt: "The malignant virus must be completely eradicated!"

 PRK_malignant_virus_dynamic: "A Breached Epidemic Front"
 PRK_malignant_virus_dynamic_desc: "As nationwide infection rises, society and production seize up. Every effect scales in real time with nationwide infection."
 PRK_malignant_virus_dynamic_tooltip: "Current nationwide infection: [GetPRKNationalInfectionStage] (§Y[?PRK_national_infection_var|%0]§!)"
 PRK_virus_spread_mission: "Next Wave of Infection - Stage 1"
 PRK_virus_spread_mission_desc: "For the first 100 days of the epidemic crisis, infection spreads every §Y20 days§!. Undetected transmission increases infection in every region, and a concentrated outbreak strikes one random region. Concentrated spread begins at §R16%§! and is reduced by containment capacity, but never falls below §R6%§!.\n\n§7High nationwide infection will cause additional spread.§!"
 PRK_virus_spread_mission_stage_2: "Next Wave of Infection - Stage 2"
 PRK_virus_spread_mission_stage_2_desc: "The epidemic crisis has lasted 100 days, shortening the spread interval to §Y15 days§!. If the crisis continues for another 100 days, it will enter its final stage."
 PRK_virus_spread_mission_stage_3: "Next Wave of Infection - Stage 3"
 PRK_virus_spread_mission_stage_3_desc: "The epidemic crisis has lasted 200 days. Infection now spreads every §R10 days§!, and the interval can no longer be extended."
 PRK_virus_stage_2_countdown_mission: "Transition to Infection Stage 2"
 PRK_virus_stage_2_countdown_mission_desc: "The infection interval will shorten 100 days after the epidemic crisis begins."
 PRK_virus_stage_3_countdown_mission: "Transition to Infection Stage 3"
 PRK_virus_stage_3_countdown_mission_desc: "The infection interval will shorten again 100 days after Stage 2 begins."
 PRK_epidemic_supply_production_mission: "Routine Production of Epidemic Supplies"
 PRK_epidemic_supply_production_mission_desc: "Produces £GFX_PRK_epidemic_supplies_texticon Epidemic Supplies §G+2§! every 30 days."
 PRK_quarantine_pyongan: "Emergency Quarantine in Pyongan"
 PRK_quarantine_pyongan_desc: "Restrict movement and markets in Pyongan for ten days. Upon completion, Pyongan infection §G-10%§! and stability §R-0.5%§!."
 PRK_quarantine_hwanghae: "Emergency Quarantine in Hwanghae"
 PRK_quarantine_hwanghae_desc: "Restrict movement and markets in Hwanghae for ten days. Upon completion, Hwanghae infection §G-10%§! and stability §R-0.5%§!."
 PRK_quarantine_kangwon: "Emergency Quarantine in Kangwon"
 PRK_quarantine_kangwon_desc: "Restrict movement and markets in Kangwon for ten days. Upon completion, Kangwon infection §G-10%§! and stability §R-0.5%§!."
 PRK_quarantine_hamgyong: "Emergency Quarantine in Hamgyong"
 PRK_quarantine_hamgyong_desc: "Restrict movement and markets in Hamgyong for ten days. Upon completion, Hamgyong infection §G-10%§! and stability §R-0.5%§!."
 PRK_quarantine_ryanggang: "Emergency Quarantine in Ryanggang"
 PRK_quarantine_ryanggang_desc: "Restrict movement and markets in Ryanggang for ten days. Upon completion, Ryanggang infection §G-10%§! and stability §R-0.5%§!."
 PRK_quarantine_chagang: "Emergency Quarantine in Chagang"
 PRK_quarantine_chagang_desc: "Restrict movement and markets in Chagang for ten days. Upon completion, Chagang infection §G-10%§! and stability §R-0.5%§!."
 PRK_mobilize_party_quarantine_cells: "Mobilize Party Quarantine Cells"
 PRK_mobilize_party_quarantine_cells_desc: "Mobilize Party members and neighborhood units to trace contacts and monitor homes. Infection in every region §G-2.5%§!."
 PRK_nationwide_disinfection_campaign: "Nationwide Disinfection Campaign"
 PRK_nationwide_disinfection_campaign_desc: "Intensively disinfect public facilities and transportation. Infection in every region §G-3%§! and stability §R-0.5%§!."
 PRK_enforce_nationwide_lockdown: "Enforce a Nationwide Lockdown"
 PRK_enforce_nationwide_lockdown_desc: "Halt all movement at the cost of the economy and livelihoods. Infection in every region §G-6%§! and stability §R-2%§!."
 PRK_requisition_medical_supplies: "Requisition Medical Supplies"
 PRK_requisition_medical_supplies_desc: "Forcibly requisition medical supplies from the military, factories, and provincial warehouses. Upon completion, gain §G+12§! Epidemic Supplies, but for §Y30 days§!, Factory Output falls by §R-10%§!. You must wait §Y45 days§! before doing so again."
 PRK_punish_quarantine_violations: "Punish Quarantine Violations"
 PRK_punish_quarantine_violations_desc: "Publicly punish quarantine violations and concealment of infection. Infection in every region §G-3%§! and stability §R-1%§!."
 PRK_quarantine_self_reporting_period: "Voluntary Infection Reporting Period"
 PRK_quarantine_self_reporting_period_desc: "Offer one final chance to report concealed infections before punishment begins. After §Y7 days§!: £GFX_PRK_epidemic_infection_texticon infection in every region §G-2%§! and stability §G+0.3%§!. Requires £GFX_PRK_epidemic_supplies_texticon §Y4 epidemic supplies§! and §Y15§! political power. Cooldown: §Y45 days§!."
 PRK_emergency_vaccination_drive: "Emergency Vaccination Drive"
 PRK_emergency_vaccination_drive_desc: "Concentrate the available vaccines in high-risk regions first. Infection in every region §G-8%§!."
 PRK_prioritize_high_risk_vaccination: "Prioritize High-Risk Vaccination"
 PRK_prioritize_high_risk_vaccination_desc: "Give available vaccines priority to medical personnel, the elderly, and people with underlying conditions. After §Y7 days§!, £GFX_PRK_epidemic_infection_texticon infection in every region §G-4%§!. Requires £GFX_PRK_epidemic_supplies_texticon §Y8§! Epidemic Supplies and has a §Y30-day§! cooldown."
 PRK_deploy_army_quarantine_cordon: "Deploy Army Quarantine Cordons"
 PRK_deploy_army_quarantine_cordon_desc: "Block travel routes with military personnel and vehicles. Infection in every region §G-7%§!, Command Power §R-15§!, and War Support §R-1%§!."
 PRK_dispatch_military_medical_units: "Dispatch Military Doctors and Field Hospitals"
 PRK_dispatch_military_medical_units_desc: "Urgently dispatch military doctors and field hospitals to infected regions. After §Y7 days§!, £GFX_PRK_epidemic_infection_texticon infection in every region §G-4%§!. Requires £GFX_PRK_epidemic_supplies_texticon §Y3§! Epidemic Supplies and §Y10§! Command Power, while for §Y30 days§!, Army Organization Recovery falls by §R-5%§!. This decision has a §Y40-day§! cooldown."
 PRK_koryo_medicine_treatment_campaign: "Koryo Medicine Treatment Campaign"
 PRK_koryo_medicine_treatment_campaign_desc: "Use domestic medicinal herbs and Koryo medicine prescriptions as supplementary treatment. Infection in every region §G-4%§!."
 PRK_expand_koryo_medicine_production: "Expand Koryo Medicine Production"
 PRK_expand_koryo_medicine_production_desc: "Convert part of the industrial base to Koryo medicine production. After §Y10 days§!, gain £GFX_PRK_epidemic_supplies_texticon Epidemic Supplies §G+5§!, but for §Y20 days§!, Factory Output falls by §R-5%§!. Requires §Y20§! Political Power and has a §Y60-day§! cooldown."
 PRK_expand_temporary_quarantine_posts: "Expand Temporary Quarantine Posts"
 PRK_expand_temporary_quarantine_posts_desc: "Add temporary posts and inspection stations along roads and at railway stations. This can be done only once: Containment Capacity §G+1.5%§!, infection in every region §G-2%§!, and stability §R-0.5%§!."
 PRK_deploy_epidemic_reserve_units: "Pre-Deploy Epidemic Reserve Units"
 PRK_deploy_epidemic_reserve_units_desc: "Position reserve units at likely outbreak points. Preparations finish after §Y5 days§! and block the concentrated regional portion of the next infection wave once. Baseline spread in every region and epidemic-front breakthroughs can still occur. Requires £GFX_PRK_epidemic_supplies_texticon §Y6 epidemic supplies§!. Cooldown: §Y50 days§!."
 PRK_household_fever_surveys: "Conduct Household Fever Surveys"
 PRK_household_fever_surveys_desc: "Neighborhood units and Party cells check every household for people with fevers. Containment Capacity §G+0.5%§!, infection in every region §G-1%§!, and stability §R-0.3%§!. This can no longer be carried out once Containment Capacity reaches its maximum."
 PRK_suspend_interprovincial_transport: "Suspend Interprovincial Transport"
 PRK_suspend_interprovincial_transport_desc: "Halt trains and vehicles crossing provincial boundaries. Infection in every region §G-7%§! and stability §R-1.5%§!."
 PRK_dispatch_emergency_medical_trains: "Dispatch Emergency Medical Trains"
 PRK_dispatch_emergency_medical_trains_desc: "Send special trains carrying medicine and medical personnel into infected regions. Infection in every region §G-5%§! and command power §R-10§!."
