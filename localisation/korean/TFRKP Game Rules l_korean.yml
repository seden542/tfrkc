 TFRKP_lee_reds_lead_faction_of_party_JP_TXT: "§Y£GFX_KOR_JP_texticon 정의당계§!"
 TFRKP_lee_reds_lead_faction_of_party_JP_TXT_DESC: "-------------------------------------\n\n\n\n\n\n\n\n   £GFX_portrait_KOR_jang_hye_young_gamerule\n\n\n\n\n\n\n\n\n-------------------------------------\n\n정의당계는 구 정의당에 속했던 인사들이 주축이 되어 결성한 정파입니다. 이들은 현실적 진보 정치와 정의로운 복지 국가를 목표로 사회의 온건적 변화를 추구합니다."
 TFRKP_lee_reds_lead_faction_of_party_LP_TXT: "§t£GFX_KOR_LP_texticon 좌단위§!"
 TFRKP_lee_reds_lead_faction_of_party_LP_TXT_DESC: "-------------------------------------\n\n\n\n\n\n\n\n   £GFX_portrait_KOR_lee_baek_yoon_gamerule\n\n\n\n\n\n\n\n\n-------------------------------------\n\n좌단위는 다양한 사회주의적, 급진적 그룹들을 포괄하는 정파입니다. 이들은 급진적 사회주의 정책을 관철하고, 종국에는 자본주의를 완전 철폐하려 할 것입니다."
 
 TFRKP_lee_reds_bop_of_nation: "@KOR£GFX_lee_reds_route 구체제의 마지막 발악"
