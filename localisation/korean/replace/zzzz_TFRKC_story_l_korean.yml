l_korean:
 # TFRKC original fiction. Text-ready; new event and UI references await implementation.
 TFRKC_story_mod_intro: "THE FIRE RISE: KOREA CIVILWAR — TFRKC"
 TFRKC_story_mod_intro_desc: "양안전쟁 패전 이후, TFRKC의 이야기는 원본과 갈라집니다. 대만 함락과 경제 단절, 귀환장병·유가족·난민의 문제가 해결되지 않은 채 패전 1주년을 맞습니다. 전주의 탄핵 요구 시위와 폭동, 사망자 13명과 정부의 극형·감형, 전국적인 반발은 실패한 계엄으로 이어집니다. 탄핵소추로 대통령의 직무는 정지되지만 국가기관의 분열은 멈추지 않습니다. 실제 계엄 선포일로부터 달력 기준 한 달 뒤, 대한민국은 내전에 들어갑니다.\n\n이 작품은 게임 모드의 대체역사 창작입니다. 실존 인물과 실제 부대에 부여된 내전 배역은 현실의 행동이나 정치 성향을 뜻하지 않습니다."
 TFRKC_story_government_desc: "분할 이후 대한민국 주정부는 경상남도 잔여 지역을 기반으로 이주호 권한대행 아래 국가의 법적 연속성과 생존을 주장합니다.\n\n헌정수호연합과 함께 대한민국 블록에 속하지만, 정부의 이름으로 내린 결정이 현장에 도착하려면 실제 행정과 보급이 따라야 합니다. 남아 있는 기관을 보존하는 일과 그 기관이 다시 주민의 생활을 책임지게 하는 일 사이에 정부의 과제가 놓여 있습니다."
 TFRKC_story_constitutional_desc: "헌정수호연합은 화천·양구·고성·인제·속초·춘천을 기반으로 대한민국 블록에 참여합니다. 대한민국 주정부와의 협력은 헌정복원을 조건으로 하며, 특정 지도자에 대한 무조건적인 충성을 뜻하지 않습니다.\n\n군이 지켜야 할 원칙과 당장의 생존을 위한 거래가 충돌합니다. 전쟁에 이긴 뒤 지휘권을 내려놓을 수 있는지, 동맹이 조건을 미룰 때 무엇으로 책임을 물을 것인지가 연합의 약속을 시험합니다."
 TFRKC_story_yoonagain_desc: "자유민주주의방위국은 부산·김해·양산·밀양·청도·창녕·창원을 기반으로 윤어게인 블록을 이끕니다. ‘귀환’ 작전으로 구출된 윤석열의 직접 명령과 복권을 중심으로 결집하지만, 구출이 탄핵소추에 따른 대통령 직무정지를 끝내지는 않습니다.\n\n신라와 철강의 울산이 같은 블록에 속해도 복권 이후 원하는 질서까지 같지는 않습니다. 대통령의 명령에 충성한다는 말 뒤에는 지지 운동의 회복, 비상통치의 유지, 각 계파의 영향력을 지키려는 서로 다른 계산이 남습니다."
 TFRKC_story_supreme_council_desc: "계엄 이후 비밀리에 창설된 국가재건최고회의는 윤석열과 기존 정치권 모두의 무능을 비판하며 군의 질서와 국가 재건을 주장합니다. 충청북도 잔여 지역과 문경·예천·상주·영주·구미·김천을 기반으로 국군 블록을 이끕니다.\n\n가장 강한 국력을 가진 최고회의는 명령을 따르게 할 수 있습니다. 그러나 대한민국 공군과 같은 블록에 속한다는 사실만으로 모든 지휘와 책임이 하나가 되는 것은 아닙니다. 국가를 재건할 힘을 얻은 군이 언제, 누구에게 그 힘을 돌려줄지는 아직 답해야 할 질문입니다."
 TFRKC_story_youth_liberation_desc: "충청남도를 기반으로 한 청소년해방군은 대구 코뮌 블록에 참여합니다. 전투부대는 성인 대학생·청년노동자·귀환장병·예비역 등으로 구성되며, 청소년 당사자는 학생자치와 권리 요구의 주체입니다.\n\n‘우리가 겪었던 억압을 다음 세대에게 넘기지 않겠다.’ 이 약속은 동맹에도 내부 지휘부에도 적용되어야 합니다. 민간 대표의 반대가 전쟁을 방해한다는 이유로 무시되는 순간, 해방을 위해 만든 조직은 자신이 거부했던 통제를 되풀이하게 됩니다."
 TFRKC_story_workers_desc: "노동자평의회는 경기도 잔여 산업지대와 대구·칠곡·성주·고령·영천·경산을 기반으로 노동자 자치와 생산·생존을 주장합니다. 대구 코뮌 블록의 중심이지만, 이 이름이 별도의 국가를 뜻하지는 않습니다.\n\n공장을 다시 돌리는 일과 작업장의 결정권을 지키는 일이 언제나 같은 방향은 아닙니다. 청소년해방군과 협력하면서도 성인 군사조직의 지휘, 주민의 생활, 생산 현장의 목소리를 하나의 명령으로 묶을 수 있는지 시험받습니다."
 TFRKC_story_purification_desc: "민족정화전선은 배타적인 구원의 논리로 내부의 적을 만들어냅니다. 곤궁의 원인을 이웃의 이름으로 바꿔 적을 때마다 지지자들은 잠시 안도합니다. 그 명단에서 자기 이름이 영원히 제외된다는 보장은 없습니다."
 TFRKC_story_navy_desc: "해군은 내전에 가담하지 않고 섬과 피난민을 보호합니다. 별도의 지휘는 내전 동안 보호 임무를 유지하기 위한 것입니다. 통일된 국가가 확립되면 함대와 관할 섬은 그 국가에 통합됩니다."
 TFRKC_story_intervention_desc: "대한인민해방군의 공동지휘 아래에서도 중국·북한·남측 협력세력의 전후 목표는 다릅니다. 같은 전선에서 싸우는 동안 미룬 권력의 문제는 승리 뒤에 돌아옵니다. 도움을 받는 사람과 명령을 내리는 사람이 같은 나라를 기대하는지는 아직 알 수 없습니다."
 TFRKC_story_lee_ju_ho_desc: "이 대체역사의 이주호는 개전 당시 대통령 권한대행으로 정부를 대표합니다. 대통령의 직무정지 이후에도 국가의 업무가 이어져야 한다는 법적 책임을 맡았습니다. 그가 서명한 구호와 복구 지시가 현장에서 효력을 가지는지 확인하는 일은, 지시를 작성하는 일보다 어려워졌습니다."
 TFRKC_story_yoon_suk_yeol_desc: "이 대체역사의 윤석열은 실패한 계엄 이후 탄핵소추로 대통령 직무가 정지된 상태입니다. ‘귀환’ 작전으로 구출된 뒤에는 윤어게인을 직접 지휘합니다. 지지자들의 충성이 법적 복직을 이루어 주지는 않지만, 그의 명령은 그 조직 안에서 실질적인 힘을 갖습니다."
 TFRKC_story_nam_young_sin_desc: "이 대체역사의 남영신은 국가재건최고회의를 중심으로 군의 질서와 국가 재건을 주장합니다. 윤석열과 기존 정치권을 함께 배제하려는 구상은 무너진 국가를 다시 세운다는 명분을 내세웁니다. 명령이 돌아오는 나라에서 그 명령을 거부할 권리도 돌아올지는 아직 답하지 않았습니다."

 # 7. 부산 비상통치 선언 — event connection pending
 TFRKC_story_busan_emergency_rule.t: "부산의 비상통치 선언"
 TFRKC_story_busan_emergency_rule.d: "윤어게인이 부산에서 비상통치를 선언했습니다. 성명은 윤석열의 명령을 조직의 최고 지시로 삼고, 그를 복권하기 위한 통치를 실시한다고 밝혔습니다. 계엄 실패와 탄핵소추를 인정할 수 없다는 주장이 선언의 근거로 제시되었습니다.\n\n정부는 이 선언에 법적 효력이 없으며 윤석열의 대통령 직무정지도 계속된다고 발표했습니다. 그러나 부산에서 현장의 지시를 내리는 사람들은 서울의 해석을 기다리지 않습니다. 관청에 내려오는 요구와 무장조직이 요구하는 협조가 갈라지고 있습니다.\n\n윤어게인의 각 계파는 같은 선언에 서명했습니다. 선언이 끝난 뒤 되찾을 것이 대통령의 자리인지, 자신들의 영향력인지에 대해서는 따로 말하지 않았습니다."
 TFRKC_story_busan_emergency_rule.a: "서로 다른 정부의 명령이 도착한다."
 TFRKC_story_busan_emergency_rule.tt: "부산의 비상통치는 윤어게인의 일방적인 선언입니다. 윤석열이 적법하게 대통령 직무에 복귀한 것은 아닙니다."

 # 9. 계엄 한 달 뒤 대한민국 내전 — event connection pending
 TFRKC_story_civilwar_news.t: "대한민국 내전 발발"
 TFRKC_story_civilwar_news.d: "대한민국에서 전면적인 내전이 발생했습니다. 계엄이 선포된 날로부터 달력 기준 한 달이 지난 가운데, 정부의 무장해제 요구를 거부한 조직들과 갈라진 국가기관 사이에서 교전이 확산되었습니다.\n\n이주호 권한대행 정부는 법적 연속성과 국가 생존을 주장하지만 실제 통제력은 각 진영 가운데 가장 약합니다. 헌정수호연합은 정부와 동맹을 맺으면서 헌정복원을 협력의 조건으로 내세웁니다. 윤석열의 직접 명령을 받는 윤어게인, 군의 질서로 재건을 주장하는 국가재건최고회의, 청소년해방군과 노동자평의회도 독자 지휘를 유지하고 있습니다. 민족정화전선은 내부의 적을 제거해야 한다는 구호로 세력을 확대하고 있습니다.\n\n대만 함락과 패전 이후 누적된 위기는 이제 국내의 전쟁으로 이어졌습니다. 해군은 내전 불참과 섬·피난민 보호를 선언했습니다."
 TFRKC_story_civilwar_news.a: "한 나라 안에서 전선이 갈라졌다."
 TFRKC_story_civilwar_news.tt: "내전 기준일은 실제 계엄 선포일에서 달력 기준 한 달 뒤입니다. 예: 1월 2일 선포 시 2월 2일. 고정 개전일이나 30일 경과로 대체하지 않습니다."

 # 10. 해군 중립 선언 — event connection pending
 TFRKC_story_naval_neutrality.t: "함대의 임무"
 TFRKC_story_naval_neutrality.d: "해군 지휘부는 내전에 가담하지 않고 섬과 피난민을 보호하겠다고 발표했습니다. 어느 진영의 승리를 위해서도 함대를 투입하지 않으며, 내전이 끝나 하나의 국가가 확립되면 그 국가의 지휘 아래 통합한다는 방침입니다.\n\n부두에서는 병력 명부 옆에 피난민 명부가 놓였습니다. 담당자는 승선 인원을 세고, 남겨진 짐을 다시 내려 달라고 부탁합니다. 짐을 줄이면 한 사람이 더 탈 수 있지만, 어떤 사람에게는 그 짐이 남은 집의 전부입니다.\n\n중립 선언은 바다에서 내려야 할 결정을 없애 주지 않았습니다. 다만 누구에게 총을 쏠 것인지 대신 누구를 먼저 배에 태울 것인지가 당장의 질문이 되었습니다."
 TFRKC_story_naval_neutrality.a: "승선 인원을 다시 확인한다."
 TFRKC_story_naval_neutrality.tt: "해군은 내전에 불참합니다. 최종 통일 시 함대와 관할 섬이 통일된 국가에 통합됩니다."

 # 11. 노동자평의회의 외부 지원 논쟁 — event connection pending
 TFRKC_story_workers_foreign_aid.t: "누가 상자를 여는가"
 TFRKC_story_workers_foreign_aid.d: "평의회 안에서 이어지던 외부 지원 논쟁이 공개적인 쟁점이 되었습니다. 원료와 식량, 의약품이 부족한 작업장에서는 국경 밖에서 오는 지원이라도 받아야 한다는 주장이 나옵니다. 자치는 살아남은 사람들이 해야 한다는 말입니다.\n\n반대편에서는 군사 지원을 받는 순간 생산과 통치를 스스로 결정할 권한까지 협상에 오를 수 있다고 경고합니다. 중국과 북한이 같은 목적으로 움직이는 것도 아니고, 남측 협력세력이 평의회의 결정을 대신할 권한도 없다는 지적입니다.\n\n그러나 전선의 위기 속에서 지원 요청은 이미 외부 지도부의 검토에 넘어갔습니다. 남은 논쟁은 요청을 없던 일로 만드는 표결이 아니라, 지원이 도착한다면 누가 조건을 정하고 누가 그 대가를 감당할지에 관한 것입니다."
 TFRKC_story_workers_foreign_aid.a: "지원의 조건에 관한 논쟁을 계속한다."
 TFRKC_story_workers_foreign_aid.tt: "지원 요청은 기존 숨김 사건의 조건에 따라 이루어집니다. 이 원고의 선택지는 요청을 취소하거나 개입을 확정하지 않습니다."
