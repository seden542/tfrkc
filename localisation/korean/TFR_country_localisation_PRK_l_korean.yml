 nk.1.t: "수술로 인한 김정은의 입원"
 nk.1.d: "금일 이른 아침 경애하는 수령 동지께서 병원에 입원하셨습니다."
 nk.1.a: "수령 동지를 위해 기도하자."
 nk.2.t: "경애하는 수령 동지께서 서거하시였다!"
 nk.2.d: "정말 참담한 날입니다! 우리의 경애하는 수령 동지께서는 수술 후에 세상을 떠나셨습니다! 여러 외과의사가 최선을 다했으나 끝내 심장 박동을 되살리지 못했습니다. 열흘간의 애도 기간이 선포되었고 곧 끔찍한 소식이 전국에 방송될 것입니다."
 nk.2.a: "누가 통치를 맡을 것인가?"
 nk.3.t: "최룡해가 권력을 잡다"
 nk.3.d: "최룡해는 로동당이 긴급회의를 준비하기도 전에 권력을 사실상 장악했습니다. 그는 예측할 수 없는 권력 찬탈을 막으려면 비상 권력이 필요하다고 주장하며, 진정한 후계자를 찾을 때까지 이 어려운 시기에 인민을 충실히 이끌겠다고 밝히고 있습니다."
 nk.3.a: "믿을 수 없는 이야기다..."
 nk.4.t: "내각 시위"
 nk.4.d: "최룡해가 갑작스럽게 집권을 선언하자 로동당은 긴급회의를 소집했고, 내각의 많은 이들이 최룡해의 지도력에 불만을 표출했습니다. 그들은 최룡해가 무혈 쿠데타를 일으켰으며, 전권을 장악하기 위해 군과 손잡고 또 다른 조치를 준비하고 있다고 주장했습니다. 나머지 로동당원들은 누가 권력을 잡아야 할지 결정하지 못했습니다. 여러 정치인의 이름이 거론되었지만, 그때마다 실현 가능성을 둘러싼 반론이 뒤따랐습니다."
 nk.4.a: ""
 nk.5.t: "혼란에 빠진 내각"
 nk.5.d: "초기"
 nk.5.a: "동지를 위하여 기도하자."
 nk.6.t: "장성들의 우려 섞인 목소리"
 nk.6.d: "초기"
 nk.6.a: "그들은 자신의 위치를 알아야 한다."
