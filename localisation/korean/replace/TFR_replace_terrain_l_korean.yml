 san_francisco: "샌프란시스코"
 san_francisco_desc: "----\n§9샌프란시스코와 인근 실리콘밸리 지역은 1990년대부터 미국의 기술 수도로 알려져 왔으며, 구글, 페이스북, 애플, 트위터와 같은 많은 \"빅 테크\" 기업들이 모두 이 지역에 자리 잡고 있습니다. 이 도시는 80만 명이 넘는 주민이 거주하는 서해안에서 가장 큰 도시 중 하나이며, 문화적 다양성과 진보적인 정치 성향으로 잘 알려져 있습니다.§!"
