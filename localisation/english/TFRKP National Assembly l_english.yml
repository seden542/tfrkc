 KOR_national_assembly_new_category_desc: "\n\n\n\n\n£GFX_KOR_national_assembly_new_category_decision\n\n\n\n\n\n\n\n§YNational Assembly of the Republic of Korea§! is the country's highest and sole legislative body. It operates under a unicameral system and is responsible for enacting and amending laws, reviewing the national budget, ratifying treaties, and overseeing and checking the government.\n\nAs a central pillar of the state, the National Assembly checks the executive and judicial branches through powers such as questioning, hearings, and impeachment. Its decisions directly affect national policy, national defense and security, and the lives of the people.\n\nWe must pass key legislation to lay the foundations for the 'Post-American Era' and ensure national stability, independence, and sustainable development amid an unstable international order.\n\n---- §YParties in the National Assembly§! ---- \n[GetNamePPPLoc]\n[GetNameDPLoc]\n[GetNamePPLoc]"
