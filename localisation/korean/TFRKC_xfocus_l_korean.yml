l_korean:
 TFRKC_xfocus_GWANGJU_tree:0 "광주시민방위정부 중점"
 TFRKC_xfocus_GWANGJU_campaign_tt:0 "전시 방위 효과는 실제 내전 참가 중에만 적용됩니다. 전쟁이 끝난 뒤에도 훈련과 행정 준비는 진행할 수 있습니다."
 TFRKC_xfocus_GWANGJU_district_mandates_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_GWANGJU_joint_front_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_GWANGJU_start:0 "시청의 불을 켜다"
 TFRKC_xfocus_GWANGJU_start_desc:0 "독재에 맞선 시민과 행정기관이 같은 청사로 들어옵니다. 서로 다른 정당보다 오늘의 민원을 먼저 받습니다."
 TFRKC_xfocus_GWANGJU_civic_1:0 "골목의 대표들"
 TFRKC_xfocus_GWANGJU_civic_1_desc:0 "배급소와 병원에 지역 대표의 연락처를 남깁니다. 방위정부가 누구를 대표하는지 작은 명부부터 적습니다."
 TFRKC_xfocus_GWANGJU_civic_2:0 "서명받는 행정"
 TFRKC_xfocus_GWANGJU_civic_2_desc:0 "행정의 효율만큼 주민의 동의를 중요한 비용으로 인정합니다."
 TFRKC_xfocus_GWANGJU_civic_3:0 "광주 밖의 목소리"
 TFRKC_xfocus_GWANGJU_civic_3_desc:0 "다른 지역의 지지는 승전보만으로 생기지 않습니다. 협의할 대표와 설명할 계획을 준비합니다."
 TFRKC_xfocus_GWANGJU_military_1:0 "시민군의 구역표"
 TFRKC_xfocus_GWANGJU_military_1_desc:0 "성인 방위대의 담당 구역과 민간 대피 구역을 구분합니다."
 TFRKC_xfocus_GWANGJU_military_2:0 "방어의 공통 언어"
 TFRKC_xfocus_GWANGJU_military_2_desc:0 "서로 다른 성인 방위조직이 같은 보고 양식을 쓰게 합니다. 전시 효과는 실제 내전 참가 중에만 적용됩니다."
 TFRKC_xfocus_GWANGJU_military_3:0 "골목을 넘어서는 훈련"
 TFRKC_xfocus_GWANGJU_military_3_desc:0 "도시 밖 작전을 위한 연락과 보급 절차를 연습합니다. 주민의 지지를 대신 만들어 내지는 않습니다."
 TFRKC_xfocus_GWANGJU_system_1:0 "도시 간의 연락실"
 TFRKC_xfocus_GWANGJU_system_1_desc:0 "광주와 전주의 연락 창구를 분리해 유지합니다. 공동의 적이 있다고 같은 재판을 승인하는 것은 아닙니다."
 TFRKC_xfocus_GWANGJU_system_2:0 "재판 기록의 공개"
 TFRKC_xfocus_GWANGJU_system_2_desc:0 "처벌 요구와 피고인의 권리를 같은 기록에 남깁니다. 혁명이라는 말로 민간인의 권리를 지우지 않습니다."
 TFRKC_xfocus_GWANGJU_system_3:0 "위임장을 들고 가다"
 TFRKC_xfocus_GWANGJU_system_3_desc:0 "다른 지역과 협의할 대표의 권한을 명확히 합니다. 영토 이전은 실제 합의와 전쟁 처리에 따릅니다."
 TFRKC_xfocus_GWANGJU_council:0 "시민의 정부인가"
 TFRKC_xfocus_GWANGJU_council_desc:0 "전쟁이 길어질수록 위임받은 권한과 직접 장악한 권한 사이의 거리가 벌어집니다."
 TFRKC_xfocus_GWANGJU_route_a:0 "지역이 고르는 공화국"
 TFRKC_xfocus_GWANGJU_route_a_desc:0 "지방분권을 국가의 원칙으로 삼습니다. 다른 도시가 우리와 다른 결정을 할 권리도 인정합니다."
 TFRKC_xfocus_GWANGJU_route_b:0 "먼저 결정하는 비상정부"
 TFRKC_xfocus_GWANGJU_route_b_desc:0 "군사적 위기를 이유로 결정권을 집중합니다. 빨라진 명령은 주민의 불신도 함께 낳습니다."
 TFRKC_xfocus_GWANGJU_route_a_2:0 "서로 다른 조례"
 TFRKC_xfocus_GWANGJU_route_a_2_desc:0 "각 지역의 조례를 협의하고 공통으로 지킬 권리를 남깁니다."
 TFRKC_xfocus_GWANGJU_route_b_2:0 "지연 없는 결재선"
 TFRKC_xfocus_GWANGJU_route_b_2_desc:0 "비상 예산과 작전 보고의 결재를 정리합니다. 긴급 절차의 정치적 비용도 정부가 부담합니다."
 TFRKC_xfocus_GWANGJU_route_a_3:0 "거부할 수 있는 연방"
 TFRKC_xfocus_GWANGJU_route_a_3_desc:0 "연방의 협정문에 탈퇴와 이의 제기의 절차를 적습니다. 군대를 움직이는 명령은 별도의 합의를 요구합니다."
 TFRKC_xfocus_GWANGJU_route_b_3:0 "비상의 종료 조건"
 TFRKC_xfocus_GWANGJU_route_b_3_desc:0 "비상권한을 유지하는 정부에도 성과를 보고할 의무를 남깁니다."
 TFRKC_xfocus_GWANGJU_settlement:0 "살아 있는 위임장"
 TFRKC_xfocus_GWANGJU_settlement_desc:0 "전쟁과 평화 어느 쪽에서도 시민에게 답해야 하는 행정의 초안을 보존합니다."
 TFRKC_xfocus_JEONJU_tree:0 "전주국민혁명위원회 중점"
 TFRKC_xfocus_JEONJU_campaign_tt:0 "전시 방위 효과는 실제 내전 참가 중에만 적용됩니다. 전쟁이 끝난 뒤에도 훈련과 행정 준비는 진행할 수 있습니다."
 TFRKC_xfocus_JEONJU_uprising_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_JEONJU_tribunal_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_JEONJU_start:0 "열세 이름의 도시"
 TFRKC_xfocus_JEONJU_start_desc:0 "전주 사건에서 숨진 열세 명의 이름을 다시 읽습니다. 책임을 묻는 일과 권력을 갖는 일은 이제 다른 질문이 됩니다."
 TFRKC_xfocus_JEONJU_civic_1:0 "유가족의 기록함"
 TFRKC_xfocus_JEONJU_civic_1_desc:0 "서로 엇갈린 증언과 남겨진 일상을 모읍니다. 명단을 구호로 바꾸기 전에 사람으로 기억합니다."
 TFRKC_xfocus_JEONJU_civic_2:0 "사라지지 않는 증언"
 TFRKC_xfocus_JEONJU_civic_2_desc:0 "지역 위원회가 기록과 생활 지원을 함께 맡습니다."
 TFRKC_xfocus_JEONJU_civic_3:0 "새로운 일상의 청구서"
 TFRKC_xfocus_JEONJU_civic_3_desc:0 "국가 해체를 외쳐도 수도와 병원은 누군가 운영해야 합니다. 생활 행정을 혁명위원회에 연결합니다."
 TFRKC_xfocus_JEONJU_military_1:0 "성인 의용대의 연락"
 TFRKC_xfocus_JEONJU_military_1_desc:0 "석방된 성인 수감자와 귀환장병 등 지원자의 담당과 책임을 구분합니다."
 TFRKC_xfocus_JEONJU_military_2:0 "구호 다음의 명령"
 TFRKC_xfocus_JEONJU_military_2_desc:0 "서로 다른 혁명조직이 공통 연락조를 운영합니다. 전시 효과는 실제 내전 참가 중에만 적용됩니다."
 TFRKC_xfocus_JEONJU_military_3:0 "후퇴도 보고하라"
 TFRKC_xfocus_JEONJU_military_3_desc:0 "패배를 배신으로만 기록하면 아무도 사실을 말하지 않습니다. 후퇴와 재집결을 훈련합니다."
 TFRKC_xfocus_JEONJU_system_1:0 "이웃 도시의 동지"
 TFRKC_xfocus_JEONJU_system_1_desc:0 "광주와 협의할 대표를 보냅니다. 독재 반대라는 공통점이 모든 방법을 정당화하지는 않습니다."
 TFRKC_xfocus_JEONJU_system_2:0 "재판의 방청석"
 TFRKC_xfocus_JEONJU_system_2_desc:0 "혁명재판을 누가 지켜보고 누가 이의를 제기할지 정리합니다."
 TFRKC_xfocus_JEONJU_system_3:0 "봉기에도 도착지가 있다"
 TFRKC_xfocus_JEONJU_system_3_desc:0 "지역 조직에 실제 연락 가능한 경로와 비용을 확인합니다. 선언만으로 다른 도시를 차지할 수는 없습니다."
 TFRKC_xfocus_JEONJU_council:0 "혁명의 끝을 묻다"
 TFRKC_xfocus_JEONJU_council_desc:0 "승리 뒤에도 혁명이 계속되어야 하는지, 시민에게 권력을 돌려줘야 하는지 결정합니다."
 TFRKC_xfocus_JEONJU_route_a:0 "투표함으로 가는 혁명"
 TFRKC_xfocus_JEONJU_route_a_desc:0 "민주적 절차를 혁명의 결말로 정합니다. 분노가 사라지지 않아도 권력의 종료를 약속합니다."
 TFRKC_xfocus_JEONJU_route_b:0 "끝나지 않는 심판"
 TFRKC_xfocus_JEONJU_route_b_desc:0 "위원회는 반대 의견을 또 다른 반혁명으로 부릅니다. §R다음 피고인의 이름은 아직 비어 있습니다.§!"
 TFRKC_xfocus_JEONJU_route_a_2:0 "검찰보다 먼저 피고인"
 TFRKC_xfocus_JEONJU_route_a_2_desc:0 "독립적인 변론과 공개 기록을 보장해 혁명권력에도 책임을 묻습니다."
 TFRKC_xfocus_JEONJU_route_b_2:0 "비어 있지 않은 감방"
 TFRKC_xfocus_JEONJU_route_b_2_desc:0 "숙청의 범위를 넓힙니다. 두려움으로 높인 전투 의지가 지역의 신뢰를 깎습니다."
 TFRKC_xfocus_JEONJU_route_a_3:0 "끝낼 수 있는 위원회"
 TFRKC_xfocus_JEONJU_route_a_3_desc:0 "비상위원회의 권한 이양 초안을 만듭니다. 혁명은 시민이 다시 선택할 수 있을 때 끝날 수 있습니다."
 TFRKC_xfocus_JEONJU_route_b_3:0 "항상 다음의 적"
 TFRKC_xfocus_JEONJU_route_b_3_desc:0 "영구혁명의 선전과 조직 보고를 정리합니다. 외교적 고립과 협상의 어려움을 감수합니다."
 TFRKC_xfocus_JEONJU_settlement:0 "기억과 권력 사이"
 TFRKC_xfocus_JEONJU_settlement_desc:0 "희생자의 기억을 다음 국가가 어떻게 다룰지 원칙을 남깁니다. 통일과 처벌을 선언하는 명령은 아닙니다."
 TFRKC_xfocus_CORPORATE_tree:0 "한국기업안보연합 중점"
 TFRKC_xfocus_CORPORATE_campaign_tt:0 "전시 방위 효과는 실제 내전 참가 중에만 적용됩니다. 전쟁이 끝난 뒤에도 훈련과 행정 준비는 진행할 수 있습니다."
 TFRKC_xfocus_CORPORATE_procurement_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_CORPORATE_shareholders_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_CORPORATE_start:0 "비상 이사회 소집"
 TFRKC_xfocus_CORPORATE_start_desc:0 "생산을 복구하겠다는 기업들이 경비대와 함께 모입니다. 첫 안건은 국가보다 긴급 결제입니다."
 TFRKC_xfocus_CORPORATE_civic_1:0 "지급일을 지키다"
 TFRKC_xfocus_CORPORATE_civic_1_desc:0 "임금과 납품 대금의 지급 순서를 정리합니다. 노동자를 채권자의 맨 뒤에 세우면 공장은 열리지 않습니다."
 TFRKC_xfocus_CORPORATE_civic_2:0 "공동 정산실"
 TFRKC_xfocus_CORPORATE_civic_2_desc:0 "서로 다른 회계와 계약을 맞춰 거래의 일부를 회복합니다."
 TFRKC_xfocus_CORPORATE_civic_3:0 "공장 밖의 생활비"
 TFRKC_xfocus_CORPORATE_civic_3_desc:0 "기숙사와 진료소의 비용도 생산 유지의 일부로 인정합니다."
 TFRKC_xfocus_CORPORATE_military_1:0 "경비대의 호출부호"
 TFRKC_xfocus_CORPORATE_military_1_desc:0 "기업별 경비조직의 지휘와 통신을 조사합니다."
 TFRKC_xfocus_CORPORATE_military_2:0 "계약된 지휘권"
 TFRKC_xfocus_CORPORATE_military_2_desc:0 "같은 전선에 선 사병들이 어느 명령을 우선할지 정합니다. 전시 효과는 실제 내전 참가 중에만 적용됩니다."
 TFRKC_xfocus_CORPORATE_military_3:0 "하청에 맡길 수 없는 것"
 TFRKC_xfocus_CORPORATE_military_3_desc:0 "후퇴와 민간 보호의 책임은 계약서 바깥으로 넘길 수 없습니다."
 TFRKC_xfocus_CORPORATE_system_1:0 "구매부의 전황판"
 TFRKC_xfocus_CORPORATE_system_1_desc:0 "가격표와 납기를 실제 군수 수요에 맞춥니다. 자금이 있다고 물자가 즉시 생기지는 않습니다."
 TFRKC_xfocus_CORPORATE_system_2:0 "돈이 도착하는 길"
 TFRKC_xfocus_CORPORATE_system_2_desc:0 "공급자의 생존과 재고, 운송 경로를 확인하는 구매 규정을 마련합니다."
 TFRKC_xfocus_CORPORATE_system_3:0 "사병의 주인은 누구인가"
 TFRKC_xfocus_CORPORATE_system_3_desc:0 "계열사 간 지휘권 충돌을 중재할 절차를 적습니다."
 TFRKC_xfocus_CORPORATE_council:0 "국가의 주주총회"
 TFRKC_xfocus_CORPORATE_council_desc:0 "기업 간 협약을 지킬지 한 기업에 권력을 몰아줄지 결정합니다."
 TFRKC_xfocus_CORPORATE_route_a:0 "서로의 계약서"
 TFRKC_xfocus_CORPORATE_route_a_desc:0 "복수 기업의 공동 의결과 상호보증을 국가 운영의 원칙으로 삼습니다."
 TFRKC_xfocus_CORPORATE_route_b:0 "단 하나의 직인"
 TFRKC_xfocus_CORPORATE_route_b_desc:0 "한 기업이 국가의 최종 결재권을 장악합니다. 경쟁이 사라진 자리에 불신이 남습니다."
 TFRKC_xfocus_CORPORATE_route_a_2:0 "분쟁조정 창구"
 TFRKC_xfocus_CORPORATE_route_a_2_desc:0 "거래 중단이 곧 전선 붕괴가 되지 않도록 공동 중재를 받습니다."
 TFRKC_xfocus_CORPORATE_route_b_2:0 "모든 도로가 본사로"
 TFRKC_xfocus_CORPORATE_route_b_2_desc:0 "납품과 행정의 결정을 본사에 집중합니다. 지역의 발언권은 줄어듭니다."
 TFRKC_xfocus_CORPORATE_route_a_3:0 "협약이 보장하는 퇴장"
 TFRKC_xfocus_CORPORATE_route_a_3_desc:0 "협약에 탈퇴·정산·노동 분쟁의 절차를 남깁니다."
 TFRKC_xfocus_CORPORATE_route_b_3:0 "사표 없는 경영진"
 TFRKC_xfocus_CORPORATE_route_b_3_desc:0 "단일 기업의 통치를 장기 운영 체계로 정리합니다. 책임을 지는 사람과 권력을 가진 사람이 다시 갈라집니다."
 TFRKC_xfocus_CORPORATE_settlement:0 "전후의 결산서"
 TFRKC_xfocus_CORPORATE_settlement_desc:0 "이번 전쟁의 비용을 다음 국가에 어떻게 넘길지 기록합니다. 새 공장이나 무료 계약군을 지급하는 결산은 아닙니다."
 TFRKC_xfocus_CONTINUITY_tree:0 "국가존속위원회 중점"
 TFRKC_xfocus_CONTINUITY_campaign_tt:0 "전시 방위 효과는 실제 내전 참가 중에만 적용됩니다. 전쟁이 끝난 뒤에도 훈련과 행정 준비는 진행할 수 있습니다."
 TFRKC_xfocus_CONTINUITY_seoul_support_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_CONTINUITY_succession_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_CONTINUITY_start:0 "정부가 없어도 서류는"
 TFRKC_xfocus_CONTINUITY_start_desc:0 "청사와 기록기관의 잔류 인원이 행정의 존속을 선언합니다. 종이의 연속성이 국가의 연속성을 보장하는지는 아직 모릅니다."
 TFRKC_xfocus_CONTINUITY_civic_1:0 "남아 있는 공무원"
 TFRKC_xfocus_CONTINUITY_civic_1_desc:0 "출근 가능한 인원과 주민 서비스 창구를 확인합니다."
 TFRKC_xfocus_CONTINUITY_civic_2:0 "기록의 두 번째 집"
 TFRKC_xfocus_CONTINUITY_civic_2_desc:0 "기록과 통신을 이중 보관해 청사를 잃어도 업무를 이어 갈 준비를 합니다."
 TFRKC_xfocus_CONTINUITY_civic_3:0 "어제의 민원 번호"
 TFRKC_xfocus_CONTINUITY_civic_3_desc:0 "전쟁 전 접수된 민원을 새 조직의 번호로만 지우지 않습니다."
 TFRKC_xfocus_CONTINUITY_military_1:0 "청사 방호병력 점검"
 TFRKC_xfocus_CONTINUITY_military_1_desc:0 "각 청사와 송신시설을 지키는 부대의 연락을 확인합니다."
 TFRKC_xfocus_CONTINUITY_military_2:0 "문서를 지키는 전선"
 TFRKC_xfocus_CONTINUITY_military_2_desc:0 "분산된 방호병력의 보고와 보급을 조정합니다. 전시 효과는 실제 내전 참가 중에만 적용됩니다."
 TFRKC_xfocus_CONTINUITY_military_3:0 "통신실의 야간근무"
 TFRKC_xfocus_CONTINUITY_military_3_desc:0 "교신 단절과 후퇴 상황에서도 기록을 넘길 절차를 훈련합니다."
 TFRKC_xfocus_CONTINUITY_system_1:0 "서울로 보내는 전문"
 TFRKC_xfocus_CONTINUITY_system_1_desc:0 "서울 정부의 상태를 확인하며 지원 협의 자료를 준비합니다."
 TFRKC_xfocus_CONTINUITY_system_2:0 "지원도 결재가 필요하다"
 TFRKC_xfocus_CONTINUITY_system_2_desc:0 "지원 요청과 실제 비용을 함께 기록합니다. 정부가 사라졌다면 다른 국가를 되살리지 않습니다."
 TFRKC_xfocus_CONTINUITY_system_3:0 "관료의 소속을 묻다"
 TFRKC_xfocus_CONTINUITY_system_3_desc:0 "다른 세력의 관료와 장교를 받을 조건을 검토합니다. 서류만으로 인물과 부대를 이전하지는 않습니다."
 TFRKC_xfocus_CONTINUITY_council:0 "직인은 누구의 것인가"
 TFRKC_xfocus_CONTINUITY_council_desc:0 "서울의 정부를 돕는 행정인지 새 국가를 자처할 행정인지 정합니다."
 TFRKC_xfocus_CONTINUITY_route_a:0 "서울이 답할 때까지"
 TFRKC_xfocus_CONTINUITY_route_a_desc:0 "서울 정부를 지원하는 노선을 선택합니다. 상대의 생존과 동의가 필요한 실제 협력은 별도로 협의합니다."
 TFRKC_xfocus_CONTINUITY_route_b:0 "우리가 국가를 잇는다"
 TFRKC_xfocus_CONTINUITY_route_b_desc:0 "정통성 승계를 주장합니다. 주장만으로 서울이나 다른 행정기관이 넘어오지는 않습니다."
 TFRKC_xfocus_CONTINUITY_route_a_2:0 "권한보다 먼저 책임"
 TFRKC_xfocus_CONTINUITY_route_a_2_desc:0 "지원한 물자의 사용과 주민 서비스를 공개합니다."
 TFRKC_xfocus_CONTINUITY_route_b_2:0 "국가의 이름을 고치다"
 TFRKC_xfocus_CONTINUITY_route_b_2_desc:0 "승계 주장에 필요한 행정 근거와 반론을 정리합니다."
 TFRKC_xfocus_CONTINUITY_route_a_3:0 "같은 헌법의 사본"
 TFRKC_xfocus_CONTINUITY_route_a_3_desc:0 "정부와 협력할 수 있는 행정 약정을 준비합니다. 자동 통합 명령은 넣지 않습니다."
 TFRKC_xfocus_CONTINUITY_route_b_3:0 "승계에도 동의가 필요하다"
 TFRKC_xfocus_CONTINUITY_route_b_3_desc:0 "기록을 가진 권력과 주민을 대표하는 권력이 같지 않다는 반론에 답해야 합니다."
 TFRKC_xfocus_CONTINUITY_settlement:0 "폐기하지 않을 기록"
 TFRKC_xfocus_CONTINUITY_settlement_desc:0 "선택한 노선과 남은 민원을 전후 행정 계획에 보관합니다."
 TFRKC_xfocus_TAEBAEK_tree:0 "태백산군사평의회 중점"
 TFRKC_xfocus_TAEBAEK_campaign_tt:0 "전시 방위 효과는 실제 내전 참가 중에만 적용됩니다. 전쟁이 끝난 뒤에도 훈련과 행정 준비는 진행할 수 있습니다."
 TFRKC_xfocus_TAEBAEK_isolated_units_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_TAEBAEK_constitutional_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_TAEBAEK_start:0 "산 너머의 호출"
 TFRKC_xfocus_TAEBAEK_start_desc:0 "고립된 부대와 성인 예비역이 서로의 위치를 확인합니다. 같은 군 출신이라는 사실만으로 같은 명령을 따르지는 않습니다."
 TFRKC_xfocus_TAEBAEK_civic_1:0 "골짜기의 연락초소"
 TFRKC_xfocus_TAEBAEK_civic_1_desc:0 "흩어진 마을과 초소의 연락 시간을 정합니다."
 TFRKC_xfocus_TAEBAEK_civic_2:0 "끊긴 도로의 장부"
 TFRKC_xfocus_TAEBAEK_civic_2_desc:0 "보급 담당자가 실제 통과 가능한 길을 보고하도록 합니다."
 TFRKC_xfocus_TAEBAEK_civic_3:0 "군정청의 민원 시간"
 TFRKC_xfocus_TAEBAEK_civic_3_desc:0 "산악의 질서도 주민의 겨울과 진료를 책임져야 합니다."
 TFRKC_xfocus_TAEBAEK_military_1:0 "능선을 읽는 장교들"
 TFRKC_xfocus_TAEBAEK_military_1_desc:0 "지역 지형과 방어 구역을 부대 사이에 공유합니다."
 TFRKC_xfocus_TAEBAEK_military_2:0 "자리를 지키는 훈련"
 TFRKC_xfocus_TAEBAEK_military_2_desc:0 "방어 진지와 교대 순서를 정비합니다. 전시 효과는 실제 내전 참가 중에만 적용됩니다."
 TFRKC_xfocus_TAEBAEK_military_3:0 "노획품의 출처"
 TFRKC_xfocus_TAEBAEK_military_3_desc:0 "확보한 장비의 정비와 보급 경험을 공유합니다. 실제 노획품 이상을 새로 만들지는 않습니다."
 TFRKC_xfocus_TAEBAEK_system_1:0 "응답 없는 부대"
 TFRKC_xfocus_TAEBAEK_system_1_desc:0 "고립 부대를 확인할 연락 창구를 마련합니다."
 TFRKC_xfocus_TAEBAEK_system_2:0 "돌아오는 명령서"
 TFRKC_xfocus_TAEBAEK_system_2_desc:0 "합류를 원하는 부대의 실제 소속과 지휘 책임을 확인합니다."
 TFRKC_xfocus_TAEBAEK_system_3:0 "같은 헌법의 무전"
 TFRKC_xfocus_TAEBAEK_system_3_desc:0 "헌정수호연합과 대화할 협상안을 준비합니다. 상대가 사라져도 우리 내부의 절차는 남습니다."
 TFRKC_xfocus_TAEBAEK_council:0 "장교회의의 표결"
 TFRKC_xfocus_TAEBAEK_council_desc:0 "헌정 세력과 협력할지 군의 독자적 국가를 만들지 장교회의에서 결정합니다."
 TFRKC_xfocus_TAEBAEK_route_a:0 "헌정의 편에 서다"
 TFRKC_xfocus_TAEBAEK_route_a_desc:0 "헌정세력과 합류를 협의하는 노선을 택합니다. 실제 가입과 통합은 상대와의 합의를 따릅니다."
 TFRKC_xfocus_TAEBAEK_route_b:0 "산에서 세우는 국가"
 TFRKC_xfocus_TAEBAEK_route_b_desc:0 "독자 군사국가를 선언할 행정 원칙을 정합니다. 선언이 다른 영토를 가져오지는 않습니다."
 TFRKC_xfocus_TAEBAEK_route_a_2:0 "민간 앞의 작전 보고"
 TFRKC_xfocus_TAEBAEK_route_a_2_desc:0 "군사적 판단이 주민에게 미치는 영향을 공개합니다."
 TFRKC_xfocus_TAEBAEK_route_b_2:0 "명령의 관할구역"
 TFRKC_xfocus_TAEBAEK_route_b_2_desc:0 "군이 직접 운영하는 행정의 책임과 보고를 통일합니다."
 TFRKC_xfocus_TAEBAEK_route_a_3:0 "합류 뒤에도 지킬 것"
 TFRKC_xfocus_TAEBAEK_route_a_3_desc:0 "헌정 협력의 조건에 지역의 생계와 군의 책임을 적습니다."
 TFRKC_xfocus_TAEBAEK_route_b_3:0 "군복을 벗지 않는 권력"
 TFRKC_xfocus_TAEBAEK_route_b_3_desc:0 "장기 군정의 운영안을 만듭니다. 민간 정치의 빈자리를 병력으로만 채울 수는 없습니다."
 TFRKC_xfocus_TAEBAEK_settlement:0 "봄이 오는 능선"
 TFRKC_xfocus_TAEBAEK_settlement_desc:0 "산간 행정과 전후 부대 운영의 기록을 남깁니다."
 TFRKC_xfocus_FARMERS_tree:0 "호남농민공동전선 중점"
 TFRKC_xfocus_FARMERS_campaign_tt:0 "전시 방위 효과는 실제 내전 참가 중에만 적용됩니다. 전쟁이 끝난 뒤에도 훈련과 행정 준비는 진행할 수 있습니다."
 TFRKC_xfocus_FARMERS_food_agreement_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_FARMERS_requisition_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_FARMERS_start:0 "도시의 전쟁, 우리의 밭"
 TFRKC_xfocus_FARMERS_start_desc:0 "농민조직과 지역 자위대가 곡창의 운영을 맡습니다. 도시의 요구보다 내일의 파종을 먼저 셉니다."
 TFRKC_xfocus_FARMERS_civic_1:0 "마을마다 남는 몫"
 TFRKC_xfocus_FARMERS_civic_1_desc:0 "배급과 종자를 함께 보관해 주민의 내일을 남깁니다."
 TFRKC_xfocus_FARMERS_civic_2:0 "공동 수매장의 저울"
 TFRKC_xfocus_FARMERS_civic_2_desc:0 "수매량과 농민의 부담을 같은 장부에 적습니다."
 TFRKC_xfocus_FARMERS_civic_3:0 "농촌의 진료일"
 TFRKC_xfocus_FARMERS_civic_3_desc:0 "운송 계획에 병원과 생활 물자를 포함합니다."
 TFRKC_xfocus_FARMERS_military_1:0 "논두렁의 성인 방위대"
 TFRKC_xfocus_FARMERS_military_1_desc:0 "지역 성인 방위대의 담당과 연락을 정리합니다."
 TFRKC_xfocus_FARMERS_military_2:0 "익숙한 길의 보급"
 TFRKC_xfocus_FARMERS_military_2_desc:0 "지역 방위조직의 보급 청구를 연결합니다. 전시 효과는 실제 내전 참가 중에만 적용됩니다."
 TFRKC_xfocus_FARMERS_military_3:0 "수확철의 교대표"
 TFRKC_xfocus_FARMERS_military_3_desc:0 "경작과 방위 근무가 함께 유지되도록 교대를 훈련합니다."
 TFRKC_xfocus_FARMERS_system_1:0 "창고 앞의 협상"
 TFRKC_xfocus_FARMERS_system_1_desc:0 "도시와 체결할 공급 협정의 장부를 준비합니다."
 TFRKC_xfocus_FARMERS_system_2:0 "식량에도 운송비가 있다"
 TFRKC_xfocus_FARMERS_system_2_desc:0 "상대의 요청과 실제 운송 가능한 분량을 대조합니다."
 TFRKC_xfocus_FARMERS_system_3:0 "밭을 비운 사람들"
 TFRKC_xfocus_FARMERS_system_3_desc:0 "수매의 비용과 주민 반발을 기록할 조사 창구를 마련합니다."
 TFRKC_xfocus_FARMERS_council:0 "누가 저울을 쥐는가"
 TFRKC_xfocus_FARMERS_council_desc:0 "자치하는 농민의 협약인지 전시 국가의 명령인지 결정합니다."
 TFRKC_xfocus_FARMERS_route_a:0 "농민자치연방"
 TFRKC_xfocus_FARMERS_route_a_desc:0 "지역 농민 대표가 수매와 공급을 결정합니다. 동의하지 않을 권리도 협정에 남깁니다."
 TFRKC_xfocus_FARMERS_route_b:0 "전시농업국가"
 TFRKC_xfocus_FARMERS_route_b_desc:0 "국가가 수매와 배급을 명령합니다. 창고의 숫자가 늘어나는 동안 신뢰는 줄어듭니다."
 TFRKC_xfocus_FARMERS_route_a_2:0 "협정의 최소 가격"
 TFRKC_xfocus_FARMERS_route_a_2_desc:0 "지역이 감당할 몫과 생활 보장을 협상 기준으로 삼습니다."
 TFRKC_xfocus_FARMERS_route_b_2:0 "수매 명령의 집행부"
 TFRKC_xfocus_FARMERS_route_b_2_desc:0 "강제수매의 보고와 책임을 중앙에 모읍니다."
 TFRKC_xfocus_FARMERS_route_a_3:0 "씨앗을 남기는 연방"
 TFRKC_xfocus_FARMERS_route_a_3_desc:0 "전후 협정에도 농촌의 생존과 자치권을 남깁니다."
 TFRKC_xfocus_FARMERS_route_b_3:0 "배급국의 다음 해"
 TFRKC_xfocus_FARMERS_route_b_3_desc:0 "명령 체제가 경작을 고갈시키지 않을 대책을 적습니다. 늘어난 통제에는 비용이 따릅니다."
 TFRKC_xfocus_FARMERS_settlement:0 "다음 해에도 심을 것"
 TFRKC_xfocus_FARMERS_settlement_desc:0 "선택한 농정의 계획을 보관합니다. 수확이 끝났다고 전쟁까지 끝난 것은 아닙니다."
 TFRKC_xfocus_COVENANT_tree:0 "새벽언약회 중점"
 TFRKC_xfocus_COVENANT_campaign_tt:0 "전시 방위 효과는 실제 내전 참가 중에만 적용됩니다. 전쟁이 끝난 뒤에도 훈련과 행정 준비는 진행할 수 있습니다."
 TFRKC_xfocus_COVENANT_relief_network_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_COVENANT_authority_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_COVENANT_start:0 "새벽에 열린 문"
 TFRKC_xfocus_COVENANT_start_desc:0 "가상의 종교 공동체가 피난민에게 문을 엽니다. 바깥의 붕괴를 설명하는 교리와 안쪽의 굶주림이 함께 들어옵니다."
 TFRKC_xfocus_COVENANT_civic_1:0 "한 사람분의 그릇"
 TFRKC_xfocus_COVENANT_civic_1_desc:0 "신도와 피난민의 급식 수요를 구분해 기록합니다."
 TFRKC_xfocus_COVENANT_civic_2:0 "불 꺼지지 않는 시설"
 TFRKC_xfocus_COVENANT_civic_2_desc:0 "구호시설의 교대와 비용을 정리합니다."
 TFRKC_xfocus_COVENANT_civic_3:0 "예배 뒤의 민원"
 TFRKC_xfocus_COVENANT_civic_3_desc:0 "공동체 운영에 주민의 불만을 접수할 창구를 둡니다."
 TFRKC_xfocus_COVENANT_military_1:0 "성인 호송대의 약속"
 TFRKC_xfocus_COVENANT_military_1_desc:0 "전투와 호송은 성인이 맡고 민간 대피의 책임을 분명히 합니다."
 TFRKC_xfocus_COVENANT_military_2:0 "길을 지키는 규율"
 TFRKC_xfocus_COVENANT_military_2_desc:0 "성인 호송조직의 지휘와 물자 청구를 정리합니다. 전시 효과는 실제 내전 참가 중에만 적용됩니다."
 TFRKC_xfocus_COVENANT_military_3:0 "기도만으로 오지 않는 약"
 TFRKC_xfocus_COVENANT_military_3_desc:0 "의료와 보급 담당자의 보고를 실제 운송 계획에 반영합니다."
 TFRKC_xfocus_COVENANT_system_1:0 "더 많은 문을 열려면"
 TFRKC_xfocus_COVENANT_system_1_desc:0 "시설 확대의 비용과 민간 수용 여력을 조사합니다."
 TFRKC_xfocus_COVENANT_system_2:0 "구호의 조건"
 TFRKC_xfocus_COVENANT_system_2_desc:0 "구호받는 사람에게 어떤 권리를 보장할지 원칙을 적습니다."
 TFRKC_xfocus_COVENANT_system_3:0 "누구의 명령을 듣는가"
 TFRKC_xfocus_COVENANT_system_3_desc:0 "교단의 권위와 외부 정치 지도자의 명령이 다를 때를 대비합니다."
 TFRKC_xfocus_COVENANT_council:0 "종말 뒤의 이웃"
 TFRKC_xfocus_COVENANT_council_desc:0 "구호 공동체로 남을지 계시로 통치하는 국가가 될지 정합니다."
 TFRKC_xfocus_COVENANT_route_a:0 "믿음보다 먼저 사람"
 TFRKC_xfocus_COVENANT_route_a_desc:0 "신앙을 고백하지 않아도 구호받을 권리를 보장합니다."
 TFRKC_xfocus_COVENANT_route_b:0 "계시를 적는 관청"
 TFRKC_xfocus_COVENANT_route_b_desc:0 "종말론적 교리를 국가의 권위로 삼습니다. 의심은 행정의 오류보다 큰 죄가 됩니다."
 TFRKC_xfocus_COVENANT_route_a_2:0 "열린 구호위원회"
 TFRKC_xfocus_COVENANT_route_a_2_desc:0 "피난민 대표와 시설 담당자가 함께 운영을 논의합니다."
 TFRKC_xfocus_COVENANT_route_b_2:0 "의심 없는 보고서"
 TFRKC_xfocus_COVENANT_route_b_2_desc:0 "교단의 명령을 일원화합니다. 잘못된 보고를 고칠 여지도 좁아집니다."
 TFRKC_xfocus_COVENANT_route_a_3:0 "문을 닫지 않는 언약"
 TFRKC_xfocus_COVENANT_route_a_3_desc:0 "전후에도 공동체의 구호 권리를 남길 약정을 준비합니다."
 TFRKC_xfocus_COVENANT_route_b_3:0 "영원한 새벽의 질서"
 TFRKC_xfocus_COVENANT_route_b_3_desc:0 "교단 통치의 장기 운영안을 적습니다. 예언은 생산과 행정을 대신하지 못합니다."
 TFRKC_xfocus_COVENANT_settlement:0 "날이 밝은 뒤에도"
 TFRKC_xfocus_COVENANT_settlement_desc:0 "구호 기록과 선택한 통치 원칙을 보관합니다."
 TFRKC_xfocus_TAIWAN_tree:0 "자유대만복국군 중점"
 TFRKC_xfocus_TAIWAN_campaign_tt:0 "전시 방위 효과는 실제 내전 참가 중에만 적용됩니다. 전쟁이 끝난 뒤에도 훈련과 행정 준비는 진행할 수 있습니다."
 TFRKC_xfocus_TAIWAN_recognition_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_TAIWAN_return_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_TAIWAN_start:0 "항구에 남은 사람들"
 TFRKC_xfocus_TAIWAN_start_desc:0 "대만 함락 뒤 피난 온 잔존 병력과 망명 조직이 생존의 기반을 찾습니다. 짐을 풀지 못한 사람에게도 오늘 밤의 거처는 필요합니다."
 TFRKC_xfocus_TAIWAN_civic_1:0 "망명 가족의 명부"
 TFRKC_xfocus_TAIWAN_civic_1_desc:0 "부대 명부와 민간 정착 명부를 구분해 돌봄의 수요를 확인합니다."
 TFRKC_xfocus_TAIWAN_civic_2:0 "타지의 생활망"
 TFRKC_xfocus_TAIWAN_civic_2_desc:0 "숙련과 공동체를 보존할 정착 창구를 엽니다."
 TFRKC_xfocus_TAIWAN_civic_3:0 "번역되는 일상"
 TFRKC_xfocus_TAIWAN_civic_3_desc:0 "진료와 배급, 민원에 필요한 언어 지원을 정비합니다."
 TFRKC_xfocus_TAIWAN_military_1:0 "남은 간부들의 회의"
 TFRKC_xfocus_TAIWAN_military_1_desc:0 "적은 병력의 경험을 보존할 훈련 계획을 세웁니다."
 TFRKC_xfocus_TAIWAN_military_2:0 "숙련을 넘겨주다"
 TFRKC_xfocus_TAIWAN_military_2_desc:0 "간부의 경험을 부대 훈련과 지휘 절차로 정리합니다. 전시 효과는 실제 내전 참가 중에만 적용됩니다."
 TFRKC_xfocus_TAIWAN_military_3:0 "낯선 전장의 지도"
 TFRKC_xfocus_TAIWAN_military_3_desc:0 "한국의 전선과 민간 보호 절차를 익힙니다. 외국 병력을 새로 소환하지 않습니다."
 TFRKC_xfocus_TAIWAN_system_1:0 "돌아갈 주소"
 TFRKC_xfocus_TAIWAN_system_1_desc:0 "해외 연락과 가족의 소재를 조사할 창구를 유지합니다."
 TFRKC_xfocus_TAIWAN_system_2:0 "망명자의 대표권"
 TFRKC_xfocus_TAIWAN_system_2_desc:0 "정치조직의 승인과 정착을 협의할 자료를 준비합니다."
 TFRKC_xfocus_TAIWAN_system_3:0 "항구의 실제 능력"
 TFRKC_xfocus_TAIWAN_system_3_desc:0 "수송과 정비에 필요한 비용을 조사합니다. 명단 위의 함대는 바다에 뜨지 않습니다."
 TFRKC_xfocus_TAIWAN_council:0 "남을 것인가 돌아갈 것인가"
 TFRKC_xfocus_TAIWAN_council_desc:0 "한국에서의 공동생활을 미래로 삼을지 귀환 준비를 우선할지 정합니다."
 TFRKC_xfocus_TAIWAN_route_a:0 "이곳에도 내일이 있다"
 TFRKC_xfocus_TAIWAN_route_a_desc:0 "한국 정착과 지역사회 협력을 우선합니다. 고향의 기억을 버리라는 약속은 아닙니다."
 TFRKC_xfocus_TAIWAN_route_b:0 "돌아갈 날을 준비하다"
 TFRKC_xfocus_TAIWAN_route_b_desc:0 "대만 귀환의 준비를 국가 과제로 삼습니다. 이 결정은 원정 개시나 중국과의 선전포고가 아닙니다."
 TFRKC_xfocus_TAIWAN_route_a_2:0 "같은 골목의 이웃"
 TFRKC_xfocus_TAIWAN_route_a_2_desc:0 "정착 공동체와 한국 주민의 갈등 조정 창구를 만듭니다."
 TFRKC_xfocus_TAIWAN_route_b_2:0 "수송 계획의 첫 장"
 TFRKC_xfocus_TAIWAN_route_b_2_desc:0 "귀환에 필요한 수송·의료·정비의 실제 수요를 정리합니다."
 TFRKC_xfocus_TAIWAN_route_a_3:0 "함께 남는 기록"
 TFRKC_xfocus_TAIWAN_route_a_3_desc:0 "지역사회와 맺을 정착 약정과 권리를 준비합니다."
 TFRKC_xfocus_TAIWAN_route_b_3:0 "바다 건너의 조건"
 TFRKC_xfocus_TAIWAN_route_b_3_desc:0 "귀환 원정은 항구와 선박, 후원과 정치적 선택을 모두 요구한다는 원칙을 남깁니다."
 TFRKC_xfocus_TAIWAN_settlement:0 "짐을 푸는 방식"
 TFRKC_xfocus_TAIWAN_settlement_desc:0 "선택한 미래와 공동체의 생활 기록을 남깁니다. 망명은 언제까지나 임시라는 말만으로 버틸 수 없습니다."
 TFRKC_xfocus_DAEDEOK_tree:0 "대덕기술관리국 중점"
 TFRKC_xfocus_DAEDEOK_campaign_tt:0 "전시 방위 효과는 실제 내전 참가 중에만 적용됩니다. 전쟁이 끝난 뒤에도 훈련과 행정 준비는 진행할 수 있습니다."
 TFRKC_xfocus_DAEDEOK_requisition_conflict_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_DAEDEOK_prototype_review_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_DAEDEOK_start:0 "연구노트의 대피"
 TFRKC_xfocus_DAEDEOK_start_desc:0 "연구시설 경비대와 연구진이 남은 자료를 확인합니다. 국가가 무너져도 기술을 보존하겠다는 말에 생활의 책임이 따라옵니다."
 TFRKC_xfocus_DAEDEOK_civic_1:0 "실험실 밖의 사람들"
 TFRKC_xfocus_DAEDEOK_civic_1_desc:0 "연구원과 시설 노동자, 가족의 거처를 함께 조사합니다."
 TFRKC_xfocus_DAEDEOK_civic_2:0 "다음 장을 남기다"
 TFRKC_xfocus_DAEDEOK_civic_2_desc:0 "연구의 연속성과 비용을 기록할 보존 체계를 만듭니다."
 TFRKC_xfocus_DAEDEOK_civic_3:0 "전력과 냉각수의 예산"
 TFRKC_xfocus_DAEDEOK_civic_3_desc:0 "눈에 띄는 시제품보다 먼저 기초 시설의 유지 계획을 정리합니다."
 TFRKC_xfocus_DAEDEOK_military_1:0 "경비대와 연구진 사이"
 TFRKC_xfocus_DAEDEOK_military_1_desc:0 "시설 방위와 연구 지휘의 책임을 구분합니다."
 TFRKC_xfocus_DAEDEOK_military_2:0 "교신을 시험하다"
 TFRKC_xfocus_DAEDEOK_military_2_desc:0 "전자 장비와 항공 운용의 안전 절차를 맞춥니다. 전시 효과는 실제 내전 참가 중에만 적용됩니다."
 TFRKC_xfocus_DAEDEOK_military_3:0 "시험비행의 기록"
 TFRKC_xfocus_DAEDEOK_military_3_desc:0 "성공한 시범만이 아니라 사고와 실패도 보고하도록 합니다."
 TFRKC_xfocus_DAEDEOK_system_1:0 "징발 명령의 서명"
 TFRKC_xfocus_DAEDEOK_system_1_desc:0 "청소년해방군과의 시설 징발 갈등을 기록합니다. 독립은 담당 공통 절차와 실제 선택을 따릅니다."
 TFRKC_xfocus_DAEDEOK_system_2:0 "시설의 주인을 묻다"
 TFRKC_xfocus_DAEDEOK_system_2_desc:0 "공공 자산과 연구 자율의 경계를 협의할 자료를 만듭니다."
 TFRKC_xfocus_DAEDEOK_system_3:0 "시제품은 보고서가 아니다"
 TFRKC_xfocus_DAEDEOK_system_3_desc:0 "실제 장비와 예산, 실패 위험을 대조할 시험 심사를 마련합니다."
 TFRKC_xfocus_DAEDEOK_council:0 "누가 실험을 승인하는가"
 TFRKC_xfocus_DAEDEOK_council_desc:0 "공공 심사 아래 연구할지 전문가의 국가를 세울지 정합니다."
 TFRKC_xfocus_DAEDEOK_route_a:0 "공공의 연구실"
 TFRKC_xfocus_DAEDEOK_route_a_desc:0 "연구를 공개된 심사와 주민의 권리 아래 둡니다."
 TFRKC_xfocus_DAEDEOK_route_b:0 "국가를 설계하는 사람들"
 TFRKC_xfocus_DAEDEOK_route_b_desc:0 "기술관료가 국가를 운영합니다. 사람의 삶이 실험 결과로만 평가될 위험을 감수합니다."
 TFRKC_xfocus_DAEDEOK_route_a_2:0 "실패를 공개할 권리"
 TFRKC_xfocus_DAEDEOK_route_a_2_desc:0 "실패 보고자를 처벌하는 대신 심사 과정을 개선합니다."
 TFRKC_xfocus_DAEDEOK_route_b_2:0 "측정되지 않은 민원"
 TFRKC_xfocus_DAEDEOK_route_b_2_desc:0 "국가의 통계에 잡히지 않는 불만을 처리할 실무를 마련합니다."
 TFRKC_xfocus_DAEDEOK_route_a_3:0 "주민 앞의 연구윤리"
 TFRKC_xfocus_DAEDEOK_route_a_3_desc:0 "공공 연구의 절차와 권리를 장기 원칙에 남깁니다."
 TFRKC_xfocus_DAEDEOK_route_b_3:0 "관리국의 장기 실험"
 TFRKC_xfocus_DAEDEOK_route_b_3_desc:0 "기술관료 통치가 책임질 비용과 성과 기준을 적습니다."
 TFRKC_xfocus_DAEDEOK_settlement:0 "보존할 기술, 지킬 사람"
 TFRKC_xfocus_DAEDEOK_settlement_desc:0 "선택한 연구체제의 계획을 보관합니다. 다음 국가는 실험 장비만으로 운영되지 않습니다."
 TFRKC_xfocus_RAIL_tree:0 "대한철도공동체 중점"
 TFRKC_xfocus_RAIL_campaign_tt:0 "전시 방위 효과는 실제 내전 참가 중에만 적용됩니다. 전쟁이 끝난 뒤에도 훈련과 행정 준비는 진행할 수 있습니다."
 TFRKC_xfocus_RAIL_transit_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_RAIL_cutoff_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_RAIL_start:0 "마지막 열차의 직원들"
 TFRKC_xfocus_RAIL_start_desc:0 "철도노동자와 철도경찰, 성인 호송병력이 조차장의 불을 지킵니다. 시간표는 갈라진 나라의 말을 아직 알아듣습니다."
 TFRKC_xfocus_RAIL_civic_1:0 "역마다 남은 명부"
 TFRKC_xfocus_RAIL_civic_1_desc:0 "민간 대피와 운송 인력의 명부를 분리해 보관합니다."
 TFRKC_xfocus_RAIL_civic_2:0 "같은 시간의 역무실"
 TFRKC_xfocus_RAIL_civic_2_desc:0 "서로 다른 거점의 운행 보고를 같은 형식으로 정리합니다."
 TFRKC_xfocus_RAIL_civic_3:0 "정차역의 식탁"
 TFRKC_xfocus_RAIL_civic_3_desc:0 "역 구내의 급식과 의료 연락도 운송 계획에 포함합니다."
 TFRKC_xfocus_RAIL_military_1:0 "성인 호송대의 담당표"
 TFRKC_xfocus_RAIL_military_1_desc:0 "열차와 역을 지키는 성인 부대의 담당을 구분합니다."
 TFRKC_xfocus_RAIL_military_2:0 "호송 관제실"
 TFRKC_xfocus_RAIL_military_2_desc:0 "호송 보고와 예비 인력의 연락을 조정합니다. 전시 효과는 실제 내전 참가 중에만 적용됩니다."
 TFRKC_xfocus_RAIL_military_3:0 "끊어진 구간의 훈련"
 TFRKC_xfocus_RAIL_military_3_desc:0 "단절과 지연을 가정해 호송과 대피 절차를 연습합니다."
 TFRKC_xfocus_RAIL_system_1:0 "통행권의 가격"
 TFRKC_xfocus_RAIL_system_1_desc:0 "상대와 기간을 명시한 운임 계약 양식을 만듭니다."
 TFRKC_xfocus_RAIL_system_2:0 "선로가 있어야 갈 수 있다"
 TFRKC_xfocus_RAIL_system_2_desc:0 "실제 철도 연결과 협정 당사자의 동의를 확인합니다."
 TFRKC_xfocus_RAIL_system_3:0 "다음 역이 사라지면"
 TFRKC_xfocus_RAIL_system_3_desc:0 "고립된 거점의 보고와 주민 피해를 조사합니다."
 TFRKC_xfocus_RAIL_council:0 "시간표의 주인은 누구인가"
 TFRKC_xfocus_RAIL_council_desc:0 "중립의 교통연방인지 선로를 독점하는 군벌인지 정합니다."
 TFRKC_xfocus_RAIL_route_a:0 "중립 교통연방"
 TFRKC_xfocus_RAIL_route_a_desc:0 "중립 규칙과 지역 협약을 교통의 원칙으로 삼습니다."
 TFRKC_xfocus_RAIL_route_b:0 "철도 군벌의 지휘봉"
 TFRKC_xfocus_RAIL_route_b_desc:0 "군벌의 명령을 운임과 배차보다 앞에 둡니다. 민간의 생활도 그 대가를 치릅니다."
 TFRKC_xfocus_RAIL_route_a_2:0 "같은 운임, 같은 권리"
 TFRKC_xfocus_RAIL_route_a_2_desc:0 "각 세력이 같은 조건으로 계약할 수 있게 심사와 이의를 남깁니다."
 TFRKC_xfocus_RAIL_route_b_2:0 "명령으로 바뀐 신호"
 TFRKC_xfocus_RAIL_route_b_2_desc:0 "군사적 우선 수송을 정리하며 민간의 반발을 감수합니다."
 TFRKC_xfocus_RAIL_route_a_3:0 "연방의 환승 협정"
 TFRKC_xfocus_RAIL_route_a_3_desc:0 "지역이 다른 규칙을 갖더라도 공통 운송 권리를 보장할 계획을 만듭니다."
 TFRKC_xfocus_RAIL_route_b_3:0 "도시를 멈출 권력"
 TFRKC_xfocus_RAIL_route_b_3_desc:0 "단절을 압박 수단으로 삼는 운영안을 적습니다. 실제 중단은 협정과 경로 조건을 요구합니다."
 TFRKC_xfocus_RAIL_settlement:0 "첫차가 다시 다니는 나라"
 TFRKC_xfocus_RAIL_settlement_desc:0 "선택한 운영 원칙과 거점의 기록을 보관합니다."
 TFRKC_xfocus_WHITE_NIGHT_tree:0 "백야국가보안국 중점"
 TFRKC_xfocus_WHITE_NIGHT_campaign_tt:0 "전시 방위 효과는 실제 내전 참가 중에만 적용됩니다. 전쟁이 끝난 뒤에도 훈련과 행정 준비는 진행할 수 있습니다."
 TFRKC_xfocus_WHITE_NIGHT_covert_contacts_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_WHITE_NIGHT_double_agents_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_WHITE_NIGHT_start:0 "이름 없는 수신처"
 TFRKC_xfocus_WHITE_NIGHT_start_desc:0 "정보기관 잔존조직이 문서와 협조자 명부를 모읍니다. 공개되지 않은 권력도 누군가의 삶에 흔적을 남깁니다."
 TFRKC_xfocus_WHITE_NIGHT_civic_1:0 "문서의 다른 사본"
 TFRKC_xfocus_WHITE_NIGHT_civic_1_desc:0 "기밀과 민간 행정 기록을 구분해 파손과 유출을 줄입니다."
 TFRKC_xfocus_WHITE_NIGHT_civic_2:0 "닫힌 보관실"
 TFRKC_xfocus_WHITE_NIGHT_civic_2_desc:0 "문서를 분리 보관하고 접근 책임을 남깁니다."
 TFRKC_xfocus_WHITE_NIGHT_civic_3:0 "기밀이 아닌 생활"
 TFRKC_xfocus_WHITE_NIGHT_civic_3_desc:0 "직원과 협조자 가족의 생활 지원을 별도 창구로 돌립니다."
 TFRKC_xfocus_WHITE_NIGHT_military_1:0 "현장에 닿는 보고"
 TFRKC_xfocus_WHITE_NIGHT_military_1_desc:0 "분석과 현장 지휘의 연락 시간을 맞춥니다."
 TFRKC_xfocus_WHITE_NIGHT_military_2:0 "연락관의 책임"
 TFRKC_xfocus_WHITE_NIGHT_military_2_desc:0 "정보를 작전에 전달할 때의 권한과 책임을 정합니다. 전시 효과는 실제 내전 참가 중에만 적용됩니다."
 TFRKC_xfocus_WHITE_NIGHT_military_3:0 "보고서를 믿기 전에"
 TFRKC_xfocus_WHITE_NIGHT_military_3_desc:0 "서로 다른 출처를 대조하는 훈련으로 오판을 줄입니다."
 TFRKC_xfocus_WHITE_NIGHT_system_1:0 "명부 밖의 동의"
 TFRKC_xfocus_WHITE_NIGHT_system_1_desc:0 "접촉할 사람과 포섭의 실제 비용을 조사합니다."
 TFRKC_xfocus_WHITE_NIGHT_system_2:0 "장군은 문서가 아니다"
 TFRKC_xfocus_WHITE_NIGHT_system_2_desc:0 "타 세력의 인물을 움직이는 데 필요한 실제 조건을 확인합니다."
 TFRKC_xfocus_WHITE_NIGHT_system_3:0 "우리 안의 다른 수신처"
 TFRKC_xfocus_WHITE_NIGHT_system_3_desc:0 "내부의 이중간첩과 조작 보고에 대응할 심사 절차를 마련합니다."
 TFRKC_xfocus_WHITE_NIGHT_council:0 "누구에게 보고하는가"
 TFRKC_xfocus_WHITE_NIGHT_council_desc:0 "민간정부에 권한을 돌려줄지 비밀조직이 국가를 운영할지 정합니다."
 TFRKC_xfocus_WHITE_NIGHT_route_a:0 "기밀에도 주인이 있다"
 TFRKC_xfocus_WHITE_NIGHT_route_a_desc:0 "민간 통제 아래 기밀과 비밀권한을 반환할 원칙을 확정합니다."
 TFRKC_xfocus_WHITE_NIGHT_route_b:0 "보이지 않는 국가"
 TFRKC_xfocus_WHITE_NIGHT_route_b_desc:0 "공개된 정치 위에 비밀 결재선을 남깁니다. 시민은 자신을 통치하는 사람을 알 수 없습니다."
 TFRKC_xfocus_WHITE_NIGHT_route_a_2:0 "감사받는 보관실"
 TFRKC_xfocus_WHITE_NIGHT_route_a_2_desc:0 "공개할 기록과 보호할 개인정보를 민간 감사에 맡깁니다."
 TFRKC_xfocus_WHITE_NIGHT_route_b_2:0 "누락된 결재자의 이름"
 TFRKC_xfocus_WHITE_NIGHT_route_b_2_desc:0 "비밀 통치의 보고 체계를 정비합니다. 책임 소재가 지워질수록 불신은 깊어집니다."
 TFRKC_xfocus_WHITE_NIGHT_route_a_3:0 "문을 닫는 조직"
 TFRKC_xfocus_WHITE_NIGHT_route_a_3_desc:0 "권한 반환과 기록 이관의 순서를 준비합니다. 실제 정부 통합은 별도 합의를 따릅니다."
 TFRKC_xfocus_WHITE_NIGHT_route_b_3:0 "아무도 끝내지 않은 임무"
 TFRKC_xfocus_WHITE_NIGHT_route_b_3_desc:0 "비밀 통치를 계속할 내부 규약을 남깁니다."
 TFRKC_xfocus_WHITE_NIGHT_settlement:0 "남겨진 서명란"
 TFRKC_xfocus_WHITE_NIGHT_settlement_desc:0 "선택한 권력 운영과 기록의 보관 계획을 남깁니다."
 TFRKC_xfocus_CHEONGSONG_tree:0 "청송자유군 중점"
 TFRKC_xfocus_CHEONGSONG_campaign_tt:0 "전시 방위 효과는 실제 내전 참가 중에만 적용됩니다. 전쟁이 끝난 뒤에도 훈련과 행정 준비는 진행할 수 있습니다."
 TFRKC_xfocus_CHEONGSONG_amnesty_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_CHEONGSONG_sentences_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_CHEONGSONG_start:0 "같은 문을 나서다"
 TFRKC_xfocus_CHEONGSONG_start_desc:0 "교정시설 붕괴 뒤 수감자와 교도관이 생존협약을 맺습니다. 다른 삶의 이력이 같은 출구에서 만났습니다."
 TFRKC_xfocus_CHEONGSONG_civic_1:0 "명부의 다른 사정"
 TFRKC_xfocus_CHEONGSONG_civic_1_desc:0 "정치범과 생계형 수감자, 전직 군인 등 성인 참가자의 사정을 구분합니다."
 TFRKC_xfocus_CHEONGSONG_civic_2:0 "서로 서명한 협약"
 TFRKC_xfocus_CHEONGSONG_civic_2_desc:0 "최소한의 권리와 공동생활의 책임을 정합니다."
 TFRKC_xfocus_CHEONGSONG_civic_3:0 "문밖의 진료소"
 TFRKC_xfocus_CHEONGSONG_civic_3_desc:0 "민간 생활과 치료의 필요를 부대 공로와 구분합니다."
 TFRKC_xfocus_CHEONGSONG_military_1:0 "경험이 다른 사람들"
 TFRKC_xfocus_CHEONGSONG_military_1_desc:0 "성인 지원자의 지휘 경험과 훈련 수요를 조사합니다."
 TFRKC_xfocus_CHEONGSONG_military_2:0 "혼성부대의 규정"
 TFRKC_xfocus_CHEONGSONG_military_2_desc:0 "교도관과 수감자 출신이 같은 절차를 따르게 합니다. 전시 효과는 실제 내전 참가 중에만 적용됩니다."
 TFRKC_xfocus_CHEONGSONG_military_3:0 "명령과 모욕 사이"
 TFRKC_xfocus_CHEONGSONG_military_3_desc:0 "지휘와 처벌을 구분하는 훈련 규정을 남깁니다."
 TFRKC_xfocus_CHEONGSONG_system_1:0 "공로를 적는 장부"
 TFRKC_xfocus_CHEONGSONG_system_1_desc:0 "공로와 사면 약속을 공개적으로 대조할 명부를 준비합니다."
 TFRKC_xfocus_CHEONGSONG_system_2:0 "빈 약속을 막으려면"
 TFRKC_xfocus_CHEONGSONG_system_2_desc:0 "같은 공로로 약속을 중복 지급하지 않도록 심사를 정합니다."
 TFRKC_xfocus_CHEONGSONG_system_3:0 "누가 형량을 계산하는가"
 TFRKC_xfocus_CHEONGSONG_system_3_desc:0 "형량과 복무를 누가 심사할지 논의합니다."
 TFRKC_xfocus_CHEONGSONG_council:0 "자유라는 이름의 날짜"
 TFRKC_xfocus_CHEONGSONG_council_desc:0 "약속을 이행할지 끝없이 조건을 붙일지 결정합니다."
 TFRKC_xfocus_CHEONGSONG_route_a:0 "약속한 사면을 지키다"
 TFRKC_xfocus_CHEONGSONG_route_a_desc:0 "공개된 기준으로 사면을 이행하는 노선을 택합니다. 실제 인력과 법적 처리는 별도 심사를 따릅니다."
 TFRKC_xfocus_CHEONGSONG_route_b:0 "지휘부가 쥔 달력"
 TFRKC_xfocus_CHEONGSONG_route_b_desc:0 "형량의 계산을 지휘부의 권한으로 남깁니다. 자유를 약속한 조직이 다시 문을 잠급니다."
 TFRKC_xfocus_CHEONGSONG_route_a_2:0 "공로의 공개 심사"
 TFRKC_xfocus_CHEONGSONG_route_a_2_desc:0 "지휘부가 임의로 약속을 바꾸지 못하도록 이의를 받습니다."
 TFRKC_xfocus_CHEONGSONG_route_b_2:0 "다시 늘어난 조건"
 TFRKC_xfocus_CHEONGSONG_route_b_2_desc:0 "복무와 형량의 결정을 집중합니다. 반복되는 조건은 전투 의지와 신뢰를 함께 소모합니다."
 TFRKC_xfocus_CHEONGSONG_route_a_3:0 "전후에도 효력 있는 서명"
 TFRKC_xfocus_CHEONGSONG_route_a_3_desc:0 "사면과 복귀 약속을 전후 계획에 남깁니다."
 TFRKC_xfocus_CHEONGSONG_route_b_3:0 "끝나지 않는 복무"
 TFRKC_xfocus_CHEONGSONG_route_b_3_desc:0 "형량 통제 체제를 장기 운영안에 적습니다. 약속의 비용을 지웠다고 불신이 지워지지는 않습니다."
 TFRKC_xfocus_CHEONGSONG_settlement:0 "문밖에서 남길 기록"
 TFRKC_xfocus_CHEONGSONG_settlement_desc:0 "선택한 약속과 공동체의 기록을 보존합니다."
 TFRKC_xfocus_IMPERIAL_tree:0 "대한황실봉대회 중점"
 TFRKC_xfocus_IMPERIAL_campaign_tt:0 "전시 방위 효과는 실제 내전 참가 중에만 적용됩니다. 전쟁이 끝난 뒤에도 훈련과 행정 준비는 진행할 수 있습니다."
 TFRKC_xfocus_IMPERIAL_lineage_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_IMPERIAL_defectors_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_IMPERIAL_start:0 "임시 왕좌의 천"
 TFRKC_xfocus_IMPERIAL_start_desc:0 "지방 유지와 복고 단체가 황실 계승자를 자처하는 가상 인물을 추대합니다. 왕좌보다 먼저 놓인 것은 낡은 접이식 의자였습니다."
 TFRKC_xfocus_IMPERIAL_civic_1:0 "의전보다 먼저 배급"
 TFRKC_xfocus_IMPERIAL_civic_1_desc:0 "추대식 뒤에도 주민의 식사와 진료가 필요합니다."
 TFRKC_xfocus_IMPERIAL_civic_2:0 "왕관을 위한 회계"
 TFRKC_xfocus_IMPERIAL_civic_2_desc:0 "의전과 지역 행정의 비용을 같은 장부에 적습니다."
 TFRKC_xfocus_IMPERIAL_civic_3:0 "충성의 민원 창구"
 TFRKC_xfocus_IMPERIAL_civic_3_desc:0 "지지자의 환호와 주민의 불만을 서로 다른 서류로 받습니다."
 TFRKC_xfocus_IMPERIAL_military_1:0 "왕좌 곁의 성인 방위대"
 TFRKC_xfocus_IMPERIAL_military_1_desc:0 "약한 출발의 성인 방위조직을 조사하고 담당을 정합니다."
 TFRKC_xfocus_IMPERIAL_military_2:0 "궁정 밖의 훈련장"
 TFRKC_xfocus_IMPERIAL_military_2_desc:0 "의전과 실제 방위 임무를 분리해 훈련합니다. 전시 효과는 실제 내전 참가 중에만 적용됩니다."
 TFRKC_xfocus_IMPERIAL_military_3:0 "귀순의 실제 명부"
 TFRKC_xfocus_IMPERIAL_military_3_desc:0 "귀순을 말하는 부대의 소속과 장비를 확인하는 훈련을 정리합니다."
 TFRKC_xfocus_IMPERIAL_system_1:0 "계보를 보관하는 방"
 TFRKC_xfocus_IMPERIAL_system_1_desc:0 "추대의 근거와 반론을 보관합니다. 의심되는 기록을 곧 진실이라고 부르지 않습니다."
 TFRKC_xfocus_IMPERIAL_system_2:0 "왕관의 서류 심사"
 TFRKC_xfocus_IMPERIAL_system_2_desc:0 "혈통을 둘러싼 증거와 주민의 반응을 조사할 창구를 만듭니다."
 TFRKC_xfocus_IMPERIAL_system_3:0 "문을 두드리는 지방"
 TFRKC_xfocus_IMPERIAL_system_3_desc:0 "다른 지역과 귀순을 협의할 자료를 준비합니다. 호칭을 바꾼다고 소유권이 넘어오지는 않습니다."
 TFRKC_xfocus_IMPERIAL_council:0 "왕관 아래의 세 길"
 TFRKC_xfocus_IMPERIAL_council_desc:0 "헌법 아래의 왕, 직접 통치하는 황제, 옛 백제의 이름 가운데 국가의 근거를 고릅니다."
 TFRKC_xfocus_IMPERIAL_route_a:0 "입헌군주국의 약속"
 TFRKC_xfocus_IMPERIAL_route_a_desc:0 "군주는 헌법과 의회의 제한을 받습니다. 가문의 주장보다 주민의 동의를 국가의 근거로 삼습니다."
 TFRKC_xfocus_IMPERIAL_route_b:0 "황제의 직접 결재"
 TFRKC_xfocus_IMPERIAL_route_b_desc:0 "군주가 직접 정무를 결정합니다. 작은 궁정의 확신이 국가 전체의 불안이 됩니다."
 TFRKC_xfocus_IMPERIAL_route_a_2:0 "의회가 여는 궁정"
 TFRKC_xfocus_IMPERIAL_route_a_2_desc:0 "군주의 권한과 예산을 민간 대표가 심사합니다."
 TFRKC_xfocus_IMPERIAL_route_b_2:0 "칙령의 접수처"
 TFRKC_xfocus_IMPERIAL_route_b_2_desc:0 "친정 체제의 보고와 결재를 통일하며 반발을 감수합니다."
 TFRKC_xfocus_IMPERIAL_route_a_3:0 "혈통보다 먼저 헌법"
 TFRKC_xfocus_IMPERIAL_route_a_3_desc:0 "계보가 흔들려도 헌법적 제도가 남도록 운영안을 준비합니다."
 TFRKC_xfocus_IMPERIAL_route_b_3:0 "왕관이 답해야 할 것"
 TFRKC_xfocus_IMPERIAL_route_b_3_desc:0 "친정의 정당화와 책임을 문서로 남깁니다. 폭로를 없던 일로 만들지는 못합니다."
 TFRKC_xfocus_IMPERIAL_settlement:0 "왕관 뒤의 나라"
 TFRKC_xfocus_IMPERIAL_settlement_desc:0 "선택한 통치와 지역 행정의 장부를 남깁니다. 귀순과 영토 이전은 실제 합의를 요구합니다."
 TFRKC_xfocus_IMPERIAL_route_c:0 "백제의 이름을 잇다"
 TFRKC_xfocus_IMPERIAL_route_c_desc:0 "백제 계승을 새 국가의 상징으로 택합니다. 옛 국경을 현재의 영토로 자동 주장하지 않습니다."
 TFRKC_xfocus_IMPERIAL_route_c_2:0 "옛 도읍의 새 주민"
 TFRKC_xfocus_IMPERIAL_route_c_2_desc:0 "역사 상징과 현재 주민의 권리를 구분할 행정 원칙을 만듭니다."
 TFRKC_xfocus_IMPERIAL_route_c_3:0 "계보가 아닌 공동체"
 TFRKC_xfocus_IMPERIAL_route_c_3_desc:0 "혈통의 진위와 별개로 지역 공동체의 동의를 국가의 근거에 남깁니다."
 TFRKC_xfocus_UNDERGROUND_tree:0 "서울지하자치구 중점"
 TFRKC_xfocus_UNDERGROUND_campaign_tt:0 "전시 방위 효과는 실제 내전 참가 중에만 적용됩니다. 전쟁이 끝난 뒤에도 훈련과 행정 준비는 진행할 수 있습니다."
 TFRKC_xfocus_UNDERGROUND_stations_tt:0 "비영토 조직의 권리와 기록을 보존할 준비를 합니다. 지상 영토와 국가를 새로 만들지 않습니다."
 TFRKC_xfocus_UNDERGROUND_surface_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_UNDERGROUND_start:0 "막차 뒤의 역장회의"
 TFRKC_xfocus_UNDERGROUND_start_desc:0 "지하철 직원과 시민 대피조직, 고립된 성인 군경이 역무실에 모입니다. 지상의 지도와 지하의 생활은 같은 종이에 그려지지 않습니다."
 TFRKC_xfocus_UNDERGROUND_civic_1:0 "플랫폼의 잠자리"
 TFRKC_xfocus_UNDERGROUND_civic_1_desc:0 "대피한 주민의 거처와 이동 필요를 기록합니다."
 TFRKC_xfocus_UNDERGROUND_civic_2:0 "역무실의 생활망"
 TFRKC_xfocus_UNDERGROUND_civic_2_desc:0 "구호와 전력, 위생의 연락을 조직 단계 계획으로 남깁니다."
 TFRKC_xfocus_UNDERGROUND_civic_3:0 "역 이름으로 부르는 사람"
 TFRKC_xfocus_UNDERGROUND_civic_3_desc:0 "표를 잃은 사람에게도 민원과 구호를 받을 이름을 남깁니다."
 TFRKC_xfocus_UNDERGROUND_military_1:0 "성인 경비조의 구역"
 TFRKC_xfocus_UNDERGROUND_military_1_desc:0 "전투·경비는 성인이 맡고 민간 대피 구역과 분리합니다."
 TFRKC_xfocus_UNDERGROUND_military_2:0 "서로 들리는 무전"
 TFRKC_xfocus_UNDERGROUND_military_2_desc:0 "경비조의 연락과 후퇴·대피 절차를 맞춥니다. 전시 효과는 실제 내전 참가 중에만 적용됩니다."
 TFRKC_xfocus_UNDERGROUND_military_3:0 "출입구의 책임"
 TFRKC_xfocus_UNDERGROUND_military_3_desc:0 "지상과 연결되는 창구의 경비와 민간 이동을 구분해 훈련합니다."
 TFRKC_xfocus_UNDERGROUND_system_1:0 "지상에 보내는 편지"
 TFRKC_xfocus_UNDERGROUND_system_1_desc:0 "지상 통제국과 대화할 대표의 권한을 정합니다."
 TFRKC_xfocus_UNDERGROUND_system_2:0 "지도에 겹치지 않는 자치"
 TFRKC_xfocus_UNDERGROUND_system_2_desc:0 "지상 영토를 복제하지 않고 조직과 주민의 권리를 기록합니다."
 TFRKC_xfocus_UNDERGROUND_system_3:0 "문을 열기 전의 조건"
 TFRKC_xfocus_UNDERGROUND_system_3_desc:0 "자치 협정과 지상 진출에 필요한 동의·거점·비용을 조사합니다."
 TFRKC_xfocus_UNDERGROUND_council:0 "계단 위로 이어지는 길"
 TFRKC_xfocus_UNDERGROUND_council_desc:0 "지상과 협약할지 지상 진출을 준비할지 역장회의가 정합니다."
 TFRKC_xfocus_UNDERGROUND_route_a:0 "서로 다른 층의 협약"
 TFRKC_xfocus_UNDERGROUND_route_a_desc:0 "지상과 지하의 자치권과 민간 이동을 협정으로 보장할 노선을 택합니다."
 TFRKC_xfocus_UNDERGROUND_route_b:0 "계단 위로"
 TFRKC_xfocus_UNDERGROUND_route_b_desc:0 "지상 진출을 준비합니다. 실제 봉기와 거점 이전은 비용과 전쟁 조건을 요구합니다."
 TFRKC_xfocus_UNDERGROUND_route_a_2:0 "열린 출입구의 규칙"
 TFRKC_xfocus_UNDERGROUND_route_a_2_desc:0 "양측 주민의 이동과 구호에 필요한 협약 조항을 정리합니다."
 TFRKC_xfocus_UNDERGROUND_route_b_2:0 "지상에서의 주소"
 TFRKC_xfocus_UNDERGROUND_route_b_2_desc:0 "조직이 지상의 행정을 맡을 때 필요한 명부를 준비합니다."
 TFRKC_xfocus_UNDERGROUND_route_a_3:0 "역장회의의 자치헌장"
 TFRKC_xfocus_UNDERGROUND_route_a_3_desc:0 "호스트가 바뀌어도 조직별 권리와 약속을 보존할 조항을 만듭니다."
 TFRKC_xfocus_UNDERGROUND_route_b_3:0 "빛 아래의 책임"
 TFRKC_xfocus_UNDERGROUND_route_b_3_desc:0 "지상 진출 뒤 민간인에게 질 책임을 정리합니다. 조직이 곧 국가가 되었다고 자동 선언하지 않습니다."
 TFRKC_xfocus_UNDERGROUND_settlement:0 "다음 열차를 기다리는 사람"
 TFRKC_xfocus_UNDERGROUND_settlement_desc:0 "자치구의 기록을 보존합니다. 비영토 단계의 실행과 보상은 조직 전용 절차를 따릅니다."
 TFRKC_xfocus_HOMECOMING_tree:0 "망향군 중점"
 TFRKC_xfocus_HOMECOMING_campaign_tt:0 "전시 방위 효과는 실제 내전 참가 중에만 적용됩니다. 전쟁이 끝난 뒤에도 훈련과 행정 준비는 진행할 수 있습니다."
 TFRKC_xfocus_HOMECOMING_peace_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_HOMECOMING_return_veterans_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_HOMECOMING_start:0 "돌아와도 끝나지 않은 전쟁"
 TFRKC_xfocus_HOMECOMING_start_desc:0 "양안전쟁에서 가족과 동료를 잃은 귀환장병이 모입니다. 돌아온 주소는 있어도 돌아갈 일상이 없는 사람이 많습니다."
 TFRKC_xfocus_HOMECOMING_civic_1:0 "귀환자의 진료 기록"
 TFRKC_xfocus_HOMECOMING_civic_1_desc:0 "치료와 가족 연락의 필요를 전투 경력과 구분해 기록합니다."
 TFRKC_xfocus_HOMECOMING_civic_2:0 "돌아온 사람의 명부"
 TFRKC_xfocus_HOMECOMING_civic_2_desc:0 "장병의 숙련과 민간 생활을 함께 지원할 창구를 만듭니다."
 TFRKC_xfocus_HOMECOMING_civic_3:0 "이름을 다시 부르는 일"
 TFRKC_xfocus_HOMECOMING_civic_3_desc:0 "전우와 유가족의 기록을 구호와 별개로 보존합니다."
 TFRKC_xfocus_HOMECOMING_military_1:0 "숙련된 소부대"
 TFRKC_xfocus_HOMECOMING_military_1_desc:0 "귀환장병의 전투 경험과 지휘를 정리합니다."
 TFRKC_xfocus_HOMECOMING_military_2:0 "같은 전장을 기억하다"
 TFRKC_xfocus_HOMECOMING_military_2_desc:0 "지휘와 보고를 연결해 경험이 실제 작전에 전달되게 합니다. 전시 효과는 실제 내전 참가 중에만 적용됩니다."
 TFRKC_xfocus_HOMECOMING_military_3:0 "낡은 장비의 새 점검"
 TFRKC_xfocus_HOMECOMING_military_3_desc:0 "숙련만으로 고장을 막을 수는 없습니다. 정비와 후퇴 절차를 훈련합니다."
 TFRKC_xfocus_HOMECOMING_system_1:0 "반중 동맹의 회의"
 TFRKC_xfocus_HOMECOMING_system_1_desc:0 "다른 세력과 협력할 목표와 한계를 정리합니다."
 TFRKC_xfocus_HOMECOMING_system_2:0 "평화를 요구하는 편지"
 TFRKC_xfocus_HOMECOMING_system_2_desc:0 "민간과 장병의 강화 요구를 기록합니다. 복수의 목소리만 대표라고 부를 수는 없습니다."
 TFRKC_xfocus_HOMECOMING_system_3:0 "복무 뒤의 생활비"
 TFRKC_xfocus_HOMECOMING_system_3_desc:0 "전후 복귀와 재통합의 실제 비용을 조사합니다."
 TFRKC_xfocus_HOMECOMING_council:0 "어느 전쟁에서 돌아오는가"
 TFRKC_xfocus_HOMECOMING_council_desc:0 "이 전쟁 뒤 일상으로 돌아갈지 다음 복수전을 준비할지 결정합니다."
 TFRKC_xfocus_HOMECOMING_route_a:0 "전후의 주소"
 TFRKC_xfocus_HOMECOMING_route_a_desc:0 "장병의 복귀와 공동체의 회복을 우선합니다."
 TFRKC_xfocus_HOMECOMING_route_b:0 "중국을 향한 다음 지도"
 TFRKC_xfocus_HOMECOMING_route_b_desc:0 "대중국 복수전을 준비하는 노선을 택합니다. 실제 전쟁과 동맹 이탈은 별도 조건과 결정을 따릅니다."
 TFRKC_xfocus_HOMECOMING_route_a_2:0 "복귀를 도울 사람들"
 TFRKC_xfocus_HOMECOMING_route_a_2_desc:0 "치료와 노동 복귀를 맡을 지역 창구를 정비합니다."
 TFRKC_xfocus_HOMECOMING_route_b_2:0 "복수의 비용표"
 TFRKC_xfocus_HOMECOMING_route_b_2_desc:0 "다음 전쟁의 준비가 민간 생활에 요구할 비용을 드러냅니다."
 TFRKC_xfocus_HOMECOMING_route_a_3:0 "강화를 받아들일 용기"
 TFRKC_xfocus_HOMECOMING_route_a_3_desc:0 "합의할 조건과 돌아갈 사람의 권리를 전후 계획에 남깁니다."
 TFRKC_xfocus_HOMECOMING_route_b_3:0 "동맹이 멈추려 할 때"
 TFRKC_xfocus_HOMECOMING_route_b_3_desc:0 "강화 반대와 동맹 이탈의 요구를 협상 문서로 적습니다. 문서만으로 선전포고하지 않습니다."
 TFRKC_xfocus_HOMECOMING_settlement:0 "돌아오지 못한 이름들"
 TFRKC_xfocus_HOMECOMING_settlement_desc:0 "선택한 목표와 전쟁이 남긴 기록을 보존합니다."
 TFRKC_xfocus_CREDIT_tree:0 "국가채권회수단 중점"
 TFRKC_xfocus_CREDIT_campaign_tt:0 "전시 방위 효과는 실제 내전 참가 중에만 적용됩니다. 전쟁이 끝난 뒤에도 훈련과 행정 준비는 진행할 수 있습니다."
 TFRKC_xfocus_CREDIT_war_loans_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_CREDIT_collateral_tt:0 "협의와 운영에 필요한 준비를 마칩니다. 실제 실행에는 당사자의 선택·비용·현재 상황에 맞는 조건이 필요합니다."
 TFRKC_xfocus_CREDIT_start:0 "항구로 온 청구서"
 TFRKC_xfocus_CREDIT_start_desc:0 "금융기관 잔존조직과 무장 자산관리조직이 담보의 확보를 주장합니다. 국가의 파산을 말하는 종이 뒤에도 주민이 살고 있습니다."
 TFRKC_xfocus_CREDIT_civic_1:0 "같은 빚을 두 번 세지 않게"
 TFRKC_xfocus_CREDIT_civic_1_desc:0 "채권의 원본과 이미 상환된 금액을 대조합니다."
 TFRKC_xfocus_CREDIT_civic_2:0 "서로 맞춘 장부"
 TFRKC_xfocus_CREDIT_civic_2_desc:0 "대출과 회수의 관리 비용을 실제 예산에 적습니다."
 TFRKC_xfocus_CREDIT_civic_3:0 "청구서 아래의 민원"
 TFRKC_xfocus_CREDIT_civic_3_desc:0 "항만 노동자와 주민의 생활 요구를 접수합니다."
 TFRKC_xfocus_CREDIT_military_1:0 "경비 계약의 담당표"
 TFRKC_xfocus_CREDIT_military_1_desc:0 "계약 병력의 실제 소속과 보급 책임을 확인합니다."
 TFRKC_xfocus_CREDIT_military_2:0 "담보 경비의 지휘"
 TFRKC_xfocus_CREDIT_military_2_desc:0 "경비 계약과 작전 명령의 우선순위를 맞춥니다. 전시 효과는 실제 내전 참가 중에만 적용됩니다."
 TFRKC_xfocus_CREDIT_military_3:0 "지켜야 할 사람의 목록"
 TFRKC_xfocus_CREDIT_military_3_desc:0 "민간 보호와 항만 경비의 책임을 훈련합니다. 실제 자산 이상을 복제하지 않습니다."
 TFRKC_xfocus_CREDIT_system_1:0 "전쟁에도 만기가 있다"
 TFRKC_xfocus_CREDIT_system_1_desc:0 "전쟁대출의 한도와 상환 기간을 심사할 절차를 마련합니다."
 TFRKC_xfocus_CREDIT_system_2:0 "돈을 빌려줄 조건"
 TFRKC_xfocus_CREDIT_system_2_desc:0 "실제 자금과 채무자의 동의를 확인하는 계약서를 준비합니다."
 TFRKC_xfocus_CREDIT_system_3:0 "연체된 국가의 주소"
 TFRKC_xfocus_CREDIT_system_3_desc:0 "채무불이행과 담보의 권리를 구분해 기록합니다."
 TFRKC_xfocus_CREDIT_council:0 "빚을 갚을 수 있는 나라"
 TFRKC_xfocus_CREDIT_council_desc:0 "채무자가 회복할 여지를 남길지 자산을 국가 자체로 만들지 결정합니다."
 TFRKC_xfocus_CREDIT_route_a:0 "채무를 다시 적다"
 TFRKC_xfocus_CREDIT_route_a_desc:0 "상환 가능한 채무 재조정을 원칙으로 삼습니다. 실제 계약은 당사자의 동의를 따릅니다."
 TFRKC_xfocus_CREDIT_route_b:0 "담보국가의 장부"
 TFRKC_xfocus_CREDIT_route_b_desc:0 "담보 자산의 운영을 국가의 통치 원리로 삼습니다. 주민의 권리가 자산 목록 뒤로 밀립니다."
 TFRKC_xfocus_CREDIT_route_a_2:0 "회복을 기다리는 만기"
 TFRKC_xfocus_CREDIT_route_a_2_desc:0 "상환 일정과 민간 생활의 유지를 함께 심사합니다."
 TFRKC_xfocus_CREDIT_route_b_2:0 "모든 창구가 회수부로"
 TFRKC_xfocus_CREDIT_route_b_2_desc:0 "담보 운영의 결정을 집중해 민간 불신을 감수합니다."
 TFRKC_xfocus_CREDIT_route_a_3:0 "갚을 수 있는 약정"
 TFRKC_xfocus_CREDIT_route_a_3_desc:0 "전후 계약에도 상환·이의·재조정의 절차를 남깁니다."
 TFRKC_xfocus_CREDIT_route_b_3:0 "국가보다 먼저 담보"
 TFRKC_xfocus_CREDIT_route_b_3_desc:0 "담보 운영권과 실제 주권의 차이를 남긴 채 장기 운영을 준비합니다. 영토를 자동 획득하지 않습니다."
 TFRKC_xfocus_CREDIT_settlement:0 "장부 밖의 나라"
 TFRKC_xfocus_CREDIT_settlement_desc:0 "선택한 금융 원칙과 주민의 요구를 전후 기록에 남깁니다."
 TFRKC_xfocus_GWANGJU_idea_system:0 "동네의 위임장"
 TFRKC_xfocus_GWANGJU_idea_system_desc:0 "지역 대표가 승인한 정책은 오래 버티지만 합의를 구하는 데 비용이 듭니다."
 TFRKC_xfocus_GWANGJU_idea_defence:0 "시민 방위구역"
 TFRKC_xfocus_GWANGJU_idea_defence_desc:0 "익숙한 거리를 방어하는 능력을 키우는 대신 원거리 작전의 준비가 느려집니다. 실제 내전 참가 상태가 끝나면 제거됩니다."
 TFRKC_xfocus_GWANGJU_idea_federal:0 "분권의 동의"
 TFRKC_xfocus_GWANGJU_idea_federal_desc:0 "지역의 거부권을 인정해 신뢰를 얻되 군사 계획의 속도를 양보합니다."
 TFRKC_xfocus_GWANGJU_idea_emergency:0 "시민을 대신하는 정부"
 TFRKC_xfocus_GWANGJU_idea_emergency_desc:0 "비상정부가 명령을 집중하며 시민의 감시권을 뒤로 미룹니다."
 TFRKC_xfocus_JEONJU_idea_system:0 "기억을 보관하는 위원회"
 TFRKC_xfocus_JEONJU_idea_system_desc:0 "유가족의 기록과 지역 조직을 보존하는 데 정치적 자원을 씁니다."
 TFRKC_xfocus_JEONJU_idea_columns:0 "혁명군의 연락조"
 TFRKC_xfocus_JEONJU_idea_columns_desc:0 "지역별 의용조직을 연결하지만 즉흥적 전투의 습관은 쉽게 사라지지 않습니다. 실제 내전 참가 상태가 끝나면 제거됩니다."
 TFRKC_xfocus_JEONJU_idea_democratic:0 "심판에도 절차가 있다"
 TFRKC_xfocus_JEONJU_idea_democratic_desc:0 "혁명의 적에게도 공개된 절차를 적용해 주민의 신뢰를 구합니다."
 TFRKC_xfocus_JEONJU_idea_purge:0 "끝나지 않는 혁명재판"
 TFRKC_xfocus_JEONJU_idea_purge_desc:0 "숙청은 전투 의지를 부추기지만 숙련인력과 민심을 함께 소모합니다."
 TFRKC_xfocus_CORPORATE_idea_system:0 "공동 정산실"
 TFRKC_xfocus_CORPORATE_idea_system_desc:0 "생산과 거래를 복구하는 비용을 계열사들이 나눠 냅니다."
 TFRKC_xfocus_CORPORATE_idea_security:0 "계약된 지휘권"
 TFRKC_xfocus_CORPORATE_idea_security_desc:0 "사병의 보고를 맞추는 데 계약 검토와 지휘 비용이 듭니다. 실제 내전 참가 상태가 끝나면 제거됩니다."
 TFRKC_xfocus_CORPORATE_idea_compact:0 "기업 간 상호보증"
 TFRKC_xfocus_CORPORATE_idea_compact_desc:0 "생산 협력을 늘리는 대신 다른 기업의 거부권을 인정합니다."
 TFRKC_xfocus_CORPORATE_idea_monopoly:0 "국가의 단일 주주"
 TFRKC_xfocus_CORPORATE_idea_monopoly_desc:0 "생산 결정을 집중하지만 독점의 대가는 사회 전체에 돌아옵니다."
 TFRKC_xfocus_CONTINUITY_idea_system:0 "중복 보관된 국가"
 TFRKC_xfocus_CONTINUITY_idea_system_desc:0 "기록과 통신망을 이중 보관해 행정의 손실을 줄입니다."
 TFRKC_xfocus_CONTINUITY_idea_guards:0 "청사 방호 연락망"
 TFRKC_xfocus_CONTINUITY_idea_guards_desc:0 "방호병력이 분산된 청사와 통신시설을 지킵니다. 실제 내전 참가 상태가 끝나면 제거됩니다."
 TFRKC_xfocus_CONTINUITY_idea_service:0 "서울로 이어지는 행정"
 TFRKC_xfocus_CONTINUITY_idea_service_desc:0 "서울의 법적 정통성을 지원하며 독자 결정을 일부 양보합니다."
 TFRKC_xfocus_CONTINUITY_idea_claim:0 "계승을 주장하는 직인"
 TFRKC_xfocus_CONTINUITY_idea_claim_desc:0 "위원회가 스스로 국가의 대표를 자처합니다. 결재는 빨라지지만 정통성 논쟁이 커집니다."
 TFRKC_xfocus_TAEBAEK_idea_system:0 "산간 연락초소"
 TFRKC_xfocus_TAEBAEK_idea_system_desc:0 "산간 지역의 연락과 보급을 유지하는 대신 행정 비용이 듭니다."
 TFRKC_xfocus_TAEBAEK_idea_mountain:0 "능선의 방어계획"
 TFRKC_xfocus_TAEBAEK_idea_mountain_desc:0 "고립된 거점을 방어하는 준비에 집중합니다. 실제 내전 참가 상태가 끝나면 제거됩니다."
 TFRKC_xfocus_TAEBAEK_idea_constitution:0 "군도 지켜야 할 규칙"
 TFRKC_xfocus_TAEBAEK_idea_constitution_desc:0 "헌정 협력을 준비하며 지휘부의 단독 결정을 제한합니다."
 TFRKC_xfocus_TAEBAEK_idea_garrison:0 "산악 군사국가"
 TFRKC_xfocus_TAEBAEK_idea_garrison_desc:0 "군 지휘권이 민간 행정까지 맡아 작전을 앞세웁니다."
 TFRKC_xfocus_FARMERS_idea_system:0 "공동 수매장"
 TFRKC_xfocus_FARMERS_idea_system_desc:0 "공동 수매로 지역 자원을 모으되 민간의 부담을 함께 기록합니다."
 TFRKC_xfocus_FARMERS_idea_local_guards:0 "마을 방위의 연락망"
 TFRKC_xfocus_FARMERS_idea_local_guards_desc:0 "성인 지역 방위대가 자기 생활권의 보급을 유지합니다. 실제 내전 참가 상태가 끝나면 제거됩니다."
 TFRKC_xfocus_FARMERS_idea_federation:0 "농민의 동의 가격"
 TFRKC_xfocus_FARMERS_idea_federation_desc:0 "농민 대표의 동의를 거쳐 수매하며 지역의 신뢰를 얻습니다."
 TFRKC_xfocus_FARMERS_idea_agrostate:0 "배급을 위한 명령"
 TFRKC_xfocus_FARMERS_idea_agrostate_desc:0 "강제수매로 자원을 더 모으지만 안정과 행정의 부담을 감수합니다."
 TFRKC_xfocus_COVENANT_idea_system:0 "새벽의 급식표"
 TFRKC_xfocus_COVENANT_idea_system_desc:0 "구호시설의 생활을 유지하는 데 민간 자원이 들어갑니다."
 TFRKC_xfocus_COVENANT_idea_stewards:0 "구호 호송의 질서"
 TFRKC_xfocus_COVENANT_idea_stewards_desc:0 "성인 호송조직이 방위와 구호를 함께 맡습니다. 실제 내전 참가 상태가 끝나면 제거됩니다."
 TFRKC_xfocus_COVENANT_idea_community:0 "믿지 않아도 받는 빵"
 TFRKC_xfocus_COVENANT_idea_community_desc:0 "구호의 권리를 신앙 고백과 분리합니다."
 TFRKC_xfocus_COVENANT_idea_theocracy:0 "계시가 된 행정"
 TFRKC_xfocus_COVENANT_idea_theocracy_desc:0 "종말론적 권위가 행정을 지배해 결속을 얻고 생산과 신뢰를 잃습니다."
 TFRKC_xfocus_TAIWAN_idea_system:0 "망명의 생활망"
 TFRKC_xfocus_TAIWAN_idea_system_desc:0 "망명 공동체의 숙련을 보존하며 정착의 비용을 치릅니다."
 TFRKC_xfocus_TAIWAN_idea_cadres:0 "적은 병력의 참모부"
 TFRKC_xfocus_TAIWAN_idea_cadres_desc:0 "숙련 간부의 경험을 지휘와 훈련에 집중합니다. 실제 내전 참가 상태가 끝나면 제거됩니다."
 TFRKC_xfocus_TAIWAN_idea_settlement:0 "이곳의 내일"
 TFRKC_xfocus_TAIWAN_idea_settlement_desc:0 "정착 공동체의 생활을 우선하며 원정 준비의 속도를 양보합니다."
 TFRKC_xfocus_TAIWAN_idea_return_plan:0 "돌아갈 날의 명부"
 TFRKC_xfocus_TAIWAN_idea_return_plan_desc:0 "귀환 준비에 역량을 모으지만 한국에서의 생활 기반은 부담을 겪습니다."
 TFRKC_xfocus_DAEDEOK_idea_system:0 "보존된 연구노트"
 TFRKC_xfocus_DAEDEOK_idea_system_desc:0 "연구의 연속성을 유지하되 생활과 연구의 비용을 함께 부담합니다."
 TFRKC_xfocus_DAEDEOK_idea_signals:0 "실험실의 교신규정"
 TFRKC_xfocus_DAEDEOK_idea_signals_desc:0 "항공·전자 장비의 경험을 모으고 통신 보안을 유지합니다. 실제 내전 참가 상태가 끝나면 제거됩니다."
 TFRKC_xfocus_DAEDEOK_idea_public:0 "공개 심사위원회"
 TFRKC_xfocus_DAEDEOK_idea_public_desc:0 "공공 연구의 신뢰를 높이는 대신 심사와 공개에 시간이 듭니다."
 TFRKC_xfocus_DAEDEOK_idea_technocrat:0 "사회 전체의 실험계획"
 TFRKC_xfocus_DAEDEOK_idea_technocrat_desc:0 "연구진에게 국가의 결정을 맡깁니다. 연구의 속도가 주민의 동의를 대신합니다."
 TFRKC_xfocus_RAIL_idea_system:0 "서로 맞춘 시간표"
 TFRKC_xfocus_RAIL_idea_system_desc:0 "운송의 효율을 높이기 위해 정치적 중재 비용을 지불합니다."
 TFRKC_xfocus_RAIL_idea_escorts:0 "호송 관제실"
 TFRKC_xfocus_RAIL_idea_escorts_desc:0 "성인 호송병력의 연락을 개선하지만 무리한 공세에는 신중합니다. 실제 내전 참가 상태가 끝나면 제거됩니다."
 TFRKC_xfocus_RAIL_idea_neutral:0 "중립의 운임표"
 TFRKC_xfocus_RAIL_idea_neutral_desc:0 "누구에게나 같은 규칙을 적용해 민간 신뢰를 얻습니다."
 TFRKC_xfocus_RAIL_idea_warlord:0 "선로 위의 지휘권"
 TFRKC_xfocus_RAIL_idea_warlord_desc:0 "군벌의 지휘가 수송을 우선 배정하고 민간의 몫을 줄입니다."
 TFRKC_xfocus_WHITE_NIGHT_idea_system:0 "분리 보관된 문서"
 TFRKC_xfocus_WHITE_NIGHT_idea_system_desc:0 "정보를 분리해 보존하지만 행정의 공개성과 속도는 줄어듭니다."
 TFRKC_xfocus_WHITE_NIGHT_idea_field_liaison:0 "현장 연락관"
 TFRKC_xfocus_WHITE_NIGHT_idea_field_liaison_desc:0 "정보와 작전의 연락을 개선하고 공작 유지 비용을 감수합니다. 실제 내전 참가 상태가 끝나면 제거됩니다."
 TFRKC_xfocus_WHITE_NIGHT_idea_return:0 "봉인되는 비밀권한"
 TFRKC_xfocus_WHITE_NIGHT_idea_return_desc:0 "민간의 감독을 인정하고 비밀조직의 자율을 제한합니다."
 TFRKC_xfocus_WHITE_NIGHT_idea_shadow:0 "보이지 않는 결재선"
 TFRKC_xfocus_WHITE_NIGHT_idea_shadow_desc:0 "정보기관이 통치를 지속하며 공작 능력과 민간 불신을 함께 키웁니다."
 TFRKC_xfocus_CHEONGSONG_idea_system:0 "서로 서명한 생존협약"
 TFRKC_xfocus_CHEONGSONG_idea_system_desc:0 "서로 다른 집단이 최소 약속을 지키며 불신을 줄입니다."
 TFRKC_xfocus_CHEONGSONG_idea_mixed_command:0 "혼성부대의 규정"
 TFRKC_xfocus_CHEONGSONG_idea_mixed_command_desc:0 "지휘 경험의 차이를 훈련으로 줄이지만 시간과 조직의 비용을 치릅니다. 실제 내전 참가 상태가 끝나면 제거됩니다."
 TFRKC_xfocus_CHEONGSONG_idea_amnesty:0 "지켜지는 약속"
 TFRKC_xfocus_CHEONGSONG_idea_amnesty_desc:0 "공로와 사면을 공개적으로 심사해 신뢰를 얻습니다."
 TFRKC_xfocus_CHEONGSONG_idea_sentences:0 "남겨 둔 형량"
 TFRKC_xfocus_CHEONGSONG_idea_sentences_desc:0 "지휘부가 형량을 통제해 복종을 얻고 신뢰를 잃습니다."
 TFRKC_xfocus_IMPERIAL_idea_system:0 "왕관을 위한 회계"
 TFRKC_xfocus_IMPERIAL_idea_system_desc:0 "의전과 지역 행정을 함께 유지하는 비용을 부담합니다."
 TFRKC_xfocus_IMPERIAL_idea_retinue:0 "작은 궁정의 방위대"
 TFRKC_xfocus_IMPERIAL_idea_retinue_desc:0 "약한 출발의 방위 조직을 정비하되 공세보다 준비에 시간을 씁니다. 실제 내전 참가 상태가 끝나면 제거됩니다."
 TFRKC_xfocus_IMPERIAL_idea_constitutional:0 "의회가 지키는 왕관"
 TFRKC_xfocus_IMPERIAL_idea_constitutional_desc:0 "왕권을 헌법 아래 두어 신뢰를 얻고 군주의 결재권을 제한합니다."
 TFRKC_xfocus_IMPERIAL_idea_personal:0 "황제의 결재"
 TFRKC_xfocus_IMPERIAL_idea_personal_desc:0 "가상 군주의 친정으로 결정을 집중합니다. 혈통의 불안이 통치의 불안으로 남습니다."
 TFRKC_xfocus_IMPERIAL_idea_baekje:0 "옛 이름의 새 국가"
 TFRKC_xfocus_IMPERIAL_idea_baekje_desc:0 "백제 계승의 지역 상징을 앞세우되 보편적 정통성의 논쟁을 감수합니다."
 TFRKC_xfocus_UNDERGROUND_idea_system:0 "역무실의 생활망"
 TFRKC_xfocus_UNDERGROUND_idea_system_desc:0 "조직의 피난과 구호 운영 원칙입니다. 비영토 단계에서는 호스트 전체의 국가 보너스로 지급하지 않습니다."
 TFRKC_xfocus_UNDERGROUND_idea_wardens:0 "성인 경비조의 연락"
 TFRKC_xfocus_UNDERGROUND_idea_wardens_desc:0 "지상 국가가 실제 성립한 뒤에만 쓸 수 있는 방위 운영안입니다. 실제 내전 참가 상태가 끝나면 제거됩니다."
 TFRKC_xfocus_UNDERGROUND_idea_autonomy:0 "서로 다른 층의 협약"
 TFRKC_xfocus_UNDERGROUND_idea_autonomy_desc:0 "자치 협약은 조직과 지상 주민의 권리를 함께 요구합니다."
 TFRKC_xfocus_UNDERGROUND_idea_surface:0 "지상으로 향한 명부"
 TFRKC_xfocus_UNDERGROUND_idea_surface_desc:0 "지상 진출에 조직을 집중하며 생활과 행정의 비용을 치릅니다."
 TFRKC_xfocus_HOMECOMING_idea_system:0 "돌아온 사람의 명부"
 TFRKC_xfocus_HOMECOMING_idea_system_desc:0 "귀환장병의 경험을 보존하며 치료와 생활에 자원을 씁니다."
 TFRKC_xfocus_HOMECOMING_idea_veterans:0 "숙련의 연락망"
 TFRKC_xfocus_HOMECOMING_idea_veterans_desc:0 "숙련된 장병의 지휘를 개선하되 보급과 정비 비용이 필요합니다. 실제 내전 참가 상태가 끝나면 제거됩니다."
 TFRKC_xfocus_HOMECOMING_idea_home:0 "돌아갈 일상"
 TFRKC_xfocus_HOMECOMING_idea_home_desc:0 "장병과 민간의 회복을 우선하며 전쟁 열기를 낮춥니다."
 TFRKC_xfocus_HOMECOMING_idea_revenge:0 "복수의 다음 전쟁"
 TFRKC_xfocus_HOMECOMING_idea_revenge_desc:0 "복수의 목표로 결속을 높이지만 삶과 행정의 회복을 미룹니다."
