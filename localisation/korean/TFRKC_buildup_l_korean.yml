l_korean:
 # New TFRKC buildup prose, 2026-11-18. Existing story localisation is not overwritten.
 TFRKC_buildup_preview: "내전 전야: 추가 사건 18편 미리보기"
 TFRKC_buildup_preview_desc: "본문과 사진을 순서대로 확인합니다. 선택 효과·준비도·날짜·전쟁 상태는 바뀌지 않습니다."
 TFRKC_buildup_preview_next: "다음 장면으로."
 TFRKC_buildup_preview_done: "미리보기를 마친다."
 TFRKC_buildup_1_t: "종점에서 내린 사람들"
 TFRKC_buildup_1_d: "막차가 전주에 도착했을 때, 터미널 전광판에서는 여전히 도착 예정이라는 글자가 깜빡이고 있었다. 기사는 시동을 끄고도 한동안 문을 열어 두었다. 누군가는 광장으로 가는 길을 물었고, 누군가는 그쪽을 피해 집으로 갈 수 있는 길을 물었다. 같은 버스에서 내린 사람들이 서로 반대 방향을 가리키고 있었다.\n\n편의점 주인은 셔터를 절반쯤 내린 채 종이컵에 물을 따라 주었다. 탄핵을 외치던 청년이 받아 든 컵을, 제복을 입은 경찰도 받아 들었다. 둘은 눈을 마주치지 않았다. 가게 안의 텔레비전은 같은 장면을 세 번째 보여 주었다. 화면 아래의 속보가 바뀔 때마다 사람들의 휴대전화가 조금 늦게 울렸다.\n\n집회가 언제 끝나느냐는 질문에 누구도 시간을 말하지 못했다. 경찰은 돌아가 달라고 했고, 사람들은 대답을 듣고 돌아가겠다고 했다. 주인은 빈 생수 상자를 접다가 멈췄다. 오늘 팔지 못한 물건보다 내일 문을 열 수 있을지가 더 신경 쓰였다. 아직 거리가 두 편으로 나뉜 것은 아니었다. 다만 서로가 돌아가야 한다고 생각하기 시작했다."
 TFRKC_buildup_1_a: "귀가 교통편과 현장 구호를 지원하라."
 TFRKC_buildup_1_a_tt: "정치력: -8\n안정도: +0.5%\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_1_b: "교통 통제에 인력을 집중하라."
 TFRKC_buildup_1_b_tt: "정치력: +3\n안정도: -0.5%\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_2_t: "접수되지 않은 분실물"
 TFRKC_buildup_2_d: "경찰서 민원실 책상 위에는 주인을 알 수 없는 물건들이 놓였다. 금이 간 휴대전화, 한 짝뿐인 운동화, 번호가 적힌 수첩이었다. 민원인은 물건을 찾으러 왔다고 말하다가 사람을 찾으러 왔다고 고쳐 말했다. 직원은 다른 양식을 꺼냈다. 새 양식에도 마지막으로 본 장소를 쓰는 칸은 있었다.\n\n현장의 기록은 아직 맞지 않았다. 이송된 병원과 도착한 병원이 다르고, 확인했다는 기관에서는 확인 중이라는 답이 돌아왔다. 일부 명단은 서로 겹쳤다. 누구를 어떤 이유로 데려갔는지와 누구에게 그 사실을 알려야 하는지가 다른 부서의 일이었다. 가족들은 각자의 접수번호를 적은 종이를 나란히 놓고 같은 전화번호로 번갈아 전화를 걸었다.\n\n직원 한 명이 퇴근 시간이 지난 뒤에도 자리를 지켰다. 내일 오시라는 말이 오늘 밤 어디에 가 있어야 한다는 뜻은 아니었기 때문이다. 상부에서는 확인되지 않은 내용을 안내하지 말라는 지시가 내려왔다. 그는 전화기 옆에 빈 종이를 한 장 더 놓았다. 확인할 수 없는 말과 아무 말도 해 주지 않는 것 사이에, 자신이 맡을 수 있는 일이 남아 있을 것 같았다."
 TFRKC_buildup_2_a: "병원·경찰 연락 창구를 하나로 묶어라."
 TFRKC_buildup_2_a_tt: "정치력: -6\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_2_b: "확인된 자료만 기존 절차로 안내하라."
 TFRKC_buildup_2_b_tt: "정치력: +2\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_3_t: "열세 개의 빈자리"
 TFRKC_buildup_3_d: "추모 장소에 놓인 의자는 열세 개였다. 누가 준비했는지는 분명하지 않았다. 꽃을 내려놓는 사람들은 잠시 의자 앞에 섰다가 다음 사람에게 자리를 비켜 주었다. 준비한 사람은 이름표를 붙이지 않았다. 확인되지 않은 이름을 먼저 적어 넣지 말아 달라는 부탁이 있었기 때문이다.\n\n사람들은 저마다 다른 것을 기억했다. 한 사람은 연기 냄새를, 다른 사람은 전화가 끊어진 시간을 이야기했다. 사망한 이들이 누구였고 어디에 속했느냐는 질문을 던지는 방송 진행자에게, 현장에 있던 사람은 아직 우리가 모르는 것을 대신 결정하지 말아 달라고 말했다. 그 말이 끝나기 전에 다음 질문이 이어졌다.\n\n정부의 감형 발표를 받아 든 사람들도 그 앞에서는 환호하지 않았다. 살아서 돌아올 수 있는 사람과 돌아오지 못할 사람의 문제는 같은 발표로 정리되지 않았다. 저녁이 되자 바람에 꺼진 촛불을 옆 사람이 다시 붙여 주었다. 처음에는 고개를 숙이기 위해 모인 자리였다. 사람들이 흩어진 뒤에는 진상을 밝히라는 문장이 남았다."
 TFRKC_buildup_3_a: "독립적인 사실 확인과 추모를 보장하라."
 TFRKC_buildup_3_a_tt: "정치력: -10\n안정도: +0.5%\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_3_b: "추모는 허용하되 집회 구역을 제한하라."
 TFRKC_buildup_3_b_tt: "정치력: +3\n안정도: -0.5%\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_4_t: "오늘은 배달하지 않습니다"
 TFRKC_buildup_4_d: "물류센터 입구에 차들이 줄을 섰다. 기사들은 차에서 내려 담배를 피우거나 휴대전화 지도를 들여다보았다. 지도에는 붉은 정체 구간이 표시되어 있었지만, 통과할 수 없는 이유까지 적혀 있지는 않았다. 앞쪽 도로에서는 전날 밤의 충돌로 불에 탄 차량을 치우고 있었다. 집회는 우회로까지 이어졌고, 뒤쪽에서는 운행을 마치지 못한 차들이 새벽 배차 시간과 겹치기 시작했다.\n\n기사는 거래처에 전화를 걸어 물건이 상한 것이 아니라 길이 막힌 것이라고 설명했다. 거래처에서는 그것을 설명해도 손님이 기다려 주지는 않는다고 답했다. 센터에서는 운행을 강행하라는 말과 기사 안전을 확인하라는 말이 따로 내려왔다. 어느 지시를 따르든 누군가는 자신의 책임이 아니라고 말할 준비가 되어 있었다.\n\n차량 유리 안쪽에 오늘은 배달하지 않는다는 종이가 붙었다. 그것은 파업 선언이 아니라 다음 날까지 기다리기로 했다는 뜻이었다. 그러나 저녁 뉴스에서는 물류 마비라는 제목 아래 그 종이가 확대되었다. 마을 가게에서는 우유가 늦었고, 병원에서는 예정된 납품을 다시 확인했다. 정치가 멀리 있다고 생각하던 사람들에게도 도착하지 않는 물건이 생겼다."
 TFRKC_buildup_4_a: "운송업계와 우회 운행·보상안을 협의하라."
 TFRKC_buildup_4_a_tt: "정치력: -7\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_4_b: "필수 물자 수송부터 우선 확보하라."
 TFRKC_buildup_4_b_tt: "정치력: +2\n안정도: -0.5%\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_5_t: "삭제된 영상의 두 번째 사본"
 TFRKC_buildup_5_d: "영상은 열일곱 초였다. 촬영한 사람의 숨소리가 가장 크게 들렸고, 화면은 몇 번이나 바닥을 향했다. 누가 먼저 무엇을 했는지는 그 안에 없었다. 그럼에도 사람들은 그것을 증거라고 불렀다. 서로 반대되는 주장을 하는 게시물에 같은 영상이 붙었다.\n\n삭제된 원본 대신 자막이 입혀진 사본이 돌아다녔다. 찍힌 날짜를 바꾼 것도 있었고, 다른 지역의 화면을 이어 붙인 것도 있었다. 확인 기사를 쓰던 기자에게 편집국은 지금 올리지 않으면 아무도 읽지 않을 것이라고 했다. 그는 제목에서 단정하는 말을 하나 지웠다가, 너무 약하다는 의견을 받고 다시 다른 단어를 찾았다.\n\n정부는 허위 정보에 대응하겠다고 발표했다. 발표문을 읽은 사람은 자신이 본 영상이 왜 틀렸는지를 찾았지만, 문서에는 유포자를 엄정하게 조치하겠다는 문장이 더 길었다. 밤이 되자 새로운 사본이 올라왔다. 이번 영상의 첫 문장은 정부가 지우기 전에 저장하라는 말이었다. 사실을 기다리는 동안, 믿고 싶은 이야기는 이미 여러 번 내려받아졌다."
 TFRKC_buildup_5_a: "확인 자료와 정정 근거를 공개하라."
 TFRKC_buildup_5_a_tt: "정치력: -5\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_5_b: "수사기관에 확산 차단을 요청하라."
 TFRKC_buildup_5_b_tt: "정치력: +2\n안정도: -0.5%\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_6_t: "구청의 접이식 탁자"
 TFRKC_buildup_6_d: "구청 회의실이 가득 차 복도에 접이식 탁자가 놓였다. 상인회 대표는 깨진 유리창 사진을 가져왔고, 집회 참가자의 가족은 접견 시간을 적은 메모를 가져왔다. 담당자는 한 분씩 말씀해 달라고 했다. 사람들은 이미 여러 곳에서 한 분씩 말하고 돌아온 뒤였다.\n\n회의는 구호 지원을 이야기하다 집회 허용 구역으로, 피해 보상을 이야기하다 검거 기준으로 옮겨 갔다. 같은 동네에서 살던 사람들이 서로 다른 사건을 겪은 것처럼 말했다. 구청장은 어느 쪽도 자신의 권한만으로 해결할 수 없다는 것을 알았다. 중앙에 보고하겠다는 말을 세 번 한 뒤에는 자신도 그 말이 어떤 약속처럼 들리는지 생각하게 되었다.\n\n누군가 다음 회의 날짜라도 잡자고 했다. 다른 누군가는 만나기만 해서 무엇이 달라지느냐고 물었다. 탁자 끝에서 조용히 듣고 있던 가게 주인이 다음에는 유리 수리비 견적서를 가져오겠다고 말했다. 대답은 작았지만 회의록에는 적을 수 있었다. 동네에는 아직 같이 앉을 수 있는 자리가 남아 있었다. 그 자리를 유지하는 데에도 이제 비용이 들었다."
 TFRKC_buildup_6_a: "지역 협의와 피해 접수를 지원하라."
 TFRKC_buildup_6_a_tt: "정치력: -8\n안정도: +0.5%\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_6_b: "중앙 대응 방침이 정해질 때까지 기다려라."
 TFRKC_buildup_6_b_tt: "정치력: +3\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_7_t: "입금 예정일"
 TFRKC_buildup_7_d: "전역할 때 받은 안내서에는 지원금이 입금될 날짜가 적혀 있었다. 예비역은 그 날짜에 맞춰 병원 예약을 잡았다. 계좌에는 돈이 들어오지 않았다. 담당 창구에서는 신청이 누락된 것은 아니라며 다음 지급 일정에 포함될 것이라고 설명했다. 그는 예약부터 취소하고 나서 다음 일정이 언제인지 다시 물었다.\n\n대기실에는 비슷한 안내서를 든 사람들이 앉아 있었다. 누군가는 현 정부를 욕했고, 누군가는 지금 이 나라에 돈이 어디 있겠느냐고 했다. 옆자리 사람은 어느 쪽에도 대답하지 않고 진료비 영수증을 봉투에 다시 넣었다. 그들이 같이 전쟁을 겪었다는 사실이 같은 정치적 결론에 도착했다는 뜻은 아니었다.\n\n건물 밖에서 한 남자가 연락처를 나눠 주었다. 서로 도울 사람들을 모으고 있다는 말이었다. 급한 사람에게는 회비를 받지 않겠다고도 했다. 예비역은 종이를 버리지 않았다. 당장 가입하겠다는 뜻은 아니었다. 적어도 그 번호로 전화하면 담당자가 바뀌었다는 안내를 듣지 않아도 될 것 같았다. 국가가 약속한 날짜와 누군가 내민 연락처 사이에서, 그는 연락처를 지갑에 넣었다."
 TFRKC_buildup_7_a: "지연된 지원금 지급을 우선 처리하라."
 TFRKC_buildup_7_a_tt: "정치력: -10\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_7_b: "심사를 유지하고 기존 창구를 보강하라."
 TFRKC_buildup_7_b_tt: "정치력: +2\n안정도: -0.5%\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_8_t: "우리 동네는 우리가"
 TFRKC_buildup_8_d: "상가 번영회가 야간 순찰표를 붙였다. 다른 지역의 집회가 폭동으로 번지고 상점이 약탈당했다는 소식이 계기였다. 처음에는 문이 열린 가게와 꺼진 가로등을 확인하는 일이었다. 경찰의 출동이 늦어졌다는 말이 퍼진 뒤 참가자가 늘었다. 조끼는 서로 달랐고, 손전등은 집에서 가져온 것이었다. 첫 회의에서 가장 오래 논의한 것은 순찰 뒤 마실 커피를 어느 가게에서 준비할지였다.\n\n며칠 뒤 순찰대가 낯선 차량을 세웠다. 배달 기사는 신분증을 보여 줄 이유가 없다고 했다. 순찰대원은 동네 사람을 지키기 위해서라고 답했다. 둘 다 자신이 시비를 거는 쪽이라고 생각하지 않았다. 인근 파출소에 문의가 들어왔지만, 담당 경찰도 협조를 요청할 범위와 제지해야 할 범위를 분명하게 안내받지 못했다.\n\n새로 인쇄한 순찰표에는 구역 담당자 옆으로 출입 확인이라는 칸이 생겼다. 서명을 하지 않은 상점에도 표는 붙었다. 스스로를 지키겠다는 말은 여전히 설득력이 있었다. 다만 누가 우리 동네 사람인지 정할 권한까지 그 말에 들어 있었는지는 아무도 처음에 묻지 않았다. 문을 잠그던 주인은 다음 회의에 꼭 나가야겠다고 생각했다. 이제 불참도 뜻이 있는 행동처럼 받아들여졌기 때문이다."
 TFRKC_buildup_8_a: "경찰 협조 아래 활동 범위를 명문화하라."
 TFRKC_buildup_8_a_tt: "정치력: -6\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_8_b: "지역의 자율적인 대응에 맡겨라."
 TFRKC_buildup_8_b_tt: "정치력: +3\n안정도: -0.5%\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_9_t: "비어 있는 주말 시간표"
 TFRKC_buildup_9_d: "당직실 벽에 걸린 주말 시간표에서 외출 칸이 지워졌다. 중대장은 대비 태세를 확인하기 위한 조치라고 설명했다. 병사는 휴가를 취소한 것인지 물었다가 아직 결정된 바 없다는 답을 들었다. 그는 어머니에게 이번 주에는 내려가지 못할 수도 있다고 문자를 보냈다. 문장 끝에는 별일은 아니라는 말을 붙였다.\n\n참모부에는 수도권 이동에 필요한 차량과 연락망을 다시 점검하라는 요구가 내려왔다. 문서에는 상황 발생 시라는 표현이 여러 번 나왔다. 어떤 상황인지는 회의에서 설명하겠다고 했다. 장교들은 전투 준비를 점검하는 것과 국내 치안 임무를 맡는 것이 같은 질문으로 끝나지 않는다는 것을 알고 있었다. 그렇다고 아직 내려오지 않은 명령을 두고 먼저 반대 의견을 기록할 사람도 많지 않았다.\n\n저녁 점호 뒤 병사들은 휴대전화를 돌려받고 거리의 영상을 보았다. 화면 속 도로를 아는 사람이 있었다. 그곳에 가족이 사는 사람도 있었다. 내일 아침 집합 시간이 평소보다 삼십 분 빨라졌다는 공지가 올라왔다. 아무도 이유를 묻지 않았다. 묻지 않는다고 걱정하지 않는 것은 아니었지만, 당직일지에는 이상 없음이라고 적혔다."
 TFRKC_buildup_9_a: "국내 임무의 법적 범위와 보고 절차를 확인하라."
 TFRKC_buildup_9_a_tt: "정치력: -5\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_9_b: "대비 태세 점검을 계속하라."
 TFRKC_buildup_9_b_tt: "정치력: +3\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_10_t: "미처 닫지 못한 회의록"
 TFRKC_buildup_10_d: "전국의 상황 보고가 한 장의 표로 묶였다. 집회, 운송 차질, 민원, 경찰 지원 요청이 각각 다른 색으로 표시되어 있었다. 색을 모두 지우고 인쇄하면 어느 지역이 더 위태로운지 한눈에 알 수 없었다. 담당자는 프린터 설정을 바꾸고 같은 자료를 다시 뽑았다.\n\n회의에서는 어느 대응이 효과가 있었는지보다 누가 먼저 상황 악화를 경고했는지를 확인하는 데 시간이 걸렸다. 지방에서 보낸 협의 요청과 예산 지원 건은 별첨으로 넘어갔다. 참석자 한 명이 어느 시점부터 질서 회복이 일상 복구와 다른 뜻으로 쓰이게 되었느냐고 물었다. 답변 대신 다음 보고자의 이름이 불렸다.\n\n회의가 끝난 뒤 속기 담당자는 결론 부분을 비워 두었다. 논의가 없었던 것은 아니었다. 서로 양립할 수 없는 의견이 나왔고, 더 검토하자는 지시도 있었다. 그러나 밖에 설명할 문장으로 정리할 수 있는 결정은 없었다. 그는 저장 버튼을 누르고 파일 이름 뒤에 미완이라고 붙였다. 같은 폴더에는 지난 회의의 미완 파일도 남아 있었다."
 TFRKC_buildup_10_a: "현장 협의와 구호 업무를 먼저 정리하라."
 TFRKC_buildup_10_a_tt: "정치력: -4\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_10_b: "비상 대응 검토를 서둘러라."
 TFRKC_buildup_10_b_tt: "정치력: +3\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_11_t: "도착하지 않은 손님"
 TFRKC_buildup_11_d: "식당 주인은 예약석에 수저를 놓아 두었다. 방송에서 계엄을 알렸을 때도 손님이 올지부터 생각했다. 이미 재료를 손질했고 종업원은 막차 시간을 물었다. 텔레비전의 음량을 올리자 옆 가게에서도 같은 목소리가 들려왔다. 거리에서는 누군가 셔터를 내리기 시작했다.\n\n손님에게 전화를 걸었지만 연결되지 않았다. 예약 취소 문자는 그보다 늦게 왔다. 죄송하다는 말이 두 번 적혀 있었다. 주인은 종업원에게 먼저 들어가라고 했다. 남은 음식을 싸 주면서 내일은 연락을 보고 나오라는 말을 덧붙였다. 내일 문을 닫겠다고 결정한 것은 아니었다. 문을 연다고 약속할 수 없었을 뿐이다.\n\n식탁마다 놓였던 물컵을 거두는 동안 방송에서는 국민의 평온한 일상을 이야기했다. 그는 리모컨을 찾아 화면을 껐다. 갑자기 조용해진 가게 안에서 냉장고 소리가 크게 들렸다. 정치가 무엇을 결정했든, 내일 다시 팔 수 없는 재료는 오늘 안에 정리해야 했다. 손님이 오지 않은 자리는 어느새 국가의 상황을 보여 주는 풍경이 되어 있었다."
 TFRKC_buildup_11_a: "생활 정보와 민원 안내를 계속 제공하라."
 TFRKC_buildup_11_a_tt: "정치력: -3\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_11_b: "비상 방송 전달에 집중하라."
 TFRKC_buildup_11_b_tt: "정치력: +2\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_12_t: "명령서의 수신란"
 TFRKC_buildup_12_d: "부대 상황실의 전화가 울렸다. 당직장교는 지시를 받아 적다가 발신 기관을 다시 물었다. 상대는 위에서 내려온 내용이라고 했다. 어느 위인지 확인하는 질문이 잠시 이어졌다. 통화가 끝나자 당직장교는 메모를 정식 명령철에 넣지 않고 책상 앞에 놓았다.\n\n이미 내려온 명령과 지금 들은 지시가 맞지 않는 부분이 있었다. 지휘관은 서면 확인을 요청하라고 했다. 참모 한 명은 그런 절차가 지연으로 보일 수 있다고 말했다. 지휘관은 무엇을 지연했다는 판단을 받더라도 자신이 어떤 명령을 받았는지부터 남겨야 한다고 답했다. 누구도 탁자를 치거나 목소리를 높이지 않았다. 회의실이 조용할수록 전화벨은 더 날카롭게 들렸다.\n\n병사들에게는 대기하라는 말이 전달되었다. 구체적인 임무가 내려오지 않았으므로 구체적인 질문에도 대답할 수 없었다. 당직장교는 수신란에 자기 이름을 적었다. 명령을 받았다는 서명과 명령에 동의한다는 서명이 다르다는 사실을, 나중에도 설명할 수 있을지 생각하면서였다. 복사기에서 나온 종이는 아직 따뜻했다."
 TFRKC_buildup_12_a: "지휘 계통과 서면 명령 확인을 보장하라."
 TFRKC_buildup_12_a_tt: "정치력: -4\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_12_b: "현행 계통을 통한 신속 보고를 지시하라."
 TFRKC_buildup_12_b_tt: "정치력: +2\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_13_t: "두 장의 공문"
 TFRKC_buildup_13_d: "행정기관에 같은 업무를 다루는 공문 두 장이 도착했다. 하나는 앞선 지시를 유지하라고 했고 다른 하나는 추가 통보가 있을 때까지 집행을 보류하라고 했다. 담당자는 발신 시간을 비교했다. 나중에 온 문서가 먼저 작성되어 있었다. 어느 것을 최신 지시로 보아야 하는지 묻는 전화에는 상부에서 확인 중이라는 대답이 돌아왔다.\n\n계엄의 실패는 거리의 병력이 움직임을 멈췄다는 소식보다 훨씬 많은 일을 남겼다. 누가 열쇠를 돌려받아야 하는지, 보관 중인 기록을 누구에게 넘겨야 하는지, 이미 내려진 지시로 발생한 책임을 어떻게 처리할지가 남아 있었다. 직원들은 평소처럼 결재판을 돌렸다. 다만 이번에는 결재판이 돌아오는 속도가 유난히 느렸다.\n\n민원 창구 앞에서 한 사람이 오늘도 접수가 가능한지 물었다. 담당자는 가능하다고 답했다. 그것만은 자신의 권한으로 대답할 수 있었다. 그는 두 공문을 같은 파일에 넣고 접수 도장을 꺼냈다. 국가가 서로 다른 말을 하는 동안에도 누군가는 한 가지 대답을 해야 했다. 도장이 찍힌 날짜는 같았지만, 그 종이가 어디까지 효력이 있을지는 누구도 장담하지 못했다."
 TFRKC_buildup_13_a: "행정 명령의 효력과 기록 보존을 정리하라."
 TFRKC_buildup_13_a_tt: "정치력: -5\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_13_b: "긴급 업무를 제외한 집행을 보류하라."
 TFRKC_buildup_13_b_tt: "정치력: +2\n안정도: -0.5%\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_14_t: "전화번호가 바뀌었습니다"
 TFRKC_buildup_14_d: "권한대행 체제의 연락망이 새로 내려왔다. 비서실 직원은 예전 종이를 떼어 내고 새 번호를 붙였다. 지워진 이름 옆에는 아직 연필 자국이 남아 있었다. 그 사이에도 전화가 들어왔다. 상대는 지금 결정을 받을 수 있는 사람이 누구인지 먼저 물었다.\n\n정부가 계속된다는 말은 법률 문서에서 분명했다. 실제 업무에서는 누구의 결재를 기다려야 하는지와 누구의 판단을 나중에 책임질 수 있는지가 별개의 질문이었다. 어떤 기관은 새 지시를 기다렸고, 다른 기관은 새 지시가 없으므로 종전대로 처리했다. 두 기관이 함께 맡는 일은 어느 쪽으로도 움직이지 않았다.\n\n직원은 전화를 옮겨 주다가 한 번 멈췄다. 수화기 너머의 지방 공무원이 제발 오늘 안에는 담당자를 정해 달라고 했다. 그곳에서는 같은 질문에 답하러 온 주민들이 아직 복도에서 기다리고 있었다. 그는 전화를 끊지 않은 채 자리에서 일어났다. 새 연락망은 이미 배포되었다. 그 연락망으로 일이 이어지는지는 지금부터 확인해야 했다."
 TFRKC_buildup_14_a: "대행 체제의 결재·연락 창구를 일원화하라."
 TFRKC_buildup_14_a_tt: "정치력: -5\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_14_b: "기관별로 기존 권한 안에서 대응하라."
 TFRKC_buildup_14_b_tt: "정치력: +2\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_15_t: "불을 끈 회의실"
 TFRKC_buildup_15_d: "복도 끝 회의실은 사용 예약표에 비어 있었다. 문틈 아래로 빛이 새지 않도록 안쪽 조명 일부가 꺼져 있었다. 참석자는 휴대전화를 책상 위에 놓았다. 누구도 자신을 소개하지 않았다. 서로의 보직과 목소리를 이미 알고 있었기 때문이다.\n\n그들이 이야기하는 윤석열은 더 이상 복귀시켜야 할 명령권자가 아니었다. 계엄을 준비하고도 통제하지 못한 대통령과, 그 뒤에도 책임보다 자리를 먼저 계산하는 정치권이 함께 거론되었다. 국가재건최고회의라는 이름은 이미 정해져 있었다. 아직 정하지 못한 것은 국가를 구한다는 명분이 어디까지 자신들의 권한이 될 수 있느냐는 문제였다.\n\n회의가 끝나자 서류는 각자의 가방에 나뉘어 들어갔다. 복사본을 한곳에 보관하지 않기로 했기 때문이다. 마지막으로 나온 사람이 사용하지 않은 회의실의 문을 잠갔다. 그날 밤 정부에 올라간 보고에는 특이 사항이 없다고 적혔다. 국가의 지휘 체계 안에서 일어난 일이었지만, 국가가 알도록 작성된 기록에는 남지 않았다."
 TFRKC_buildup_15_a: "확인되지 않은 동향을 조용히 추적하라."
 TFRKC_buildup_15_a_tt: "정치력: -4\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_15_b: "추측보다 현 지휘 체계의 업무에 집중하라."
 TFRKC_buildup_15_b_tt: "정치력: +2\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_16_t: "통화 중인 아버지"
 TFRKC_buildup_16_d: "윤석열이 구출되었다는 소식은 가족 단체 대화방에도 올라왔다. 아버지는 같은 영상을 두 번 보낸 뒤 이제 돌아온 것이라고 썼다. 딸은 대통령 신분과 직무 수행은 다른 문제라고 답했다. 메시지 옆의 숫자가 사라진 뒤에도 대답은 오지 않았다.\n\n뉴스에는 윤어게인 민병대를 직접 지휘하는 윤석열의 모습이 나왔다. 아버지는 그 화면을 가리키며 누가 나라를 지킬 사람인지 보라고 했다. 딸은 나라를 지키겠다는 사람들이 왜 정부의 지시를 따르지 않느냐고 물었다. 둘은 같은 식탁에서 말을 멈췄다. 어머니가 국이 식는다며 냄비를 가운데로 옮겼다.\n\n밤에 딸이 물을 마시러 나왔을 때 아버지는 베란다에서 통화하고 있었다. 내일 어디로 모이면 되느냐고 묻는 목소리가 들렸다. 아침에는 아버지의 낡은 운동화가 현관에서 사라졌다. 딸은 전화를 걸었다. 연결음이 길게 이어졌다. 화면에서 보던 일이 집 밖 어딘가에서 일어나는 일일 수만은 없다는 것을, 그녀는 그때 처음 두려워했다."
 TFRKC_buildup_16_a: "민간인의 무장조직 가담을 만류하는 안내를 내라."
 TFRKC_buildup_16_a_tt: "정치력: -4\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_16_b: "확인된 무장 활동에 수사 역량을 집중하라."
 TFRKC_buildup_16_b_tt: "정치력: +2\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_17_t: "교육청으로 가는 우편"
 TFRKC_buildup_17_d: "우편 배달원은 대전 교육청 앞에서 오토바이를 세웠다. 정문에 서 있는 사람은 어제까지 보던 경비원이 아니었다. 그는 우편물을 어디에 두면 되는지 물었다. 상대는 신분부터 확인하겠다고 했다. 가방 안에는 인사 서류와 공사 대금 청구서, 전학에 필요한 회신 봉투가 섞여 있었다.\n\n건물이 점령되었다는 사실을 그는 알고 있었다. 그래도 배달 구역표에서는 그 주소가 지워지지 않았다. 안에 있는 누군가가 접수 도장을 가져오겠다고 했다. 기다리는 동안 부산에서 비상통치가 선언되었다는 속보가 휴대전화 화면에 떴다. 서로 다른 도시의 소식이 한 화면에서 이어졌지만, 그가 해야 할 일은 수취인 확인이었다.\n\n도장을 들고 나온 사람은 담당자가 바뀌었다고 했다. 배달원은 서명란을 가리켰다. 상대는 잠시 망설이다 이름을 적었다. 그 이름이 기관을 대표할 수 있는지 우편 배달원이 판단할 수는 없었다. 그는 수령 확인을 남기고 다음 주소로 향했다. 돌아오는 길에는 정문에 새 안내문이 붙어 있었다. 같은 건물을 가리키는 길 이름은 아직 바뀌지 않았다."
 TFRKC_buildup_17_a: "민원·교육 업무의 대체 접수처를 안내하라."
 TFRKC_buildup_17_a_tt: "정치력: -4\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_17_b: "점거 시설과의 행정 연락을 중단하라."
 TFRKC_buildup_17_b_tt: "정치력: +2\n안정도: -0.5%\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_18_t: "불을 켜 둔 집"
 TFRKC_buildup_18_d: "무장해제 요구가 거부되었다는 발표가 나오자 관리사무소에는 지하 주차장을 대피소로 써도 되는지 묻는 전화가 왔다. 직원은 정해진 지침이 내려오지 않았다고 답했다. 전화를 끊고 나서는 자신도 손전등이 어디에 있는지 확인했다. 주민 한 명이 복도 소화전 앞에 쌓아 둔 택배 상자를 치웠다.\n\n인터넷에는 어느 길이 막혔다는 말과 아직 괜찮다는 말이 함께 올라왔다. 가족을 다른 지역으로 보내려던 사람은 그곳이 더 안전하다는 보장이 있는지 물었다. 누구도 보장할 수 없었다. 정부는 명령의 이행을 요구했고, 무장한 쪽은 자신들의 정당성을 되풀이했다. 발표가 이어지는 동안에도 아파트 엘리베이터에서는 다음 점검 날짜를 알리는 안내가 흘렀다.\n\n늦은 밤에도 여러 집에 불이 켜져 있었다. 짐을 싸는 집도 있었고, 출근 시간을 바꾸는 집도 있었고, 먼 곳의 가족과 계속 통화하는 집도 있었다. 아직 모두가 전쟁이라는 말을 쓰지는 않았다. 아이가 왜 자지 않느냐고 묻자 부모는 연락을 기다린다고 답했다. 무엇을 기다리는지까지 설명하면, 내일도 평소와 같을 것이라는 마지막 약속을 할 수 없을 것 같았다."
 TFRKC_buildup_18_a: "대피·의료·필수 서비스 안내를 준비하라."
 TFRKC_buildup_18_a_tt: "정치력: -5\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
 TFRKC_buildup_18_b: "치안 당국의 공식 지시를 기다리게 하라."
 TFRKC_buildup_18_b_tt: "정치력: +2\n계엄 준비도와 개전 기한에는 영향을 주지 않습니다. 이미 위기가 끝났다면 효과 없이 닫습니다."
