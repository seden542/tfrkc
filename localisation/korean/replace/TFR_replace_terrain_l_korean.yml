 rio: "리우데자네이루"
 rio_desc: "----\n§9브라질에서 두 번째로 큰 도시이자 동명의 주인 리우데자네이루는 아름다운 자연경관과 활기 넘치는 문화로 유명하며, 외국인 관광객에게 가장 인기 있는 브라질의 여행지입니다. 1565년에 설립되어 1960년까지 브라질의 수도였습니다. 이 도시는 코르코바두산 위의 거대 예수상, 팡지아수카르 산, 그리고 코파카바나와 이파네마 해변과 같은 명소들로 잘 알려져 있습니다. 리우 카니발은 삼바 음악과 화려한 행진을 선보이는 세계 최대 규모의 축제 중 하나이며, 세계에서 가장 크고 유서 깊은 축구 경기장 중 하나인 마라카낭 스타디움이 있는 곳이기도 합니다.\n\n리우데자네이루는 2016년 하계 올림픽을 개최했으며, 산, 바다, 건축물이 어우러진 독특한 도시 경관으로 유네스코 세계문화유산으로 지정되었습니다. 사회경제적 불균형과 같은 문제에도 불구하고, 리우는 라틴 아메리카의 주요 문화 및 경제 중심지로 남아 있습니다. 그러나 문화적, 경제적 영향력에도 불구하고, 많은 빈민가에서 발생하는 빈곤, 부패, 폭력 범죄와 같은 심각한 문제에 직면해 있으며, 이는 도시의 일상과 발전에 영향을 미치고 있습니다.§!\n\n§G삼바 데 자네이루!§!"
 sao_paulo: "상파울루"
 sao_paulo_desc: "----\n§9상파울루는 브라질에서 가장 큰 도시이자 동명의 주입니다. 라틴 아메리카의 주요 금융, 문화, 산업 중심지 역할을 하며 서반구와 남반구 전체에서 가장 큰 도시로 '돌의 정글'이라는 별명을 가지고 있습니다. 1554년 예수회 선교사들에 의해 설립된 이 도시는 19세기 커피 붐을 통해 명성을 얻었고 이후 산업화의 중심지가 되었습니다.\n\n상파울루는 이탈리아인, 일본인, 아랍인 디아스포라 공동체를 포함한 다양한 인구 구성으로 풍부한 문화유산을 형성한 것으로 유명합니다. 이 도시는 상파울루 미술 비엔날레와 상파울루 패션 위크 같은 주요 행사를 개최하며, 상파울루 미술관과 이비라푸에라 공원 같은 명소들이 있습니다. 이러한 경제적 영향력에도 불구하고, 상파울루는 범죄, 오염, 사회적 불평등, 심각한 교통 체증과 같은 문제에 직면해 있습니다.§!"
