# Events
 jap.66.d: "In light of the rapidly changing economic landscape and shifting balance of military power, the Japan-led PDTO has asked [Root.GetName] to join the Pacific Economic Community. Known by the abbreviation PEC, the Pacific Economic Community aims to rebuild the shattered global trade network and restore the mutual benefits of the international division of labor pursued during the late twentieth and early twenty-first centuries—the age of \"globalization.\"\n\nSome countries, especially pro-EADI states aligned with China, have denounced the PEC as a \"neo-imperialist scheme of economic plunder.\" With military tensions between PDTO and EADI now rising, however, this is regarded as politically motivated and biased criticism.\n\nThe delegation sent by Japan's Ministry of Foreign Affairs has concluded its talks with officials from our own foreign ministry, and today our country formally became a member of the PEC. China has issued a statement expressing regret." 

