 changchun: "창춘"
 changchun_desc: "----\n§9\"만리장성 너머의 진주\"로 알려진 창춘은 중국 북부 국경 지대의 살아있는 연대기입니다. 군사적 요새로서의 창춘의 기원은 요나라와 금나라 시대로 거슬러 올라가며, 청나라 시인 나란싱더의 \"변방에 가을바람이 불어 부채를 애도하고, 석양이 옛 성벽 위의 깃발을 황금빛으로 물들이네\"라는 구절은 시대를 초월한 웅장함을 영원히 기립니다. 이 도시의 복잡한 근현대사는 위만주국의 황궁과 팔대부와 같은 마루지에 새겨져 있으며, 이는 전시의 유사 수도로서의 역할을 보여주는 유적입니다. 디이자동차 설립과 함께 중국 자동차 산업의 요람으로 다시 태어난 창춘은 이제 최첨단 신에너지 및 스마트 차량 기술을 통해 국가의 그린 모빌리티 혁명을 이끌고 있습니다. 지린대학의 학술적 강점과 상징적인 \"신중국 영화계의 요람\" 창춘영화촬영소를 기반으로 이 도시는 학술적 깊이와 산업적 활력의 조화를 이루며, 시인 아이칭의 송가를 구현합니다. \"내 눈에는 눈물이 가득하다. 이 땅을 향한 내 사랑이 영혼 깊이 흐르기 때문이다.\"§!"
 dalian: "다롄"
 dalian_desc: "----\n§9하늘을 찌를 듯한 마천루 아래에서 러시아풍 첨탑과 일본식 정원이 만나는 다롄은 바다를 노래하는 서정시와도 같습니다. 19세기 식민주의의 물결에서 다롄이 가지는 현대적인 면모가 형성되었지만, 한나라 때부터 이어져온 기원은 여전히 진시탄의 바람이 빚은 거대한 바위들과 라오후탄의 절벽이 이루는 경관에서 메아리치고 있습니다. 광활한 싱하이 광장은 다롄이 일대일로의 핵심 거점으로서 가진 야망을 보여주며, 여름 거리에는 패션 위크와 황금빛 맥주 축제의 활기찬 분위기가 가득합니다. 오늘날 동북아의 해운 강자로 떠오른 다롄은 심해의 풍요로움과 스마트 제조 기술을 활용하여 대륙을 잇고 있습니다. 원대한 이상과 광범위한 연결을 담고 있는 그 이름처럼, 이 해안의 보석은 산과 바다가 만나고 역사가 미래와 춤추는 지역의 왕관이자 세계적인 무대로서 빛나고 있습니다.§!"
 shenyang: "선양"
 shenyang_desc: "----\n§9선양은 1625년에 후금의 수도가 되어, 훈강 북쪽 기슭에서 청 왕조가 세력을 확장하는 기반이 되었습니다. 선양고궁의 붉은 벽 안에는 팔각형의 이중 처마를 가진 대정전이 수백 년 전과 다름없이 서 있습니다. 세월이 흘러 20세기 초에 이땅에는 러시아의 광궤 철도가 부설되었고, 일본은 남만주 철도를 건설했습니다. 오늘날까지도 중산로는 고딕 양식의 창문틀과 꽃무늬 장식이 혼합된 모습을 간직하고 있습니다. 톄시구의 녹슨 갠트리 크레인과 주조 공장은 중화인민공화국 초기 중공업 산업의 기억을 담고 있으며, 선양기체공업집단의 전투기 생산 라인은 삼선건설의 국방 정신을 계속해서 구현하고 있습니다.\n왕조의 변화, 식민지의 흔적, 산업화의 부상이 뒤얽힌 도시 선양은 풍부한 역사 속에 겹겹이 쌓인 현대적 정체성을 끊임없이 찾아나가고 있습니다.§!"
