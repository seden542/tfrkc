# Events
 jap.66.d: "최근 급변하는 경제적 지형과 군사적 세력도에 따라, 일본을 중심으로 한 PDTO는 [Root.GetName]의 태평양 경제 공동체에 가입할 것을 요청하였습니다. 약칭으로 PEC라 칭하는 태평양 경제공동체는 파괴된 세계 무역망 재구축과 20세기 후반에서 21세기 초반의 '세계화' 시대에 추진했던 국가별 분업화를 통한 상호 수혜의 재건을 목표로 두고 있습니다.\n\n일부 국가들, 특히 중국을 중심으로 한 친 EADI 국가들의 경우 PEC 자체를 '신제국주의적 경제 침탈 야욕'으로 비난하고 있지만 이는 PDTO와 EADI 간 군사적 긴장이 고조되고 있는 지금 정치적 이유에 따른 편황된 비난으로 간주됩니다.\n\n일본 외무성에서 파견한 인력이 우리 외교부 인사들과 회동을 마쳤고, 오늘 공식적으로 우리나라는 PEC의 회원국이 되었습니다. 중국 측은 유감스럽다는 성명문을 발표했습니다." 

