l_korean:
 LOADING_TIP_0: "내가 한 가지 소원을 고를 수 있다면 전 세계 모든 기자를 죽일 것이다, 하지만 난 내가 아침 식사를 하기도 전에 지옥산 신문 기사를 받을 수 있을 것이라고 확신할 수 있다.\n- 윌리엄 셔먼"
 LOADING_TIP_1: "열정은 어떤 형태로든 오래 지속되는 성공을 이루기 위해 절대적으로 필요하다. 난 경험으로 이를 깨달았다. 열정이 없으면, 하는 모든 일은 결국 흐지부지되거나 기껏해야 평범해질 것이다.\n- 도널드 트럼프"
 LOADING_TIP_2: "사람들은 내가 도박꾼이라고 생각하지만. 나는 평생 도박을 한 적이 없다. 나에게 도박사란 슬롯머신을 하는 사람이고. 난 슬롯머신을 소유하는 것을 더 선호한다. 부동산은 아주 좋은 사업이다.\n- 도널드 트럼프"
 LOADING_TIP_3: "누구나 인생에서 좌절을 경험하고 스스로 세운 목표에 도달하지 못할 때도 있다. 그것은 인생의 일부이며 자신이 어떤 사람인지 받아들이는 과정이다.\n- 힐러리 클린턴"
 LOADING_TIP_4: "사람들은 내가 한 일에 대해 나를 판단할 수 있습니다. 그리고 누군가가 공적인 시선에 노출되면, 그렇게 판단하는 것이 자연스러운 일이라고 생각합니다. 그래서 나는 내가 누구인지, 내가 무엇을 지지하는지, 그리고 항상 무엇을 지지해 왔는지에 대해 전혀 불편함이 없습니다.\n- 힐러리 클린턴"
 LOADING_TIP_5: "중국 인민은 어떤 외세도 중국을 괴롭히거나, 억압하거나, 노예로 삼는 것을 결코 용납하지 않을 것이며, 그렇게 하려는 자는 누구든 14억 중국 인민이 피와 살로 쌓아 올린 강철의 만리장성에 머리가 깨져 피흘리게 할 것입니다!\n- 시진핑"
 LOADING_TIP_6: "내 정책에는 대안이 없다.\n- 앙겔라 메르켈"
 LOADING_TIP_7: "우리의 적들은 혁신적이고 수완이 뛰어나며 우리도 마찬가지입니다. 그들은 우리 나라와 국민을 해칠 새로운 방법을 끊임없이 고민하고 있으며, 우리도 마찬가지입니다.\n- 조지 W. 부시"
 LOADING_TIP_8: "피노체트는 더 많은 사람을 죽였어야 했다.\n- 자이르 보우소나루"
 LOADING_TIP_9: "안정적인 인종 구성이 없는 인민에는 문화적 정체성이 존재하지 않는다. 한 국가의 인종 구성이 바뀌는 것은 문화적 정체성이 바뀌는 것과 같다.\n- 오르반 빅토르"
 LOADING_TIP_10: "쉬운 삶을 위해 기도하지 말고 더 강한 사람이 되기를 기도하십시오.\n- 존 F. 케네디"
 LOADING_TIP_11: "권력이 있는 곳에 저항이 있다.\n- 미셸 푸코"
 LOADING_TIP_12: "도로 교통의 목적은 안전이 아니라 속도에 있다.\n- 야누시 코르빈미케"
 LOADING_TIP_13: "오늘 이 현충일에 우리나라는 끊임없이 이어져 온 영웅들을 기립니다. 이 자리에 계신 많은 분들이 그 증인이십니다. 우리의 애국심은 그 어느 때보다 강하게 불타오를 것입니다.\n- 버락 오바마"
 LOADING_TIP_14: "민주주의는 외세에 의해서 강요될 수 없습니다. 각 사회는 저마다의 길을 찾아야 하며, 완벽한 길이란 없습니다.\n- 버락 오바마"
 LOADING_TIP_15: "어떤 정부는 테러 앞에서 주저할 것입니다. 그러나 분명히 알아두십시오. 그들이 행동하지 않는다면, 미국이 행동할 것입니다.\n- 조지 W. 부시"
 LOADING_TIP_16: "미국의 경쟁력을 유지하려면 에너지가 저렴해야 합니다. 그런데 우리는 심각한 문제를 안고 있습니다. 미국은 불안정한 지역에서 수입하는 석유에 중독되어 있습니다.\n- 조지 W. 부시"
 LOADING_TIP_17: "신문 1면에 오르고 싶나요? 그렇다면 독한 공격을 해야겠죠. 하지만 저는 그렇게 하지 않을 겁니다. 저는 이슈 중심의 캠페인을 하고 있습니다.\n- 버니 샌더스"
 LOADING_TIP_18: "나는 국민에 의한, 국민을 위한, 국민의 정부가 미국에서 사라지기 시작하고 있다는 점이 매우 두렵다.\n- 버니 샌더스"
 LOADING_TIP_19: "알았으면 공범이고, 몰랐으면 무능이다.\n- 조국"
 LOADING_TIP_20: "러시아 사람들의 야망은 조금 다르다. 더 높고 영적인 것을 추구한다. 하느님과의 관계 말이다.\n- 블라디미르 푸틴"
 LOADING_TIP_21: "물론 우리는 양안 관계에 여전히 역사적 문제가 남아 있으며, 앞으로도 시간이 필요하고 인내와 공동의 노력이 요구되는 과제가 있을 것임을 냉철히 인식하고 있다.\n- 시진핑"
 LOADING_TIP_22: "우선 모든 과제에 대한 당의 지도력을 견지해야 하며, 당의 지도력은 끊임없이 강화되고 개선되어야 한다.\n- 시진핑"
 LOADING_TIP_23: "나는 과거에서 배우려 노력하지만 오직 현재에 집중해 미래를 계획한다. 그곳에 진정한 재미가 있다.\n- 도널드 트럼프"
 LOADING_TIP_24: "당신이 밧줄의 끝에 도달했다면, 거기서 매듭을 묶고 매달려라.\n- 에이브러햄 링컨"
 LOADING_TIP_25: "당신의 고통을 이해합니다.\n- 빌 클린턴"
 LOADING_TIP_26: "사람들이 자신을 예외적인 존재로 보도록 부추기는 것은 어떤 이유에서든 매우 위험하다.\n- 블라디미르 푸틴"
 LOADING_TIP_27: "동지들! 위대한 김일성민족의 100년사는 탁월한 수령을 모셔야 나라와 민족의 존엄도,강성번영도 있다는 철의 진리를 뚜렷이 확증해준 력사입니다. \n- 김정은"
 LOADING_TIP_28: "누군가 저를 모욕하면 무한한 동정심을 느낄 뿐입니다.\n- 코체릴 라만 나라야난"
 LOADING_TIP_29: "나는 잃어버린 시간을 생각하지 않는다. 그저 계획을 실행할 뿐이다. 그것은 나를 위해 이미 그려져 있다.\n- 넬슨 만델라"
 LOADING_TIP_30: "인생에서 실패는 피할 수 없지만, 포기는 용서받지 못한다.\n- 조 바이든"
 LOADING_TIP_31: "불법이라면 당장에 처리해줄 수 있다. 위헌은 조금 더 걸린다.\n- 헨리 키신저"
 LOADING_TIP_32: "그들의 진짜 의도가 당신을 죽이는 것이라 믿는다면, 거짓말을 한다고 믿는 것 역시 무리가 아니다.\n- 헨리 키신저"
 LOADING_TIP_33: "그들은 사회주의의 실패에 대해 얘기하지만, 아시아나 아프리카, 라틴 아메리카에서 자본주의의 성공은 어디있는가?\n- 피델 카스트로"
 LOADING_TIP_34: "유럽에는 5천만 명의 무슬림이 있다. 알라께서 유럽에서 이슬람의 승리를 허락하시리라는 징조가 보인다. 칼도, 총도, 정복도 없이 수십 년 안에 이 땅은 이슬람의 대륙으로 변할 것이다.\n- 무아마르 카다피"
 LOADING_TIP_35: "아프리카는 제국주의자들의 손길이 닿기 이전의 모습으로 돌아가야 한다. 우리는 그들이 만든 인위적인 경계를 범아프리카주의의 정신으로 없앨 것이다.\n- 로버트 무가베"
 LOADING_TIP_36: "가장 큰 선물은 잊을 수 있는 능력, 즉 나쁜 일은 잊고 좋은 일에 집중할 수 있는 능력입니다.\n- 조 바이든"
 LOADING_TIP_37: "캐나다는 개방적이고 따뜻한 나라이지만 한 가지 확실히 말해두고 싶은 것이 있습니다. 캐나다 또한 법치국가입니다.\n- 쥐스탱 트뤼도"
 LOADING_TIP_38: "내가 총리가 될 확률은 플라잉 디스크에 목이 베이거나 엘비스를 찾을 확률만큼 희박하다.\n- 보리스 존슨"
 LOADING_TIP_39: "백 번 싸워 백 번 이기는 것은 최선이 아니다, 싸우지 않고 적을 굴복시키는 것이 최선이다.\n- 손무"
 LOADING_TIP_40: "역사는 아와 비아의 투쟁이다.\n- 신채호"
 LOADING_TIP_41: "모든 싸움에서 이길 필요는 없다. 모든 싸움을 할 필요도 없다. 하지만, 무언가를 위해 맞서야 한다는 것은 확실하다.\n- 테드 크루즈"
 LOADING_TIP_42: "인생은 나약한 자의 것이 아니라 용감한 자의 것이다.\n- 로널드 레이건"
 LOADING_TIP_43: "우리가 세상을 구할 필요는 없습니다. 세상은 스스로를 돌볼 만큼 충분히 큽니다. 우리가 신경 써야 할 것은 이 세상이 우리를 품을 수 있을지 여부입니다.\n- 더글러스 애덤스"
 LOADING_TIP_44: "나는 '정체성 정치'가 문제가 아니라는 것을 알기 때문이다. 자본주의가 문제다.\n- 조 심스"
 LOADING_TIP_45: "어떤 사람들은 불에는 불로 맞서야 한다고 하지만, 우리는 불은 물로 끄는 것이 가장 좋다고 믿습니다. 인종차별을 인종차별로 맞설 수는 없습니다. 우리는 연대로 인종차별에 맞설 것입니다.\n- 프레드 햄프턴"
 LOADING_TIP_46: "진정한 평화는 단순히 긴장이 없는 것이 아닌 정의가 이루어진 것입니다.\n- 마틴 루터 킹"
 LOADING_TIP_47: "옳은 일을 하기 위한 적절한 시간은 언제나 지금입니다.\n- 마틴 루터 킹"
 LOADING_TIP_48: "우리는 미래를 일깨우기 위해 과거를 기념한다.\n- 존 F. 케네디"
 LOADING_TIP_49: "왜 공항 이름을 내 이름으로 지은 걸까요?\n- 로널드 레이건"
 LOADING_TIP_50: "미래는 여전히 기꺼이 손에 흙을 묻힐 각오가 되어있는 소수에게 달려 있다.\n- 제임스 메이슨"
 LOADING_TIP_51: "상상력은 종종 우리가 가보지 못한 세상으로 우리를 데려가지만, 상상력이 없다면 그 어느 곳도 갈 수 없다.\n- 칼 세이건"
 LOADING_TIP_52: "사람을 두 가지 부류로 구별할 수 있으니 하나는 스스로 자기 문제를 해결하는 사람이고 다른 하나는 남에게 다스림을 받는 사람이다.\n- 이승만"
 LOADING_TIP_53: "의원 되니까 세상이 안 무섭지? 권력 망하는 것 똑똑히 볼 거야, 내가! 우리도 집권해 본 사람이야. 권력이 영원할 것 같아?\n- 주호영"
 LOADING_TIP_54: "9/11 테러 이후에도 우리는 무너지지 않았습니다. 보스턴 마라톤 이후에도 우리는 흔들리지 않았습니다. 우리는 미국입니다. 미국인은 결코, 결코 물러서지 않습니다. 우리는 견뎌냅니다. 우리는 극복합니다. 우리는 끝내 결승선을 쟁취합니다.\n- 조 바이든"
 LOADING_TIP_55: "그는 불가능한 이유를 생각한 적이..\n - 아베 신조"
 LOADING_TIP_56: "혁명가를 감옥에 가둘 순 있지만, 혁명을 감옥에 가둘 순 없다.\n- 프레드 햄프턴"
 LOADING_TIP_57: "너무 멀리 갈 위험을 감수할 수 있는 사람만이 얼마나 멀리 갈 수 있는지 알 수 있다.\n- T. S. 엘리엇"
 LOADING_TIP_58: "푸틴 대통령과의 관계에 대해 말하자면, 괜찮습니다.\n- 게르하르트 슈뢰더"
 LOADING_TIP_59: "이라크 전쟁은 국내 재난 예방보다 더 높은 우선순위를 받았다.\n- 찰스 B. 랭겔"
 LOADING_TIP_60: "이라크에서 싸우고 싶었던 이유는 억압으로부터 사람들을 해방시키는 데 도움을 줘야 한다는 의무감을 느꼈기 때문입니다.\n- 에드워드 스노든"
 LOADING_TIP_61: "정치를 이야기하고, 공부를 이야기하며, 긍정적으로 이야기하십시오.\n- 장쩌민"
 LOADING_TIP_62: "나는 타고난 리더가 아닙니다. 나는 너무 지적이고, 너무 추상적이며, 생각이 너무 많습니다.\n- 뉴트 깅리치"
 LOADING_TIP_63: "영어에서 가장 무서운 9개 단어는 \"나는 정부에서 왔습니다. 그리고 나는 당신을 도우러 이곳에 왔습니다.\"이다.\n- 로널드 레이건"
 LOADING_TIP_64: "탄탄한 경제는 국력의 원천이다.\n- 아베 신조"
 LOADING_TIP_65: "미국은 가장 취약한 지점에 신의 일격을 받았으며, 그들의 가장 명망 높은 건물들은 처참히 파괴되었다.\n- 오사마 빈 라덴"
 LOADING_TIP_66: "신께선 우리의 편에 서 계신다. 우리는 침략자를 물리칠 것이다.\n- 사담 후세인"
 LOADING_TIP_67: "미국은 큰 사탄이며, 상처 입은 뱀이다.\n- 아야톨라 호메이니"
 LOADING_TIP_68: "다가오는 것은 아무도 막을 수 없다. 아무도.\n- 제임스 메이슨"
 LOADING_TIP_69: "우리 민족이 멸망한다면, 적어도 조상들이 죽음을 맞이했던 것처럼 남자답게 맞이하자.\n- 조지 링컨 록웰"
 LOADING_TIP_70: "천하의 근심이란 형세를 알지 못하는 것보다 더 큰 것은 없고, 치국에 형세를 살피는 것보다 더 급한 것은 없다.\n- 하라 다카시"
 LOADING_TIP_71: "자유의 나무는 때때로 애국자와 폭군의 피로 생기를 되찾아야 한다.\n- 토머스 제퍼슨"
 LOADING_TIP_72: "우리나라와 우리의 국민, 그리고 우리의 법이 최우선 순위가 되어야 한다.\n- 도널드 트럼프"
 LOADING_TIP_73: "역사의 단두대 위에 서자. 만약 우리가 처형되어야 한다면, 뉘른베르크의 순교자들처럼 당당하고 자랑스럽게 서자!\n- 조지 링컨 록웰"
 LOADING_TIP_74: "당의 두리에 전군이 하나의 전우로 굳게 뭉치고 천만군민이 혼연일체를 이룬 불패의 단결은 우리 인민군대의 진짜 위력이며 바로 여기에 군력강화의 기본열쇠가 있습니다.\n- 김정은"
 LOADING_TIP_75: "일본 열도는 태평양에서 자본주의 국가를 지탱하는, 가라앉지 않는 항공모함이다.\n- 나카소네 야스히로"
 LOADING_TIP_76: "병원을 폭격하는 것은 우리의 관심사가 아니다.\n- 바샤르 알아사드"
 LOADING_TIP_77: "테러리즘은 가장 중요한 것, 즉 인간 생명의 가치를 부정한다. 테러리즘은 어떤 이념적 계산이 수반되든 모든 권리와 자유를 짓밟고 공포와 증오를 심어주며 우리가 세상을 변화시키고 개선하는 것을 방해한다.\n- 드미트리 메드베데프"
 LOADING_TIP_78: "트럼프가 선거에서 깜짝 승리를 거두는 것을 보며, 나는 이제 그 어떤 일도 일어날 수 있다고 믿는다.\n- 제임스 메이슨"
 LOADING_TIP_79: "나는 국가사회주의 아래서 자란 세대에 속해 있었고, 눈이 멀어 잘못된 길로 인도됐다. 우리는 우리 스스로를 잘못된 길로 인도하도록 허용했다.\n- 귄터 그라스"
 LOADING_TIP_80: "전쟁을 오래 끌어 국가에 이득이 된 적은 없다. (부병구이국리자 미지유야)\n- 손무"
 LOADING_TIP_81: "인권은 테러, 억압, 암살에 의해서만 침해되는 것이 아닙니다. 심각한 불평등을 초래하는 불공정한 경제 구조에 의해서도 침해됩니다.\n- 프란치스코 교황"
 LOADING_TIP_82: "강성국가건설과 인민생활향상을 총적목표로 내세우고있는 우리 당과 공화국정부에 있어서 평화는 더없이 귀중합니다. 그러나 우리에게는 민족의 존엄과 나라의 자주권이 더 귀중합니다.\n- 김정은"
 LOADING_TIP_83: "솔직히 혼돈에 관해서는 아직 아무것도 보지 못했다고 생각합니다.\n- 나이젤 패라지"
 LOADING_TIP_84: "적들이 원자탄으로 우리를 위협공갈하던 시대는 영원히 지나갔습니다.\n- 김정은"
 LOADING_TIP_85: "군력이자 국력이며 군력을 백방으로 강화하는 길에 강성국가도 있고 인민의 안녕과 행복도 있습니다.\n- 김정은"
 LOADING_TIP_86: "저는 정치 등 모든 분야에서 무례할 정도로 진실을 말하는 것을 좋아합니다. 그래서 시온주의자들과 미국인들이, 고위 관리들이 사담 후세인을 싫어하는 것입니다.\n- 사담 후세인"
 LOADING_TIP_87: "현재 세계 경제 시스템의 분배 체제가 국가의 생산적 부를 제대로 분배할 수 없다면, 그 시스템은 잘못된 것이며 반드시 바뀌어야 한다.\n- 시진핑"
 LOADING_TIP_88: "역사에는 변화가 필요한 시기가 있고, 모든 것을 그대로 유지하는 것이 더 좋은 시기가 있다. 인생의 예술이란 그 시대의 리듬을 따르는 것이다.\n- 오즈월드 모즐리 경"
 LOADING_TIP_89: "정치적 정세, 안보적 정세가 장기적으로, 총체적으로 서서히 변화해 가는 것이지 그날 큰일 나는 거 아니거든요? 그날 전쟁 나는 거 아이란 말입니다. 근데 정부가 나서 가지고 \"국민 여러분, 미사일을 쐈습니다. 라면 사십쇼, 방독면 챙기십쇼.\" 이렇게 해야 합니까? 새벽에 비상을 걸어야 됩니까?\n- 노무현"
 LOADING_TIP_90: "적이 공격했을 때 완벽하게 제압할 수 있는 수준, 나는 털끝도 안 다치고 아니면 거의 약간 껍질이나 약간 벗겨지고 그... 찰과상 정도 입거나 타박상 정도 입고 완전히 제압하는 수준, 그러면 확실하지요. \n- 노무현"
 LOADING_TIP_91: "적어도 상식을 가진 사람이라면, 싸움을 해서 이길 수 없고, 공격을 해서 이길 수 없다. 따라서 점령할 수 없고 따라서 지배할 수도 없다. 이 단계를 한번 생각해 보십시다. 이겨도 점령하지 못하면 무슨 소용입니까? 점령해도 지배하지 못하면 전쟁을 일으킨 보람이 어디에 있겠습니까?\n- 노무현"
 LOADING_TIP_92: "한 대 때리려고 하다가 한 대 반을 맞을 형편이면은, 붙었는데 적의 팔을 하나 부러뜨렸는데 뭐, 자기 팔은 두 개가 부러져 버렸다, 이 정도이면은 제정신 가진 사람이면 (전쟁을) 안 하지 않겠느냐?\n- 노무현"
 LOADING_TIP_93: "상대가 제정신이 멀쩡한 사람인지, 아니면 완전히 믿을 수 없을 만큼 돌아버린 사람인지, 아니면 영 머리가 아주 나쁜 사람인지를 판단을 해 봐야 되는 것이지요.\n- 노무현"
 LOADING_TIP_94: "작전통제권 자기들 나라 자기 군대, 작전 통제도 한 개 제대로 할 수 없는 군대를 맨들어 놔 놓고 \"나 국방장관이오.\", \"나 참모총장이오.\", 그렇게 별들 달고 끄드럭거리고 말았다는 얘깁니까?\n- 노무현"
 LOADING_TIP_95: " 피를 흘려도 우리가 흘려야지 우리가 할 수 있다라는 자신감을 가져야 무슨 경제적인 일이나 또 그 밖에 무슨 일이 있을 때 미국이 호주머니 손 넣고, \"그러면 우리 군대 뺍니다.\" 이렇게 나올 때, 이 나라의 대통령이 미국하고 당당하게 \"그러지 마십쇼.\" 하든지, \"예, 빼십쇼.\" 할 거 아닙니까?\n- 노무현"
 LOADING_TIP_96: "강물은 바다를 포기하지 않습니다.\n- 노무현"
 LOADING_TIP_97: "국가란 유산계급이 무산계급을 착취하기 위해 태어난 인육분쇄소와 같다.\n- 신채호"
 LOADING_TIP_98: "역사를 앞으로 나아가게 한 동력은 주인의 나태한 안주나 변치 않는 자기정체성이 아니라, 노예의 끊임없는 인정 욕구였다.\n- 프랜시스 후쿠야마"
 LOADING_TIP_99: "국민들이, '내 나라는 내가 지킨다'라고 하는 의지와 자신감을 가지고 있어야 국방이 되는 것이지요.\n- 노무현"
 LOADING_TIP_100: "정치는 곧 숫자이며, 숫자는 곧 힘, 힘은 곧 돈이다.\n- 다나카 가쿠에이"
 LOADING_TIP_101: "인간은 자유롭게 태어났으나, 어디서나 사슬에 묶여 있습니다. 타인을 지배한다고 생각하는 자들은 사실은 타인들보다 더 큰 노예입니다.\n- 장자크 루소"
 LOADING_TIP_102: "어느 나라에서든 인민은 그들의 주권과 독립을 위해서 유혈전쟁을 수행하지 않으면 안 된다.\n- 박헌영"
 LOADING_TIP_103: "고래 싸움에 등 터지는 새우가 아니라 큰 고래, 작은 고래 함께 노는 동해 바다의 돌고래, 그것이 우리 한국의 목표다. 아무래도 인구가 적으니까 돌고래라고 생각했던 모양이에요? 그냥 큰 고래라고 해 버리지 뭘, 그죠?\n- 노무현"
 LOADING_TIP_104: "자유는 자유롭지 않은 것보다 낫다.\n- 드미트리 메드베데프"
 LOADING_TIP_105: "그대의 이름은 무명이다. 그대의 행동은 불멸이다.\n- 무명 용사의 묘 (모스크바)"
 LOADING_TIP_106: "소득이 적은 사람은 밀을 많이 먹고, 소득이 많은 사람은 쌀을 많이 먹는다. 그것이 경제의 원칙이다.\n- 이케다 하야토"
 LOADING_TIP_107: "홀의 관객이 무대 위의 이벤트와 전혀 관련이 없다고 확실하게 말할 수 있을까요?\n- 미시마 유키오"
 LOADING_TIP_108: "큰 뜻을 품으면, 천하에 그 무엇도 두려울 것이 없다.\n- 요시다 시게루"
 LOADING_TIP_109: "전쟁은 대화가 실패할 때 일어나는 일입니다.\n- 마거릿 애트우드"
 LOADING_TIP_110: "분열된 집안은 스스로 일어설 수 없다.\n- 에이브러햄 링컨"
 LOADING_TIP_111: "일본이 동양의 영국이라면 조선은 동양의 프랑스가 되어야 한다.\n- 김옥균"
 LOADING_TIP_112: "적을 맞이할 준비를 잘하는 것만큼 평화를 가져올 가능성이 큰 것은 없다.\n- 조지 워싱턴"
 LOADING_TIP_113: "내가 서 있던 우익은 적의 모든 사격에 노출되어 있었는데, 나는 총알의 휘파람 소리를 들었고, 그 소리에는 뭔가 매혹적인 것이 있었다고 믿는다.\n- 조지 워싱턴"
 LOADING_TIP_114: "모든 직책은 국가를 위해 봉사할 수 있는 명예로운 자리다.\n- 조지 워싱턴"
 LOADING_TIP_115: "억제당하는 것에 익숙하지 않은 백성들은 이끌어야지 몰아붙이면 안 된다.\n- 조지 워싱턴"
 LOADING_TIP_116: "나를 가장 잘 아는 사람들이 나에 대해 이렇게 말해주길 바랍니다. 가시덤불을 뽑아내고, 꽃이 필 만한 곳에는 항상 꽃을 심었다고.\n- 에이브러햄 링컨"
 LOADING_TIP_117: "역경은 대부분의 사람들이 견딜 수 있는 것이다. 사람의 인격을 실험해보고 싶다면, 그에게 권력을 줘라.\n- 에이브러햄 링컨"
 LOADING_TIP_118: "왕관이 길바닥에 수십 개씩 굴러다녀도 그것을 줍는 사람이 없을 정도로 낡은 국가와 수구적인 국가의 타당성이 무너질 것이다.\n- 프리드리히 엥겔스"
 LOADING_TIP_119: "현재는 우리의 눈앞에 펼쳐져 있습니다. 그러나 그 전망이 너무도 암울하여 차라리 눈을 감아버리고 싶어집니다.\n- 미하일 불가코프"
 LOADING_TIP_120: "나는 울지 말라 하지 않으리니, 모든 눈물이 악한 것은 아니니.\n- J. R. R. 톨킨"
 LOADING_TIP_121: "밤이 깊을수록 별은 밝아지고 슬픔이 깊을수록 신은 더 가까이 계신다!\n- 아폴론 마이코프"
 LOADING_TIP_122: "신사 여러분, 말조심하시오! 경제 전쟁이 인류 역사에서 종종 실제 전쟁으로 변해왔다는 사실을 잊지 마시오.\n- 드미트리 메드베데프"
 LOADING_TIP_123: "크게 굽힐 줄 아는 사람을 두려워하라.\n- 이토 히로부미"
 LOADING_TIP_125: "이 사람들이 진심으로 자신들을 세계 지도자라 여기고, 무언가 거창한 존재라 자처하며, 다른 이들에게 자신들의 의지를 강요하려 꿈꾼다고? 대체 무슨 근거로? 이미 스스로를 실추시키고, 무력함을 인정하며, 거짓말을 일삼고, 문제에 허덕이고 있으면서?\n- 드미트리 메드베데프"
 LOADING_TIP_126: "NATO는 소련과 바르샤바 조약에 맞서 싸우기 위한 냉전의 도구로 만들어졌다. 이제 바르샤바 조약도, 소련도 사라졌지만 NATO는 여전히 존재한다. 그렇다면 질문이 하나 생긴다. '왜?'\n- 블라디미르 푸틴"
 LOADING_TIP_127: "나는 헌법을 준수하고 국가를 보위하며 조국의 평화적 통일과 국민의 자유와 복리의 증진 및 민족문화의 창달에 노력하여 대통령으로서의 직책을 성실히 수행할 것을 국민 앞에 엄숙히 선서합니다.\n -대한민국 대통령 취임 선서문"
 LOADING_TIP_128: "만일 일본이라는 나라에 결점이 있다면, 그것은 지나치게 겸손하고, 삼가며, 물러서는 태도이다.\n- 하라 다카시"
 LOADING_TIP_129: "여러분과 제가 알다시피 애국심은 조국에 대한 사랑일 뿐입니다. 하지만 그것이 없으면 국가는 존재할 수 없으며 이 차의 설탕 조각처럼 녹을 것입니다.\n- 블라디미르 푸틴"
 LOADING_TIP_130: "그들은 나를 쫓는 것이 아니라 당신을 쫓고 있으며, 나는 그들의 길을 막아 주고 있다!\n- 도널드 트럼프"
 LOADING_TIP_131: "우리는 공통의 적에 맞서 싸우고 있습니다. 과거 소련 언론은 이를 '세계 제국주의'라 불렀습니다. 오늘날 우리는 이 오래된 명칭을 새롭게 정의할 수 있습니다. 이는 공격적인 세계화이며, '신질서'라는 기치 아래 급히 세워지고 있는 자유주의적 묵시록적 '짐승의 왕국'입니다.\n- 겐나디 주가노프"
 LOADING_TIP_132: "가정이 무너지고, 사회가 무너지고, 가정이 황폐화되고, 이러한 현실 속에서...\n- 신원 미상"
 LOADING_TIP_133: "힘은 가장 설득력 있는 수사법이다. \n- 프리드리히 실러"
 LOADING_TIP_134: "오늘 우리는 관용을 베풀고 있다. 내일 우리는 우리 나라에서 이방인이 될 것이다.\n- 알렉산더 가울란트"
 LOADING_TIP_135: "자연은 곧 로마, 그리고 지금도 예전처럼 신들을 귀찮게 하거나 기도할 필요는 없다. 전쟁을 예언할 제물은 이미 있고, 노예들은 침묵하며, 돌은 제자리에 놓일 뿐이다!\n- 오시프 만델시탐"
 LOADING_TIP_136: "설령 그대들이 정치에 관심을 갖지 않는다고 해서 정치가 그대들에게 관심을 갖지 않는 것은 아니다.\n- 페리클레스"
