l_korean:
 TFRKC_constitutional_front: "헌정수호 공동전선"
 TFRKC_workers_front: "노동자 공동전선"
 tfrkc_war.2.t: "일본의 한국 지원"
 tfrkc_war.2.d: "일본은 대한민국 정부를 인정하며 헌정수호연합과의 별도 군사협력을 검토한다. 지원은 군수품 이전으로 제한된다."
 tfrkc_war.3.t: "한국 정부의 지원 요청"
 tfrkc_war.3.d: "독일 정부는 한국 정부의 법적 연속성을 존중하며 제한된 구호와 군수 지원을 검토한다. 아시아 전쟁에 대한 동맹 전체의 참전 결정은 포함되지 않는다."
 tfrkc_war.a: "제한적 지원을 승인한다."
 tfrkc_war.no: "지금은 지원할 수 없다."
 tfrkc_war.11.t: "협력의 마지막 조건"
 tfrkc_war.11.d: "정부와 헌정수호연합에 맞서던 세력들이 패배했습니다. 이주호 권한대행 정부는 하나의 지휘 체계를 복구하기 위해 연합의 조직과 병력을 통합하라고 요청했습니다. 함께 싸웠으니 이제 같은 국가기관으로 돌아와야 한다는 설명입니다.\n\n연합의 회의에서는 헌정복원을 조건으로 한 협력이 무엇을 남겼는지 논쟁이 벌어졌습니다. 정부 통합에 동의한다는 것은 전쟁 중 확보한 독자 지휘를 내려놓는 일입니다. 이를 거부하고 무력으로 헌정복원을 관철하겠다면, 지금까지 함께 싸운 정부를 적으로 삼아야 합니다.\n\n회의장에는 전사자 명부도 올라왔습니다. 그 명부의 다음 장을 비워 둘 것인지, 다시 이름을 받아 적을 것인지 결정해야 합니다."
 tfrkc_war.11.a: "조직과 병력을 정부에 통합한다."
 tfrkc_war.11.b: "정부에 선전포고한다."
