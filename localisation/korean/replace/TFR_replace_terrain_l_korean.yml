 paris: "파리"
 paris_desc: "----\n§9사령관! 내 영광스러운 행진에 재를 뿌리셨군! 그 대가로, 내 모든 걸 총동원해서 공격해주지! 하지만 내가 잡히는 꼴은 절대로 보지 못할 거야. 나는 자본주의에 오염되지 않은 유일한 곳... 우주로 탈출할 거니까!§!"
