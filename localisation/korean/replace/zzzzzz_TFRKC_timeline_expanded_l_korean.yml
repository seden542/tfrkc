l_korean:
 # Expanded original TFRKC prose. STAGED; no event/effect code or map IDs.
 TFRKC_TMP_1_d: "대만이 함락되고 한국이 양안전쟁에서 패한 지 1년이 되었습니다. 전주의 거리에 윤석열 탄핵을 요구하는 사람들이 모였습니다. 돌아온 장병에게는 치료와 일자리가, 유가족에게는 아직 받지 못한 답변이, 난민에게는 다음 달에도 머무를 방이 필요했습니다. 문을 닫은 가게의 주인은 끊어진 거래를 이야기했고, 집회에 처음 나온 사람은 장바구니 영수증을 접어 주머니에 넣었습니다. 서로 다른 사정이 같은 구호 아래 모였지만, 그들이 모두 같은 생각을 가진 것은 아니었습니다.\n\n시위가 이어지는 가운데 거리 일부에서 폭동이 발생했다는 보고가 올라왔습니다. 현장의 경위를 두고는 설명이 엇갈리고 있습니다. 당국이 분류한 가담자의 범위와 실제로 폭력에 참여한 사람의 범위가 같은지도 분명하지 않습니다. 탄핵을 요구한 사람, 가족을 찾으러 나온 사람, 가게를 지키던 사람의 얼굴이 흔들리는 영상 속에서 뒤섞였습니다. 이를 정리하는 보고서에는 각자의 사정이 들어갈 자리가 많지 않았습니다.\n\n이 패전 이후 혼란기의 첫 대규모 폭동은 정부와 거리가 서로를 바라보는 방식을 바꾸고 있습니다. 정부는 질서 회복을 약속했고, 거리의 사람들은 그 질서가 자신들에게 무엇을 돌려주었는지 묻습니다. 집회가 지나간 자리에서 누군가는 떨어진 물건을 주워 가게 안에 넣고, 누군가는 돌아오지 않은 사람에게 다시 전화를 겁니다. 패전 1주년을 알리는 방송은 끝났지만, 거리에 모인 사람들이 기다리던 대답은 아직 나오지 않았습니다."
 TFRKC_TMP_2_d: "전주 사건의 사망자가 총 13명으로 집계되었습니다. 누구에게 어떤 경위로 죽음이 닥쳤는지, 누가 그 책임을 져야 하는지에 대한 답은 아직 정리되지 않았습니다. 발표를 듣는 사람들에게 열세 명은 서로 다른 이름이었지만, 상황 보고에서는 하나의 합계로 읽혔습니다. 집계가 끝났다는 말이 사태가 수습되고 있다는 설명의 근거로 먼저 쓰였습니다. 확인되지 않은 경위를 채울 자료보다 이미 정리된 숫자를 보여 주는 일이 쉬웠습니다.\n\n정부는 사건 가담자 전원을 검거하고 사형 선고를 추진하겠다는 방침을 내놓았습니다. 발표문은 이를 국가의 생존과 질서 회복을 위한 불가피한 조치라고 설명했습니다. 정부가 앞세운 문구는 짧았습니다. ‘§R예외를 남기지 않겠습니다.§!’ 이어 사건 가담자로 분류된 이들에게 사형이 선고되었습니다. 어떤 행위를 했고 어느 정도의 책임이 있는지 각각 살펴야 할 자리에, 국가가 물러서지 않았다는 사실을 증명해야 한다는 논리가 놓였습니다.\n\n정부는 엄정한 대응이 더 큰 희생을 막을 것이라고 말합니다. 그러나 사망 경위를 알고 싶은 사람과 구금된 가족의 행방을 알고 싶은 사람에게 그 설명은 답이 되지 못했습니다. 창구에서는 담당 기관을 다시 안내하고, 기관에서는 확인 중이라는 말을 되풀이했습니다. 집에서는 평소와 같은 수의 수저를 꺼냈다가 하나를 다시 넣습니다. 집계표의 합계는 더 이상 바뀌지 않더라도, 남은 사람들에게 그 숫자를 받아들이는 일까지 끝난 것은 아닙니다."
 TFRKC_TMP_3_d: "전주 사건 가담자로 분류된 이들에게 내려진 사형 선고가 무기징역으로 감형되었습니다. 정부는 엄정한 처벌과 인도적 고려를 함께 지켰으며, 이번 조치가 사회의 화합을 위한 결정이라고 발표했습니다. 발표문은 사형을 추진한 판단도, 그것을 감형한 판단도 국가의 책임 있는 선택이라고 설명합니다. 처음의 극형이 필요했다면 무엇이 달라졌는지, 이제의 감형이 옳다면 처음에 무엇을 잘못 판단했는지를 묻는 문장은 그 안에 없었습니다.\n\n반발은 전국으로 번지고 있습니다. 윤석열 탄핵을 요구하는 집회에 일괄적인 극형 추진을 비판하는 목소리가 더해졌습니다. 시위에 대한 입장이 달랐던 사람들도 각자의 행위와 책임을 따져야 할 절차가 사라져서는 안 된다고 말합니다. 사망자 13명의 경위를 규명하라는 요구 역시 가라앉지 않았습니다. 감형을 환영하는 사람과 정부의 판단을 신뢰하지 못하는 사람이 같은 거리에서 같은 발표를 들었습니다.\n\n구금자 가족들은 면회가 가능한 요일과 준비해야 할 서류를 적습니다. 정부가 사태의 종결을 기대하는 동안 그들에게는 더 긴 시간이 시작됩니다. 감형은 석방이 아니며, 살아 있다는 사실이 이전의 생활을 돌려주는 것도 아닙니다. 정부는 선처했다는 말로 한 문서를 닫으려 합니다. 거리에서는 아직 누구의 잘못이었는지 묻는 문서가 새로 쌓입니다. 서로 같은 결정을 두고 말하지만, 끝났다고 표시한 날짜와 기다리기 시작한 날짜는 같지 않습니다."
 TFRKC_TMP_4_d: "전국에서 올라온 보고가 대통령의 책상에 쌓였습니다. 집회 규모와 경찰의 대응 여력, 지역별 업무 차질이 같은 양식으로 정리되었습니다. 숫자는 매일 바뀌었지만 상황이 나아질 것이라는 근거를 담은 보고는 많지 않았습니다. 어떤 문서는 전주에서 시작된 반발이 일시적이라고 설명하고, 그 다음 문서는 같은 반발이 다른 지역으로 확산되고 있다고 적었습니다. 회의 참석자들은 앞선 판단을 고치는 대신 더 자세한 보고를 요구했습니다.\n\n회의에서는 대화 창구를 열어야 한다는 의견과 더 강한 조치가 필요하다는 주장이 맞섰습니다. 경제 단절과 귀환장병의 문제, 구호의 지연을 먼저 다루자는 말은 시급한 질서 회복 안건 뒤로 밀렸습니다. 누군가는 국가가 양보하는 모습을 보이면 안 된다고 말했고, 누군가는 국민에게 양보하는 것이 누구에게 지는 일이냐고 되물었습니다. 회의록에는 발언이 정리되었지만, 서로 다른 말이 무엇에 합의했는지는 쉽게 정리되지 않았습니다.\n\n책상 한쪽에는 비상조치에 관한 문건이 놓였습니다. 아직 서명된 명령은 없습니다. 서류를 준비한 사람들은 가능한 모든 경우에 대비하기 위한 검토라고 설명합니다. 회의가 끝나자 찻잔과 참고 자료가 치워졌고, 다음 날의 일정표가 새로 놓였습니다. 그 문건만은 그대로 남았습니다. 바깥에서 기다리는 사람들이 요구한 것은 답변이었지만, 집무실에서 가장 오래 남은 서류는 그 요구에 어떻게 대응할 것인지에 관한 것이었습니다."
 TFRKC_TMP_5_d: "계엄은 실패했고 국회는 윤석열에 대한 탄핵소추를 가결했습니다. 대통령의 직무는 정지되었으며 국정의 결재선은 한덕수 권한대행에게 넘어갔습니다. 탄핵소추에 따른 직무정지는 대통령의 신분과 그 권한의 행사를 구별하는 상태입니다. 이 결정만으로 파면이 확정되거나 이전의 명령에 새 효력이 생기는 것은 아닙니다. 정부는 국가의 업무가 계속된다고 발표하며 각 기관에 기존 업무를 유지하라고 지시했습니다.\n\n관청에서는 결재 서식과 보고 수신인을 고칩니다. 급여를 지급하고 병원의 물자를 확보하며 구호품을 보내야 하는 업무는 대통령의 직무가 정지되었다고 함께 멈출 수 없습니다. 그러나 현장에서는 어느 지시를 따라야 하는지 되묻는 연락이 이어집니다. 이미 받은 명령을 취소하라는 지시와 추가 확인을 기다리라는 연락이 같은 책상에 도착합니다. 서류를 발송한 기관은 적법한 절차를 설명하지만, 그것을 집행할 사람은 책임질 이름을 먼저 확인합니다.\n\n누군가는 이번 표결로 위기가 끝나기를 기대했습니다. 또 누군가는 책임을 묻는 절차가 이제 시작되었다고 말합니다. 그 사이 국가의 이름으로 일하는 사람들은 다음 근무를 준비합니다. 직함은 한 줄 바뀌었지만 밀린 민원과 지급되지 않은 수당, 연락이 닿지 않는 기관은 그대로입니다. 직무를 정지하는 절차는 효력을 발휘했습니다. 그 효력이 나라의 모든 길목에서 같은 의미로 받아들여지게 하는 일은 여전히 정부 앞에 남았습니다."
 TFRKC_TMP_6_d: "한덕수 권한대행 체제가 끝나고 최상목이 업무를 넘겨받았습니다. 정부는 정해진 승계 절차에 따라 국정 운영이 계속된다고 밝혔습니다. 새 결재선이 각 부처에 전달되었고, 보류되었던 문서에는 다시 수신인이 적혔습니다. 지도부가 바뀌어도 민생과 국가 기능을 유지하겠다는 발표는 이어졌습니다. 다만 새 권한대행 앞에 놓인 업무의 상당수는 앞선 권한대행이 해결하지 못하고 남겨 둔 것과 같았습니다.\n\n인계 목록에는 예산과 치안, 구호, 대외 연락이 차례로 적혔습니다. 어느 항목도 다른 항목이 끝날 때까지 기다려 주지 않았습니다. 구호품을 보내려면 안전한 수송이 필요하고, 수송을 확보하려면 지휘부의 협조가 필요하며, 협조를 얻으려면 정부가 계속 존재할 것이라는 신뢰가 필요했습니다. 각 기관은 자기 업무를 수행했다고 보고했지만 그 업무들을 이어 실제 결과로 만드는 책임은 새 결재선의 맨 위로 올라왔습니다.\n\n관료들은 문서의 수신인을 고쳐 적습니다. 구호를 기다리는 사람들에게는 누가 서명하는지보다 언제 도착하는지가 먼저입니다. 밀린 수당을 받을 창구에서는 새 지침을 기다린다는 안내가 붙고, 현장의 담당자는 같은 설명을 다시 합니다. 국가의 법적 절차는 계속 움직이고 있습니다. 그 절차를 기다리며 살아야 하는 사람들의 시간도 계속 흐릅니다. 정상화가 다시 약속되는 동안, 기다렸던 날짜를 세는 달력에는 지울 수 없는 표시가 늘어납니다."
 TFRKC_TMP_7_d: "최상목의 사의 표명 이후 이주호 권한대행의 이름으로 각 기관에 업무 계속 지시가 발송되었습니다. 정부는 대통령의 직무정지가 국가의 직무정지를 뜻하지 않는다고 밝혔습니다. 급여와 구호, 병원과 발전소의 운영을 유지하는 것이 국가 생존의 첫 조건이라는 설명입니다. 새 지시는 필요한 업무의 우선순위를 정리하고 각 기관의 연락을 재확인하도록 요구했습니다. 국가는 여전히 같은 이름으로 서류를 보내고 있습니다.\n\n그러나 현장에서 올라오는 보고에는 정부가 즉시 집행할 수 없는 요구가 더 많습니다. 호송할 병력이 없는 구호품, 지급할 재원이 막힌 수당, 중앙의 승인을 기다리다 멈춘 행정이 책상 위에 놓였습니다. 적법한 결정을 내릴 권한이 있다는 사실과 그 결정을 집행할 수단이 있다는 사실 사이의 거리가 커지고 있습니다. 어떤 기관은 협조를 약속했고, 다른 기관은 지시가 유효한지 다시 확인해 달라는 답을 보냈습니다.\n\n정부는 아직 기능하고 있으며 그 사실을 지키기 위해 밤새 일하는 사람들도 남아 있습니다. 다만 이들에게 필요한 것은 새로운 정상화 선언보다 마지막까지 이어지는 연락과 실제로 도착하는 물자입니다. 이주호 권한대행의 책상에는 결재를 기다리는 문서와 이미 결재했지만 이루어지지 않은 문서가 나란히 쌓입니다. 결재란은 비어 있지 않습니다. 서명 다음에 무엇이 일어났는지를 적는 칸이 비어 있습니다. 정부는 그 빈칸부터 채워야 합니다."
 TFRKC_TMP_8_d: "계엄 이후 남영신을 중심으로 모인 군 인사들이 국가재건최고회의를 비밀리에 결성했습니다. 참석자들은 윤석열의 실패뿐 아니라 기존 정치권 전체가 국가를 이끌 능력을 잃었다고 판단했습니다. 회의의 목적은 윤석열과 정치권을 함께 끌어내리고 군의 질서로 국가를 재건하는 것입니다. 이들은 더는 다른 기관이 사태를 수습하기를 기다리지 않겠다고 말합니다. 국가를 대신할 권한을 누구에게 받았는지에 대한 설명은 그 결의만큼 길지 않았습니다.\n\n회의에서는 연락망과 명령 계통, 각자가 책임질 업무가 논의되었습니다. 누가 누구의 지시를 받을지와 누구에게 상황을 보고할지는 분명하게 적혔습니다. 그러나 군이 국가를 대신하기 시작한 뒤 누가 그 군에 책임을 물을 것인지는 다음 논의로 남았습니다. 일부는 질서가 돌아오면 예외적인 권한도 필요 없어질 것이라고 말했습니다. 다른 일부는 질서를 무너뜨린 사람들에게 다시 권한을 맡겨서는 안 된다고 답했습니다.\n\n명단은 공식 배포하지 않기로 했습니다. 연락할 수 있는 사람과 연락해서는 안 되는 사람이 구별되었고, 회의에 오지 않은 지휘관들의 의중은 추정으로 적혔습니다. 비밀리에 시작한 구상이 이미 모든 군의 뜻인 것처럼 말할 수는 없습니다. 참석자들은 서로 다른 길로 자리를 떠났습니다. 나라를 구하겠다는 사람들의 첫 서류에는 그 나라의 다른 기관들이 보아서는 안 된다는 표시가 붙었습니다. 명령을 다시 세우겠다는 약속은 그렇게 보이지 않는 곳에서 시작되었습니다."
 TFRKC_TMP_9_d: "윤어게인이 ‘귀환’ 작전으로 윤석열을 구출했다고 발표했습니다. 구체적인 작전 경위에 대해서는 확인되지 않은 이야기가 오가지만, 모습을 드러낸 윤석열은 자신을 따르는 조직과 부대에 직접 명령을 내리기 시작했습니다. 지지자들이 돌려 보는 영상에는 환호와 복권 구호가 반복됩니다. 한동안 누구의 말을 기다려야 하는지 확신하지 못하던 조직들에는 이제 명령을 내리는 얼굴과 목소리가 생겼습니다.\n\n정부는 구출이 대통령의 법적 지위를 바꾸지 않는다고 밝혔습니다. 탄핵소추에 따른 직무정지는 계속되며, 윤석열의 지시는 정부의 적법한 지휘로 인정되지 않습니다. 그러나 윤어게인은 이미 그의 명령을 실제 지휘 계통으로 삼고 있습니다. 법적으로 내릴 수 있는 명령과 현실에서 따르는 사람이 있는 명령이 갈라집니다. 정부의 공문과 지지 조직의 연락이 같은 기관으로 향하면서, 이를 받은 사람들은 누구의 서명에 자신의 책임을 걸어야 할지 판단해야 합니다.\n\n그를 되찾은 사람들의 목적까지 하나가 된 것은 아닙니다. 어떤 이들은 복권을 통해 이전의 정치로 돌아가기를 바라고, 어떤 이들은 이번 기회에 반대 세력을 정리해야 한다고 말합니다. 군과 민병대, 정치 조직이 같은 구호를 외쳐도 전쟁 뒤 자신들의 자리를 생각하는 방식은 다릅니다. 지금은 모두 다음 명령을 기다립니다. 대통령을 되찾았다는 환호 속에서, 돌아갈 나라가 어떤 모습이어야 하는지에 대한 질문은 다시 뒤로 밀리고 있습니다."
 TFRKC_TMP_10_d: "청소년해방군이 대전 교육청을 점령했다는 소식이 전해졌습니다. 청사를 확보한 전투부대는 성인 대학생·청년노동자·귀환장병·예비역 등으로 구성되어 있습니다. 청소년 당사자 대표들은 학생자치와 권리 보장을 요구하며 회의에 참여했습니다. 이 점령은 현장의 정치적 행동과 통제의 충돌을 보여 주지만, 청사 하나의 점령만으로 도시 전체의 통치권이나 앞으로의 영토 배분까지 정해지는 것은 아닙니다.\n\n‘우리가 겪었던 억압을 다음 세대에게 넘기지 않겠다.’ 성명서를 읽은 뒤에도 청사의 일은 남았습니다. 급식 물자와 학교 운영, 학생 대표의 결정권을 둘러싼 논의가 이어졌습니다. 성인 지휘부가 안전을 이유로 결정을 미루자 대표들은 자신들의 권리를 뒤로 미루던 말도 늘 안전을 앞세웠다고 지적했습니다. 바깥을 지킬 병력이 있는 조직이 안에서 말하는 사람들의 결정도 지킬 수 있는지, 해방의 약속은 점령 직후부터 시험받고 있습니다.\n\n부산에서는 윤어게인이 윤석열의 직접 명령에 따르는 비상통치를 선언했습니다. 정부는 그 선언에 법적 효력이 없고 대통령의 직무정지도 계속된다고 밝혔습니다. 그러나 현장에서는 이미 서로 다른 지시가 내려옵니다. 비상통치를 지지하는 사람들 안에서도 복권과 장기적인 권력 장악을 원하는 목소리가 같지는 않습니다. 대전과 부산의 움직임은 하나의 국가 위기로 보고되었습니다. 정부는 공문을 정리하고 있으며, 공문을 받을 기관들은 어느 쪽의 지시를 먼저 처리할지 정하고 있습니다."
 TFRKC_TMP_11_d: "이주호 권한대행 정부는 국가의 적법한 지휘를 이탈한 부대와 무장조직에 무장해제 및 지휘 복귀를 요구했습니다. 점거 시설을 반환하고 독자적인 군사 명령을 중단하라는 지시가 함께 전달되었습니다. 정부는 국가기관의 업무 계속과 국민 보호를 위해 별개의 무장 지휘를 인정할 수 없다고 밝혔습니다. 발표는 공식적이고 분명했습니다. 법적 권한을 가진 정부가 복귀를 요구하며, 현장 기관은 이를 집행해야 한다는 설명입니다.\n\n요구는 거부되었습니다. 각 조직은 정부가 자신들을 보호하거나 대표할 수 없다며 자체 지휘를 유지했습니다. 같은 정부 문서를 받은 기관 안에서도 어느 지시를 따라야 하는지 의견이 갈렸습니다. 접수 창구는 수신을 확인했지만 무기를 관리하는 지휘소는 별도의 명령을 기다렸습니다. 중앙에서 보면 문서가 정상적으로 전달되었고, 현장에서 보면 아직 무엇도 하나로 결정되지 않았습니다. 지휘의 분열은 이제 소문이 아니라 서로 다른 회신으로 남습니다.\n\n정부 발표에는 국가기관이 정상적으로 기능하고 있다고 적혔습니다. 그 발표를 전달할 통신망 일부는 다른 지휘의 허가를 받아야 했습니다. 관청의 담당자는 자신의 업무를 끝냈다고 표시하고 다음 연락을 기다립니다. 길목의 병력은 자리를 비우지 않습니다. 법적 지휘와 실제 무장력이 다른 곳을 바라보는 동안 평범한 사람들은 통행과 배급, 출근과 귀가의 허가를 다시 확인해야 합니다. 정부의 요구에 답은 돌아왔습니다. 그 답을 집행할 하나의 국가가 남아 있는지가 문제가 되었습니다."
 TFRKC_TMP_12_d: "비상계엄 선포 이후 봉인된 명령이 각 지휘부에 전달되었습니다. 담당자들은 수신 시각을 적고 필요한 인원과 연락 수단을 확인했습니다. 명령은 같은 서식으로 작성되었고 접수했다는 보고도 차례로 올라왔습니다. 상황판에는 확인 표시가 늘어납니다. 그 표시를 보는 사람에게 각 부대는 같은 절차를 따르는 것처럼 보입니다. 봉투를 연 사람들에게는 그 안의 문장이 자신과 부하의 행동을 어디까지 요구하는지부터 판단해야 할 일이었습니다.\n\n어떤 지휘관은 후속 지시를 기다렸고, 어떤 지휘관은 명령의 적법성과 책임의 소재를 되물었습니다. 지시를 전달한 쪽은 절차에 따른 집행을 강조하고, 현장에서는 구체적으로 누구에게 무엇을 하라는 것인지 확인합니다. 질문을 올렸다는 사실만으로 항명이나 복종이 확정되는 것은 아닙니다. 대기 중인 인원은 자신의 임무를 짧게 전달받았지만, 그 임무가 끝난 뒤 누가 결과를 설명할 것인지에 대한 말은 듣지 못했습니다.\n\n보고망에는 접수와 확인, 대기라는 단어가 반복됩니다. 어느 단어도 아직 현장의 모든 판단을 대신하지는 않습니다. 명령을 내린 사람에게는 상황판의 한 칸이 채워진 일이지만, 그 결과를 감당할 사람에게는 돌아가야 할 집과 함께 근무하는 동료의 얼굴이 떠오릅니다. 기관은 명령이 전달되었다고 기록합니다. 같은 지시를 받은 사람들이 같은 결론에 도달했는지는 아직 기록되지 않았습니다. 봉투는 열렸고, 그 사이의 침묵은 보고서에 들어가지 않았습니다."
