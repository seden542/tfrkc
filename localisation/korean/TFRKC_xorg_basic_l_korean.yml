l_korean:
 # Temporary basic prose: final NEW16 story handoff was not present when generated.
 TFRKC_xorg_category:0 "지역 조직의 제안"
 TFRKC_xorg_category_desc:0 "등록된 조직의 초기 협의 안건입니다. 이 단계에서는 독립이나 영토·병력·외교 관계를 변경하지 않습니다."
 TFRKC_xorg_record_tt:0 "해당 조직의 초기 검토 결과를 기록합니다. 실제 협정·독립·파병·사면·담보 이전은 실행하지 않습니다."
 TFRKC_xorg_GWANGJU_proposal:0 "광주시민방위정부: 공동전선 제안"
 TFRKC_xorg_GWANGJU_proposal_desc:0 "조직의 초기 협의 방향을 결정합니다. 후속 고유 시스템과 독립 효과는 별도로 연결됩니다."
 TFRKC_xorg_draft_GWANGJU_t:0 "공동전선 제안"
 TFRKC_xorg_draft_GWANGJU_d:0 "전주 측과 공동전선을 논의하자는 의견이 올라왔습니다. 당장 지휘권을 합치기보다 연락창구와 협의 범위를 먼저 정해야 합니다."
 TFRKC_xorg_draft_GWANGJU_a:0 "공동전선 협의를 추진한다."
 TFRKC_xorg_draft_GWANGJU_b:0 "당분간 독자 연락망을 유지한다."
 TFRKC_xorg_JEONJU_proposal:0 "전주국민혁명위원회: 혁명재판의 범위"
 TFRKC_xorg_JEONJU_proposal_desc:0 "조직의 초기 협의 방향을 결정합니다. 후속 고유 시스템과 독립 효과는 별도로 연결됩니다."
 TFRKC_xorg_draft_JEONJU_t:0 "혁명재판의 범위"
 TFRKC_xorg_draft_JEONJU_d:0 "혁명재판의 범위를 둘러싸고 의견이 갈렸습니다. 광주와 협력하려면 증거와 절차를 먼저 합의해야 한다는 주장도 나오고 있습니다."
 TFRKC_xorg_draft_JEONJU_a:0 "재판 절차의 공동 협의를 추진한다."
 TFRKC_xorg_draft_JEONJU_b:0 "외부 협의 없이 내부 심의를 계속한다."
 TFRKC_xorg_CORPORATE_proposal:0 "한국기업안보연합: 누구의 경비대인가"
 TFRKC_xorg_CORPORATE_proposal_desc:0 "조직의 초기 협의 방향을 결정합니다. 후속 고유 시스템과 독립 효과는 별도로 연결됩니다."
 TFRKC_xorg_draft_CORPORATE_t:0 "누구의 경비대인가"
 TFRKC_xorg_draft_CORPORATE_d:0 "계열사들은 공동 경비를 요구하면서도 사병의 지휘권은 양보하지 않으려 합니다. 첫 회의부터 명령권과 비용 분담을 정할 필요가 생겼습니다."
 TFRKC_xorg_draft_CORPORATE_a:0 "공동 지휘 규약을 협의한다."
 TFRKC_xorg_draft_CORPORATE_b:0 "계열사별 지휘를 유지한다."
 TFRKC_xorg_CONTINUITY_proposal:0 "국가존속위원회: 서울에서 온 요청"
 TFRKC_xorg_CONTINUITY_proposal_desc:0 "조직의 초기 협의 방향을 결정합니다. 후속 고유 시스템과 독립 효과는 별도로 연결됩니다."
 TFRKC_xorg_draft_CONTINUITY_t:0 "서울에서 온 요청"
 TFRKC_xorg_draft_CONTINUITY_d:0 "서울에 대한 지원 방안을 검토하자는 보고가 올라왔습니다. 지원의 대가로 무엇을 요구할지, 정통성 주장을 어디까지 내세울지부터 의견이 엇갈립니다."
 TFRKC_xorg_draft_CONTINUITY_a:0 "지원과 정통성 문제를 분리해 협의한다."
 TFRKC_xorg_draft_CONTINUITY_b:0 "승계 문제를 먼저 논의한다."
 TFRKC_xorg_TAEBAEK_proposal:0 "태백산군사평의회: 산중의 연락"
 TFRKC_xorg_TAEBAEK_proposal_desc:0 "조직의 초기 협의 방향을 결정합니다. 후속 고유 시스템과 독립 효과는 별도로 연결됩니다."
 TFRKC_xorg_draft_TAEBAEK_t:0 "산중의 연락"
 TFRKC_xorg_draft_TAEBAEK_d:0 "고립된 부대와 연락할 수 있을지 검토하자는 제안이 나왔습니다. 장교들은 합류 조건과 지휘권을 먼저 정해야 한다며 회의를 요청했습니다."
 TFRKC_xorg_draft_TAEBAEK_a:0 "합류 조건을 장교회의에 회부한다."
 TFRKC_xorg_draft_TAEBAEK_b:0 "확인될 때까지 기존 지휘를 유지한다."
 TFRKC_xorg_FARMERS_proposal:0 "호남농민공동전선: 곡식의 가격"
 TFRKC_xorg_FARMERS_proposal_desc:0 "조직의 초기 협의 방향을 결정합니다. 후속 고유 시스템과 독립 효과는 별도로 연결됩니다."
 TFRKC_xorg_draft_FARMERS_t:0 "곡식의 가격"
 TFRKC_xorg_draft_FARMERS_d:0 "식량 공급 협정을 마련하자는 제안이 올라왔습니다. 마을 대표들은 강제수매를 우려하며 수량과 대금을 문서로 보장하라고 요구합니다."
 TFRKC_xorg_draft_FARMERS_a:0 "자발적 공급과 대금 보장을 협의한다."
 TFRKC_xorg_draft_FARMERS_b:0 "공급 약속을 보류한다."
 TFRKC_xorg_COVENANT_proposal:0 "새벽언약회: 구호소의 열쇠"
 TFRKC_xorg_COVENANT_proposal_desc:0 "조직의 초기 협의 방향을 결정합니다. 후속 고유 시스템과 독립 효과는 별도로 연결됩니다."
 TFRKC_xorg_draft_COVENANT_t:0 "구호소의 열쇠"
 TFRKC_xorg_draft_COVENANT_d:0 "구호시설을 늘리자는 의견과 교단이 모든 운영권을 가져야 한다는 주장이 맞섰습니다. 구호품을 나누는 일이 곧 권한을 나누는 문제가 되었습니다."
 TFRKC_xorg_draft_COVENANT_a:0 "구호 운영의 공동 감독을 검토한다."
 TFRKC_xorg_draft_COVENANT_b:0 "교단 내부의 운영 심의를 계속한다."
 TFRKC_xorg_TAIWAN_proposal:0 "자유대만복국군: 먼 바다의 정부"
 TFRKC_xorg_TAIWAN_proposal_desc:0 "조직의 초기 협의 방향을 결정합니다. 후속 고유 시스템과 독립 효과는 별도로 연결됩니다."
 TFRKC_xorg_draft_TAIWAN_t:0 "먼 바다의 정부"
 TFRKC_xorg_draft_TAIWAN_d:0 "망명정부 승인 요청과 귀환 원정 구상이 함께 논의되고 있습니다. 외교적 승인과 군사적 약속을 같은 문서에 담아서는 안 된다는 지적이 나왔습니다."
 TFRKC_xorg_draft_TAIWAN_a:0 "승인 협의를 먼저 추진한다."
 TFRKC_xorg_draft_TAIWAN_b:0 "원정 가능성을 내부 검토한다."
 TFRKC_xorg_DAEDEOK_proposal:0 "대덕기술관리국: 연구소의 징발 명령"
 TFRKC_xorg_DAEDEOK_proposal_desc:0 "조직의 초기 협의 방향을 결정합니다. 후속 고유 시스템과 독립 효과는 별도로 연결됩니다."
 TFRKC_xorg_draft_DAEDEOK_t:0 "연구소의 징발 명령"
 TFRKC_xorg_draft_DAEDEOK_d:0 "청소년해방군과의 징발 갈등을 어떻게 풀 것인지 연구소 대표들이 모였습니다. 자율 운영 보장을 요구할지 독립안을 검토할지부터 결정해야 합니다."
 TFRKC_xorg_draft_DAEDEOK_a:0 "징발 제한과 자율 운영을 협의한다."
 TFRKC_xorg_draft_DAEDEOK_b:0 "독립안 검토를 요청한다."
 TFRKC_xorg_RAIL_proposal:0 "대한철도공동체: 선로 위의 경계"
 TFRKC_xorg_RAIL_proposal_desc:0 "조직의 초기 협의 방향을 결정합니다. 후속 고유 시스템과 독립 효과는 별도로 연결됩니다."
 TFRKC_xorg_draft_RAIL_t:0 "선로 위의 경계"
 TFRKC_xorg_draft_RAIL_d:0 "통행권과 호송 조건을 정하지 않으면 선로가 이어져 있어도 열차는 움직일 수 없습니다. 거점이 단절될 경우의 운행 중단 기준도 논의 대상입니다."
 TFRKC_xorg_draft_RAIL_a:0 "통행권과 호송 규약을 협의한다."
 TFRKC_xorg_draft_RAIL_b:0 "안전 확인을 우선한다."
 TFRKC_xorg_WHITE_NIGHT_proposal:0 "백야국가보안국: 같은 암호, 다른 보고"
 TFRKC_xorg_WHITE_NIGHT_proposal_desc:0 "조직의 초기 협의 방향을 결정합니다. 후속 고유 시스템과 독립 효과는 별도로 연결됩니다."
 TFRKC_xorg_draft_WHITE_NIGHT_t:0 "같은 암호, 다른 보고"
 TFRKC_xorg_draft_WHITE_NIGHT_d:0 "비밀 연락망에 서로 맞지 않는 보고가 들어왔습니다. 이중간첩의 존재를 단정하기 전에 연락책과 정보 출처를 대조하자는 의견이 나왔습니다."
 TFRKC_xorg_draft_WHITE_NIGHT_a:0 "정보 출처의 교차 검증을 지시한다."
 TFRKC_xorg_draft_WHITE_NIGHT_b:0 "접촉 확대를 보류한다."
 TFRKC_xorg_CHEONGSONG_proposal:0 "청송자유군: 철문 안의 협약"
 TFRKC_xorg_CHEONGSONG_proposal_desc:0 "조직의 초기 협의 방향을 결정합니다. 후속 고유 시스템과 독립 효과는 별도로 연결됩니다."
 TFRKC_xorg_draft_CHEONGSONG_t:0 "철문 안의 협약"
 TFRKC_xorg_draft_CHEONGSONG_d:0 "교도관과 수감자 사이에 생존협약을 만들자는 제안이 나왔습니다. 사면 약속은 누구의 권한으로 보장할 수 있는지부터 확인해야 합니다."
 TFRKC_xorg_draft_CHEONGSONG_a:0 "생존협약과 사면 심의안을 마련한다."
 TFRKC_xorg_draft_CHEONGSONG_b:0 "사면 약속 없이 생존 협의를 계속한다."
 TFRKC_xorg_IMPERIAL_proposal:0 "대한황실봉대회: 추대장의 빈칸"
 TFRKC_xorg_IMPERIAL_proposal_desc:0 "조직의 초기 협의 방향을 결정합니다. 후속 고유 시스템과 독립 효과는 별도로 연결됩니다."
 TFRKC_xorg_draft_IMPERIAL_t:0 "추대장의 빈칸"
 TFRKC_xorg_draft_IMPERIAL_d:0 "군주 추대를 논의하는 자리에서 혈통 자료의 진위를 먼저 확인해야 한다는 주장이 나왔습니다. 의례를 앞세울지 검증을 앞세울지 의견이 갈렸습니다."
 TFRKC_xorg_draft_IMPERIAL_a:0 "혈통 자료의 공개 검증을 요청한다."
 TFRKC_xorg_draft_IMPERIAL_b:0 "추대 논의를 보류한다."
 TFRKC_xorg_HOMECOMING_proposal:0 "망향군: 강화의 조건"
 TFRKC_xorg_HOMECOMING_proposal_desc:0 "조직의 초기 협의 방향을 결정합니다. 후속 고유 시스템과 독립 효과는 별도로 연결됩니다."
 TFRKC_xorg_draft_HOMECOMING_t:0 "강화의 조건"
 TFRKC_xorg_draft_HOMECOMING_d:0 "강화협정을 수용할지, 동맹에서 이탈할 가능성까지 검토할지 의견이 갈립니다. 어느 쪽도 아직 서명하거나 명령을 내린 것은 아닙니다."
 TFRKC_xorg_draft_HOMECOMING_a:0 "강화 조건의 협의를 추진한다."
 TFRKC_xorg_draft_HOMECOMING_b:0 "동맹 이탈안을 내부 검토한다."
 TFRKC_xorg_CREDIT_proposal:0 "국가채권회수단: 담보 목록"
 TFRKC_xorg_CREDIT_proposal_desc:0 "조직의 초기 협의 방향을 결정합니다. 후속 고유 시스템과 독립 효과는 별도로 연결됩니다."
 TFRKC_xorg_draft_CREDIT_t:0 "담보 목록"
 TFRKC_xorg_draft_CREDIT_d:0 "전쟁대출의 상환 보장과 채무불이행 때의 담보 운영권을 정하자는 안이 제출되었습니다. 운영권 이전은 계약과 현장 통제를 따로 확인해야 합니다."
 TFRKC_xorg_draft_CREDIT_a:0 "상환과 담보 조건을 협의한다."
 TFRKC_xorg_draft_CREDIT_b:0 "대출 약속을 보류한다."
 TFRKC_xorg_UNDERGROUND_proposal:0 "서울지하자치구: 역장회의"
 TFRKC_xorg_UNDERGROUND_proposal_desc:0 "조직의 초기 협의 방향을 결정합니다. 후속 고유 시스템과 독립 효과는 별도로 연결됩니다."
 TFRKC_xorg_draft_UNDERGROUND_t:0 "역장회의"
 TFRKC_xorg_draft_UNDERGROUND_d:0 "역장들은 자치 협상과 지상 진출 문제를 논의하기 위해 모였습니다. 먼저 공동 회의의 대표권을 정해야 한다는 의견이 나왔습니다."
 TFRKC_xorg_draft_UNDERGROUND_a:0 "역장회의의 협상안을 마련한다."
 TFRKC_xorg_draft_UNDERGROUND_b:0 "지상 진출 검토를 내부에 회부한다."
