l_korean:
 # Original TFRKC fiction; bilateral consent integration. Event owner connects these keys.
 TFRKC_bloc_integration_category: "공동전선 통합 협상"
 TFRKC_bloc_integration_request_t: "통합 협상 제안"
 TFRKC_bloc_integration_request_d: "[From.GetName] 측이 [Root.GetName] 측에 군과 행정을 하나의 체계로 통합하자는 제안을 보내왔습니다. 같은 블록에 속해 협력하는 동안에도 각 기관과 부대는 별도의 지휘와 책임 아래 움직였습니다. 제안이 도착했다는 사실만으로 그 권한이 넘어가지는 않습니다.\n\n통합을 주장하는 이들은 보급과 행정의 중복을 줄일 수 있다고 말합니다. 독립 지휘를 지지하는 이들은 주민에게 한 약속을 누가 책임질지 묻습니다. 급여 명부와 배급 장부는 하나로 묶을 수 있어도, 그 장부에 이름을 올린 사람들의 신뢰까지 한꺼번에 넘길 수는 없습니다.\n\n동의하면 이번 제안을 주고받은 두 세력의 통합을 진행합니다. 거절하면 각자의 지휘를 유지하며, 거절을 이유로 같은 블록 안에서 전쟁을 벌이지 않습니다."
 TFRKC_bloc_integration_accept: "통합 제안을 수락한다."
 TFRKC_bloc_integration_decline: "독립 지휘를 유지한다."
 TFRKC_bloc_integration_transfer_tt: "이번 제안에 쌍방이 동의한 두 세력만 통합합니다. 다른 동맹 세력은 이 결정으로 통합되지 않습니다."
 TFRKC_bloc_request_KWC_KLF: "청소년해방군에 통합 협상 제안"
 TFRKC_bloc_request_KWC_KPL: "대한인민해방군에 통합 협상 제안"
 TFRKC_bloc_request_KRC_ZAF: "대한민국 공군에 통합 협상 제안"
 TFRKC_bloc_request_KOR_KCH: "헌정수호연합에 통합 협상 제안"
 TFRKC_bloc_request_KYA_ZSL: "신라에 통합 협상 제안"
 TFRKC_bloc_request_KYA_ZUS: "철강의 울산에 통합 협상 제안"
