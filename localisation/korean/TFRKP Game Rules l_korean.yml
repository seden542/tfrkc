 TFRKP_lee_reds_bop_of_nation_DLP_TXT: "§s£GFX_KOR_DLP_texticon 민주노동당§!"
 TFRKP_lee_reds_bop_of_nation_DLP_TXT_DESC: "민주노동당은 기성 정당을 상대로 우위를 점했습니다. 다음 대선에서 주도 정파 및 정파 영향력에 따라 대통령이 결정됩니다."
 TFRKP_lee_reds_bop_of_nation_PPP_DPK_TXT: "£GFX_KOR_PPP_texticon §d기성§! §B정당§!£GFX_KOR_DemocraticParty_texticon"
 TFRKP_lee_reds_bop_of_nation_PPP_DPK_TXT_DESC: "국민의힘, 더불어민주당 등 기존 6공 체제 하의 정당들이 우위를 점했습니다. 다음 대선에서 무조건 더불어민주당 대통령이 당선되며 한국은 체제 개혁의 길을 걸어갈 것입니다."
 
