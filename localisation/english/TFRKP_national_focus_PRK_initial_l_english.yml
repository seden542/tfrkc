 PRK_GATHERING_STORM_DESC: "If asked which country has the world's most closed and anomalous system, nine out of ten people would immediately name the Democratic People's Republic of Korea.\n\nA country whose basic ideology is communism, utterly diminished after the collapse of the Soviet Union; a country where supreme leadership has passed through three generations of a single family; a country that spends more than 25 percent of its gross domestic product on defense; and a country that has antagonized the entire world through reckless nuclear brinkmanship. Neither the Republic of Korea directly across the Military Demarcation Line nor the many other countries of the world can predict its internal circumstances or future course.\n\nFounded after World War II upon the Soviet Army's southward advance and the communist takeover led by Kim Il Sung, the Democratic People's Republic of Korea stood on the front line of the Cold War and experienced countless military clashes. The Cold War's two giants confronted each other on this tiny land, which became both the cause and the theater of repeated armed clashes and military crises on land, at sea, and in the air.\n\nUnder three generations of hereditary rule from Kim Il Sung to Kim Jong Il and Kim Jong Un, the Democratic People's Republic of Korea grew increasingly isolated. It has pursued nuclear weapons obsessively in response to pressure from 'U.S. imperialism,' while the international community has intensified sanctions and pressure to stop it.\n\nAfter decades of this vicious cycle, the Democratic People's Republic of Korea is seeking a new breakthrough, and its turning point is approaching sooner than expected.\n\n----\n\n\"The mental strength of a single Korean can make 25 million Yankees tremble in fear. With 25 million Koreans, we can not only destroy the United States but annihilate every enemy in the world.\" - §YKim Jong Un§!\n\n§ANo Additional Content Planned!§!"
 PRK_country_summary: "$PRK_GATHERING_STORM_DESC$"
