l_korean:
 TFRKC_story_test_preview:0 "개발용: 사건 본문·그림 순서대로 보기"
 TFRKC_story_test_preview_desc:0 "사건 본문과 그림만 확인합니다. 다음 선택지를 누르면 다음 장면으로 넘어갑니다. 정치·날짜·전쟁 상태를 변경하지 않습니다."
 TFRKC_story_test_failure:0 "개발용: 전주부터 계엄 실패 경로 시험"
 TFRKC_story_test_failure_desc:0 "별도의 새 테스트 게임에서 사용하십시오. 패전 1년 대기를 생략하고 전주 사건부터 시작합니다. 전주 9일 후 계엄 기준일을 기록하고 10일 후 준비도 25의 실패 사건을 실행합니다. 실제 달력 한 달 후 조건 판정과 내전 호출까지 진행하므로 정치·지도·군대가 변경될 수 있습니다. 저장 후 불러오기는 선포일 기록 뒤 시험하십시오."
 TFRKC_story_test_success:0 "개발용: 계엄 성공·내전 미발생 시험"
 TFRKC_story_test_success_desc:0 "별도의 새 테스트 게임에서 사용하십시오. 실패 시험과 같은 날짜로 진행하되 계엄 성공 사건을 실행합니다. 한 달 판정일에도 새 내전이 발생하지 않아야 합니다. 두 시험은 서로 다른 새 게임에서 실행하십시오."
 TFRKC_test_result_t:0 "개발용: 한 달 기한 판정 결과"
 TFRKC_test_result_success:0 "계엄 성공 시험의 판정 기한이 지났습니다. 현재 TFRKC 내전 활성 플래그는 없습니다. 성공 경로에서 내전을 발생시키지 않는 기본 검사를 통과했습니다. 실제 지도와 지도자 상태도 확인하십시오."
 TFRKC_test_result_failure:0 "계엄 실패 시험의 판정 기한이 지났습니다. 현재 TFRKC 내전 활성 플래그가 있습니다. 내전 호출의 기본 검사를 통과했습니다. 선포일과 개전일, 지도자, 영토와 부대는 별도로 확인하십시오."
 TFRKC_test_result_unexpected:0 "선택한 시험과 내전 활성 상태가 일치하지 않습니다. 선포일·단계 플래그와 game.log 및 error.log를 확인하십시오. 다른 개발 디시전을 함께 실행했다면 별도의 새 게임에서 다시 시험하십시오."
