 lvov: "르비우"
 lvov_desc: ""
 milan: "밀라노"
 milan_desc: "----\n§9오 밀라노여, 노래하는 성가대여,\n거대한 창들의 찬연한 불꽃이여,\n그 높이, 그 공간, 그 어스름, 그 영광이여!\n대리석의 산이여, 백 개의 첨탑이여!§!"
 odessa: "오데사"
 odessa_desc: ""
 strasbourg: "스트라스부르"
 strasbourg_desc: ""
 venice: "베네치아"
 venice_desc: "----\n§9한때 그녀는 찬란한 동방을 영지로 거느렸고\n서방의 수호자였으니\n베네치아의 가치는 그 태생에 결코 뒤처지지 않았도다\n자유의 가장 오래된 자식 베네치아여.§!"
 toyko: "도쿄"
 toyko_desc: "----\n§9널리 뻗은 도쿄도는 일본의 수도입니다. 일본 전체 인구의 거의 절반이 거주하며 정부 및 일본 황실이 모두 자리 잡고 있는 도쿄는 일본 전역에 막대한 문화적, 경제적, 정치적 영향력을 행사합니다.\n\n문화적으로 도쿄는 역사적인 신사, 번화한 쇼핑몰, 국회의사당, 시부야 스크램블 교차로, 도쿄 스카이트리, 도쿄 타워와 같은 상징적인 건축물들이 풍부합니다. 도쿄는 또한 기술과 금융, 그리고 패션 분야의 세계적인 선두주자이며, 안전성과 효율적인 대중교통으로 명성이 자자한, 많은 사람들이 국제 표준이라 인정하는 도시입니다.§!\n\n§p오카와가 있기에 나는 도쿄를 사랑하고, 도쿄가 있기에 나는 삶을 사랑한다.§!"
 osaka: "오사카"
 osaka_desc: "----\n§9오사카부의 부청 소재지이자 일본에서 세 번째로 큰 도시인 오사카는 혼슈 간사이 지방의 주요 경제 및 문화 중심지입니다. 고훈 시대부터 주요 무역항이었던 오사카는 에도 시대에 일본의 상업 수도가 되었고 메이지 유신 이후 빠르게 산업화되었습니다.\n\n오늘날 오사카는 오사카증권거래소는 물론, 많은 주요 기업체와 명문 대학이 위치한 중요한 금융 중심지이며, 국제 수준의 연구개발의 핵심 거점이기도 합니다. 오사카는 활기찬 길거리 문화, 미식 문화 및 오사카성, 도톤보리, 츠텐카쿠, 시텐노지와 같은 마루지, 그리고 유니버설 스튜디오 재팬과 같은 관광 명소로도 유명합니다.§!\n\n§p오 마 가!§!"
 nagoya: "나고야"
 nagoya_desc: "----\n§9아이치현의 현청 소재지인 나고야는 일본에서 네 번째로 인구가 많은 도시이며 주부 지방의 주요 산업 및 문화 중심지입니다. 1610년 도쿠가와 이에야스가 나고야성을 건설하며 설립한 이 도시는 빠르게 오와리국의 수도가 되었고 메이지 시대에 번성했습니다.\n\n강력한 제조업으로 유명한 나고야는 특히 자동차, 항공, 조선 분야와 같은 핵심 산업의 본거지로, 브라더 공업, 아이바네즈, 렉서스, 그리고 도요타 통상과 같은 주요 기업들이 이곳에 본사를 두고 있습니다. 도카이도 신칸센을 통해 도쿄, 교토와 오사카는 긴밀하게 연결되어 있습니다. 주목할 만한 명소로는 아쓰타 신궁, 나고야성, 히가시야마 동물원 및 나고야 TV 타워 등이 있습니다.§!"
 kyoto: "교토"
 kyoto_desc: "----\n§9일본의 옛 수도였던 교토는 일본에서 인구가 9번째로 많은 도시이자 혼슈 간사이 지방에 위치한 주요 문화 중심지입니다. 794년 헤이안쿄로 건립되어 헤이안 시대 동안 일본의 정치 및 문화 중심지 역할을 했으며, 1868년까지 천년 넘게 수도로 남아 있었습니다.\n\n보존이 잘 된 문화유산과 제2차 세계 대전의 파괴를 대부분 면한 것으로 유명한 교토는 키요미즈데라와 킨카쿠지를 포함한 2,000개 이상의 종교 시설이 있는 곳입니다. 교토는 또한 전통 예술, 다도, 기온 지구의 게이샤 공연으로 유명합니다. 경제 면에서는 기모노 직조와 같은 전통 산업과 도시에 본사를 둔 닌텐도와 같은 현대 기술 기업이 조화를 이루고 있습니다. 교토는 수많은 유네스코 세계문화유산과 기온마쓰리와 같은 유명한 축제가 열리는 곳으로, 문화 및 교육의 주요 명소로 남아 있습니다.§!\n\n§p장소, 근데 이제 일본을 곁들인§!"
 yokohama: "요코하마"
 yokohama_desc: "----\n§9요코하마는 일본 제2의 도시이자 가나가와현의 현청 소재지입니다. 간토 지방의 도쿄만 연안에 위치한 이 도시는 1859년 국제 무역항으로 개항한 이후 작은 어촌 마을에서 주요 항구 도시로 발전했으며, 메이지 시대 서양 문물의 관문 역할을 했습니다. 일본에서 가장 크고 분주한 항구 중 하나인 요코하마항은 도시가 상업 및 산업의 중심지로 빠르게 발전하는 데 중요한 역할을 했습니다.\n\n오늘날 요코하마는 번성하는 산업 및 경제의 중심지로, 닛산이나 이스즈와 같은 주요 기업들이 자리 잡고 있습니다. 상징적인 미나토 미라이 21 지구는 요코하마 랜드마크 타워와 코스모 클락 21과 같은 명소들을 자랑합니다. 문화적 명소로는 일본 최대 규모인 요코하마 차이나타운과 경치 좋은 야마시타 공원 등이 있습니다.§!\n\n§p달려가자, 겁나 뜨겁고 멋들어진 축제 이끄는 거야 이치반, 즐기자! 눈부신 인생을 처음부터!§!"
 beijing: "베이징"
 beijing_desc: "----\n§9활기차고 다채로운 왕푸징 거리는 고즈넉한 역사의 숨결이 느껴지는 오래된 후퉁들과 벽 하나를 사이에 두고 맞닿아 있습니다. 과거 황제들의 호화로운 정원이 붉은 별과 망치낫 문양으로 장식된 회색의 정부 청사들을 내려다보고 있습니다. 이러한 기묘하면서도 조화로운 풍경은 중화인민공화국의 수도인 베이징에서만 찾아볼 수 있을 것입니다. 원나라가 1271년에 베이징을 수도로 삼은 이래, 이 도시는 수많은 풍파를 겪으며 여러 통치자들의 흥망성쇠를 지켜봤습니다. 독특한 역사는 도시의 남북 축과 격자형 배치를 형성했으며, 베이징 사람들이 소중히 여기는 독특한 도시 정신과 시민 문화를 함양했습니다.\n베이징 사람들은 동포들에게 종종 열정과 오만, 개방성과 경직성이 뒤섞인 복합적인 역할을 보여줍니다. 국가 권력의 심장부에 가장 가까이 있음에도, 시민들은 권위에 대한 은근한 경멸을 품고 있습니다. \"베이징에서는 벽돌 하나를 던지면 국장 열 명은 맞출 수 있다.\" 공화국의 개방과 대외 교류의 최전선에 서 있는 그들은 독특한 억양부터 발효 음료인 \"더우즈\"에 대한 애정까지, 재미있고도 고풍스러운 전통들을 고수합니다. 이는 오래 되었음에도 젊은 국가인 중국 그 자체를 보여줍니다.\n오늘날 베이징을 수도로 삼은 중화인민공화국은 70년 이상의 역사를 자랑하고 있습니다. 이 유서 깊은 도시는 과거 왕조들의 평화로운 번영과 격동의 시기, 그리고 국가의 흥망성쇠와 중흥을 모두 목격했습니다. 미래를 내다보며, 작금의 베이징의 지도자들은 이 도시를 또 어디로 이끌어갈까요? 아마 역사만이 그 답을 줄 수 있을 것입니다.§!"
 tianjin: "톈진"
 tianjin_desc: "----\n§9톈진은 \"천자의 나루터\"라는 뜻으로, 처음부터 중국의 수도와 통치자들의 운명과 뗄레야 뗄 수 없는 관계를 맺어 왔습니다. 지난 2세기 동안 이 도시는 무능한 통치 아래 중국이 겪은 굴욕을 견뎌야 했고, 오만한 식민 세력의 폭정 아래에서 고통 받아야 했으며, 수많은 순교자들이 목숨을 바치는 것을 목격했습니다. 그러나 결국, 길고 긴 어둠을 이겨내고 떠오르는 태양을 맞이했습니다. 오늘날 톈진은 중국 북부 산업계의 최대 도시로서 베이징의 중요한 해상 관문이자 환보하이 경제권의 핵심으로서 굳건히 서있습니다. 이 번성하는 항구는 수백 년 전처럼 상인들이 모여드는 국내외 무역의 번화한 중심지로서 수 세기 동안 이어져 온 전통을 이어가고 있습니다.§!"
 chengdu: "청두"
 chengdu_desc: "----\n§9\"풍요의 땅\"이라 불리는 청두는 2,300년이 넘는 세월 동안 도강언의 젖줄을 타고 풍요를 누려왔습니다. 청두는 고대 문명의 무게를 짊어지고 있을 뿐만 아니라, 현지인과 방문객 모두를 사로잡는 활기찬 도시 문화를 자랑합니다. 청성산의 고즈넉한 아름다움부터 무후사에서 기리는 충의의 역사에 이르기까지, 청두는 오래된 것과 새로운 것이 매혹적으로 어우러져 있습니다. 길가의 찻집, 세계적 수준의 전투기 생산 라인, 번육 연구 기지의 대왕판다, 그리고 도심의 번화한 톈푸 광장은 모두 청두의 다양성을 잘 보여줍니다.\n하지만 진정으로 청두를 돋보이게 하는 것은 다른 중국의 대도시에서 찾아볼 수 있는 빠르게 진행되는 경제 중심의 박자와는 확연히 대조되는 특유의 여유로운 삶의 속도입니다. 전통과 현대 사이의 균형으로 청두는 독특한 매력을 선사하며, 현대화의 물결이 중국 남서부의 이 활기찬 도시를 어떻게 변화시켰는지 여실히 보여주고 있습니다.§!"
 chongqing: "충칭"
 chongqing_desc: "----\n§9지리적으로나 문화적으로나 충칭만큼 강과 밀접한 관계를 맺고 있는 도시는 거의 없습니다. 장강과 자링강이 합류하는 이곳에서 3천 년의 세월 동안 \"산의 도시\"에서 사람들은 험준한 이 땅을 사이버펑크물에 나올 법한 매혹적인 대도시로 변화시켰습니다. 숨 막히는 야경은 곧 황금기의 증거이며, 도시의 강들은 독특한 강 문화의 탄생으로 이어졌습니다. 항구의 전통, '가로회' 결사, 한때 도시를 지배했던 흑방은 모두 충칭의 거칠고도 신비로운 분위기를 조성했습니다.\n중국의 정신을 보존하는 전시수도에서 싼샤 댐 건설 계획의 이주민을 수용하는 도시가 되기까지 충칭은 항상 변화에 적응해 왔습니다. 오늘날 충칭은 빅데이터 산업의 핵심 주역이자 쓰촨 분지의 경제 엔진으로서 계속 진화하고 있습니다. 충칭을 상징하는 요리인 훠궈처럼 이 도시에서 각계각층의 사람들은 저마다 고유한 활력과 원동력을 기여하며 다양성을 포용합니다.§!"
 nanjing: "난징"
 nanjing_desc: "----\n§9오나라가 수도로 정한 이래 난징은 중국 남부의 전략적 요충지였으며, 여섯 왕조와 명나라 초기 조정, 중화민국의 임시 수도 역할을 해왔습니다. 양쯔강이 바다를 향해 굽이치며 대운하의 남쪽 종착점과 만나는 이곳은 한때 곡물 바지선과 차 및 소금 무역의 교차로였습니다. 자금산과 명효릉은 황릉 문화를 풍수지리와 엮어내고 거대한 두께의 중화문은 수 세기 동안 이 도시를 지켰습니다. 우화대에는 진나라와의 전쟁, 태평천국 운동, 항일 전쟁의 순교자들을 기리는 비석들이 세워져 있습니다. 침울한 전시물들을 갖춘 난징 대학살 기념관은 1937년을 결코 잊지 말라는 엄중한 경고를 세계에 던지고 있습니다.\n\n21세기에 난징은 장강 삼각주 통합 계획 하에 소프트웨어 서비스, 바이오 의약품, 신소재를 중심으로 현대적인 산업 구성을 발전시켜 왔습니다. 난징 남역과 양쯔강 대교는 철도 및 해운 중심망으로서의 역할을 공고히 하고, 푸커우 개발구와 장베이 신구는 지속적으로 새로운 혜택을 제공하며 디지털 위안화 시범 사용이 길거리에서도 눈에 띕니다. 백 년 이상의 역사를 지닌 대학들과 연구 기관들은 계속해서 인재와 발상을 공급하고 있습니다. 한편 친화이강 문화벨트와 등불이 켜진 라오먼둥 지구는 끊임없는 재개발 속에서도 이 도시의 인간적인 온기를 보존하고 있습니다.§!"
 shanghai: "상하이"
 shanghai_desc: "----\n§9\"밤의 상하이, 밤의 상하이, 그대는 잠들지 않는 도시.\" 현대적인 대도시 상하이는 중국 발전의 가장 눈에 띄는 상징으로 우뚝 서 있습니다. 서구 열강이 들어온 후, 상하이는 상업이 활성화되었고 중국 최초의 근대 산업들이 태동한 곳이 되었습니다. 하지만 이 발전은 상당 부분 외세에 의해 이루어졌습니다. 또한 상하이는 거대한 노동력을 바탕으로 중국공산당이 탄생하는 요람이 되기도 했습니다.\n1949년, 상하이는 인민해방군에 의해 해방되었고 처음으로 도시의 미래가 진정으로 중국 인민의 손에 놓이면서 새로운 시대가 시작되었습니다. 지난 70여 년간 특히 개혁개방 정책과 푸둥 신구 개발 이후 상하이의 성장은 눈부셨습니다. 오늘날 상하이는 아시아와 세계를 선도하는 국제 금융 및 무역 중심지 중 하나이며, 개방적이고 포용적인 정신으로 중국 경제 발전을 이끌고 있습니다.§!"
 shenzhen: "선전"
 shenzhen_desc: "----\n§9\"로마는 하루아침에 이루어지지 않았다\"고들 하듯이, 로마가 지금의 영광을 누리기까지는 2천 년이 넘는 세월이 걸렸습니다. 이와는 대조적으로, 선전은 40년이라는 짧은 기간 만에 주강 삼각주 서쪽 기슭의 작은 어촌에서 로마 인구의 5배에 달하는, 훨씬 더 발전된 번화한 대도시로 변모하는 놀라운 성과를 이루어냈습니다. 40여 년 전만 해도 현지인들은 갈대밭 사이를 작은 어선으로 헤치고 다녔습니다. 하지만 오늘날 선전은 경제 규모 면에서 중국 남부, 아니 세계에서 가장 큰 도시 중 하나로 성장했습니다. 선전은 부상하는 중국의 상징이 되었습니다. 개혁개방 정책이 없었다면 이 땅은 여전히 잠들어 있었을지도 모릅니다. 선전은 중국 개혁개방의 성공을 상징하며, 주강 삼각주의 가장 빛나는 보석으로 자리매김하고 있습니다.§!"
 guangzhou: "광저우"
 guangzhou_desc: "----\n§9300여 년 전, 황실의 칙령과 독특한 지리적 위치 덕분에 광저우는 중국 최초로 국제 무역에 종사하는 도시가 되어 당시 국내의 유일한 무역 중심지로 발돋움 했습니다. 하지만 이 부는 또한 광저우를 표적으로 만들었고, 광저우는 곧 외세의 전리품이 되었습니다. 많은 시련을 견뎌낸 후 이 도시는 더욱 빛나는 모습으로 떠올랐습니다. 개혁개방 이후 광저우의 발전은 선전에 뒤처졌지만, 여전히 광저우가 주강 삼각주 경제권의 중심지임은 부인할 수 없습니다. 오늘날 광저우는 광둥성의 수도이자 중국 남부의 중요한 경제 중심지이며, 중국에서 가장 큰 국제 무역의 중심지 중 하나입니다.§!"
 wuhan: "우한"
 wuhan_desc: "----\n§9장강과 한수를 품은 우한은 오랫동안 남중국과 북중국 문화의 용광로이자 육상 및 수상 교통의 핵심 거점 역할을 해왔습니다. 황동기 반룡성 유적부터 삼국 시대의 혼란 속에서도 시상의 매력을 뽐내던 황학루까지, 우한의 역사는 수천 년을 아우르며 오늘날까지 이어지는 전설을 엮어내려 가고 있습니다.\n현대의 중국사에서 한양제철소는 중국의 산업화의 불씨를 지폈고, 우창 봉기의 총성은 제국의 몰락을 알렸습니다. 우한 전투에서 보여준 단결과 용기는 이 도시의 회복성을 전국에 울려 퍼지게 했습니다. 오늘날에도 장한관 시계탑의 종소리는 여전히 연락선의 기적 소리와 조화롭게 울려 퍼지고 있으며, 우한은 대담한 혁신과 문화의 조화를 통해 과거를 빚어내고 미래를 이끄는 개척 정신을 구현하며 전설을 만들어가고 있습니다.§!"
 hongkong: "홍콩"
 hongkong_desc: "----\n§9아, 홍콩. 한때 풍부한 향나무 때문에 '향기로운 항구'라고 불리던 보잘것없는 어촌 마을이었던 이 섬은 참으로 모든 것을 겪었습니다. 옛날에는 상선들이 이곳으로 모여들었고, 그 돛은 하늘을 가리는 숲과 같았습니다. 하지만 아편 전쟁은 모든 것을 바꾸었고 한 세기가 넘는 기간 동안 우뚝 솟은 마천루와 북적이는 항구를 목격하게 한 새로운 권력을 가져왔습니다. 이 시대는 엄청난 번영을 가져왔지만, 굴욕과 억압이라는 지울 수 없는 상처 또한 남겼습니다. 그러나 도시의 정신은 여전히 남아 있습니다. '딩딩' 전차는 여전히 오래된 거리를 따라 달리고, 스타페리는 홍콩섬과 구룡반도 사이를 오가며 사람들을 실어 나르고, 템플스트리트 노점상들의 외침은 딤섬 포장마차의 짤랑거리는 소리와 뒤섞입니다. 이 독특한 정신은 TV 속 김용의 서사적인 무협 이야기부터 장국영의 시대를 초월한 노래에 이르기까지 도시 그 자체에 짜여 있습니다. 세계적인 금융 도시이자 '동양의 할리우드'인 홍콩은 서구의 냉혹함과 남방의 부드러움이 만나는 놀라운 대비의 도시입니다. 오늘날에도 홍콩은 남중국으로 향하는 중요한 관문으로 남아 있으며 격동과 승리 모두를 경험한 도시입니다. 빅토리아 항구의 불빛은 여전히 밝게 빛나며 굴하지 않는 정신의 등대 역할을 하고 있습니다.§!"
 macau: "마카오"
 macau_desc: "----\n§9마카오는 오랫동안 동양과 서양의 교차로였으며, 문화 교류에서 중추적인 역할로 유명했습니다. 명나라 말기와 청나라 초기에는 \"서학동전\"에 중요한 역할을 했으며 한때 세계의 주요 경제 중심지 중 하나였습니다. 명나라 때부터 포르투갈 정착민들은 이 중국 영토에 정착하여 토지 임대료와 세금을 이용해 마카오를 통제했고, 이곳을 동양으로 가는 중요한 관문으로 변화시켰습니다. 새천년 직전에 마카오는 조국의 품으로 돌아왔고, 1세기 이상의 식민 통치를 종식했습니다.\n\n오늘날 마카오는 특히 중국 내에서 번성하는 서비스 산업으로 유명합니다. 중국에서 카지노가 합법적으로 허용되는 유일한 도시로서 운을 시험하려는 큰손 도박꾼들을 끌어들이며 \"아시아의 라스베이거스\"라는 별명을 얻었습니다.\n\n마카오에 와서 한번 시도해 보세요. 비록 마지막 남은 옷까지 잃게 될지라도 여전히 가치 있는 경험일 것입니다.§!"
 taibei: "타이베이"
 taibei_desc: "----\n§9타이베이는 대만의 수도이자 칠백만이 넘는 인구의 터전으로, 중심업무지구인 신이계획구, 활기 넘치는 시먼딩, 중정구의 교통 허브, 그리고 다안구의 공원과 명문 대학가로 잘 알려져 있습니다. 1960년대 이후 대만의 경제 기적과 발전의 상징이 된 타이베이는 평범하고 원시적인 도시에서 번화한 대도시로 변모했습니다. 한때 세계에서 가장 높았던 마천루인 타이베이 101 또한 이곳에 있습니다.\n오래된 청나라 시대의 성벽은 해체되었지만, 타이베이는 다른 많은 대도시와 마찬가지로 잠재적인 침략자들에 대응할 수 있는 요새로 여겨집니다. 수비 측 병력은 다양한 지점에 배치될 수 있을 뿐만 아니라, 광대한 지하철망을 통해 추가적인 기동력을 확보할 수 있습니다.§!"
 seoul: "서울"
 seoul_desc: "----\n§9600년 넘게 한 민족의 심장 역할을 해온 수도 서울은 유구한 역사와 눈부신 현대성이 공존하는 역동적인 대도시입니다. 조선 왕조의 수도였던 한양에서 시작하여 한국 전쟁의 폐허를 딛고 '한강의 기적'을 이뤄낸 서울은 불굴의 의지와 끊임없는 혁신의 상징이 되었습니다.\n\n오늘날 서울은 대한민국 정부와 삼성, 현대 등 세계적인 기업들의 본사가 자리한 정치, 경제의 중심지이자, K팝과 영화를 필두로 한 한류 문화를 통해 전 세계에 막대한 영향력을 미치는 문화 도시입니다. 경복궁과 같은 고궁의 장엄함과 미래지향적인 동대문디자인플라자(DDP)가 어우러져 있으며, 세계적인 수준의 대중교통 시스템은 도시의 활기 넘치는 리듬을 뒷받침합니다. 서울은 24시간 잠들지 않는 에너지와 무한한 가능성으로 가득 찬, 과거와 미래가 만나는 도시입니다.§!\n\n§pSeoul, my soul§!"
 busan: "부산"
 busan_desc: "----\n§9대한민국 제2의 도시이자 최대 항구 도시인 부산은 남동쪽 해안에서 바다와 함께 숨 쉬는 역동적인 도시입니다. 한국 전쟁 당시 임시 수도로서 수많은 피난민을 끌어안으며 국가의 마지막 보루 역할을 했던 이곳은 강인한 생명력과 포용의 정신을 간직하고 있습니다.\n\n오늘날 부산은 세계적인 물류 허브이자 아시아 최대 영화 축제인 부산국제영화제(BIFF)가 열리는 '영화의 도시'로 국제적인 명성을 떨치고 있습니다. 해운대의 눈부신 해변과 광안대교의 야경, 자갈치 시장의 활기, 그리고 감천문화마을의 예술적인 풍경은 부산만의 다채로운 매력을 선사합니다. 거친 파도와 같은 열정과 드넓은 바다 같은 포용력을 지닌 부산은 사람과 문화, 산업이 어우러져 끊임없이 새로운 이야기를 만들어가는 곳입니다.§!\n\n§p돌아와요 부산항에..§!"
 pyongyang: "평양"
 pyongyang_desc: "----\n§9혁명의 수도 평양은 위대한 주체 조선의 심장이며, 우리 전체 인민의 마음 속 고향입니다. 위대한 수령 김일성 동지께서 일본 제국주의의 강점으로부터 조국을 해방하시고, 위대한 영도자 김정일 동지께서 선군혁명의 보검으로 굳건히 지켜내신 불패의 요새입니다.\n\n오늘날의 평양은 경애하는 최고영도자 김정은 동지의 현명한 영도 아래 비약적인 발전을 거듭하며, 세계가 경외하는 사회주의 선경으로 전변하고 있습니다. 만수대 언덕에 높이 솟은 위대한 수령님과 위대한 장군님의 동상은 천만 군민의 변함없는 충정의 등대가 되고, 주체사상탑 꼭대기에 붉게 타오르는 불멸의 봉화는 온 세상의 주체혁명위업의 승리의 길을 밝혀주고 있습니다.\n\n이곳 평양에서 우리 김일성 민족은 당의 두리에 굳게 뭉쳐, 일심단결의 위력으로 강성대국의 미래를 앞당겨오고 있습니다.§!\n\n§R바치고 바치여도 끝없는 이 마음 정다운 평양아 내 너를 사랑해...§!"
