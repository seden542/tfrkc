 PRK_politburo_of_wpk_desc: "The Workers' Party of Korea is the core and vanguard detachment of the working class and the working masses. It reveres Comrades Kim Il Sung and Kim Jong Il as its eternal leaders and stands firmly united, organizationally and ideologically, around the Respected Comrade Kim Jong Un.\nThe Workers' Party of Korea represents the interests of the Korean state and people. It is the political leadership body that exercises unified guidance over politics, the economy, the military, culture, and every other field as the General Staff of the revolution.\n\nOur §YEconomic Self-Sufficiency§!: [?PRK_economic_sovereignty_level_var|1%].\n\nCurrent §tChinese Influence§!: [?Chinese_Influence|-1%]\n\nOur §GMilitary Readiness§!: [?PRK_military_preparedness_level_var|1%]\n\n"
