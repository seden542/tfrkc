 PRK_chinese_peoples_volunteer_army_idea: "Chinese People's Volunteer Army"
 PRK_chinese_peoples_volunteer_army_idea_desc: "China's military advisory group and support forces are enhancing the operational capabilities of the Korean People's Army, but their very presence shows how much Pyongyang's political autonomy has shrunk."
 PRK_Total_Control_idea: "Complete Local Control"
 PRK_Total_Control_idea_desc: "\n\n\n\n£GFX_PKR_Total_Control\n\n\n\n\n\nNorth Korea and the Kim dynasty have spent decades building a near-perfect surveillance state. Dissidents are nowhere to be found; most would-be dissidents chose escape rather than resistance from within.\n\nThe 'military-first' policy supplied the manpower needed to sustain constant surveillance. Soldier or officer, worker or cleaner, Party official or anyone else: everyone is subjected to endless propaganda demanding patriotism toward the Party, the Respected Supreme Leader, and the army, and gratitude for the supposed good fortune of being protected from the United States and its imperialist puppets in this socialist paradise.\n\nKim Jong Un's cult of personality is the largest the country has ever seen. An overwhelming share of the population is unquestionably loyal, ready to work, fight, and die for the Respected Leader Comrade. Yet perhaps they are too loyal. §RIf Chairman Kim were to die suddenly, no one knows what would become of the country...§!"
