 TFRKC_wartime_administration: "전시 행정 정비"
 TFRKC_wartime_administration_desc: "분열된 행정체계를 정비하고 지역의 민생과 군수 지원을 복원합니다."
 TFRKC_government_disruption: "끊어진 국가 동원망"
 TFRKC_government_disruption_desc: "정부의 공문은 여전히 국가의 이름으로 발송됩니다. 그러나 지방의 충원과 생산, 행정망이 갈라지면서 적법한 결정을 집행할 수단이 줄었습니다. 이주호 권한대행 정부는 국가의 생존을 말하며, 먼저 그 말을 전달할 길부터 복구해야 합니다."
 TFRKC_frontier_burden: "전방 경계 부담"
 TFRKC_frontier_burden_desc: "헌정수호연합은 헌정복원을 내걸었지만 북방 경계도 비울 수 없습니다. 서로 다른 방향을 지키는 부대에 보급을 보내는 동안, 충성의 원칙과 당장의 군사적 필요가 충돌합니다."
 TFRKC_militia_divisions: "불균일한 충성"
 TFRKC_militia_divisions_desc: "윤석열의 직접 지휘 아래 모였어도 윤어게인 내부의 목표까지 같아지지는 않았습니다. 복권을 바라는 지지자와 비상권력을 바라는 계파, 정규군과 민병대가 같은 명령을 서로 다르게 받아들입니다."
 TFRKC_fuel_shortage: "기동전력 유지 부담"
 TFRKC_fuel_shortage_desc: "국가재건최고회의는 군의 질서로 나라를 다시 세우겠다고 선언합니다. 그러나 정비창의 부품과 연료는 선언으로 채워지지 않습니다. 출동 명령과 실제로 움직일 수 있는 장비 사이에 공백이 남습니다."
 TFRKC_liberation_coalition: "해방 연합의 불안정"
 TFRKC_liberation_coalition_desc: "성인 대학생·청년노동자·귀환장병·예비역이 전투부대를 이루고, 청소년 당사자들은 학생자치와 권리 요구를 대표합니다. 성인 군사조직의 지휘와 당사자 대표의 결정이 엇갈릴 때마다 해방을 약속한 조직은 누구의 말을 먼저 들을지 시험받습니다."
 TFRKC_workers_defence: "작업장의 방어대"
 TFRKC_workers_defence_desc: "노동자평의회의 생산시설은 생계의 터전이자 방어의 거점입니다. 현장을 아는 사람들이 자기 작업장을 지키지만, 익숙한 공장 밖의 전선을 움직이는 데에는 다른 경험과 지휘가 필요합니다."
 TFRKC_local_fragmentation: "계속 늘어나는 내부의 적"
 TFRKC_local_fragmentation_desc: "민족정화전선은 배타적인 구원 약속으로 지지자를 모았습니다. 그러나 충성을 증명할 기준이 바뀔 때마다 어제의 지지자가 오늘의 의심 대상이 됩니다. 배제를 통해 얻겠다는 질서는 조직 내부의 불신까지 키웁니다."
 TFRKC_no_naval_war: "해군 중립 협약"
 TFRKC_no_naval_war_desc: "함대는 내전 불참과 섬·피난민 보호를 내걸고 별도 지휘를 유지합니다. 내전 진영의 함정 생산과 해상 침공은 제한됩니다. 중립은 내전 동안의 방침이며, 통일 이후에는 함대와 관할 섬이 국가에 통합됩니다."
 TFRKC_intervention_burden: "한국 개입의 부담"
 TFRKC_intervention_burden_desc: "중국과 북한은 실제 개입이 성립하면 인력과 정치적 자원을 내놓고 1년간 군사적 부담을 감수합니다. 한국으로 향하는 병력과 장비만큼 본국의 여력이 줄어듭니다. 공동작전의 이견을 조율하는 동안에도 비용은 쌓입니다."
 TFRKC_joint_command: "불완전한 공동지휘"
 TFRKC_joint_command_desc: "중국·북한·남측 협력세력은 같은 전선의 적을 상대하지만 같은 전후 국가를 그리지는 않습니다. 작전 명령 하나를 전달하기 위해서도 서로 다른 계산을 거쳐야 합니다."
 TFRKC_category: "분열된 공화국"
 TFRKC_category_desc: "국가 지휘체계가 분열되었습니다. 정복한 지역을 통합하고 내전의 종식을 준비하십시오."
 TFRKC_restore_administration: "지방 행정망 복구"
 TFRKC_restore_administration_desc: "충원 명부와 생산 보고, 지방의 연락망을 다시 잇습니다. 결정이 완료되면 끊어진 국가 동원망의 제약을 제거하고 안정도를 높입니다. 서류에 적힌 인원과 실제로 도착하는 사람이 같아지는 것부터 시작합니다."
 TFRKC_start_test: "개발용: 한국 내전 즉시 발발"
 TFRKC_start_test_desc: "개발 규칙을 켠 새 게임에서만 표시됩니다. 현재 한국을 분할하므로 기존 캠페인에는 사용하지 마십시오."
 TFRKC_test_rule: "TFRKC 내전 개발 도구"
 TFRKC_test_off: "끄기"
 TFRKC_test_on: "켜기"
 TFRKC_test_off_desc: "즉시 내전 테스트 디시전을 표시하지 않습니다. 이 설정 자체가 전주 사건이나 계엄 이후의 사건 연결을 추가하지는 않습니다."
 TFRKC_test_on_desc: "한국에 즉시 내전 테스트 디시전을 표시합니다."
 tfrkc.1.t: "직무는 정지되었으나"
 tfrkc.1.d: "계엄은 실패했고, 국회의 탄핵소추로 윤석열의 대통령 직무가 정지되었습니다. 그러나 대통령의 명령을 받던 기관들이 같은 순간에 같은 결론에 도달한 것은 아니었습니다. 어떤 지휘소는 정부의 지시를 기다렸고, 어떤 지휘소는 이미 효력을 잃은 명령서를 거두지 않았습니다.\n\n권한대행 정부는 국가기관의 법적 연속성을 강조하고 있습니다. 인사도 예산도 여전히 정부의 이름으로 처리됩니다. 다만 공문을 받은 기관이 회신할 것인지, 회신한 부대가 실제로 움직일 것인지는 별개의 문제가 되었습니다.\n\n관청의 불은 밤새 켜져 있습니다. 나라를 움직이는 힘보다 나라가 움직이고 있다는 보고가 먼저 쌓이고 있습니다."
 tfrkc.1.o0: "보고를 접수한다."
 tfrkc.2.t: "권한대행의 책상"
 tfrkc.2.d: "이주호 권한대행의 이름으로 각 기관에 업무 계속 지시가 발송되었습니다. 정부는 대통령의 직무정지가 국가의 직무정지를 뜻하지 않는다고 밝혔습니다. 급여와 구호, 병원과 발전소의 운영을 유지하는 것이 국가 생존의 첫 조건이라는 설명입니다.\n\n그러나 지방에서 올라오는 보고에는 정부가 집행할 수 없는 요구가 더 많습니다. 호송할 병력이 없는 구호품, 지급할 재원이 막힌 수당, 중앙의 승인을 기다리다 멈춘 행정이 책상 위에 놓였습니다. 법적 권한을 가진 정부가 그것을 행사할 수단부터 요청하고 있습니다.\n\n서류의 결재란은 비어 있지 않습니다. 결재 다음에 무엇이 이루어질지가 비어 있습니다."
 tfrkc.2.o0: "국가의 업무는 계속된다."
 tfrkc.3.t: "작전명: 귀환"
 tfrkc.3.d: "윤어게인이 ‘귀환’ 작전으로 윤석열을 구출했다고 발표했습니다. 모습을 드러낸 윤석열은 자신을 따르는 조직과 부대에 직접 명령을 내리기 시작했습니다. 지지자들이 돌려 보낸 영상에는 짧은 환호와 길게 반복되는 복권 구호가 담겼습니다.\n\n서울의 정부는 구출이 대통령의 법적 지위를 바꾸지 않는다고 밝혔습니다. 탄핵소추에 따른 직무정지는 계속되며, 윤석열의 지시는 정부의 적법한 지휘로 인정되지 않습니다. 그러나 윤어게인은 이미 그의 명령을 조직의 지휘 계통으로 삼고 있습니다.\n\n그를 되찾은 사람들의 목적까지 하나가 된 것은 아닙니다. 어떤 이들은 복권을, 어떤 이들은 정적에 대한 보복을, 또 다른 이들은 전쟁 뒤 자신의 자리를 생각합니다. 지금은 모두 같은 사람의 다음 명령을 기다립니다."
 tfrkc.3.o0: "새 지휘 계통을 확인한다."
 tfrkc.10.t: "대한민국 내전"
 tfrkc.10.d: "계엄 선포로부터 달력 기준 한 달이 지났습니다. 정부의 무장해제 요구는 거부되었고, 갈라진 국가기관과 무장조직 사이에서 전면적인 교전이 시작되었습니다. 대한민국의 위기는 내전으로 넘어갔습니다.\n\n이주호 권한대행의 정부는 국가의 법적 연속성을 주장합니다. 헌정수호연합은 헌정복원을 협력의 조건으로 내세웁니다. 윤어게인과 국가재건최고회의는 서로 다른 지휘를 따르고 있으며, 청소년해방군과 노동자평의회도 독자적인 세력을 이루었습니다. 민족정화전선은 혼란 속에서 새로운 적을 지목하고 있습니다.\n\n사람들은 출근길에 지나던 길목에서 통행 허가를 요구받습니다. 같은 나라의 신분증을 내밀어도, 어느 쪽에서 발급했는지를 다시 묻습니다."
 tfrkc.90.t: "내전 개발 시나리오"
 tfrkc.90.d: "테스트용 사전 선택 사건을 시작합니다. 답변으로 세력을 확정한 뒤 다음 날 내전을 시작합니다. 실제 캠페인의 전주 사건·계엄 연표는 이 개발 도구에서 생략합니다."
 tfrkc.90.o0: "개전 전 입장을 정한다."
 tfrkc.90.o1: "취소한다."
 tfrkc.21.t: "지원의 대가 — 중국"
 tfrkc.21.d: "한국 노동자평의회의 위기를 계기로 개입안이 중국 지도부에 제출되었습니다. 평의회가 무너진 뒤 한반도에 들어설 권력을 지켜보기만 할 수는 없다는 주장입니다. 공동지휘부를 통한 제한 개입은 전후 질서를 협의할 자리를 확보하는 수단으로도 검토되고 있습니다.\n\n군의 보고서는 병력과 보급을 외부로 돌리는 만큼 본국의 여력이 줄어든다고 지적합니다. 북한 측이 바라는 안보 구도와 남측 협력세력이 요구하는 자치 역시 중국의 구상과 일치한다고 보장할 수 없습니다.\n\n결재할 문서는 짧습니다. 그 결재로 시작될 전쟁의 길이는 적혀 있지 않습니다."
 tfrkc.21.o0: "군사적 부담을 감수하고 개입을 승인한다."
 tfrkc.21.o1: "이번 개입을 거부한다."
 tfrkc.22.t: "지원의 대가 — 북한"
 tfrkc.22.d: "한국 노동자평의회의 위기를 두고 북한 지도부에서 개입 논쟁이 벌어지고 있습니다. 남측의 전후 권력에서 발언권을 얻어야 한다는 주장과, 본국의 대비 태세를 먼저 지켜야 한다는 보고가 나란히 올라왔습니다.\n\n중국과 협력하면 당장의 부담을 나눌 수 있습니다. 그러나 함께 진군한다는 사실이 같은 전후 질서를 뜻하지는 않습니다. 남측 협력세력도 외부의 명령에 따르기 위해 싸우는 것이 아니라며 자신들의 자리를 요구하고 있습니다.\n\n국경 너머로 보낼 병력의 수는 셀 수 있습니다. 그들이 돌아올 때까지 감당해야 할 것은 아직 셀 수 없습니다."
 tfrkc.22.o0: "군사적 부담을 감수하고 개입을 승인한다."
 tfrkc.22.o1: "이번 개입을 거부한다."
 tfrkc.24.t: "대한인민해방군의 개입"
 tfrkc.24.d: "인천과 김포에 대한인민해방군 공동지휘부의 병력이 전개되었습니다. 공동지휘부는 노동자평의회의 보호와 질서 회복을 개입 명분으로 발표했습니다. 평의회와 적대하던 내전 세력들을 상대로 전쟁에 들어가면서 외부 개입이 새로운 전선을 만들었습니다.\n\n공동지휘부가 내세우는 연대가 전후의 합의까지 뜻하지는 않습니다. 중국 측이 검토하는 지역 질서, 북한 측이 요구하는 안보와 영향력, 남측 협력세력이 주장하는 통치 참여는 아직 하나의 합의로 정리되지 않았습니다.\n\n항구의 구호품 상자에는 수량이 적혀 있습니다. 그것을 받는 대가가 어디까지인지는 적혀 있지 않습니다."
 tfrkc.24.o0: "외부 개입으로 전선이 바뀌었다."
 tfrkc.51.t: "승리 다음의 권력"
 tfrkc.51.d: "노동자평의회와 대한인민해방군에 맞서던 마지막 경쟁 세력이 사라졌습니다. 평의회는 공동 승리가 끝없는 공동 군정을 뜻해서는 안 된다며, 개입군 조직과 병력을 평의회 통치 아래 통합하라고 요구했습니다.\n\n공동지휘부에서는 반대로 평의회가 공동지휘부의 통치 아래 들어와야 한다는 주장이 나왔습니다. 중국과 북한의 전후 구상은 서로 어긋나고, 남측 협력세력은 전쟁 중 약속받았다고 여기는 몫을 요구합니다. 노동자 대표들은 자신들의 작업장과 도시가 협상용 지분으로 바뀌는 것을 경계합니다.\n\n어제까지 지도 위의 화살표를 함께 그리던 사람들이 오늘은 그 지도를 누가 보관할지 다투고 있습니다. 하나의 통치권으로 합쳐진 뒤, 누구의 이름으로 명령을 내릴 것인지 결정해야 합니다."
 tfrkc.51.o0: "조직과 병력을 노동자평의회에 통합한다."
 tfrkc.51.o1: "노동자평의회를 공동지휘부에 통합한다."
 tfrkc.40.t: "함대가 돌아오는 날"
 tfrkc.40.d: "본토의 경쟁 통치권들이 사라지고 하나의 통치권이 확립되었습니다. 해군 중립사령부의 함대와 관할 섬도 통일된 국가에 통합되었습니다. 내전 불참을 위해 따로 유지하던 지휘는 끝났습니다. 바다로 나가는 명령은 이제 같은 지휘 계통에서 내려옵니다.\n\n내전 동안 섬으로 옮겨 간 사람들은 돌아갈 배편을 묻습니다. 집이 남아 있는지 확인하지 못한 사람도 우선 표를 구하려 합니다. 정부가 발표할 수 있는 것은 통합의 완료이고, 그들이 알고 싶은 것은 자기 동네의 수도가 나오는지입니다.\n\n승자는 나라를 하나로 만들었습니다. 비어 있는 식탁에 앉을 사람까지 되돌려 놓지는 못했습니다. 이제 남은 사람들의 생활을 책임져야 합니다."
 tfrkc.40.o0: "이제 살아갈 나라를 복구해야 한다."
