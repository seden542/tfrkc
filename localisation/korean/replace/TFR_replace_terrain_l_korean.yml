 brussels: "브뤼셀"
 brussels_desc: "----\n§9만약 유럽 민족의 해방이 그들의 통일과 병행되지 않는다면 유럽 국가들은 머지않아 급부상하는 세계 강대국들에 의해 집어삼켜질 것입니다...이미 스스로에 대한 확신을 거의 상실한 유럽은 외부의 도움을 기대하고 있습니다. 어떤 이들은 러시아로부터, 어떤 이들은 미국으로부터 그것을 기대합니다. 이 두 가지 열망 모두 유럽에게는 생존의 위협입니다. 서방도 동방도 유럽을 구원하려 하지 않습니다. 러시아는 유럽을 정복하려 하고, 미국은 유럽을 사버리려 합니다.§!"
