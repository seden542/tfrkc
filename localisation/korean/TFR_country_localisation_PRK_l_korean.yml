 korean_war_desc: "남조선과의 적대 행위를 종식하는 공식적인 휴전이 체결된 지 67년이 지났습니다. 미국이 극심한 혼란에 빠져 있는 지금이 어쩌면 우리 형제 동포를 다시 하나로 만들 수 있는 유일한 기회일지도 모릅니다!"
