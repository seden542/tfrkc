 PRK_epidemic_supply_requisition_disruption: "방역물자 긴급 징발의 여파"
 PRK_epidemic_supply_requisition_disruption_desc: "공장과 군 창고의 물자를 방역전선으로 돌리면서 정상적인 생산 일정에 차질이 발생했습니다."
 PRK_military_medical_units_deployment_strain: "군 의료력 전용의 여파"
 PRK_military_medical_units_deployment_strain_desc: "군의관과 야전병원을 방역전선에 집중하면서 전선 부대의 환자 후송과 전투력 회복이 늦어지고 있습니다."
 PRK_koryo_medicine_production_disruption: "고려약 증산의 여파"
 PRK_koryo_medicine_production_disruption_desc: "공장 설비와 인력을 고려약 생산에 돌리면서 정상적인 생산 일정에 차질이 발생했습니다."

