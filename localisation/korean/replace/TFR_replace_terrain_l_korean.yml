 urban: "도시"
 urban_desc: "도시에서의 전투는 현대전에서 가장 혼란스럽고 잔인한 전투 중 하나로 꼽힙니다. 건물을 대치했을 때는 각별히 주의해야 합니다."
 los_angeles: "로스앤젤레스"
 los_angeles_desc: "----\n§9대도시로 손꼽히는 로스앤젤레스 지역에는 4백만 명이 넘는 인구가 거주하고 있습니다. 따라서 이 도시 내에서 전투를 벌이는 것은 대규모 전투로 번지게 될 것입니다.§!"
 new_york: "뉴욕"
 new_york_desc: "----\n§9거주하는 인구만 800만 명이 넘는 뉴욕시는 UN 본부와 뉴욕증권거래소를 위시한 주요 금융 중심지가 위치해 있어 세계의 금융 및 문화 수도로 불립니다. 미국의 수도는 아니지만 수백 개의 마천루와 거대한 항구, 사방으로 뻗은 수십 마일의 교외와 위성 도시를 가진 뉴욕시는 모두가 인정하는 미국 최대의 도시입니다. 달리 말해 뚱뚱한 쥐새끼들로 가득하다는 뜻입니다.§!"
 miami: "마이애미"
 miami_desc: "----\n§9코카인.§!"
 seattle: "시애틀"
 seattle_desc: "----\n§9시애틀은 워싱턴 주와 미국 태평양 북서부 지역에서 가장 큰 도시로 약 75만 명의 주민이 거주하고 있습니다. 이 도시는 아마존과 마이크로소프트의 본사가 소재한 미국 테크 산업의 주요 중심지이며, 스페이스 니들과 같은 대형 마천루와 도시를 둘러싼 서쪽과 동쪽의 산맥 워싱턴 주와 미국 태평양 북서부 지역에서 가장 큰 도시로 약 75만 명의 주민이 거주하고 있습니다. 이 도시는 아마존과 마이크로소프트의 본사가 소재한 미국 테크 산업의 주요 중심지이며, 스페이스 니들과 같은 대형 마천루와 도시를 둘러싼 서쪽과 동쪽의 산맥으로 유명합니다.§!"
 new_orleans: "뉴올리언스"
 new_orleans_desc: "----\n§9뉴올리언스는 루이지애나 주에서 가장 큰 도시로, 도시에만 38만 명이 넘는 인구가 거주하고 있습니다. 걸프 연안의 주요 문화적, 경제적 중심지이자 대형 항구를 갖추고 있으며 마르디 그라와 같은 케이준과 미국 흑인 문화가 섞인 유명 축제가 열리는 곳이기도 합니다. 최근 수십 년 동안 허리케인에 의해 피해를 입었음에도 여전히 미국 남부에서 굉장히 크고 중요한 도시입니다.§!"
 boston: "보스턴"
 boston_desc: "----\n§9보스턴은 미국 매사추세츠주의 주도이자 뉴잉글랜드의 최대 도시로, 약 67만 명의 주민이 살고 있습니다. 많은 사람이 보스턴을 미국 독립 혁명의 심장으로 여기는데, 이곳에서 자유의 아들들이 결성되었고 보스턴 차 사건이 일어났기 때문입니다. 오늘날 보스턴은 뉴잉글랜드와 북동부 광역권의 주요 상업, 금융, 문화 중심지입니다.§!"
 washingtondc: "워싱턴 D.C."
 washingtondc_desc: "----\n§9약 69만 명의 주민이 거주하는 미국의 수도 컬럼비아 특별구는 어느 주에도 속하지 않는 별도의 행정 구역입니다. 이곳에는 미합중국 의회, 연방대법원, 미국 대통령이 거주하는 백악관을 비롯해 내셔널 몰과 워싱턴 기념비와 같은 기념물들이 있습니다. 컬럼비아 특별구는 미국과 연방정부의 영원한 상징이며, 1812년 대영제국과의 전쟁 이후 그 어떤 적에게도 점령되거나 훼손된 적이 없습니다.§!"
 chicago: "시카고"
 chicago_desc: "----\n§9윈디 시티, 즉 바람의 도시로도 알려진 시카고는 미국에서 세 번째로 큰 도시이자 동부의 뉴욕과 서부의 로스앤젤레스 사이의 가장 큰 도시로, 200만 명이 넘는 주민이 거주하고 있습니다. 시카고는 수십 개의 고층 빌딩이 있는 주요 산업 중심지이며 금융업 또한 점점 더 중요해지고 있습니다. 높은 범죄율로 어려움을 겪고 있지만, 시카고는 여전히 중서부와 미국 전체의 경제를 견인하는 주된 원동력으로 남아 있습니다.§!"
 philadelphia: "필라델피아"
 philadelphia_desc: "----\n§9미국의 옛 수도인 필라델피아에는 100만 명이 넘는 주민이 거주하고 있습니다. 펜실베이니아 주에서 여섯 번째로 큰 도시로, 대규모 항구 인프라를 갖춘 동부 해안의 주요 비즈니스 및 무역 중심지입니다. 수십 개의 고층 빌딩이 있는 대규모 도심이 있으며 뉴욕시와의 라이벌 관계로도 유명합니다.§!"
 houston: "휴스턴"
 houston_desc: "----\n§9휴스턴은 텍사스에서 가장 큰 도시이자 미국에서 네 번째로 큰 도시로, 약 250만 명의 주민이 거주하고 있습니다. 이 도시에는 미국에서 두 번째로 큰 항구인 휴스턴항이 존재하며, 중요한 금융 중심지이자 텍사스의 석유 및 에너지 산업의 중심지이기도 합니다. 비록 수많은 마천루를 거느리지는 않았지만, 휴스턴은 면적 면에서 미국에서 가장 넓은 도시 중 하나입니다.§!"
 richmond: "리치먼드"
 richmond_desc: "----\n§9리치먼드는 미국 버지니아 주의 주요 도시이자 1차 남북전쟁 당시 연방에 반기를 들었던 남부 동맹의 옛 수도였습니다. 약 20만 명의 주민이 거주하는 중규모 도시이지만, 많은 대기업과 정부 기관이 본사를 두고 있는 미국 남부의 중요한 경제적 중심지입니다. 오래 전에는 반란의 중심지였지만 오늘날 이 도시는 연방 정부에 굳건히 충성하고 있습니다.§!"
