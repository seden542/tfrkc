 TFRKC_rework_choice_t:0 "갈라진 명령, 여섯 개의 길"
 TFRKC_rework_choice_d:0 "패전 이후의 대한민국은 더 이상 어제의 나라가 아닙니다. 양안전쟁에서 돌아온 사람들은 전쟁이 끝났다는 발표를 들었지만, 일터와 거리에서 마주한 것은 끝나지 않은 전쟁의 대가였습니다. 전주에서 시작된 항의와 폭동, 총 13명의 죽음, 사형 선고와 무기징역으로의 감형을 거치며 정부가 약속한 질서와 시민들이 요구한 책임 사이의 거리는 더욱 벌어졌습니다. 같은 뉴스를 보고도 사람들은 서로 다른 결론에 도달했고, 그 결론들은 이제 거리의 구호와 조직의 이름이 되고 있습니다.\n\n정부의 정통성을 지켜야 한다는 사람도, 헌정질서를 지키기 위해 행동해야 한다는 사람도 있습니다. 군과 정치권의 무능을 끝내야 한다는 주장 옆에서는 노동자의 권리와 청소년의 자결을 이야기하는 목소리가 들려옵니다. 윤석열을 중심으로 다시 결집하려는 움직임도 커지고 있습니다. 누구도 자신이 나라를 무너뜨리려 한다고 말하지 않습니다. 그러나 서로 다른 구원의 약속이 같은 거리에 모였을 때, 그 약속들이 끝까지 함께 설 수 있을지는 분명하지 않습니다.\n\n아직 모든 것이 결정되지는 않았습니다. 오늘 선택한 사람들과 내일도 같은 식탁에 앉을 수 있을지, 지키겠다고 다짐한 가치가 위기 속에서도 지켜질지는 누구도 보장해 주지 않습니다. 그럼에도 침묵만으로는 자신의 자리를 남겨 둘 수 없는 시간이 다가오고 있습니다. 함께 위기를 건널 사람들을 정하십시오. 훗날 이 날을 돌아보게 된다면, 우리는 지금의 선택을 어떻게 설명하게 될까요."
 TFRKC_rework_choice_choose_KWC:0 "노동자평의회와 함께한다."
 TFRKC_rework_choice_choose_KLF:0 "청소년해방군과 함께한다."
 TFRKC_rework_choice_choose_KRC:0 "국가재건최고회의와 함께한다."
 TFRKC_rework_choice_choose_KCH:0 "헌정수호연합과 함께한다."
 TFRKC_rework_choice_choose_KYA:0 "자유민주주의방위국과 함께한다."
 TFRKC_rework_choice_choose_KOR:0 "대한민국 주정부에 남는다."
