l_korean:
 # Expanded original TFRKC prose. Retained-tag unification contract, 2026-11-18.
 tfrkc.40.t: "하나의 나라를 세우는 일"
 tfrkc.40.d: "전쟁의 승패가 결정되고 각지의 보고가 통일정부 출범을 위한 문서로 모였습니다. 서로 다른 명령을 받던 기관과 병력, 주민을 하나의 국가 체계 아래로 정리할 조건이 마련되었습니다. 아직 남아 있는 통치 조직의 인계와 출범을 확정하는 결정은 내려지지 않았습니다. 지휘부 앞에는 승전의 기록과 앞으로 책임져야 할 생활의 목록이 함께 놓여 있습니다.\n\n전쟁 동안 누군가는 같은 길목을 여러 번 통과하며 매번 다른 허가를 받았습니다. 어느 창구에서 급여를 받아야 하는지, 어느 기관에 가족의 행방을 물어야 하는지도 달라졌습니다. 통일의 의미를 새 국호나 깃발로 설명할 수는 있습니다. 그 설명이 주민에게 효력을 가지려면 명령의 통일뿐 아니라 끊긴 생활의 복구까지 이어져야 합니다.\n\n새 정부는 승리한 쪽이 걸어온 노선을 이어받게 됩니다. 그 노선에 기대를 건 사람뿐 아니라 반대했던 주민의 생활도 이제 같은 책임 아래 놓입니다. 내전을 피해 별도의 임무를 유지하던 해군과 섬의 인계도 새로운 국가 지휘의 문제로 다루어져야 합니다. 승리를 이루게 한 방식이 평화를 운영할 방식으로도 충분한지는 앞으로의 결정에서 드러날 것입니다.\n\n출범안을 승인하면 남아 있는 조직을 정리하고 하나의 통일정부를 세우는 절차를 진행하게 됩니다. 돌아오지 않는 사람의 자리는 어떤 인계서에도 채울 수 없습니다. 남은 사람들은 그 빈자리를 안고 다시 살아가야 합니다. 지금 지휘부가 서명하려는 것은 전쟁이 끝났다는 선언과 함께 그 이후의 나라를 책임지겠다는 약속입니다."
 tfrkc.40.o0: "통일 정부를 출범한다."
 TFRKC_unification_KOR_transfer_tt: "§Y현재 국가의 태그·지도자·국가중점·육군·공군을 유지§!한 채 승리한 노선에 맞는 통일 국호를 선포합니다.\n해군의 함대와 제독, 관할 도서가 합류하며 해군 운용 제한이 해제됩니다."
 TFRKC_unification_KWC_d: "큰 교전이 멎고 각지의 보고가 통일정부 출범을 위한 안건으로 모이고 있습니다. 공장과 배급소에서는 어느 기관의 지시를 따라야 하는지 더는 날마다 묻지 않아도 되기를 바랍니다. 노동자평의회 앞에는 승전의 성명과 함께 전국의 행정·군사 조직을 하나의 국가 체계로 정리할 문서가 놓였습니다. 아직 출범 절차의 마지막 결정은 남아 있습니다. 작업장에서 시작한 통치가 이제 작업장 바깥의 사람들까지 책임지려 합니다.\n\n평의회가 약속한 것은 일하는 사람들이 생산과 생활을 스스로 결정하는 나라였습니다. 그러나 전쟁 동안에는 생산량과 수송, 인원을 한곳에서 정해야 한다는 요구가 커졌습니다. 현장의 대표가 반대한 결정도 전선의 필요라는 이유로 집행되었습니다. 승리 뒤에도 그 이유가 계속된다면 노동자의 이름으로 만들어진 국가는 노동자의 목소리를 다시 기다리게 할 수 있습니다. 새로운 정부의 이름보다 그 정부가 거부 의견을 처리하는 방식이 자치의 약속을 드러낼 것입니다.\n\n대표들의 책상에는 밀린 임금과 끊긴 배급, 돌아갈 집을 찾는 주민의 요구가 올라와 있습니다. 같은 편에서 싸운 사람들의 기대도 하나가 아닙니다. 지역과 조직의 권한을 얼마나 남길지, 전시의 집중 권한을 언제 정리할지, 외부와 맺은 협력이 내부의 결정권을 대신할 수 있는지를 이제 공적 질서로 정해야 합니다. 전선을 유지하던 임시 합의만으로 전국의 하루를 운영할 수는 없습니다.\n\n출범안에 서명하면 현재의 지도부와 군 지휘체계를 이어 통일 국호를 선포하는 절차를 진행하게 됩니다. 함대와 섬의 인계 역시 새로운 국가 지휘의 문제로 다루어져야 합니다. 주민들이 확인하고 싶은 것은 승자의 깃발보다 다음 급여일과 병원의 문입니다. 평의회는 나라를 얻을 문턱에 섰습니다. 이제 나라를 움직이는 사람들이 다시 그 나라의 주인일 수 있게 할 책임을 받아들여야 합니다."
 TFRKC_unification_KLF_d: "전쟁을 끝낼 수 있다는 보고가 들어왔습니다. 청소년해방군의 성인 지휘부와 민간 대표들 앞에는 전국의 조직을 하나의 통일정부 아래로 정리할 출범안이 놓였습니다. 오래전 회의에서 외쳤던 약속이 다시 읽힙니다. ‘우리가 겪었던 억압을 다음 세대에게 넘기지 않겠다.’ 그때에는 문을 열게 하라는 요구였던 문장이, 이제 문을 열고 닫을 권한을 갖게 될 사람들에게 돌아왔습니다.\n\n전투를 감당한 것은 성인 대학생과 청년노동자, 귀환장병과 예비역들이었습니다. 청소년 당사자들은 자신의 생활과 권리를 결정하는 주체로 참여했습니다. 전쟁 중 이 두 목소리가 항상 같지는 않았습니다. 안전을 이유로 회의가 미뤄졌고 시급한 보급을 이유로 대표의 요구가 뒤로 밀렸습니다. 그때마다 임시라고 설명한 결정들을 전쟁 뒤에도 그대로 둘 것인지, 통일의 승리는 그 대답까지 대신해 주지 않습니다.\n\n학교에서는 다시 수업할 공간과 급식을 확인하고, 일터에서는 동원에서 돌아올 사람의 자리를 묻습니다. 모두에게 같은 미래를 약속하는 일보다 서로 다른 미래를 선택할 자리를 마련하는 일이 더 어렵습니다. 학생자치가 군사조직의 허락을 받아야 한다면, 젊다는 이유로 명령받는 질서는 다른 이름으로 이어질 수 있습니다. 새 정부는 자신에게 반대하는 다음 세대의 목소리도 지킬 수 있어야 합니다.\n\n출범안을 승인하면 해방을 이끌어 온 지도부와 군 지휘체계를 이어 통일 국호를 선포하는 절차가 시작됩니다. 그 과정에서 보호한다는 이유로 결정권까지 가져가지 않도록 해야 합니다. 남은 사람들은 새로운 교훈을 듣기 전에 평범한 하루를 돌려받고 싶어 합니다. 이제 해방은 구호를 외친 사람들의 승리로만 남을 수 없습니다. 그 구호를 외치지 않아도 권리를 누릴 수 있는 나라를 만드는 일이 남았습니다."
 TFRKC_unification_KRC_d: "국가재건최고회의에 통일정부 출범안이 제출되었습니다. 각지의 군사·행정 조직을 정리하고 국가의 명령 체계를 하나로 세울 조건이 마련되었다는 보고입니다. 계엄 이후 비밀리에 모였던 회의는 이제 공개적으로 전국의 미래를 결정할 문턱에 섰습니다. 무능한 정치가 국가를 무너뜨렸다는 주장은 전쟁 동안 많은 명령의 근거가 되었습니다. 앞으로는 자신들의 통치가 무엇을 복구했는지 같은 기준으로 답해야 합니다.\n\n명령 계통을 분명히 하는 데에는 군의 방식이 효과적이었습니다. 그러나 병원과 학교, 작업장과 시장에서 올라오는 요구는 한 종류의 지시로 정리되지 않습니다. 현장의 보고를 다른 의견으로 받아들일 것인지, 집행을 늦추는 장애로 볼 것인지에 따라 재건의 모습도 달라집니다. 전쟁을 수행할 수 있는 힘을 갖추었다는 사실이 그 힘을 언제까지 행사해야 하는지까지 결정해 주지는 않습니다.\n\n회의에는 전시 권한을 정리할 순서와 당장 유지해야 할 업무가 함께 올라왔습니다. 구체적인 제도는 선택해 온 재건 노선에 따라 달라지겠지만, 어떤 노선도 사라진 사람의 자리를 수치에서 지울 수는 없습니다. 정비된 도로로 먼저 지나갈 것은 군의 행렬만이 아니며, 복구된 통신망에는 정부에 대한 항의도 실려야 합니다. 나라를 다시 세운다는 말은 복종할 길과 함께 책임을 물을 길도 다시 만드는 일입니다.\n\n출범안에 서명하면 최고회의의 지도부와 군 지휘체계를 이어 통일 국호를 선포하게 됩니다. 최고회의가 내세운 질서는 이제 승리를 얻는 방법에서 주민의 생활을 지탱하는 방식으로 바뀌어야 합니다. 새로운 문서에는 명령을 내릴 기관이 적혀 있습니다. 그 명령의 결과를 감당할 주민들이 누구에게 설명을 요구할 수 있는지까지 채워 넣을 책임은 여전히 최고회의 앞에 남아 있습니다."
 TFRKC_unification_KCH_d: "헌정수호연합 앞에 통일정부 출범안이 놓였습니다. 지켜야 할 선이 있다는 이유로 명령을 거부했던 사람들은 이제 전국에 내려갈 명령을 만드는 자리에 섰습니다. 전쟁을 끝낼 조건이 마련되었으며, 흩어진 국가 기능을 하나의 통치 체계로 정리할 마지막 결정을 기다리고 있습니다. 연합이 주장한 헌정복원은 승전의 표제가 될 수 있습니다. 그러나 그 표제를 실제 절차로 바꾸지 않으면 협력의 조건은 끝내 구호로만 남습니다.\n\n법적 연속성을 인정하고 헌정을 지키겠다는 약속 아래서도 지휘권과 책임을 둘러싼 논쟁은 계속되었습니다. 급박한 상황을 이유로 미룬 민간의 결정이 있고, 전방을 비울 수 없다는 이유로 연장한 군의 권한이 있습니다. 자신들이 지킨 것은 특정한 사람의 자리가 아니라 원칙이라고 말해 왔습니다. 그 원칙이 승자의 편의와 충돌할 때에도 같은 효력을 가지는지 이제 스스로 보여 주어야 합니다.\n\n새 정부에 필요한 것은 복원되었다는 발표와 함께 작동할 기관입니다. 주민이 이의를 제기하고 대표를 선택하며 지휘부의 결정을 검토할 통로가 있어야 합니다. 전쟁을 함께 견딘 사람들의 공로는 그 책임을 가볍게 하지 않습니다. 가족을 기다리는 집에는 어느 조직이 더 옳았는지 적힌 설명보다 돌아갈 길과 끊기지 않는 급여가 먼저 필요합니다. 헌정의 약속은 그런 생활에서 확인되어야 합니다.\n\n출범안을 승인하면 남아 있는 조직과 병력을 정리해 하나의 통일정부를 출범시키는 절차가 진행됩니다. 연합이 확보한 권한을 어떤 제도와 책임 아래 둘지도 그 국가 안에서 다루어져야 합니다. 지휘관들은 새로운 명령서를 받을 수 있습니다. 주민들은 다시 명령만 받는 사람이 되어서는 안 됩니다. 헌정을 수호해 얻은 승리가 헌정을 대신할 영구적인 자격이 아니라는 것을 증명할 때가 왔습니다."
 TFRKC_unification_KYA_d: "자유민주주의방위국의 지휘부에 통일정부 출범안이 올라왔습니다. 윤석열의 명령과 복권을 중심으로 결집했던 사람들은 자신들의 승리를 새로운 국가 질서로 옮길 문턱에 섰습니다. ‘귀환’이라는 작전명은 사람을 되찾는 약속에서 나라를 되찾는 구호로 커졌습니다. 이제 어느 기관이 어떤 권한으로 전국을 통치할 것인지 정해야 합니다. 환호가 같은 방향을 향했다는 사실만으로 그 답이 하나가 되는 것은 아닙니다.\n\n윤어게인 안에서도 돌아가고 싶은 나라는 서로 다릅니다. 이전의 정치적 지위를 회복하려는 사람, 비상통치를 오래 유지하려는 사람, 전쟁 동안 확보한 영향력을 새 정부에서도 지키려는 사람이 함께 싸웠습니다. 직접 명령을 받았다는 충성은 이들을 움직였지만, 전쟁 뒤의 생활과 책임을 어떻게 나눌지까지 정해 주지는 못했습니다. 복권을 요구하는 구호와 국가의 권한을 정하는 절차는 이제 같은 무대에서 답을 요구받습니다.\n\n각지에서 온 보고에는 지지자만의 이름이 적혀 있지 않습니다. 다른 편에 있었던 주민도 병원과 배급을 이용해야 하고, 명령에 반대한 사람도 같은 행정의 보호를 필요로 합니다. 질서를 되찾겠다는 약속이 자기편만 안전한 질서가 된다면 새 통치는 전쟁의 구별을 일상으로 옮기게 됩니다. 어느 계파가 더 많은 자리를 얻는지보다 그 자리에 앉은 사람이 누구에게 책임을 지는지가 국가의 모습을 정할 것입니다.\n\n출범안에 서명하면 현재의 지도부와 군 지휘체계를 이어 통일 국호를 선포하는 절차를 진행하게 됩니다. 승리는 이전의 모든 판단을 옳게 만들지 않으며, 새 정부의 이름만으로 과거의 책임이 사라지지도 않습니다. 오랫동안 외쳐 온 귀환이 무엇을 뜻했는지 이제 명령과 배급, 재판과 생활에서 드러나게 됩니다. 지휘부 앞의 문서는 승전을 기념하는 종이이면서 앞으로 감당할 나라의 책임을 받아들이는 문서입니다."
 TFRKC_unification_KOR_d: "대한민국 주정부에 통일정부 출범안이 제출되었습니다. 국가의 법적 연속성을 주장하며 남은 기관을 지키던 정부는 이제 전국의 행정과 지휘를 다시 하나로 정리할 문턱에 섰습니다. 권한대행 체제에서 반복했던 업무 계속 지시는 오랫동안 약속에 가까웠습니다. 서류가 도착해도 집행될지 알 수 없었고, 결재가 끝나도 현장의 답이 돌아오지 않았습니다. 이제 그 약속을 실제 국가 기능으로 이어 갈 마지막 결정이 남았습니다.\n\n정부가 계속 존재했다는 사실은 중요했습니다. 그 이름으로 급여를 청구하고 가족의 행방을 묻고 구호를 요청하던 사람들이 있었기 때문입니다. 그러나 존재했다는 사실만으로 그들이 기다린 동안의 실패까지 지워지지는 않습니다. 닫힌 창구와 늦은 물자, 서로 다른 명령 사이에서 감당한 손실은 별도로 답해야 할 일입니다. 법적 연속성을 지킨 정부는 자신의 책임도 함께 이어받아야 합니다.\n\n출범 준비 문서에는 각 기관의 인계 업무와 필요한 복구가 정리되어 있습니다. 누구의 편이었는지에 따라 달라진 처우를 어떻게 고칠지, 전시의 임시 권한을 어떤 공적 절차로 정리할지도 남아 있습니다. 정부의 문서를 신뢰하지 않았던 사람들을 다시 같은 창구 앞에 서게 하는 일은 서류 양식을 통일하는 것보다 어렵습니다. 주민이 확인할 수 있는 약속이 조금씩 이행되어야 국가의 이름도 다시 같은 뜻으로 읽힐 것입니다.\n\n출범안을 승인하면 정부의 지도부와 군 지휘체계를 이어 통일 국호를 선포하는 절차가 진행됩니다. 사람들에게 필요한 것은 끝없는 정상화 선언보다 정상적으로 열리는 병원과 실제로 지급되는 급여입니다. 끊어졌던 결재선의 마지막 칸에는 누가 서명했는지뿐 아니라 무엇이 이루어졌는지도 적혀야 합니다. 정부는 국가를 계속한다고 말해 왔습니다. 이제 그 말이 주민의 하루에서도 참이게 할 책임을 받아들여야 합니다."
