 rome: "로마"
 rome_desc: "----\n§9들으소서, 이 세상에서 가장 아름다운 여왕이시여, 별빛 가득한 하늘에 환영받는 로마여, 들으소서, 인간들의 어머니이자 신들의 어머니시여, 당신의 신전들 덕분에 우리는 하늘과 멀지 않나이다."
