 PRK_GATHERING_STORM_DESC: "세계에서 가장 폐쇄적이고 기형적인 체제를 지닌 국가가 어디냐고 묻는다면, 열 중 아홉은 곧바로 조선민주주의인민공화국을 꼽을 것입니다.\n\n소련의 붕괴로 완전히 위축된 공산주의를 기본 이념으로 삼는 나라, 한 가문이 3대에 걸쳐 최고지도자를 세습하는 나라, 국내총생산의 25%가 넘는 금액을 국방비로 지출하는 나라, 그리고 핵을 담보로 한 무모한 도전으로 전 세계와 척을 지는 나라. 휴전선을 경계로 맞대고 있는 남쪽의 대한민국은 물론, 지구상의 수많은 나라가 이들의 내부 사정과 앞으로의 방향성을 예측하지 못하고 있습니다.\n\n제2차 세계 대전의 종전 이후, 소련군의 남진과 김일성을 필두로 한 공산주의자들의 장악을 토대로 건국된 조선민주주의인민공화국은 냉전의 최전선에 위치해 있던 만큼, 수많은 군사적 충돌이 일어났습니다. 냉전의 거대한 두 거인이 이 조그마한 땅에서 서로 맞붙었고, 땅과 바다와 하늘에서 일어난 수많은 무력 충돌과 군사 위기의 원인이자 당사자였습니다.\n\n김일성, 김정일, 김정은으로 이어지는 3대 권력 세습 속에서 조선민주주의인민공화국의 고립은 심화되었습니다. 이들은 '미 제국주의'의 압박에 대응하기 위해 핵무기 개발에 집착해 왔으며, 국제사회는 이를 저지하기 위해 제재와 압박을 더욱 강화하고 있습니다.\n\n수십 년 동안 이어진 악순환 속에서, 조선민주주의인민공화국은 새로운 돌파구를 모색하고 있으며, 그 전환점은 예상보다 빠르게 이들에게 다가오고 있습니다.\n\n----\n\n\"조선인민은 한사람의 정신력만으로도 양키의 2,500만을 공포에 떨게 할 수 있다. 조선사람 2,500만이면 미국의 괴멸은 물론 세계의 모든 원쑤무리들을 멸망시킬수 있다.\" - §Y김정은§!\n\n§A추가 예정 컨텐츠 없음!§!"
 PRK_country_summary: "$PRK_GATHERING_STORM_DESC$"
