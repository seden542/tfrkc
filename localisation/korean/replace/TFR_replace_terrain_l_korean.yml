 sevastopol: "세바스토폴"
 sevastopol_desc: "----\n§9재로부터 일어나라, 세바스토폴이여,\n영원히 찬양받을 영웅이여!\n너의 살아남은 민중들은\n러시아 사람들은 소중히 여길 것이다..§!"
 grozny: "그로즈니"
 grozny_desc: "----\n§9자랑스러운 도시. 테러도 없는§!"
 lugansk: "루간스크"
 lugansk_desc: "----\n§9여기, 이 곳 평민들은 자신들의 고향과 해안, 언어를 지켰다.§!"
 donetsk: "도네츠크"
 donetsk_desc: "----\n§9콘크리트 심장 속에 포탄 파편이 박힌 도시§!"
 minsk: "민스크"
 minsk_desc: "----\n§9내 할아버지께서는 코사크셨지, 그리고 우리 코사크는 그렇게 쉽게 죽지 않아.§!"
 nursultan: "아스타나"
 nursultan_desc: "----\n§9토카예프 삼알의 탄생지, 그리고 폭탄 위협§!"
