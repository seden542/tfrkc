 nk.1.t: "Kim Jong Un's Hospitalization Due to Surgery"
 nk.1.d: "Early this morning, our Respected Supreme Leader Comrade was admitted to the hospital."
 nk.1.a: "Let us pray for the Supreme Leader Comrade."
 nk.2.t: "Our Respected Supreme Leader Comrade Has Passed Away!"
 nk.2.d: "This is a truly devastating day! Our Respected Supreme Leader Comrade died after surgery! Several surgeons did their utmost, but they could not restore his heartbeat. A ten-day mourning period has been declared, and the terrible news will soon be broadcast throughout the country."
 nk.2.a: "Who Will Rule?"
 nk.3.t: "Choe Ryong-hae Seizes Power"
 nk.3.d: "Before the Workers' Party even prepared an emergency meeting, Choe Ryong-hae had effectively seized power. He said that emergency power is needed to prevent an unpredictable seizure of power, and he insists that he will faithfully lead the people through this difficult period until a true successor is found."
 nk.3.a: "It's an unbelievable story..."
 nk.4.t: "Cabinet Protest"
 nk.4.d: "When Choe Ryong-hae suddenly declared his intention to seize power, the Workers' Party convened an emergency meeting, and many members of the Cabinet expressed dissatisfaction with his leadership. They claimed that Choe had carried out a bloodless coup and was preparing further measures with the military to seize full powers. The remaining Workers' Party members could not decide who should take power. The names of several politicians were raised, but each time objections followed over whether they were viable."
 nk.4.a: ""
 nk.5.t: "The Cabinet in Turmoil"
 nk.5.d: "Early"
 nk.5.a: "Let us pray for our comrade."
 nk.6.t: "Concerned Voices of the Generals"
 nk.6.d: "Early"
