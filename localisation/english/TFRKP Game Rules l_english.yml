 TFRKP_lee_reds_lead_faction_of_party_PP_TXT: "§s£GFX_KOR_TPP_texticon Progressive Party Faction§!"
 TFRKP_lee_reds_lead_faction_of_party_PP_TXT_DESC: "-------------------------------------\n\n\n\n\n\n\n\n   £GFX_portrait_KOR_yoon_jong_o_gamerule\n\n\n\n\n\n\n\n\n-------------------------------------\n\nThe Progressive Party faction is a political group formed mainly by figures who belonged to the former Progressive Party. They place the nation's independence, democracy, and reunification as the most important agenda of the political factions."
 TFRKP_lee_reds_lead_faction_of_party_JP_TXT: "§Y£GFX_KOR_JP_texticon Justice Party Faction§!"
 TFRKP_lee_reds_lead_faction_of_party_JP_TXT_DESC: "-------------------------------------\n\n\n\n\n\n\n\n   £GFX_portrait_KOR_jang_hye_young_gamerule\n\n\n\n\n\n\n\n\n-------------------------------------\n\nThe Justice Party faction was formed primarily by figures from the former Justice Party. It seeks moderate social change through pragmatic progressive politics and the construction of a just welfare state."
 TFRKP_lee_reds_lead_faction_of_party_LP_TXT: "§t£GFX_KOR_LP_texticon Leftist Group§!"
 TFRKP_lee_reds_lead_faction_of_party_LP_TXT_DESC: "-------------------------------------\n\n\n\n\n\n\n\n   £GFX_portrait_KOR_lee_baek_yoon_gamerule\n\n\n\n\n\n\n\n\n-------------------------------------\n\nThe Leftist Group is a faction that encompasses various socialist and radical groups. They will implement radical socialist policies and ultimately seek to completely abolish capitalism."
 
 TFRKP_lee_reds_bop_of_nation: "@KOR£GFX_lee_reds_route The last desperate struggle of the old regime"
