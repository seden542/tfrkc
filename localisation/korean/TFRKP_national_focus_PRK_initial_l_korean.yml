 PRK_eighth_congress_workers_party: "조선로동당 제8차대회"
 PRK_eighth_congress_workers_party_desc: ""
 PRK_national_economic_development_plan_category: "국가경제발전 계획"
 PRK_national_economic_development_plan_category_desc: "조선로동당 제8차대회에서 제시된 국가경제발전계획을 부문별 사업으로 집행합니다. 관련 중점을 완료하면 새로운 경제 사업을 추진할 수 있습니다."
 PRK_expand_civilian_industry: "인민경제 생산기지 확충"
 PRK_expand_civilian_industry_desc: "지방의 유휴 부지를 정비하고 인민경제에 필요한 새로운 생산시설을 건설합니다."
 PRK_expand_defense_industry: "국방공업 생산기지 확충"
 PRK_expand_defense_industry_desc: "국방공업의 생산능력을 확대하기 위한 새로운 군수생산시설을 조성합니다."
 PRK_modernize_rural_infrastructure: "농촌 기반시설 현대화"
 PRK_modernize_rural_infrastructure_desc: "농촌의 도로와 기반시설을 정비하여 농업 생산과 물자 수송의 효율을 높입니다."
 PRK_expand_agricultural_support_network: "농기계.비료 공급망 확충"
 PRK_expand_agricultural_support_network_desc: "농기계와 비료를 농촌에 안정적으로 공급하는 체계를 확립합니다."
 PRK_modernize_industrial_equipment: "공업설비 현대화"
 PRK_modernize_industrial_equipment_desc: "노후 공업설비를 교체하고 생산공정을 현대화하여 공장 생산성을 끌어올립니다."
 PRK_modernize_industrial_equipment_effect_tt: "산업재건 변동치: 생산 효율 한도: §G+1.0%§!"
 PRK_expand_power_transport_network: "전력.수송망 확충"
 PRK_expand_power_transport_network_desc: "공업지대를 잇는 전력망과 수송망을 확충하여 건설사업을 지원합니다."
 PRK_expand_power_transport_network_effect_tt: "산업재건 변동치: 건설 속도: §G+1.0%§!"
 PRK_coordinate_rural_industrial_development: "농업과 공업의 균형발전"
 PRK_coordinate_rural_industrial_development_desc: "농업과 공업 부문의 계획을 조정하여 두 부문이 서로의 성장을 뒷받침하도록 합니다."
 PRK_complete_regional_development_projects: "지방경제발전사업 총화"
 PRK_complete_regional_development_projects_desc: "각 지방의 경제발전사업을 점검하고 성과를 전국적으로 확대합니다."
 PRK_five_year_national_economic_development_plan: "국가경제발전 5개년계획"
 PRK_five_year_national_economic_development_plan_desc: ""
 PRK_national_economic_reconstruction_dynamic: "산업재건"
 PRK_national_economic_reconstruction_dynamic_desc: "당의 영도 아래 생산 기반을 복구하고 공업 전반의 정상화를 추진하고 있습니다. 국가경제발전계획이 진척될수록 그 효과가 강화될 것입니다."
 PRK_national_economic_reconstruction_dynamic_dummy_idea: "산업재건"
 PRK_national_economic_reconstruction_dynamic_dummy_idea_desc: ""
 PRK_economy_broken_beyond_recognition: "어디서부터 잘못된 건지도 모르겠는 경제"
 PRK_economy_broken_beyond_recognition_desc: "이게... 강성대국...?"
 PRK_guideline_crush_ideological_cultural_infiltration: "사상문화적침투책동을 짓부실데 대한 방침"
 PRK_guideline_crush_ideological_cultural_infiltration_desc: ""
 PRK_great_innovation_in_rural_areas: "농촌에서 일대 혁신을"
 PRK_great_innovation_in_rural_areas_desc: ""
 PRK_great_innovation_in_industrial_sector: "공업 부문에서 일대 혁신을"
 PRK_great_innovation_in_industrial_sector_desc: ""
 PRK_enact_reactionary_thought_culture_rejection_act: "반동사상문화배격법 제정"
 PRK_enact_reactionary_thought_culture_rejection_act_desc: ""
 PRK_strengthen_anti_imperialist_class_education: "반제계급교양 강화"
 PRK_strengthen_anti_imperialist_class_education_desc: ""
 PRK_strengthened_anti_imperialist_class_education_idea: "반제계급교양 강화"
 PRK_strengthened_anti_imperialist_class_education_idea_desc: "제국주의의 본질과 계급적 원칙을 인민대중에게 깊이 새겨 반제자주의 기치를 더욱 굳건히 수호할 것입니다."
 PRK_review_line_for_rural_revitalization: "농촌진흥을 위한 로선 검토"
 PRK_review_line_for_rural_revitalization_desc: ""
 PRK_kim_jong_un_original_ideological_theory: "김정은 동지의 '독창적인 사상리론'"
 PRK_kim_jong_un_original_ideological_theory_desc: ""
 PRK_original_ideological_theory_idea: "'독창적인 사상리론'"
 PRK_original_ideological_theory_idea_desc: "경애하는 김정은 동지께서 독창적으로 발전시키신 사상 이론은 당과 국가, 인민을 하나의 의지로 결속시키는 강령적 지침을 따를 것입니다!"
 PRK_regional_development_20x10_policy: "지방발전 20X10 정책"
 PRK_regional_development_20x10_policy_desc: ""
 PRK_20x10_songchon_regional_industry: "성천군 지방공업공장 준공"
 PRK_20x10_songchon_regional_industry_desc: "지방발전 20x10 정책의 첫 착공지였던 성천군에 식료품.피복.일용품 생산시설을 완공합니다. 성천밤을 이용한 단묵과 잼을 비롯한 지방 특산품 생산을 정상화할 것입니다."
 PRK_20x10_jaeryong_foodstuffs: "재령군 식료품.일용품 생산 정상화"
 PRK_20x10_jaeryong_foodstuffs_desc: "재령나무리벌의 농산물을 활용해 막대떡과 검은찰고추장을 생산하고, 지방 주민에게 필요한 비누와 일용품의 공급을 확대합니다."
 PRK_20x10_sukchon_west_sea_foodstuffs: "숙천군 서해 수산가공기지 조성"
 PRK_20x10_sukchon_west_sea_foodstuffs_desc: "조선서해와 인접한 숙천군의 조건을 살려 여러 종류의 젓갈과 식료품을 생산하는 지방공업기지를 조성합니다."
 PRK_20x10_unpha_integrated_production: "은파군 무균화 식료공장 가동"
 PRK_20x10_unpha_integrated_production_desc: "은파군 식료공장에 무균.무진화 생산공정과 통합생산체계를 도입하여 제품의 질과 생산성을 높입니다."
 PRK_20x10_kyongsong_specialty_foods: "경성군 구기자 특산품 생산"
 PRK_20x10_kyongsong_specialty_foods_desc: "경성군의 구기자를 원료로 단물과 단묵, 고추장을 생산하여 지역을 대표하는 특산품으로 발전시킵니다."
 PRK_20x10_sinpho_offshore_farm: "신포시바다가양식사업소 확장"
 PRK_20x10_sinpho_offshore_farm_desc: "신포 앞바다의 유리한 조건을 활용해 다시마와 조개류를 비롯한 수산물의 양식.가공 능력을 확대합니다."
 PRK_wave_of_malignant_virus: "악성비루스의 파도"
 PRK_wave_of_malignant_virus_desc: "국경 너머에서 시작된 열병은 이미 압록강과 두만강을 건너올 기회를 엿보고 있습니다. 부족한 검사 장비, 낡은 병원, 끊어진 의약품 공급망 속에서 우리는 보이지 않는 적과 싸워야 합니다."
 PRK_fight_malignant_virus_category: "악성 비루스에 맞서 싸워서"
 PRK_fight_malignant_virus_category_desc: "§R빈약한 의료체계와 무너져 가는 방역전선 사이에서 매 순간 자원을 선택해야 합니다.§!\n£GFX_PRK_epidemic_supplies_texticon §Y보유 방역물자§!: §G[?PRK_epidemic_supplies_var|0]§! / §Y100§!\n\n§Y평안도§! : 현재 감염도 [GetPRKPyonganInfectionStage] (§Y[?PRK_pyongan_infection_var|%0]§!)\n§Y황해도§! : 현재 감염도 [GetPRKHwanghaeInfectionStage] (§Y[?PRK_hwanghae_infection_var|%0]§!)\n§Y강원도§! : 현재 감염도 [GetPRKKangwonInfectionStage] (§Y[?PRK_kangwon_infection_var|%0]§!)\n§Y함경도§! : 현재 감염도 [GetPRKHamgyongInfectionStage] (§Y[?PRK_hamgyong_infection_var|%0]§!)\n§Y량강도§! : 현재 감염도 [GetPRKRyanggangInfectionStage] (§Y[?PRK_ryanggang_infection_var|%0]§!)\n§Y자강도§! : 현재 감염도 [GetPRKChagangInfectionStage] (§Y[?PRK_chagang_infection_var|%0]§!)\n\n§Y전국 감염도§! : 현재 감염도 [GetPRKNationalInfectionStage] (§Y[?PRK_national_infection_var|%0]§!)\n£GFX_PRK_epidemic_containment_texticon §Y방역 대응력§!: §G[?PRK_epidemic_containment_var|%1]§!  |  £GFX_PRK_epidemic_infection_texticon §Y집중 확산 예상치§!: §R[?PRK_epidemic_current_spread_var|%1]§!\n\n§Y감염 단계§!\n§G0~20%§!: 이상없음\n§Y21~40%§!: 감염자 발생함\n§O41~60%§!: 감염자 증폭됨\n§R61~80%§!: 방역망 붕괴 직전\n§R81~100%§!: 방역 통제불가능함"
 PRK_infection_stage_clear: "§G이상없음§!"
 PRK_infection_stage_detected: "§Y감염자 발생함§!"
 PRK_infection_stage_amplified: "§O감염자 증폭됨§!"
 PRK_infection_stage_collapse_imminent: "§R방역망 붕괴 직전§!"
 PRK_infection_stage_uncontrollable: "§R방역 통제 불가능함§!"
 PRK_activate_maximum_emergency_epidemic_prevention_system: "최대비상방역체계 가동"
 PRK_activate_maximum_emergency_epidemic_prevention_system_desc: "모든 기관과 기업소, 인민반을 비상방역체계에 편입하고 지역별 봉쇄와 검병검진을 즉시 집행합니다. 이제 감염이 발생한 지역에 직접 대응할 수 있습니다."
 PRK_close_borders: "국경 봉쇄"
 PRK_close_borders_desc: "철도와 도로, 항만과 비행장을 닫는 것은 식량과 의약품의 유입까지 끊는 선택입니다. 그러나 지금 국경을 닫지 않는다면 병원 문을 닫게 될 것입니다."
 PRK_role_of_party: "당의 역할"
 PRK_role_of_party_desc: "각급 당조직과 인민반을 동원하여 환자와 접촉자를 찾아내고 격리 대상의 이동을 감시합니다. 당의 조직망은 부족한 의료 인력을 대신할 수 있는 유일한 전국 조직입니다."
 PRK_organize_state_emergency_epidemic_prevention_command: "국가비상방역사령부 조직"
 PRK_organize_state_emergency_epidemic_prevention_command_desc: "보건성, 내각, 군대와 지방기관의 분산된 보고체계를 하나의 지휘부로 통합합니다.
 PRK_impose_lockdowns_across_provinces: "봉쇄령 실시"
 PRK_impose_lockdowns_across_provinces_desc: "시.도 사이의 이동을 통제하고 감염지역을 생활권 단위로 봉쇄합니다. 생계와 생산을 희생하는 강경책이지만 확산 속도를 꺾을 수 있습니다."
 PRK_role_of_cabinet: "내각의 역할"
 PRK_role_of_cabinet_desc: "내각은 남은 차량과 연료, 식량과 병상을 방역전선에 배분해야 합니다. 서류상의 계획이 아니라 실제로 도착하는 물자가 필요합니다."
 PRK_ensure_medical_supplies: "의약품을 보장하라"
 PRK_ensure_medical_supplies_desc: "마스크, 해열제, 산소와 보호복을 군수창고와 공장, 해외 조달망에서 끌어모읍니다. 물자가 있어야 격리도 치료도 명령으로 끝나지 않습니다."
 PRK_investigate_infection_route: "유입경로 조사"
 PRK_investigate_infection_route_desc: "환자의 이동 기록과 국경 통행, 장마당 거래망을 역추적합니다. 감염의 길을 알아야 한정된 인력을 올바른 곳에 투입할 수 있습니다."
 PRK_role_of_judiciary_and_prosecution: "사법검찰기관의 역할"
 PRK_role_of_judiciary_and_prosecution_desc: "격리 이탈과 감염 은폐, 방역물자 전용을 엄벌합니다. 공포는 협조를 이끌어낼 수 있지만, 지나친 강압은 체제의 안정까지 갉아먹을 것입니다."
 PRK_emergency_vaccine_imports: "왁찐 긴급 수입"
 PRK_emergency_vaccine_imports_desc: "외화를 소진하고 정치적 양보를 감수하더라도 검증된 왁찐을 긴급 수입합니다. 빠른 효과를 얻을 수 있지만 공급은 외부의 결정에 달려 있습니다."
 PRK_our_own_vaccine: "조선 고유의 왁찐"
 PRK_our_own_vaccine_desc: "국내 연구기관과 생산시설을 총동원해 조선의 조건에 맞는 왁찐을 개발합니다. 완성은 늦지만 성공한다면 공급을 스스로 통제할 수 있습니다."
 PRK_kumgang_county_ipo_ri: "금강군 이포리"
 PRK_kumgang_county_ipo_ri_desc: "강원도 금강군 이포리에서 발견된 이동 경로를 따라 접촉자를 추적합니다. 산악지대의 작은 통로 하나가 지역 전체를 위험에 빠뜨렸습니다."
 PRK_hyesan_kanggu_dong: "혜산시 강구동"
 PRK_hyesan_kanggu_dong_desc: "혜산시 강구동의 비공식 거래망과 국경 왕래를 조사합니다. 량강도의 확산 고리를 끊는 것이 북부 방역선의 운명을 결정할 것입니다."
 PRK_role_of_peoples_army: "인민군대의 역할"
 PRK_role_of_peoples_army_desc: "인민군대의 병력과 차량으로 검문소와 격리선을 보강합니다. 강제력은 확실하지만 전투 준비태세와 군의 사기는 그만큼 소모됩니다."
 PRK_research_koryo_medicine: "고려의학 연구"
 PRK_research_koryo_medicine_desc: "현대 의약품이 모자란 현실에서 고려의학의 처방과 국내 약재를 보조 치료에 활용합니다. 완전한 해답은 아니지만 아무것도 하지 않는 것보다는 낫습니다."
 PRK_boiled_cows_head: "삶은 소대가리"
 PRK_boiled_cows_head_desc: "야 이 병신 새끼야!"
 PRK_national_emergency_epidemic_prevention_review_conference: "전국비상방역총화회의"
 PRK_national_emergency_epidemic_prevention_review_conference_desc: "전국 감염도를 통제 가능한 수준으로 낮춘 뒤 비상방역사업을 총화하고 일상 방역체계로 전환합니다. 아직 불길이 남아 있다면 회의를 열 수 없습니다."
 PRK_malignant_virus_must_be_fully_resolved_tt: "악성비루스가 완전히 해소되어야 함!"

 PRK_malignant_virus_dynamic: "돌파당한 방역전선"
 PRK_malignant_virus_dynamic_desc: "전국 감염도가 높아질수록 사회와 생산체계가 마비됩니다. 모든 효과는 현재 전국 감염도에 비례하여 실시간으로 변합니다."
 PRK_malignant_virus_dynamic_tooltip: "현재 전국 감염도: [GetPRKNationalInfectionStage] (§Y[?PRK_national_infection_var|%0]§!)"
 PRK_virus_spread_mission: "다음 감염 확산 - 1단계"
 PRK_virus_spread_mission_desc: "방역 위기 발생 후 첫 100일 동안 감염이 §Y20일§!마다 확산됩니다. 모든 지역에서 잠복 감염이 증가하고 무작위 지역 한 곳에 감염이 집중됩니다. 집중 확산은 기본 §R16%§!이며 방역 대응력만큼 감소하지만 §R6%§! 아래로는 내려가지 않습니다.\n\n§7전국 감염도가 높아지면 추가 확산도 발생합니다.§!"
 PRK_virus_spread_mission_stage_2: "다음 감염 확산 - 2단계"
 PRK_virus_spread_mission_stage_2_desc: "방역 위기가 100일을 넘기면서 감염 확산 주기가 §Y15일§!로 짧아졌습니다. 이 상태가 100일 더 지속되면 마지막 단계로 악화됩니다."
 PRK_virus_spread_mission_stage_3: "다음 감염 확산 - 3단계"
 PRK_virus_spread_mission_stage_3_desc: "방역 위기가 200일을 넘겼습니다. 감염은 이제 §R10일§!마다 확산되며 더 이상 확산 주기를 늦출 수 없습니다."
 PRK_virus_stage_2_countdown_mission: "감염 확산 2단계 전환"
 PRK_virus_stage_2_countdown_mission_desc: "방역 위기 발생 100일 후 감염 확산 주기가 단축됩니다."
 PRK_virus_stage_3_countdown_mission: "감염 확산 3단계 전환"
 PRK_virus_stage_3_countdown_mission_desc: "감염 확산 2단계 진입 100일 후 확산 주기가 다시 단축됩니다."
 PRK_epidemic_supply_production_mission: "방역물자 정기 생산"
 PRK_epidemic_supply_production_mission_desc: "30일마다 £GFX_PRK_epidemic_supplies_texticon 방역물자 §G+2§!를 생산합니다."

 PRK_quarantine_pyongan: "평안도 긴급 봉쇄"
 PRK_quarantine_pyongan_desc: "열흘 동안 평안도의 이동과 장마당을 통제합니다. 완료 시 평안도 감염도 §G-10%§!, 안정도 §R-0.5%§!."
 PRK_quarantine_hwanghae: "황해도 긴급 봉쇄"
 PRK_quarantine_hwanghae_desc: "열흘 동안 황해도의 이동과 장마당을 통제합니다. 완료 시 황해도 감염도 §G-10%§!, 안정도 §R-0.5%§!."
 PRK_quarantine_kangwon: "강원도 긴급 봉쇄"
 PRK_quarantine_kangwon_desc: "열흘 동안 강원도의 이동과 장마당을 통제합니다. 완료 시 강원도 감염도 §G-10%§!, 안정도 §R-0.5%§!."
 PRK_quarantine_hamgyong: "함경도 긴급 봉쇄"
 PRK_quarantine_hamgyong_desc: "열흘 동안 함경도의 이동과 장마당을 통제합니다. 완료 시 함경도 감염도 §G-10%§!, 안정도 §R-0.5%§!."
 PRK_quarantine_ryanggang: "량강도 긴급 봉쇄"
 PRK_quarantine_ryanggang_desc: "열흘 동안 량강도의 이동과 장마당을 통제합니다. 완료 시 량강도 감염도 §G-10%§!, 안정도 §R-0.5%§!."
 PRK_quarantine_chagang: "자강도 긴급 봉쇄"
 PRK_quarantine_chagang_desc: "열흘 동안 자강도의 이동과 장마당을 통제합니다. 완료 시 자강도 감염도 §G-10%§!, 안정도 §R-0.5%§!."
 PRK_mobilize_party_quarantine_cells: "당 방역초소 총동원"
 PRK_mobilize_party_quarantine_cells_desc: "당원과 인민반을 동원해 접촉자 조사와 가택 감시를 실시합니다. 모든 지역 감염도 §G-2.5%§!."
 PRK_nationwide_disinfection_campaign: "전국 집중소독전"
 PRK_nationwide_disinfection_campaign_desc: "공공시설과 운송수단을 집중 소독합니다. 모든 지역 감염도 §G-3%§!, 안정도 §R-0.5%§!."
 PRK_enforce_nationwide_lockdown: "전국 봉쇄령 집행"
 PRK_enforce_nationwide_lockdown_desc: "경제와 생계를 희생해 이동을 전면 중단합니다. 모든 지역 감염도 §G-6%§!, 안정도 §R-2%§!."
 PRK_requisition_medical_supplies: "방역물자 긴급 징발"
 PRK_requisition_medical_supplies_desc: "군과 공장, 지방 창고의 의료물자를 강제로 징발합니다. 완료 시 방역물자 §G+12§!를 확보하지만 §Y30일§! 동안 공장 생산량이 §R-10%§! 감소합니다. 다시 실시하려면 §Y45일§!을 기다려야 합니다."
 PRK_punish_quarantine_violations: "방역규률 위반자 엄벌"
 PRK_punish_quarantine_violations_desc: "격리 이탈과 감염 은폐를 공개 처벌합니다. 모든 지역 감염도 §G-3%§!, 안정도 §R-1%§!."
 PRK_quarantine_self_reporting_period: "감염 은폐 자진신고 기간"
 PRK_quarantine_self_reporting_period_desc: "처벌에 앞서 감염 사실을 스스로 신고할 마지막 기회를 줍니다. §Y7일§! 뒤 £GFX_PRK_epidemic_infection_texticon 모든 지역 감염도 §G-2%§!, 안정도 §G+0.3%§!. £GFX_PRK_epidemic_supplies_texticon 방역물자 §Y4§!와 정치력 §Y15§!가 필요하며 재사용 대기시간은 §Y45일§!입니다."
 PRK_emergency_vaccination_drive: "긴급 왁찐 접종전"
 PRK_emergency_vaccination_drive_desc: "확보한 왁찐을 고위험 지역부터 집중 접종합니다. 모든 지역 감염도 §G-8%§!."
 PRK_prioritize_high_risk_vaccination: "고위험군 우선 접종"
 PRK_prioritize_high_risk_vaccination_desc: "의료진과 고령자, 기저질환자에게 확보한 왁찐을 우선 배정합니다. §Y7일§! 뒤 £GFX_PRK_epidemic_infection_texticon 모든 지역 감염도 §G-4%§!. £GFX_PRK_epidemic_supplies_texticon 방역물자 §Y8§!이 필요하며 재사용 대기시간은 §Y30일§!입니다."
 PRK_deploy_army_quarantine_cordon: "인민군 방역차단선 투입"
 PRK_deploy_army_quarantine_cordon_desc: "군 병력과 차량으로 이동로를 봉쇄합니다. 모든 지역 감염도 §G-7%§!, 지휘력 §R-15§!, 전쟁 지지도 §R-1%§!."
 PRK_dispatch_military_medical_units: "군의관 및 야전병원 파견"
 PRK_dispatch_military_medical_units_desc: "군의관과 야전병원을 감염 지역에 긴급 파견합니다. §Y7일§! 뒤 £GFX_PRK_epidemic_infection_texticon 모든 지역 감염도 §G-4%§!. £GFX_PRK_epidemic_supplies_texticon 방역물자 §Y3§!과 지휘력 §Y10§!이 필요하며, §Y30일§! 동안 육군 조직력 회복률이 §R-5%§! 감소합니다. 재사용 대기시간은 §Y40일§!입니다."
 PRK_koryo_medicine_treatment_campaign: "고려의학 치료전개"
 PRK_koryo_medicine_treatment_campaign_desc: "국내 약재와 고려의학 처방을 보조 치료에 투입합니다. 모든 지역 감염도 §G-4%§!."
 PRK_expand_koryo_medicine_production: "고려약 생산 확대"
 PRK_expand_koryo_medicine_production_desc: "공장 일부를 고려약 생산에 전환합니다. §Y10일§! 뒤 £GFX_PRK_epidemic_supplies_texticon 방역물자 §G+5§!를 얻지만 §Y20일§! 동안 공장 생산량이 §R-5%§! 감소합니다. 정치력 §Y20§!이 필요하며 재사용 대기시간은 §Y60일§!입니다."
 PRK_expand_temporary_quarantine_posts: "림시방역초소 증설"
 PRK_expand_temporary_quarantine_posts_desc: "도로와 철도역에 임시 초소와 검사소를 추가합니다. 한 번만 실시할 수 있으며 방역 대응력 §G+1.5%§!, 모든 지역 감염도 §G-2%§!, 안정도 §R-0.5%§!."
 PRK_deploy_epidemic_reserve_units: "방역예비대 사전 배치"
 PRK_deploy_epidemic_reserve_units_desc: "방역예비대를 예상 확산 지점에 미리 배치합니다. §Y5일§! 뒤 준비가 완료되며 다음 감염 확산의 지역 집중분을 한 차례 차단합니다. 모든 지역의 기본 잠복 확산과 방역전선 돌파 위험은 계속됩니다. £GFX_PRK_epidemic_supplies_texticon 방역물자 §Y6§!이 필요하며 재사용 대기시간은 §Y50일§!입니다."
 PRK_household_fever_surveys: "인민반 발열자 전수조사"
 PRK_household_fever_surveys_desc: "인민반과 당 세포가 가구마다 발열자를 확인합니다. 방역 대응력 §G+0.5%§!, 모든 지역 감염도 §G-1%§!, 안정도 §R-0.3%§!. 방역 대응력이 최대치에 도달하면 더 이상 실시할 수 없습니다."
 PRK_suspend_interprovincial_transport: "도간 려객운수 전면 중단"
 PRK_suspend_interprovincial_transport_desc: "도 경계를 넘는 열차와 차량 운행을 강제로 중단합니다. 모든 지역 감염도 §G-7%§!, 안정도 §R-1.5%§!."
 PRK_dispatch_emergency_medical_trains: "긴급 의료렬차 파견"
 PRK_dispatch_emergency_medical_trains_desc: "의약품과 의료진을 실은 특별열차를 감염 지역으로 파견합니다. 모든 지역 감염도 §G-5%§!, 지휘력 §R-10§!."
 PRK_army_quarantine_command_power_cost: "£command_power §Y15§!"
