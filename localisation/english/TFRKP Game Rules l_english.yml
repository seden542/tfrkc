 TFRKP_lee_reds_bop_of_nation_DLP_TXT: "§s£GFX_KOR_DLP_texticon Democratic Labor Party§!"
 TFRKP_lee_reds_bop_of_nation_DLP_TXT_DESC: "The Democratic Labor Party gained the upper hand against the established parties. In the next presidential election, the president will be decided according to the leading faction and the factional influence."
 TFRKP_lee_reds_bop_of_nation_PPP_DPK_TXT: "£GFX_KOR_PPP_texticon §dEstablished§! §BParties§!£GFX_KOR_DemocraticParty_texticon"
 TFRKP_lee_reds_bop_of_nation_PPP_DPK_TXT_DESC: "Parties under the existing Sixth Republic system, such as the People Power Party and the Democratic Party of Korea, gained the upper hand. In the next presidential election, the President of the Democratic Party of Korea will be elected unconditionally, and Korea will embark on the path of systemic reform."
 
