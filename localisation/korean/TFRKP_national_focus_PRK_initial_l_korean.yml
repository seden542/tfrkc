 PRK_march_forward_korean_peoples_army_dynamic: "나가자 조선인민군"
 PRK_march_forward_korean_peoples_army_dynamic_desc: "§A항일의 빛나는 전통을 이어\n강철로 다져진 영광의 대오\n£GFX_KOR_BestKorea_2 원수님의 붉은 전사로\n사회주의 내 조국 지켜싸운다.\n\n나가자 조선인민군\n일당백 용맹을 떨치며\n제국주의 침략자\n모조리 때려 부시자.§!"
